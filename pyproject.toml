[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soiluat"
version = "0.9.0"
description = "Soi Luật Lite: tra cứu nghị định/thông tư local, FTS5, không LLM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pillow>=10"]
word = ["pywin32>=306"]
nghia = ["onnxruntime>=1.22", "tokenizers>=0.20", "numpy>=1.26"]  # Advance: embedding + reranker AITeamVN (đã kiểm với onnxruntime 1.22.1)
dev = ["pytest>=8", "httpx>=0.27", "build>=1"]
bench = ["pandas>=2", "pyarrow>=15"]  # bench/zalo/build_db.py, bench/gold/build_vle.py đọc parquet
pack = ["pyinstaller>=6"]

[project.scripts]
soiluat = "soiluat.app:main"
soiluat-importer = "soiluat.importer:main"
soiluat-health = "soiluat.health:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soiluat = ["schema.sql", "synonyms_seed.csv", "templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
