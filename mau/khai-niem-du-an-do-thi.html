ất bản thuộc cơ quan, tô chức mình."],["D1.K2~2","k","Cơ quan chủ quản nhà xuất bản đã được cấp giấy phép thành lập nhà xuất bản phải đê nghị Bộ Văn hóa, Thể thao và Du lịch cấp lại giầy phép thành lập nhà xuât bản khi thuộc một trong các trường hợp sau đây: loại hình tổ chức; tôn chỉ, mục đích, chức năng, nhiệm vụ, đôi tượng phục vụ;"],["D1.K2~2.Đa","d","Thay đổi tên, tôn chỉ, mục đích, chức năng, nhiệm vụ, đối tượng phục vụ,"],["D1.K2~2.Đb","d","Thay đổi cơ quan chủ quản hoặc tên cơ quan chủ quản mà không thay đôi"],["D1.K2~2.Đc","d","Giấy phép thành lập nhà xuất bản bị mắt, bị hư hỏng."],["D1.K3~2","k","Nhà xuất bản bị đình chỉ hoạt động xuất bản có thời hạn khi thuộc một trong các trường hợp sau đây: đủ các điều kiện quy định tại các khoản 1, 2 và 3 Điêu 13 của Luật này; gây phương hại quyên và lợi ích hợp pháp của cơ quan, tô chức, cá nhân hoặc lợi ích công cộng mà chưa đến mức bị thu hồi giấy phép thành lập nhà xuất bản quy định tại điểm d khoản 4 Điều này; phải đình chỉ hoạt động."],["D1.K3~2.Đa","d","Sau khi thành lập và trong quá trình hoạt động, nhà xuất bản không đáp ứng"],["D1.K3~2.Đb","d","Thực hiện không đúng nội dung ghi trong giấy phép thành lập nhà xuất bản"],["D1.K3~2.Đc","d","Vị phạm quy định của Luật này mà bị xử phạt vi phạm hành chính ở mức độ"],["D1.K4~2","k","Giây phép thành lập nhà xuất bản bị thu hồi khi thuộc một trong các trường hợp sau đây: nguyên nhân dẫn đến việc bị đình chỉ; § trong thời hạn 06 tháng kể từ ngày được cấp giấy phép thành lập; ©) Trong thời hạn 12 tháng liên tục nhà xuất bản không có xuất bản phẩm nộp lưu chiểu; 2 và 3 Điêu 13 của Luật này và không có khả năng khăc phục hoặc gây hậu quả nghiêm trọng: hoặc cơ quan chủ quản nhà xuât bản đê nghị châm dứt hoạt động."],["D1.K4~2.Đa","d","Hết thời hạn bị đình chỉ hoạt động xuất bản mà không khắc phục được"],["D1.K4~2.Đb","d","Cơ quan chủ quản nhà xuất bản không ra quyết định thành lập nhà xuất bản"],["D1.K4~2.Đd","d","Nhà xuất bản không đáp ứng đủ các điều kiện quy định tại các khoản 1,"],["D1.K4~2.Đđ","d","Sau khi nhà xuất bản bị hợp nhát, sáp nhập, chia, tách; giải thể, phá sản"],["D1.K5~2","k","Chính phủ quy định trình tự, thủ tục cấp, cấp lại, thu hồi giây IhUP) thành lập; trình tự, thủ tục, thời hạn đình chỉ hoạt động xuất bản của nhà xuất bản.”"],["D1.K9","k","Sửa đổi, bỗ sung khoản 2 và khoản 3 Điều 16 như sau: “2. Bổ nhiệm, miễn nhiệm, cách chức đối với tổng giám đốc hoặc giám đốc, phó tông giám độc hoặc phó giám đốc, tông biên tập, phó tông biên tập nhà xuất bản. Việc bổ nhiệm đối với tổng giám đốc hoặc giám đốc, phó tổng giám đốc hoặc phó giám đôc, tông biên tập, phó tông biên tập nhà xuât bản được thực hiện sau khi có văn bản châp thuận của Bộ Văn hóa, Thê thao và Du lịch theo quy định của Chính phủ. 3. Định hướng hoạt động của nhà xuất bản; phê duyệt kế hoạch xuất bản của nhà xuất bản đối với các trường hợp quy định tại khoản 1 và khoản 2 Điều 24 của Luật này.”"],["D1.K10","k","Sửa đổi, bổ sung Điều l7 như sau: “Điều 17. Tiêu chuẩn các chức danh lãnh đạo nhà xuất bản 1. Tiêu chuẩn đối với tổng giám đốc hoặc giám đốc, phó tông giám đốc hoặc phó giám đốc được quy định như sau: a) Là công dân Việt Nam, thường trú tại Việt Nam theo quy định của pháp luật về cư trú; b) Đáp ứng tiêu chuẩn về chính trị, trình độ, chuyên môn, nghiệp vụ và tiêu chuẩn khác theo quy định của Chính phủ và của cơ quan có thâm quyền. 2. Tiêu chuẩn đối với tổng biên tập, phó tổng biên tập được quy định như sau: a) Có đủ tiêu chuẩn quy định tại khoản 1 Điều này; b) Có chứng chỉ hành nghề biên tập. 3, Đối với nhà xuất bản được tô chức và hoạt động theo loại hình doanh nghiệp do Nhà nước nắm giữ 100% vốn điều lệ, mà có chức danh chủ tịch hội đồng thành viên hoặc chủ tịch công ty thì chủ tịch hội đồng thành viên hoặc chủ tịch công ty đồng thời là tông giám đốc hoặc giám đốc nhà xuất bản theo quy định của Luật này. Trường hợp cần bố trí chủ tịch hội đồng thành viên hoặc chủ tịch công ty 9 không đồng thời là tổng giám đốc hoặc giám đốc nhà xuất bản thì cơ quan chủ quản nhà xuất bản báo cáo, xin ý kiên cơ quan có thâm quyền trước khi quyết định. 4. Người đứng, đầu cơ quan chủ quản nhà xuất bản không được kiêm giữ chức vụ tổng giám đốc hoặc giám đốc nhà xuất bản; lãnh đạo nhà xuất bản này không được kiêm giữ chức vụ lãnh đạo nhà xuất bản khác, trừ trường hợp có quy định khác của cơ quan có thâm quyên. 5. Trường hợp nhà xuất bản được thành lập theo quy định của Luật này hoặc được sắp xếp, tổ chức lại mà có chức năng xuất bản tạp chí thì tổng giám đốc hoặc giám đốc nhà xuất bản phải đáp ứng đầy đủ các điều kiện theo quy định của pháp luật về báo chí và đông thời là tông biên tập tạp chí.”."],["D1.K11","k","Sửa đổi, bỗổ sung Điều 20 như sau: “Điều 20. Cấp, cấp lại, thu hồi chứng chỉ hành nghề biên tập 1. Bộ Văn hóa, Thẻ thao và Du lịch cấp chứng chỉ hành nghề biên tập cho người thực hiện công tác biên tập, có đủ tiêu chuẩn quy định tại các điểm a, b và e khoản 1 Điều 19 của Luật này; trường hợp không cập chứng chỉ phải có văn bản trả lời nêu rõ lý do. 2. Chứng chỉ hành nghề biên tập bị thu hồi khi thuộc một trong các trường hợp sau đây: : _..) Biên tập viên có xuất bản phẩm do mình biên tập bị cơ quan có thâm quyền câm lưu hành, thu hỗi, tịch thu, tiêu hủy; b) Biên tập viên trong 01 năm có hai xuất bản phẩm hoặc trong 02 năm liên tục có xuât bản phẩm do mình biên tập sai phạm về nội dung mà bị cơ quan có thâm quyên buộc phải sửa chữa mới được phát hành; ©) Biên tập viên không trực tiếp thực hiện công tác biên tập trong 36 tháng liên tiêp; d) Biên tập viên bị kết án bằng bản án có hiệu lực pháp luật của tòa án. 3. Biên tập viên có chứng chỉ hành nghề biên tập bị thu hồi thì sau 02 năm mới được xét cập lại, trừ trường hợp biên tập viên bị kết án bằng bản án có hiệu lực pháp luật của tòa án về các tội xâm phạm an ninh quôc gia và các tội khác rất nghiêm trọng, đặc biệt nghiêm trọng. 4. Biên tập viên được cấp lại chứng chỉ hành nghề biên tập khi thuộc một trong các trường hợp sau đây: a) Chứng chỉ bị mất hoặc bị hư hỏng; b) Chuyển công tác đến làm biên tập viên tại nhà xuất bản khác; ©) Hoàn thành khóa bồi dưỡng quy định tại điểm c khoản 1 Điều 19 của Luật này sau khi hết thời hạn bị thu hôi chứng chỉ hành nghệ biên tập. 3. Chính phủ quy định trình tự, thủ tục cấp, cấp lại và thu hồi chứng chỉ hành nghề biên tập.” 19"],["D1.K12","k","Sửa đổi, bổ sung Điều 21 như sau: “Điều 21. Quyền tác giả trong lĩnh vực xuất bản Việc xuất bản tác phẩm, tài liệu và tái bản xuất bản phẩm chỉ được thực hiện sau khi có văn bản chấp thuận của tác giả, chủ sở hữu quyên tác giả, trừ trường nợ ngoại lệ, giới hạn quyên tác giả theo quy định của pháp luật về sở hữu trí tuệ.”"],["D1.K13","k","Sửa đổi, bổ sung Điều 22 như sau: “Điều 22. Đăng ký kế hoạch xuất bản 1. Trước khi xuất bản tác phẩm, tài liệu hoặc tái bản xuất bản phẩm, nhà xuất bản phải đăng ký kế hoạch xuất bản với Bộ Văn hóa, Thể thao và Du lịch. Nội dung đăng ký kế hoạch xuất bản phải phù hợp với tôn chỉ, mục đích, chức năng, nhiệm vụ của nhà xuất bản và định hướng của cơ quan chủ quản nhà xuất bản quy định tại khoản 3 Điều-16 của Luật này. 2. Đối với tác phẩm, tài liệu thuộc trường hợp quy định tại khoản I và khoản 2 Điều 24 của Luật này, trước khi đăng ký kế hoạch xuất bản, nhà xuất bản phải tổ chức thâm định bản thảo và gửi kèm kế hoạch xuất bản trình cơ quan chủ quản nhà xuất bản. 3. Cơ quan chủ quản nhà xuất bản có trách nhiệm xem xét, đánh giá kết quả thâm định bản thảo do nhà xuất bản thực hiện quy định tại khoản 2 Điều này, bảo đảm phù hợp với tôn chỉ, mục đích, chức năng, nhiệm vụ, định hướng hoạt động của nhà xuất bản và phê duyệt kế hoạch xuất bản của nhà xuất bản. 4. Bộ Văn hóa, Thể thao và Du lịch xác nhận đăng ký kế hoạch xuất bản. 'Văn bản xác nhận đăng ký kế hoạch xuất bản là căn cứ để nhà xuất bản ra quyết định xuất bản và có giá trị đến hết ngày 31 tháng 12 của năm xác nhận đăng ký. 5. Chính phủ quy định chỉ tiết Điều này.”."],["D1.K14","k","Sửa đổi, bổ sung Điều 23 như sau: “Điều 23. Liên kết của nhà xuất bản 1. Việc liên kết xuất bản được quy định như sau: a) Tổ chức, cá nhân tham gia liên kết với nhà xuất bản gồm chủ sở hữu quyền tác giả, chủ sở hữu quyền liên quan, tổ chức, cá nhân có tác phẩm, tài liệu hợp pháp để xuất bản đối với từng xuất bản phẩm; b) Nội dung, hình thức liên kết bao gồm khai thác bản thảo, đầu tư kinh phí, cung cập dịch vụ biên tập bản thảo và các hoạt động khác phục vụ việc tạo lập và hoàn thiện bản thảo trước khi xuất bản theo quy định của pháp luật; c) Nhà xuất bản trực tiếp tổ chức biên tập hoàn chỉnh bản thảo; việc biên tập và quyết định nội dung xuất bản phẩm phải được thực hiện độc : lập, khách quan, tuân thủ quy định của Luật này; không được chuyển giao quyền quyết định nội dung xuất bản phẩm dưới bất kỳ hình thức nào và chịu trách nhiệm trước pháp luật về nội dung xuất bản phẩm; 11 d) Đối tác liên kết chịu trách nhiệm trước pháp luật về quyền sử dụng tác phẩm, tài liệu, quyền tác giả, quyền liên quan và việc sử dụng trí tuệ nhân tạo trong sáng tạo, hoàn thiện tác phẩm, tài liệu do mình cung cấp để liên kết xuất bản; không được sửa đổi nội dung bản mẫu đã được nhà xuất bản phê duyệt; phối hợp thực hiện việc sửa chữa xuất bản phẩm theo yêu cầu của cơ quan quản lý nhà nước có thâm quyền hoặc nhà xuất bản; trường hợp xuất bản phẩm liên kết có nội dung vi phạm, đối tác liên kết chịu trách nhiệm theo quy định của pháp luật và nghĩa vụ đã xác định trong hợp đồng liên kết; đ) Việc liên kết phải được thực hiện trên cơ sở hợp đồng bằng văn bản; hợp đồng phải xác định rõ nội dung, phạm vi liên kết, quyền và nghĩa vụ, phạm vì trách nhiệm của các bên tham gia hoạt động liên kết xuất bản; trường hợp , liên kết xuất bán nhiều xuất bản phẩm với cùng một đối tác thì có thể giao kết trong một hợp đồng. 2. Việc liên kết in xuất bản phẩm; liên kết phát hành xuất bản phẩm, cung cấp dịch vụ trung gian phát hành xuất bản phẩm được quy định như sau: a) Tổ chức, cá nhân tham gia liên kết với nhà xuất bản gồm cơ sở 1n, CƠ SỞ phát hành, cơ sở cung cấp dịch vụ trung gian phát hành xuất bản phẩm, tô chức, doanh nghiệp cung cấp hạ tầng kỹ thuật, công nghệ, nền tảng số và các dịch vụ kỹ thuật khác; b) Nội dung, hình thức liên kết bao gồm chế bản, in, gia công sau ¡n, phát hành xuất bản phẩm, phát hành xuất bản phẩm điện tử, cung câp dịch vụ trung gian phát hành, cung cấp hạ tầng kỹ thuật, công nghệ, nền tảng số và các dịch vụ kỹ thuật khác; c) Nhà xuất bản chịu trách nhiệm về nội dung xuất bản phẩm; quyết định việc phát hành xuất bản phẩm theo quy định của Luật này; kiểm tra, giám sát việc thực hiện các nội dung liên kết theo hợp đồng đã ký kết; đ) Đối tác liên kết thực hiện đúng nội dung xuất bản phẩm đã được nhà xuất bản duyệt để in hoặc phát hành trên môi trường điện tử; chịu trách nhiệm về chất lượng, tính hợp pháp, an toàn của dịch vụ, công nghệ, hạ tầng, dữ liệu và các hoạt động thuộc phạm vi được giao; đ) Các bên có trách nhiệm phối hợp đình chỉ phát hành, gỡ bỏ, thu hồi hoặc tiêu hủy xuất bản phẩm theo yêu cầu của cơ quan nhà nước có thẩm quyền hoặc nhà xuất bản. 3. Việc liên kết phát triển hệ sinh thái xuất bản được quy định như sau: a) Nhà xuất bản được liên kết với tô chức, cá nhân để phát triển hệ sinh thái xuất bản trên cơ sở khai thác hợp pháp xuất bản phẩm, nội dung, quyền và các giá trị được hình thành từ xuất bản phẩm; b) Hệ sinh thái xuất bản gồm các hoạt động liên kết 4rong sáng tạo, phát triển nội dung; xác lập, quản lý, bảo vệ và khai thác quyên tác giả, quyên liên quan và các quyên sở hữu trí tuệ khác; xuất bản, in, phát hành; 12 ứng dụng khoa học, công nghệ, trí tuệ nhân tạo, chuyển đổi số, quản trị và khai thác dữ liệu; truyền thông, quảng bá, xúc tiễn thương mại; chuyển thể, phát triển và khai thác nội dung, hình ảnh, nhân vật và các tài sản trí tuệ từ xuất bản phẩm; cung cấp sản phẩm, dịch vụ liên quan đến xuất bản phẩm; phát triển thị trường, văn hóa đọc và các hoạt động khác nhằm phát triển, khai thác, gia tăng giá trị của xuất bản phẩm; c) Nhà xuất bản chịu trách nhiệm trước pháp luật về xuất bản phẩm do mình xuất bản; bảo đảm quyền khai thác, sử dụng, chuyển giao quyền đối với xuất bản phẩm trong phạm vi liên kết theo quy định của pháp luật và thỏa thuận với chủ thể quyền; việc liên kết phát triển hệ sinh thái xuất bản không làm thay đổi trách nhiệm của nhà xuất bản đối với hoạt động xuất bản và xuất bản phẩm theo quy định của Luật này; 3) Tổ chức, cá nhân tham gia liên kết chịu trách nhiệm trước pháp luật về sản phẩm, dịch vụ do mình tạo ra trên cơ sở khai thác, sử dụng, chuyển thê hoặc phát triển từ xuất bản phẩm trong phạm vi quyền được chuyển giao; đ) Quyền, nghĩa vụ và trách nhiệm của các bên; quyền sở hữu, khai thác, sử dụng, chia sẻ đữ liệu và quyền đối với sản phẩm, dịch vụ, tài sản và các giá trị hình thành từ hoạt động liên kết được xác định theo thỏa thuận và quy định của pháp luật có liên quan. 4. Hoạt động liên kết quy định tại Điều này phải bảo đảm các nguyên tắc sau đây: a) Tuân thủ quy định của pháp luật về xuất bản, sở hữu trí tuệ, an ninh mạng, bảo vệ đữ liệu cá nhân, bảo vệ bí mật nhà nước và quy định khác của pháp luật có liên quan; b) Bảo đảm quyền, lợi ích hợp pháp của các bên tham gia liên. kết, quyền và lợi ích hợp pháp của tác giả, chủ sở hữu quyền tác giả, chủ sở hữu quyền liên quan và người sử dụng xuất bản phẩm; c) Bảo đảm công khai, minh bạch về quyền, nghĩa vụ và trách nhiệm của các bên tham gia liên kết; d) Không làm ảnh hưởng đến quyền quyết định nội dung xuất bản phẩm và trách nhiệm của nhà xuất bản theo quy định của Luật này; đ) Không được thu thập, xử lý hoặc sử dụng dữ liệu trái với quy định của pháp luật về dữ liệu, bảo vệ dữ liệu cá nhân, sở hữu trí tuệ và an ninh mạng để phát triển, huấn luyện, kiểm thử hoặc vận hành hệ thống trí tuệ nhân tạo trong hoạt động xuất bản; e) Bảo đảm an toàn, an ninh thông tin, an toàn dữ liệu và các yêu cầu khác theo quy định của pháp luật. 5. Chính phủ quy định chỉ tiết Điều này.”."],["D1.K15","k","Sửa đổi, bố sung Điều 24 như sau: 13 “Điều 24. Tác phẩm, tài liệu phải thấm định nội dung trước khi xuất bản, tái bản ._.1. Tác phẩm, tài liệu có nội dung về lịch sử cách mạng, chủ quyền, an ninh quốc gia, lãnh tụ, lãnh đạo đât nước, anh hùng dân tộc thuộc danh mục theo quy định của Chính phủ thì nhà xuất bản phải tô chức thâm định bản thảo trước khi đăng ký kê hoạch xuất bản. 2. Tác phẩm, tài liệu sau đây nếu nội dung có dấu hiệu vị phạm quy định tại khoản l Điều 10 của Luật này thì nhà xuất bản phải tổ chức thâm định trước khi đăng ký kê hoạch xuất bản đề tái bản: a) Tác phẩm, tài liệu xuất bản trước Cách mạng Tháng Tám năm 1945; tác phẩm, tài liệu xuât bản từ năm 1945 đên năm 1954 trong vùng bị tạm chiêm; _ b) Tác phẩm, tài liệu xuất bản từ năm 1954 đến ngày 30 tháng 4 năm 1975 ở miễn Nam Việt Nam không do Chính phủ Cách mạng lâm thời Cộng hòa miễn Nam Việt Nam cho phép; c) Tác phẩm, tài liệu xuất bản ở nước ngoài. 3. Việc thâm định tác phẩm, tài liệu quy định tại khoản 1 và khoản 2 Điều này phải đáp ứng yêu cầu chuyên môn theo tính chất, nội dung của bản thảo; bảo đảm xem xét đây đủ các vân đê cần thâm định, có căn cứ đánh giá và kết luận rõ ràng làm cơ sở cho việc đăng ký kê hoạch xuất bản.”."],["D1.K16","k","Sửa đổi, bổ sung Điều 25 như sau: “Điều 25. Xuất bản tài liệu không kinh doanh 1. Cơ quan, tổ chức xuất bản tài liệu không kinh doanh sau đây nếu không thực hiện thông qua nhà xuất bản thì phải có giấy phép của Ủy ban nhân dân cấp tỉnh nơi cơ quan, tô chức đặt trụ sở, trừ trường hợp quy định tại khoản 3 Điều này: a) Tài liệu tuyên truyền chủ trương, đường lỗi của Đảng, chính sách, pháp luật của Nhà nước, phục vụ các sự kiện chính trị, lễ kỷ niệm của đât nước, địa phương; b) Tài liệu hướng dẫn phòng, chống thiên tai, dịch bệnh và bảo vệ môi trường; ©) Tài liệu giới thiệu hoạt động, kỷ yếu hội nghị, hội thảo của các cơ quan, tô chức Việt Nam, cơ quan, tổ chức nước ngoài đang hoạt động hợp pháp tại Việt Nam; d) Tài liệu lịch sử Đảng, chính quyền địa phương: đ) Các tài liệu khác do Chính phủ quy định. 2. Cơ quan, tổ chức xuất bản tài liệu không kinh doanh phải nộp phí thẩm định nội dung tài liệu xuất bản phẩm không kinh doanh theo quy định của pháp luật về phí và lệ phí. Giấy phép xuất bản tài liệu không kinh doanh có thời hạn đến hết ngày 31 tháng 12 của năm được cấp. 3. Cơ quan nhà nước, tổ chức chính trị, Mặt trận Tổ quốc Việt Nam, tổ chức 14 chính trị - xã hội ở trung ương và cấp tỉnh khi xuất bản các tài liệu không kinh doanh quy định tại khoản Ì Điều này có nội dung phù hợp với chức năng, nhiệm vụ, quyền hạn của mình thì không phải có giây phép theo quy định tại khoản 1 Điều này và không phải nộp phí thẩm định nội dung tài liệu xuất bản phẩm không kinh doanh theo quy định tại khoản 2 Điều này, nhưng phải ban hành quyết định xuất bản, lưu giữ bản mẫu tài liệu được xuất bản ít nhật 24 tháng kê từ thời điểm ban hành quyết định xuất bản và chịu trách nhiệm về nội dung tài liệu đó. 4. Chính phủ quy định chỉ tiết Điều này.”."],["D1.K17","k","Sửa đổi, bổ sung Điều 27 như sau: “Điều 27. Thông tin ghi trên xuất bản phẩm 1. Thông tin ghi trên xuất bản phẩm phải bảo đảm các nguyên tắc sau đây: a) Bảo đảm nhận diện xuất bản phâm và xác định tổ chức, cá nhân chịu trách nhiệm; b) Chính xác, trung thực, phù hợp với loại hình và nội dung của xuất bản phẩm; c) Bảo đảm phục vụ quản lý nhà nước, lưu chiều, truy xuất nguồn gốc và bảo vệ quyền, lợi ích hợp pháp của cơ quan, tổ chức, cá nhân; d) Bảo đảm khả năng hiển thị, tiếp cận, khai thác và quản lý trên môi trường số đối với xuất bản phẩm điện tử; 8) Xuất bản phẩm có nội dung được tạo lập toàn bộ hoặc một phần bằng hệ thống trí tuệ nhân tạo phải được thông báo, gần nhãn và không làm thay đổi trách nhiệm của tổ chức, cá nhân đối với xuất bản phẩm theo quy định của Luật này và quy định khác của pháp luật có liên quan. 2. Chính phủ quy định thông tin ghi trên xuất bản phẩm.”."],["D1.K18","k","Sửa đối, bố sung Điều 28 như sau: “Điều 28. Nộp và quản lý xuất bản phẩm lưu chiều, nộp xuất bản phẩm cho Thư viện Quốc gia Việt Nam 1. Nộp lưu chiêu là việc nhà xuất bản hoặc cơ quan, tổ chức được phép xuất bản chuyên xuất bản phẩm hoặc tệp xuất bản phẩm điện tử đến cơ quan quản lý nhà nước có thẳm quyền theo quy định của Luật này đề phục vụ công tác quản lý nhà nước. 2. Việc nộp xuất bản phẩm lưu chiểu được thực hiện như sau: a) Nhà xuất bản phải nộp lưu chiều cho Bộ Văn hóa, Thể thao và Du lịch chậm nhất là 10 ngày trước khi phát hành; b) Cơ quan, tổ chức được cấp giấy phép xuất bản tài liệu không kinh doanh theo quy định tại khoản I Điêu 25 của Luật này phải nộp lưu chiêu cho Ủy ban nhân dân cấp tỉnh nơi cập giây phép trước khi phát hành. 3. Xuất bản phẩm được nộp lưu chiểu theo các phương thức sau đây: 15 a) Đối với xuất bản phẩm in, nộp bản in theo số lượng quy định; b) Đối với xuất bản phẩm điện tử, nộp tệp điện tử thông qua hệ thống lưu chiểu điện tử. 4. Hết thời hạn 10 ngày kế từ ngày hoàn thành nộp lưu chiêu, nhà xuất bản được quyết định phát hành xuất bản phâm trong thời hạn I2 tháng; trường hợp quá thời hạn 12 tháng mà không quyêt định phát hành xuât bản phẩm thì phải thông báo băng văn bản cho cơ quan nhận lưu chiều. Đối với xuất bản phẩm thuộc danh mục quy định tại khoản 1 Điều 24 của Luật này thì chỉ được quyết định phát hành sau khi có ý kiên của Bộ Văn hóa, Thê thao và Du lịch. ¬- Bộ Văn hóa, Thể thao và Du lịch có trách nhiệm tổ chức quản lý xuât bản phâm lưu chiêu và thực hiện theo quy định sau đây: a) Lựa chọn xuất bản phẩm lưu chiểu để tổ chức đọc, kiểm tra, thẩm định và xử lý vi phạm theo quy định của pháp luật; . b) Khi phát hiện xuất bản phẩm có dấu hiệu vi phạm, tổ chức đọc, kiểm tra, thâm định và xử lý theo quy định của pháp luật; e) Tổ chức thẩm định và cho ý kiến trước khi phát hành đối với xuất bản phẩm thuộc danh mục quy định tại khoản ] Điều 24 của Luật này, trừ trường hợp được miễn thâm định do Chính phủ quy định. 6. Ủy! ban nhân dân cấp tỉnh tổ chức đọc, kiểm tra tài liệu không kinh doanh nộp lưu chiều thuộc thẩm quyền cấp giấy phép và xử lý vi phạm theo quy định của pháp luật. 7. Nhà xuất bản có trách nhiệm nộp xuất bản phẩm và tệp xuất bản phẩm điện tử cho Thư viện Quôc gia Việt Nam. 8. Chính phủ quy định chỉ tiết số lượng, thời hạn lưu giữ xuất bản phẩm nộp lưu chiêu, thời hạn cho ý kiên trước khi phát hành đôi với xuât bản phẩm thuộc danh mục quy định tại khoản 1 Điều 24 của Luật này và việc nộp xuất bản phẩm, tệp xuất bản phẩm điện tử cho Thư viện Quốc gia Việt Nam. 9. Bộ trưởng Bộ Văn hóa, Thể thao và Du lịch ban hành quy chế đọc, kiểm tra, thẩm định nội dung xuất bản phẩm. lưu chiểu. Bộ trưởng Bộ Tài chính quy định chế độ thù lao đối với người đọc, kiểm tra, thâm định nội dung xuất bản phẩm lưu chiều.”"],["D1.K19","k","Sửa đổi, ¡ bổ sung Điều 32 như sau: “Điều 32. Cấp, cấp lại, thu hồi giấy phép hoạt động in xuất bản phẩm 1. Hoạt động in xuất bản phẩm gồm các công đoạn quy định tại khoản 7 Điều 4 của Luật này được quy định như sau: a) Chế bản là quá trình chuẩn bị bản mẫu hoặc dữ liệu ¡ in bằng phương pháp kỹ thuật, công nghệ để tạo đầu vào phục vụ công đoạn In xuất bản phẩm; 16 b) In là quá trình sử dụng thiết bị để chuyển nội dung từ bản mẫu hoặc dữ liệu in lên vật mang tin nhằm tạo thành xuất bản phẩm; c) Gia công sau in là quá trình thực hiện các công đoạn kỹ thuật sau khi in nhằm hoàn thiện xuất bản phẩm theo yêu cầu về hình thức, kết cầu và chất lượng. 2. Cơ sở in hoạt động theo các loại hình sau đây: a) Doanh nghiệp; đơn Vị Sự nghiỆp; tổ hợp tác, hợp tác xã, liên hiệp hợp tác xã theo quy định của pháp luật vê hợp tác xã; b) Chỉ nhánh, địa điểm kinh doanh của các loại hình quy định tại điểm a khoản này (không bao gôm địa điểm kinh doanh thuộc chỉ nhánh); hoạt động in xuât bản phẩm phát sinh tại địa điểm kinh doanh thuộc chị nhánh được xác định là hoạt động do chi nhánh thực hiện; .c©) Hộ kinh doanh. 3. Điều kiện để cấp giấy phép hoạt động in xuất bản phẩm được quy định như sau: a) Người đứng đầu cơ sở ¡n là công dân Việt Nam, thường trú tại Việt Nam theo quy định của pháp luật về cư trú; b) Có mặt bằng sản xuất, thiết bị để thực hiện một hoặc các công đoạn chế bản, in và gia công sau in xuất bản phẩm; . ©) Có chủ sở hữu cơ sở in là tổ chức của Việt Nam, cá nhân là công dân Việt Nam, trừ trường hợp có yếu tố nước ngoài do Chính phủ quy định. 4. Thâm quyền cấp, cấp lại giấy phép hoạt động in xuất bản phẩm được quy định như sau: a) Ủy ban nhân dân cấp tỉnh cấp, cấp lại giấy phép cho cơ sở in quy định tại điểm a và điểm b khoản 2 Điều này trên địa bàn; b) Ủy ban nhân dân cấp xã cấp, cấp lại giấy phép cho cơ sở in quy định tại điểm c khoản 2 Điều này trên địa bản. 3. Giấy phép hoạt động in xuất bản phẩm được cấp lại khi thuộc một trong các trường hợp sau đây: a) BỊ mất hoặc bị hư hỏng: b) Có thay đối về tên gọi, địa chỉ, chia, tách, sáp nhập hoặc hợp nhất cơ sở in. 6. Giấy phép hoạt động in xuất bản phẩm bị thu hồi khi thuộc một trong các trường hợp sau đây: a) Cơ sở in không đáp ứng đủ các điều kiện quy định tại khoản 3 Điều này trong quá trình hoạt động; b) Cơ sở in có thay đổi quy định tại điểm b khoản 5 Điều này mà không làm thủ tục cấp lại giấy phép; 17 ©) Sau khi cơ sở in giải thể, phá sản, tự chấm đứt hoạt động; d) Không bảo đầm các giải pháp quản lý chống in nối bản trái phép, in lậu, in giả xuât bản phẩm. _7. Chính phủ quy định trình tự, thủ tục cấp, cấp lại, thu hồi giấy phép hoạt động in xuât bản phâm.”."],["D1.K20","k","Sửa đổi, bổ sung Điều 33 như sau: “Điều 33. Thực hiện chế bán, in, gia công sau in xuất bản phẩm 1. Cơ sở in được thực hiện chế bản, in, gia công sau In xuất bản phẩm theo một trong các trường hợp sau đây: a) Cung cấp dịch vụ chế bản, in, gia công sau in xuất bản phẩm cho tô chức, cá nhân; b) Thực hiện chế bản, in, gia công sau ïn xuất bản phẩm với tư cách là đối tác liên kết của nhà xuất bản; .©) Là cơ quan, tổ chức được xuất bản tài liệu không kinh doanh theo quy định tại Điều 25 của Luật này và có giây phép hoạt động ¡in xuất bản phâm. 2. Chính phủ quy định chỉ tiết Điều này.”."],["D1.K21","k","Sửa đổi, bỗ sung Điều 34 như sau: “Điều 34. In xuất khẩu xuất bản phẩm 1. Cơ sở in được chế bản, in, gia công sau in xuất bản phẩm để xuất khẩu 100% theo đơn đặt hàng của tổ chức, cá nhân nước ngoài sau khi có giấy phép của cơ quan quản lý nhà nước có thẩm quyền quy định tại khoản 3 Điều này. 2. Các trường hợp in xuất khâu xuất bản phẩm bao gồm: a) Cơ sở in tự đầu tư nguyên vật liệu và trực tiếp thực hiện chế bản, in, gia công sau in xuất bản phâm; b) Cơ sở in tiếp, nhận nguyên vật liệu từ tổ chức, cá nhân nước ngoài, sau đó trực tiếp thực hiện chế bản, in, gia công sau in xuất bản phẩm. 3.Ủy ban nhân dân cấp tỉnh cấp giấy phép In xuất khẩu xuất bản phẩm cho cơ sở in có giấy phép hoạt động in xuất bản phẩm quy định tại Điều 32 của Luật này trên địa bàn. Trường hợp xuất bản phẩm ¡ in xuất khẩu có dấu hiệu vi phạm quy định tại khoản 1 Điều 10 của Luật này phải tổ chức thẩm định đề xem xét, quyết định việc cấp giấy phép và phải có văn bản trả lời nêu rõ lý do nếu không cấp giấy phép. 4. Cơ sở in chịu trách nhiệm trước pháp luật về việc in đúng nội dung, hình thức xuất bản phẩm đã được cấp giấy phép in xuất khâu và không phải thông báo hoạt động kinh doanh phát hành xuất bản phẩm theo quy định tại Điều 36 của Luật này. 5. Xuất bản phẩm ¡n xuất khẩu cho tổ chức, cá nhân nước ngoài phải xuất khẩu 100%; trường hợp phát hành, sử dụng tại Việt Nam thì thực hiện nhập khẩu 18 theo quy định tại Điều 38, Điều 39 hoặc theo quy định tại Điều 42 của Luật này. 6. Tổ chức, cá nhân nước ngoài đặt In xuất khẩu xuất bản phẩm chịu trách nhiệm vệ bản quyên đôi với xuất bản phẩm đặt in xuất khâu. 7. Chính phủ quy định chỉ tiết khoản 3 Điều này.”."],["D1.K22","k","Sửa đổi, bổ sung Điều 36 như sau: “Điều 36. Hoạt động phát hành xuất bản phẩm 1. Cơ sở phát hành hoạt động theo các loại hình sau đây: a) Doanh nghiệp; đơn vị sự nghiệp; tổ hợp tác, hợp tác xã, liên hiệp hợp tác xã theo quy định của pháp luật về hợp tác xã; b) Chỉ nhánh, địa điểm kinh doanh của các loại hình quy định tại điểm a khoản này và địa điểm kinh doanh thuộc chỉ nhánh; c©) Hộ kinh doanh. 2. Cơ sở phát hành và cá nhân phát hành xuất bản phẩm nhằm mục đích kinh doanh phải đáp ứng các yêu cầu sau đây trong quá trình hoạt động, trừ trường hợp nhà xuất bản tự phát hành xuất bản phẩm do mình xuất bản: a) Người đứng đầu cơ sở phát hành, cá nhân phát hành xuất bản phẩm phải thường trú tại Việt Nam theo quy định của pháp luật về cư trú; b) Có địa điểm kinh doanh hợp pháp tại Việt Nam; trường hợp kinh doanh trên môi trường điện tử phải tuân thủ các điều kiện khác theo quy định của pháp luật về thương mại, thương mại điện tử, giao dịch điện tử và quy định khác của pháp luật có liên quan; c) Thực hiện thông báo vẻ việc đáp ứng các yêu cầu quy định tại điểm a và điểm b khoản này trước khi hoạt động, khi có thay đổi thông tin hoạt động, chấm dứt hoạt động phát hành xuất bản phẩm với Ủy ban nhân dân cấp xã. 3. Tổ chức, cá nhân phát hành xuất bản phẩm không nhằm mục đích kinh doanh có trách nhiệm sau đây: a) Bảo đảm nội dung xuất bản phẩm được phát hành không vi phạm quy định khoản 1 Điều 10 của Luật này; b) Không được kinh doanh xuất bản phẩm thuộc loại không kinh doanh; c) Tuân thủ quy định của Luật này và quy định khác của pháp luật có liên quan; d) Chịu trách nhiệm trước pháp luật về hoạt động phát hành xuất bản phẩm của mình. 4. Chính phủ quy định chi tiết Điều này.”."],["D1.K23","k","Sửa đổi, bố sung Điều 38 như sau: “Điều 38. Kinh doanh nhập khẩu xuất bản phẩm 1. Cơ sở nhập khẩu hoạt động theo các loại hình sau đây: 19 a) Doanh nghiệp; đơn vị sự nghiệp; tổ hợp tác, hợp tác xã và liên hiệp hợp tác xã theo quy định của pháp luật về hợp tác xã; b) Chi nhánh, địa điểm kinh doanh của các loại hình quy định tại điểm a khoản này và địa điềm kinh doanh thuộc chỉ nhánh; ©) Hộ kinh doanh. 2. Cơ sở nhập khâu, cá nhân kinh doanh nhập khẩu xuất bản phẩm phải đáp ứng những yêu câu sau đây: a) Người đứng đầu cơ sở nhập khâu, cá nhân kinh doanh nhập khẩu xuất bản phẩm phải thường trú tại Việt Nam theo quy định của pháp luật về cư trú; b) Có địa điểm kinh doanh hợp pháp tại Việt Nam; trường hợp kinh doanh trên môi trường điện tử phải tuân thủ các điều kiện khác theo quy định của pháp luật về thương mại, thương mại điện tử, giao dịch điện tử và quy định khác của pháp luật có liên quan; c) Trường hợp kinh doanh nhập khẩu xuất bản phẩm là sách, bản đồ phải có đội ngũ nhân viên đủ năng lực và có quy chế thầm định nội dung; d) Tuân thủ quy định của Luật này và quy định khác của pháp luật có liên quan, phù hợp với điều ước quốc tê mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên. __3. Trước khi hoạt động, cơ sở nhập khẩu, cá nhân kinh doanh nhập khẩu xuất bản phẩm phải thông báo với Bộ Văn hóa, Thê thao và Du lịch. 4. Sau khi hoàn thành việc thông báo theo quy định tại khoản 3 Điều này, cơ sở nhập khâu, cá nhân kinh doanh nhập khâu xuât bản phẩm được kinh doanh phát hành xuất bản phẩm do mình nhập khẩu theo quy định tại Điêu 36 của Luật này. 5. Trong quá trình hoạt động, cơ sở nhập khẩu, cá nhân kinh doanh nhập khẩu xuất bản phẩm phải duy trì đầy đủ các yêu câu quy định tại khoản 2 Điều này. 6. Trường hợp thay đổi nội dung thông tin trong thông báo hoạt động hoặc chấm dứt hoạt động, cơ sở nhập khẩu, cá nhân kinh doanh nhập khẩu xuất bản phẩm phải gửi thông báo với Bộ Văn hóa, Thể thao và Du lịch để cập nhật thông tin vào hệ thống dữ liệu quản lý. 7. Chính phủ quy định chỉ tiết Điều này.”."],["D1.K24","k","Sửa đổi, bô sung Điều 39 như sau: “Điều 39. Nhập khẩu xuất bán phẩm để kinh doanh 1. Việc nhập khẩu xuất bản phẩm để kinh doanh phải do cơ sở nhập khẩu hoặc cá nhân kinh doanh nhập khẩu xuất bản phẩm đáp ứng yêu cầu quy định tại khoản 2 Điều 38 của Luật này thực hiện. 2. Trước khi thực hiện nhập khẩu, cơ sở nhập khẩu, cá nhân kinh doanh nhập khẩu xuất bản phẩm phải thông báo danh mục xuất bản phẩm nhập khẩu với Bộ Văn hóa, Thể thao và Du lịch. 20 Sau khi thực hiện việc thông báo, cơ sở nhập khẩu, cá nhân kinh doanh nhập khẩu xuất bản phẩm được làm thủ tục nhập khẩu xuất bản phẩm theo quy định của pháp luật về hải quan, trừ trường hợp Bộ Văn hóa, Thể thao và Du lịch có văn bản yêu cầu không thực hiện thủ tục nhập khẩu theo quy định tại khoản 4 Điều này. 3. Sau khi hoàn thành thủ tục nhập khâu, cơ sở nhập khẩu, cá nhân kinh doanh nhập khẩu xuất bản phẩm có trách nhiệm thắm định nội dung xuất bản phẩm và thông báo kết quả thâm định, thời điểm dự kiến đưa xuất bản phẩm vào kinh doanh với Bộ Văn hóa, Thể thao và Du lịch. Sau khi thực hiện việc thấm định và thông báo kết quả thẩm định, cơ sở. nhập khẩu, cá nhân kinh doanh nhập khẩu xuất bản phẩm được đưa xuất bản phẩm vào kinh doanh, trừ trường hợp Bộ Văn hóa, Thể thao và Du lịch có văn bản yêu cầu tạm dừng kinh doanh xuất bản phẩm nhập khẩu theo quy định tại khoản 4 Điều này. 4. Đối với xuất bản phẩm có dấu hiệu vi phạm quy định tại khoản 1 Điều 10 của Luật này, Bộ Văn hóa, Thể thao và Du lịch có văn bản yêu cầu cơ sở nhập khẩu, cá nhân kinh doanh xuất bản phẩm nhập khẩu không thực hiện thủ tục nhập khâu hoặc tạm đừng kinh doanh xuất bản phẩm nhập khẩu và áp dụng các biện pháp xử lý theo quy định của pháp luật. 5. Việc tạm nhập, tái xuất xuất bản phẩm thực hiện theo quy định của pháp luật về hải quan và phải thông báo với Bộ Văn hóa, Thể thao và Du lịch. 6. Chính phủ quy định chỉ tiết Điều này.”."],["D1.K25","k","Sửa đổi, bố sung Điều 40 như sau: “Điều 40. Trách nhiệm của cơ sở phát hành, cơ sở nhập khẩu và cá nhân phát hành, nhập khẩu xuất bản phẩm nhằm mục đích kinh doanh -_1, Cơ sở phát hành và cá nhân phát hành xuất bản phẩm nhằm mục đích kinh doanh có trách nhiệm sau đây: a) Tuân thủ quy định tại Điều 36 của Luật này trong quá trình hoạt động; b) Báo cáo định kỳ hoặc đột xuất theo quy định hoặc khi có yêu cầu của cơ quan quản lý nhà nước có thẩm quyền; c) Không được tàng trữ, phát hành xuất bản phẩm có nội dung quy định tại khoản l Điều 10 của Luật này, xuất bản phẩm không có hóa đơn, chứng từ thể hiện nguồn gốc hợp pháp hoặc bị đình chỉ phát hành, thu hồi, tịch thu, cắm lưu hành, tiêu hủy; đ) Tham gia các lớp tập huấn, bồi dưỡng kiến thức pháp luật về xuất bản đo cơ quan quản lý nhà nước có thẩm quyền về hoạt động xuất bản tổ chức; đ) Dùng việc phát hành và báo cáo với cơ quan nhà nước có thẩm quyền trong trường hợp phát hiện xuất bản phẩm có nội dung quy định tại khoản 1 Điều 10 của Luật này; 21 e) Lưu giữ, xuất trình, cung cấp hỗ sơ, tài liệu, giấy tờ liên quan đến hoạt động kinh doanh phát hành xuất bản phẩm khi có yêu cầu của cơ quan quản lý nhà nước có thâm quyển; g) Khi phát hiện nội dung xuất bản phẩm trên hệ thống của mình có dấu hiệu vi phạm quy định tại khoản 1 Điều 10 của Luật này, cơ sở phát hành hoạt động trên môi trường điện tử hoặc sàn thương mại điện tử phải áp dụng ngay biện pháp ngăn chặn tạm thời, thông báo với cơ quan quản lý nhà nước có thẩm quyền trong thời hạn và chấp hành các biện pháp xử lý theo quy định của Chính phủ. 2. Cơ sở nhập khẩu và cá nhân nhập khẩu xuất bản phẩm nhằm mục đích kinh doanh có trách nhiệm sau đây: a) Tuân thủ quy định tại Điều 38 và Điều 39 của Luật này trong quá trình hoạt động; b) Thực hiện trách nhiệm quy định tại các điểm b, c và d khoản 1 Điều này; c) Tổ chức thâm định nội dung xuất bản phẩm nhập khẩu; lưu giữ hồ sơ, kết quả thâm định; thông báo kết quả thẩm định và thời điểm dự kiến phát hành xuất bản phẩm; quyết định việc phát hành xuất bản phẩm nhập khẩu; d) Lưu giữ, xuất trình, cung cấp hỗ sơ, tài liệu, giấy tờ và chấp hành các quyết định xử lý có liên quan đến hoạt động nhập khẩu xuất bản phẩm của cơ quan quản lý nhà nước có thẩm quyền; đ) Chịu trách nhiệm trước pháp luật về tính chính xác của thông tin thông báo, kết quả thẩm định, quyết định phát hành và tính hợp pháp của xuất bản phẩm nhập khẩu. Việc cơ quan quản lý nhà nước có thẩm quyển tiếp nhận thông báo, kiểm tra, đối chiếu dữ liệu hoặc có ý kiến trong quá trình quản lý không loại trừ, thay thế hoặc làm giảm trách nhiệm của cơ sở nhập khẩu và cá nhân nhập khẩu.”"],["D1.K26","k","Sửa đổi, bổ sung Điều 42 như sau: “Điều 42. Nhập khẩu xuất bản phẩm không kinh doanh 1. Xuất bản phẩm không kinh doanh được nhập khẩu trong các trường hợp sau đây: a) Xuất bản phẩm phục vụ hội thảo, hội nghị quốc tế tại Việt Nam đã được cơ quan có thẩm quyền của Việt Nam cho phép tổ chức; b) Xuất bản phẩm là tài sản của cơ quan, tổ chức, gia đình, cá nhân được nhập khâu để sử dụng nội bộ hoặc để sử dụng riêng; c) Xuất bản phẩm thuộc tiêu chuẩn hành lý mang theo người của người nhập cảnh để sử dụng cho nhu cầu cá nhân; d) Xuất bản phẩm tặng cho cơ quan, tổ chức, cá nhân gửi qua bưu điện, dịch vụ chuyển phát có giá trị không lớn hơn tiêu chuẩn miễn thuế theo quy định của pháp luật; ä) Xuất bản phẩm trao đôi, tặng cho Thư viện Quốc gia Việt Nam và các 22 thư viện công lập phục vụ mục đích lưu trữ, học tập; e) Xuất bản phẩm của cơ quan, tô chức, cá nhân được hưởng quyền ưu đãi, miễn trừ ngoại giao thực hiện theo quy định của pháp luật về hải quan, pháp luật về ưu đãi, miễn trừ dành cho cơ quan đại diện ngoại giao, cơ quan lãnh Sự nước ngoài và cơ quan đại diện của tổ chức quốc tế tại Việt Nam và điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên; g) Các trường hợp nhập khẩu khác do Chính phủ quy định. 2. Cơ quan, tổ chức, cá nhân phải làm thủ tục theo quy định của pháp luật về hải quan và chịu trách nhiệm trước pháp luật về xuât bản phẩm do mình nhập khâu. 3. Xuất bản phẩm quy định tại khoản 1 Điều này không được kinh doanh dưới mọi hình thức. 4. Xuất bản phẩm quy định tại điểm a và điểm b khoản 1 Điều này sau khi sử dụng phải tái xuất; trường hợp không tái xuất phải chuyên giao cho cơ quan, tổ chức theo quy định của Chính phủ. Trường hợp xuất bản phẩm nhập khẩu không kinh doanh sau khi sử dụng, tặng cho các cơ quan, tổ chức, cá nhân và trường hợp xuất bản phẩm nhập khâu gửi qua bưu điện, dịch vụ chuyển phát có giá trị lớn hơn tiêu chuẩn miễn thuế thì thực hiện theo quy định tại Điều 39 của Luật này.”"],["D1.K27","k","Sửa đổi, bổ sung Điều 44 như sau: “Điều 44. Triển lãm, hội chợ xuất bản phẩm 1. Cơ quan, tổ chức, cá nhân Việt Nam và nước ngoài trước khi tổ chức triển lãm, hội chợ xuất. bản phẩm tại Việt Nam phải thực hiện thông báo với Ủy ban nhân dân cấp xã nơi tổ chức triển lãm, hội chợ. 2. Cơ quan, tổ chức, cá nhân tham gia triển lãm, hội chợ mà thực hiện hoạt động kinh doanh phát hành xuất bản phẩm phải đáp ứng quy định tại khoản 1 và khoản 2 Điều 36 của Luật này. 3. Chính phủ quy định chỉ tiết Điều này.”."],["D1.K28","k","Sửa đổi, bổ sung tên Chương V như sau: tớnng toa CHƯƠNG VÀ. \" XUẤT BẢN, PHÁT HÀNH XUÁT BẢN PHẢM ĐIỆN TƯ VÀ CUNG CÁP DỊCH VỤ TRUNG GIAN PHÁT HÀNH”"],["D1.K29","k","Sửa đổi, bổ sung Điều 45 như sau: “Điều 45. Điều kiện, yêu cầu đối với xuất bản, phát hành xuất bản phẩm điện tử và cung cấp dịch vụ trung gian phát hành 1. Nhà xuất bản thực hiện xuất bản điện tử khi có đủ các điều kiện sau đây: a) Có năng lực về thiết bị, công nghệ, nhân lực kỹ thuật để điều hành và quản lý quá trình xuât bản điện tử; 23 b) Có biện pháp kỹ thuật phù hợp với quy định của pháp luật để ngăn chặn sao chép, can thiệp bất hợp pháp vào nội dung xuất bản phẩm; e) Có tên miền quốc gia Việt Nam “.vn” theo quy định của pháp luật để thực hiện xuât bản điện tử trên môi trường mạng Internet và hệ thông thông tin; d) Trường hợp xuất bản, phát hành xuất bản phẩm điện tử qua ứng dụng trên thiết bị di động thì ngoài việc tuân thủ các quy định tại điểm a và điểm b khoản này còn phải tuân thủ các quy định của pháp luật về quản lý hoạt động thương mại điện tử qua ứng dụng trên thiết bị di động; đ) Thực hiện đăng ký hoạt động xuất bản xuất bản phẩm điện tử với Bộ Văn hóa, Thể thao và Du lịch; trường hợp kinh doanh phát hành xuất bản phẩm điện tử của tô chức, cá nhân khác thì phải thực hiện thông báo theo quy định tại điểm đ khoản 2 Điều này. 2. Cơ sở phát hành, cá nhân kinh doanh phát hành xuất bản phâm điện tử ngoài việc tuân thủ các quy định tại điểm a và điêm b khoản 2 Điêu 36 của Luật này phải đáp ứng các yêu câu sau đây: a) Có năng lực thiết bị, công nghệ, nhân lực kỹ thuật để điều hành và quản lý quá trình phát hành xuất bản phẩm điện tử; b) Có tên miền quốc gia Việt Nam “.vn” trong trường hợp hoạt động kinh doanh phát hành xuất bản phẩm điện tử trên môi trường mạng Internet và hệ thống thông tin; c) Xuất bản phẩm điện tử được phát hành phải có nguồn gốc hợp pháp hoặc được phát hành theo quyết định phát hành của giám đốc nhà xuất bản; đ) Phải đáp ứng các yêu cầu quy định tại điểm a và điểm b khoản này trước khi thực hiện thông báo hoạt động kinh doanh phát hành xuất bản phẩm điện tử với Bộ Văn hóa, Thể thao và Du lịch. 3. Cơ quan, tổ chức xuất bản và phát hành tài liệu không kinh doanh là xuất bản phẩm điện tử phải đáp ứng các yêu cầu sau đây: a) Có năng lực thiết bị, công nghệ, nhân lực kỹ thuật để điều hành và quản lý quá trình phát hành xuất bản phẩm điện tử; b) Có tên miền quốc gia Việt Nam “.vn” để thực hiện xuất bản, phát hành xuất bản phẩm điện tử trên môi trường mạng Internet và hệ thống thông tin; c) Bảo đảm kiểm soát nội dung và phạm vi phát hành xuất bản phẩm điện tử phù hợp với mục đích không kinh doanh. 4. Cơ sở cung cấp dịch vụ trung gian phát hành xuất bản phẩm phải tuân thủ các yêu cầu sau đây: a) Chỉ cung cấp dịch vụ phát hành xuất bản phẩm cho nhà xuất bản và tổ chức, cá nhân đáp ứng quy định tại khoản 2 Điều này và Điều 36 của Luật này; 24 b) Thiết lập cơ chế quản trị phục vụ việc ngăn chặn, gỡ bỏ hoặc hạn chế truy cập nội dung vi phạm pháp luật về xuất bản theo yêu cầu của cơ quan quản lý nhà nước về xuất bản hoặc cơ quan có thâm quyền theo quy định của pháp luật vê an ninh mạng, bảo vệ an ninh quôc gia; thời hạn, trình tự, thủ tục thực hiện theo quy định của Chính phủ; ©) Thực hiện lưu trữ, cung cắp thông tin phục vụ công tác quản lý nhà nước và tuân thủ các quy định của pháp luật; d) Có giải pháp công nghệ nhận dạng nội dung số phục vụ phát hiện, ngăn chặn, gỡ bỏ nội dung xuất bản phẩm điện tử xâm phạm quyên tác giả, quyền liên quan theo quy định của pháp luật về sở hữu trí tuệ và quy định khác của pháp luật có liên quan. 5. Cơ quan, tổ chức, cá nhân phát hành xuất bản phẩm không nhằm mục đích kinh doanh mà không thuộc trường hợp quy định tại khoản 3 Điều này phải đáp ứng các yêu cầu theo quy định tại các điểm a, b và e khoản 2 Điều này. 6. Chính phủ quy định chi tiết về điều kiện, việc đăng ký đối với hoạt động xuất bản xuất bản phẩm điện tử; yêu cầu, . việc thông báo đối với hoạt động kinh doanh phát hành xuất bản phẩm điện tử; yêu cầu đối với cơ sở cung cấp dịch vụ trung gian phát hành xuất bản phẩm quy định tại Điều này.”"],["D1.K30","k","Sửa đôi, bổ sung khoản 1 Điều 46 như sau: “1. Tác phẩm, tài liệu xuất bản lần đầu theo phương thức xuất bản điện tử phải được xuất bản thông qua nhà xuất bản hoặc do cơ quan, tổ chức thực hiện xuất bản theo quy định tại Điều 25 của Luật này.”."],["D1.K31","k","Sửa đổi, bổ sung Điều 50 như sau: “Điều 50. Trách nhiệm của nhà xuất bản, tô chức, cá nhân phát hành, nhập khẩu xuất bản phẩm điện tử, cung cấp dịch vụ trung gian phát hành xuất bản phẩm 1. Trách nhiệm của nhà xuất bản được quy định như sau: a) Thực hiện quy định tại các điều 18, 21, 22, 23, 24, 27, 45, 46, 47, 48, 49 và 52 của Luật này; b) Bảo đảm nội dung xuất bản phẩm điện tử được phát hành đúng với nội dung xuất bản phẩm điện tử nộp lưu chiểu; thực hiện lưu trữ, quản lý và bảo đảm khả năng truy xuất dữ liệu xuất bản phẩm điện tử phục vụ công tác quản lý nhà nước; c) Đối với xuất bản phẩm đã được xuất bản hợp pháp chuyển sang hình thức xuất bản phẩm điện tử, việc ra quyết định xuất bản, quyết định phát hành và nộp lưu chiêu xuất bản phẩm điện tử thực hiện theo quy định của Luật này; d) Thực hiện các biện pháp kỹ thuật ngăn chặn việc can thiệp vào nội dung xuất bản phẩm hoặc gỡ bỏ xuất bản phẩm vi phạm pháp luật theo yêu cầu của cơ quan nhà nước có thầm quyền; 25 . đ) Dùng phát hành xuất bản phẩm khi có yêu cầu của cơ quan quản lý nhà nước có thâm quyên theo quy định của pháp luật; e) Kiểm tra, giám sát nội dung xuất bản phẩm liên kết và thiết lập hệ thống giảm sát hoạt động phát hành trên môi trường số; 8) Không được sao chép, số hóa, lưu trữ, truyền đưa, phát tán hoặc phát hành xuất bản phẩm trên môi trường điện tử, nền tảng số vi phạm quy định của pháp luật về xuất bản và quy định khác của pháp luật có liên quan. 2. Trách nhiệm của tổ chức, cá nhân phát hành xuất bản phẩm điện tử được quy định như sau: a) Thực hiện quy định tại các điều 23, 45, 46, 47 và 49 của Luật này; b) Thực hiện đúng nội dung bản mẫu đã được tổng giám đốc hoặc giám đốc nhà xuât bản ký duyệt; ¬- Thực hiện các biện pháp kỹ thuật ngăn chặn việc can thiệp vào nội dung xuất bản phâm hoặc gỡ bỏ xuât bản phẩm vị phạm pháp luật theo yêu câu của cơ quan quản lý nhà nước có thâm quyên và phôi hợp cung câp thông tin, dữ liệu liên quan phục vụ công tác quản lý nhà nước; d) Dừng phát hành xuất bản phẩm điện tử khi có yêu cầu của cơ quan quản lý nhà nước có thâm quyên. 3. Trách nhiệm của cơ quan, tổ chức phát hành xuất bản phẩm điện tử là tài liệu không kinh doanh được quy định như sau: 8) Thực hiện quy định tại Điều 46 của Luật này và các điểm b, e và d khoản 2 Điêu này; b) Thực hiện đúng văn bản chấp thuận của tác giả, chủ sở hữu quyền tác giả; c) Chịu trách nhiệm trước pháp luật về việc phát hành xuất bản phẩm điện tử; thực hiện lưu trữ và cung cấp đữ liệu phát hành theo yêu cầu của cơ quan quản lý nhà nước. 4. Trách nhiệm của cá nhân kinh doanh phát hành xuất bản phẩm điện tử được quy định như sau: a) Thông báo với Bộ Văn hóa, Thể thao và Du lịch trước khi hoạt động, chấm dứt hoạt động kinh doanh phát hành xuất bản phẩm điện tử; b) Thực hiện hoạt động kinh doanh đúng nội dung đã thông bé báo với Bộ Văn hóa, Thể thao và Du lịch; c) Có hóa đơn, chứng từ hoặc tài liệu chứng minh nguồn gốc xuất xứ của xuất bản phẩm điện tử được kinh doanh; d) Không kinh doanh phát hành xuất bản phẩm điện tử có nội dung vi phạm quy định tại khoản 1 Điều 10 của Luật này và xuất bản phẩm điện tử thuộc loại không kinh doanh; đ) Xuất trình các giấy tờ, tài liệu quy định tại điểm c khoản này với cơ quan 26 quản lý nhà nước có thâm quyền; e) Ngăn chặn, gỡ bỏ xuất bản phẩm điện tử có nội dung vi phạm theo yêu cầu của cơ quan quản lý nhà nước có thầm quyên và cung câp dữ liệu phục vụ công tác quản lý nhà nước. 5. Trách nhiệm của tổ chức, cá nhân cung cấp dịch vụ trung gian phát hành xuất bản phẩm điện tử tại Việt Nam được quy định như sau: a) Thực hiện quy định tại khoản 4 Điều 45 của Luật này trong quá trình hoạt động; b), Kiểm tra, lưu giữ và cung cấp thông tin, đữ liệu theo quy định của pháp luật và yêu cầu của cơ quan nhà nước có thâm quyền; c) Thực hiện việc ngăn chặn, gỡ bỏ hoặc hạn chế truy cập xuất bản phẩm điện tử có vi phạm theo yêu cầu của cơ quan nhà nước có thâm quyển; d) Phối hợp với nhà xuất bản, cơ quan quản lý nhà nước và chủ thể có liên quan trong việc xử lý xuất bản phẩm điện tử có vi phạm. 6. Trách nhiệm của tổ chức nước ngoài cung cấp dịch vụ trung gian phát hành xuất bản phẩm, sản phẩm thông tin có tính chất xuất bản phẩm trên không gian mạng cho người sử dụng tại Việt Nam được quy định như sau: a) Lưu giữ thông tin, dữ liệu và bảo đảm khả năng xác định tổ chức, cá nhân phát hành xuất bản phẩm; cung cấp thông tin, dữ liệu theo yêu cầu của cơ quan nhà nước có thâm quyền theo quy định của pháp luật; b) Tuân thủ quy định tại điểm c khoản 5 Điều này; c) Có người đại diện theo quy định của pháp luật để tiếp nhận các yêu cầu của cơ quan quản lý nhà nước có thẩm quyền để thực hiện quy định tại điểm c khoản 5 Điều này. 7. Trách nhiệm của tổ chức, cá nhân phát hành xuất bản phẩm điện tử không nhằm mục đích kinh doanh không thuộc trường hợp quy định tại khoản 3 Điều này được quy định như sau: a) Tuân thủ các quy định tại khoản 5 Điều 45 của Luật này và pháp luật về sở hữu trí tuệ, an ninh mạng, giao dịch điện tử và quy định khác của pháp luật có liên quan; b) Không kinh doanh xuất bản phẩm điện tử dưới mọi hình thức; c) Chịu trách nhiệm trước pháp luật về nội dung xuất bản phẩm do mình phát hành. §. Trách nhiệm của tổ chức, cá nhân nhập khẩu xuất bản phẩm điện tử nhằm mục đích kinh doanh được quy định như sau: a) Trường hợp nhập khâu xuất bản phẩm điện tử chứa trong thiết bị, phương tiện hoặc vật mang tin thì thực hiện theo quy định tại các điêu 38, 39 và 51 của Luật này; trường hợp chỉ nhập khâu quyền truy cập xuất bản phẩm điện tử, tệp điện tử 27 mang nội dung xuất bản phẩm thì thực hiện theo quy định tại Điều 51 của Luật này; b) Báo cáo định kỳ hoặc đột xuất theo quy định hoặc khi có yêu cầu của Cơ quan quản lý nhà nước có thâm quyên; tham gia các lớp tập huân, bôi dưỡng kiên thức pháp luật xuât bản do cơ quan quản lý nhà nước về hoạt động xuất bản tô chức; c) Không nhập khẩu xuất bản phẩm có nội dung quy định tại khoản 1 Điều 10 của Luật này, xuât bản phâm không có hóa đơn, chứng từ thê hiện nguồn gôc hợp pháp hoặc bị đình chỉ phát hành, thu hôi, tịch thu, câm lưu hành, tiêu hủy; d) Tổ chức thẩm định nội dung xuất bản phẩm nhập khẩu; lưu giữ hồ sơ, kết quả thẩm định; thông báo kết quả thâm định và thời điểm dự kiến phát hành xuất bản phẩm; quyết định việc phát hành xuất bản phẩm; đ) Lưu giữ, xuất trình, cung cấp hồ sơ, tài liệu, giấy tờ và chấp hành các quyết định xử lý có liên quan đến hoạt động nhập khẩu xuất bản phẩm điện tử của cơ quan quản lý nhà nước có thâm quyền; e) Chịu trách nhiệm trước pháp luật về tính chính xác của thông tin tông báo, kết quả thâm định, quyết định phát hành và tính hợp pháp của xuất bản phẩm điện tử nhập khẩu.”"],["D1.K32","k","Sửa ta đổi, bổ sung Điều 51 như sau: “Điều 51. Nhập khẩu xuất bản phẩm điện tử 1. Nhập khẩu xuất bản phẩm điện tử được thực hiện dưới các hình thức sau đây: a) Nhập khẩu quyền truy cập xuất bản phẩm điện tử, tệp điện tử mang nội dung xuất bản phẩm để cung cấp cho người sử dụng tại Việt Nam; b) Nhập khẩu xuất bản phẩm điện tử được chứa trong thiết bị, phương tiện hoặc vật mang tin; e) Các hình thức nhập khẩu khác. 2. Xuất bản phẩm điện tử nhập khẩu phải có nguồn gốc hợp pháp, bảo đảm quyền khai thác hợp pháp và không có nội dung vi phạm quy định tại khoản 1 Điều 10 của Luật này và quy định khác của pháp luật có liên quan. 3. Tổ chức, cá nhân nhập khẩu phải bảo đảm khả năng xác định, quản lý, lưu trữ hoặc truy xuất xuất bản phẩm điện tử nhập khẩu phục vụ việc thẩm định, thanh tra, kiểm tra và xử lý vi phạm theo quy định của pháp luật. 4. Chính phủ quy định chỉ tiết Điều này.”."],["D1.K33","k","Thay thế, bỏ một số từ, cụm từ và bãi bỏ một số điều như sau: nhân dân cấp tỉnh” tại khoản 1 Điều §; xuất bản” tại điểm c khoản 1 Điêu 18; 28 Thẻ thao và Du lịch” tại điểm c khoản 1 Điều 18, điểm c và điểm d khoản 1 Điều 19, khoản 1 Điều 35; Điều 23” tại điểm đ khoản 1 Điều 18; xác nhận đăng ký kế hoạch xuất bản” tại điểm g khoản 1 Điều 18; ø) Bãi bỏ các điều 2, 9, 11, 15, 29, 37 và 41."],["D1.K33.Đa","d","Thay thế cụm từ “Bộ Thông tin và Truyền thông” bằng cụm từ “Ủy ban"],["D1.K33.Đb","d","Thay thế cụm từ “đăng ký xuất bản” bằng cụm từ “đăng ký kế hoạch"],["D1.K33.Đc","d","Thay thế cụm từ “Bộ Thông tin và Truyền thông” bằng cụm từ “Bộ Văn hóa,"],["D1.K33.Đd","d","Thay thế cụm từ “điểm b khoản 3 Điều 23” bằng cụm từ “điểm đ khoản 1"],["D1.K33.Đđ","d","Thay thế cụm từ “giấy xác nhận đăng ký xuất bản” bằng cụm từ “văn bản"],["D1.K33.Đe","d","Bỏ cụm từ ' 'cấp đổi,”, “, gia hạn” tại khoản 2 Điều 8;"]],"u":96},{"n":"Điều 2","t":"Sửa đỗi, bố sung Danh mục phí, lệ phí ban hành kèm theo Luật","p":[],"u":150,"cut":1},{"n":"Điều 3","t":"Điều khoản thi hành","p":[],"u":151,"cut":1}],"18/2026/QH16":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Hiễn pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đối, bổ sung một số điều theo Nghị quyết số 203/2025/0HI 3 : _ Quốc hội ban hành tuậ Phát triển đô thị. : —"]],"u":0},{"n":"Đoạn","t":"","p":[["p1.para1","o","LÝ x/ 9 K32 Đaa ÿ‹ở dỡng Cổng kao QUỐC HỘI .-_ CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM ˆ Độc lập - Tự do - Hạnh phúc Luật số: 18/2026/QH16 LUẬT - PHÁT TRIÊN ư THỊ : Căn cứ Hiễn pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đối, bổ sung một số điều theo Nghị quyết số 203/2025/0HI 3 : _ Quốc hội ban hành tuậ Phát triển đô thị. : — Chương I NHỮNG QUY ĐỊNH CHUNG"]],"u":158},{"n":"Điều 1","t":"Phạm vi điều chỉnh -","p":[["D1.K1","k","Luật này quy định cơ chế, chính sách thúc đây phát triển thành phố là đô thị loại đặc biệt (sau đây gọi là đô thị đặc biệt), thành phố khác và khu kinh tế đặc biệt."],["D1.K2","k","Thành phố Hồ Chí*Minh, thành phố khác là đô thị đặc biệt (sau đây gọi là Thành phố) được áp dụng cơ chế, chính sách thúc đẩy phát triển đô thị đặc biệt quy _ định tại Luật này. Thành phố Hà Nội thực hiện theo quy định tại Luật Thủ đô."],["D1.K3","k","Thành phố không thuộc trường hợp quy định tại khoản 2 Điều này được áp dụng một số cơ chế, chính sách thúc đây phát triển đô thị đặc biệt quy định tại Luật này, trừ quy định tại điểm a khoản 3 Điều 5, khoản 2 Điều 7, Điều 8, điểm a khoản 1 Điều 16 và Mục 7 Chương II của Luật này. °"],["D1.K4","k","Khu kinh tế đặc biệt được áp dụng cơ chế, chính sách phát triển khu kinh tế đặc biệt quy định tại Luật này. Tỉnh, thành phố nơi có khu kinh tế đặc biệt được thực hiện một số cơ chế, chính sách thúc đẩy phát triển đô thị đặc biệt quy định tại Chương II của Luật này để áp dụng trên địa bàn khu kinh tế đặc biệt, trừ quy định tại điểm a khoản 3 Điều 5, khoản 2 Điều 7, Điều 8, điểm a khoản 1 Điều l6 và Mục 7 Chương II của Luậtnày. -- -"],["D1.K5","k","Chính phủ quy định phạm vi áp dụng cơ chế, chính sách thúc đây phát triển đô thị đặc biệt cho các trường hợp quy định tại khoản 3-và khoản 4 Điều này trong trường hợp có chủ trương của cấp có thẩm quyền, trên cơ sở phù hợp với điều kiện đặc thù, định hướng phát triển, năng lực thực thi của từng địa phương và tuân thủ các nguyên tắc quy định tại các khoản 1, 2, 4 và 5 Điều 3 của Luật này. c8 2"],["D1.K6","k","Trường hợp cần thí điểm cơ chế, chính sách khác hoặc chưa được quy định trong Luật này, văn bản quy phạm pháp luật khác của Quốc hội, Ủy ban Thường vụ Quốc hội đối với các trường hợp quy định tại khoản 3 và khoản 4 Điều này để đáp ứng yêu cầu quản lý nhà nước, quản lý kinh tế, quản lý xã hội, Chính phủ ban hành nghị định sau khi có chủ trương của cấp có thẩm quyền và được sự đồng ý của Ủy ban Thường vụ Quốc hội."]],"u":159},{"n":"Điều 2","t":"Giải thích từ ngữ","p":[["D2.K1","k","Khu kinh tế đặc biệt là xã, phường, đặc khu có vị trí chiến lược, được công nhận theo các tiêu chí quy định tại Luật này, được áp dụng các cơ chế, chính sách vượt trội để nâng cao năng lực cạnh tranh quốc gia và phát triển kinh tế - xã hội của địa phương, vùng và cả nước."],["D2.K2","k","Dự án lớn, quan trọng là một trong các dự án sau đây: tư theo quy định của pháp luật về đầu tư theo phương thức đối tác công tư (sau . đây gọi là dự án PPP) sử dụng vốn ngân: sách địa phương, nguồn vốn hợp pháp khác của địa phương, dự án đầu tư theo quy định của pháp luật về đầu tư cần triển khai ngay, dự án đầu tư xây dựng cấp bách hoặc khân cấp theo chỉ đạo của Ban Chấp hành Trung ương Đảng, Bộ Chính trị, Ban Bí thư, Đảng ủy Chính phủ, Ban Chấp hành Đảng bộ Thành phố; vốn hợp pháp khác của địa phương trên địa bàn Thành phó, vùng đô thị đặc biệt đáp ứng tiêu chí phân loại dự án quan trọng quốc gia theo quy định của pháp luật về đầu tư công; tư chiến lược thực biện. :"],["D2.K2.Đa","d","Dự án đầu tư công theo quy định của pháp luật về đầu tư công, dự án đầu"],["D2.K2.Đb","d","Dự án đầu tư công, dự án PPP sử dụng vốn ngân sách địa phương, nguồn"],["D2.K2.Đc","d","Dự án thuộc Danh mục ưu tiên thu hút nhà đầu tư chiến lược do nhà đầu"],["D2.K3","k","Không gian tầm thấp, không gian tầm cao là phần không gian trên bề mặt đất, mặt nước thuộc địa giới hành chính Thành phố có phạm vi, ranh giới, độ cao - được xác định theo quy hoạch của Thành phó, được sử dụng cho mục đích quản lý, khai thác, sử dụng trong các hoạt động phát triển kinh tế - xã hội, khoa học, công nghệ, giao thông và quản lý đô thị gắn với bảo đảm quốc phòng, an ninh, trật tự, an toàn xã hội."],["D2.K4","k","Khu thương mại tự đo là khu chức năng có ranh giới địa lý xác định, gắn liền hoặc kết nối giao thông trực tiếp với hệ thống cảng biển quốc tế, cảng hàng 3 không quốc tế, trung tâm tài chính quốc tế, cửa khâu quốc tế quan trọng hoặc hạ tầng logistics chiến lược khác; được thành lập để áp dụng các cơ ché, chính sách vượt trội về đầu tư, tài chính, thương mại, dịch vụ chất lượng cao, logistics, thúc đẩy sản xuất, xuất khẩu, hoạt động nghiên cứu và phát triển và thu hút nguồn nhân lực chất lượng cao; có thê gồm nhiều khu chức năng."],["D2.K5","k","Khu logistics tích hợp là khu chức năng có ranh giới địa lý xác định, gắn liền với các đầu mối giao thông đa phương thức; được thành lập theo mô hình hệ sinh thái, ứng dụng khoa học, công nghệ hiện đại để thực hiện các địch vụ logistics kết hợp với hoạt động sản xuất, gia công hàng hóa và hoạt động thương mại SỐ, thương mại điện tử. Khu logistics tích hợp là một khu độc lập hoặc thuộc khu thương mại tự do. ta : -"],["D2.K6","k","Kinh tế biển là toàn bộ các hoạt động kinh tế diễn ra trên biển hoặc có liên quan trực tiếp đến biển, bao gồm kinh tế hàng hải; logistics; công nghiệp hỗ trợ hoạt động dầu khí, dịch vụ dầu khí; khai thác tài nguyên khoáng sản biển, trừ dầu khí; năng lượng, năng lượng tái tạo; du lịch và dịch vụ biển; nuôi trồng và khai thác hải sản; công nghiệp ven biển và hoạt động kinh tế biển khác."],["D2.K1~2","k","Khu cảng mở là khu vực có ranh giới địa lý xác định, gồm một hoặc nhiều cảng biển, được áp dựng chế độ, thủ tục hải quan và quản lý chuyên ngành đặc thù để tạo điều kiện thuận lợi nhất cho hoạt động xuất khẩu, nhập khẩu và - hoạt động ngoại thương khác. -"],["D2.K8","k","Vùng đô thị đặc biệt là khu vực liên kết phát triển kinh tế - xã hội gồm Thành phố và các đơn vị hành chính cấp tỉnh có địa giới hành chính liền kề với Thành phố. : 9, Phát triển đô thị theo định hướng giao thông công công (sau đây gọi là TOĐ) là giải pháp quy hoạch, đầu tư cải tạo, chỉnh trang và phát triển đô thị, lấy điểm kết nối giao thông đường sắt làm điểm tập trung dân cư, kinh doanh dịch vụ thương mại, văn phòng và chức năng khác. l"],["D2.K10","k","Khu vực TOD là khu vực bao gồm nhà ga đường sắt, khu tập kết bảo dưỡng, sửa chữa tàu (đề-pô) và vùng phụ cận được xác định theo quy hoạch có liên quan để xây dựng đường sắt kết ệt hợp c cải tạo, chỉnh h trang đô thị, đầu tư phát triển đô thị. 11, Cáp có thẩm quyên là cơ quan có thâm quyền của Đảng theo phân cấp quản lý trong việc lãnh đạo, chỉ đạo, quyết định chủ trương, chính sách có liên quan đến nội dung quy định tại Luật này. 4"]],"u":166},{"n":"Điều 3","t":"Nguyên tắc phân quyền và thực hiện nhiệm vụ, quyền hạn được phân quyền đối với chính quyền Thành phố","p":[["D3.K1","k","Bảo đảm phù hợp với Hiến pháp, không trái với điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên;"],["D3.K2","k","Bảo đám không phương hại đến quốc phòng, an ninh, đối ngoại quốc gia, dân tộc, tôn giáo và lĩnh vực khác liên quan trực tiếp đến chủ quyền quốc gia;"],["D3.K3","k","Phân quyền triệt để, toàn điện và phân định rõ thẩm quyền của Hội đồng nhân dân, Ủy ban nhân dân, Chủ tịch Ủy ban nhân dân Thành phố. Ngoài các nhiệm vụ, quyền hạn được quy định tại Luật này, Hội đồng nhân dân, Ửy ban nhân dân, Chủ tịch Ủy ban nhân dân các cấp của Thành phố còn thực hiện các nhiệm vụ, quyền hạn theo quy định khác của pháp luật có liên quan. Căn cứ tình hình thực tiễn, Hội đồng nhân dân, Ủy ban nhân dân, Chủ tịch Ủy ban nhân dân Thànb.phố có quyền phân cấp cho cơ quan, tổ chức, cá nhân thực hiên liên tục, thường xuyên một hoặc một số nhiệm vụ, quyền hạn mà mình được giao theo quy định của pháp luật, trừ trường hợp pháp luật quy định không được phân cấp; -"],["D3.K4","k","Bảo đảm quyền con người, quyền cơ bản của công dân, công bằng xã hội, phát triển bền vững và giữ gìn bản sắc, giá trị văn hóa của Thành phó, vùng đô thị đặc biệt; không làm ảnh hưởng đến ổn định kinh tế vĩ mô, an toàn tài chính quốc gia; tôn trọng các quy luật thị trường;"],["D3.K5","k","Bảo đảm việc vận hành nền hành chính quốc gia thống nhất, thông suốt, hiệu quả; bảo đảm thâm quyền, trách nhiệm của cơ quan, người đứng đầu gắn liền với cơ chế kiểm soát quyền lực và năng lực thực thi; tính công khai, minh bạch, trách nhiệm giải trình và thực hiện có hiệu quả việc kiểm soát quyền lực, phòng, chống tham nhũng, lãng phí, tiêu cực gắn với trách nhiệm kiểm tra, thanh tra, giám sát của cơ quan có thẩm quyền; có cơ chế theo dõi, đánh giá, kiểm tra gắn với cơ chế khuyến khích, bảo vệ cán bộ năng động, đổi mới, sáng tạo, đám nghĩ, đám làm, dám đột phá, dám chịu trách nhiệm vì lợi ích chung; kịp thời điều chỉnh nội dung phân quyền khi cơ quan, tổ chức, cá nhân được phân quyền thực hiện không hiệu quả nhiệm vụ, quyền hạn được giao. 5"]],"u":179},{"n":"Điều 4","t":"Nguyên tắc phân quyền và thực hiện nhiệm vụ, quyền hạn được phân quyền đối với chính quyền địa phương ở nơi có khu kinh tế đặc biệt","p":[["D4.K1","k","Việc phân quyền cho chính quyền địa phương cấp tỉnh nơi có khu kinh tế đặc biệt và việc thực hiện nhiệm vụ, quyền hạn được phân quyền của chính quyền địa phương cấp tỉnh nơi có khu kinh tế đặc biệt phải tuân thủ các nguyên tắc quy định tại các khoản 1, 2, 4 và 5 Điều 3 của Luật này. Việc thực hiện nhiệm vụ, quyền hạn được phân quyền của Hội đồng nhân dân, Ủy ban nhân dân, Chủ tịch Ủy ban nhân dân cấp tỉnh nơi có khu kinh tế đặc biệt theo Luật này chỉ áp dụng đối với khu kinh tế đặc biệt. Căn cứ tình hình thực tiễn, Hội đồng nhân dân, Ủy ban nhân dân, Chủ tịch Ủy ban nhân dân cấp tỉnh nơi có khu kinh tế đặc biệt có quyền phân cấp cho cơ quan, tổ chức, cá nhân có thâm quyền ở khu kinh tế đặc biệt thực hiện liên tục, thường xuyên một hoặc một số nhiệm vụ, quyền “hạn mà mình được giao theo quy định của pháp luật, trừ trường hợp pháp luật quy định không được phân cấp."],["D4.K2","k","Việc phân quyền, phân cấp cho chính quyền địa phương cấp xã ở khu kinh tế đặc biệt (sau đây gọi là chính quyền địa phương ở khu kinh tế đặc biệt) và việc thực hiện nhiệm vụ, quyền hạn được phân quyền, phân cấp của chính quyền địa phương ở khu kinh tế đặc biệt phải tuân thủ các nguyên tắc quy định tại các khoản 1,2, 4 và 5 Điều 3 của Luật này. - Ngoài các nhiệm vụ, quyền hạn được quy định tại Luật này, Hội đồng nhân dân, Ủy ban nhân dân, Chủ tịch Ủy ban nhân dân ở nơi có khu kinh tế đặc biệt còn thực hiện các nhiệm vụ, quyền hạn theo quy định khác của pháp luật có liên quan."]],"u":185},{"n":"Điều 5","t":"Áp dụng pháp luật.","p":[["D5.K1","k","Trường hợp có quy định khác nhau giữa Luật Phát triển đô thị và luật, nghị quyết khác của Quốc hội về cùng một vấn đề thì áp dụng quy định của Luật Phát triển đô thị, trừ trường hợp quy định tại khoản 3 Điều này và quy định của pháp luật trong lĩnh vực quốc phòng, an an nỉnh. \""],["D5.K2","k","Văn bản quy phạm pháp luật quy định chỉ tiết, biện pháp cụ thê đề tô chức, hướng dẫn thi hành Luật này, văn bản quy phạm pháp luật được ban hành để thực hiện thâm quyền được giao trong Luật Phát triển đô thị (sau đây gọi là văn bản thi hành Luật Phát triển đô thị) được áp dụng trong trường hợp có nhiều văn bản quy phạm pháp luật có quy định khác nhau về cùng một vấn đề. '"],["D5.K3","k","Trường hợp văn bản quy phạm pháp luật của cơ quan nhà nước ở trung ương, bao gồm cả văn bản quy định cơ chế, chính sách áp dụng cho đối tượng, 6 địa phương khác, ban hành sau ngày Luật Phát triển đô thị, văn bản thi hành Luật Phát triển đô thị có hiệu lực thi hành có quy định cơ chế, chính sách ưu đãi hoặc ._ thuận lợi hơn quy định của Luật Phát triển đô thị, văn bản thi hành Luật Phát triên đô thị thì việc áp dụng được thực hiện như sau: nhân dân Thành phố quyết định; do Chính phủ quyết định."],["D5.K3.Đa","d","Đối với Thành phố quy định tại khoản 2 Điều 1 của Luật này do Hội đồng"],["D5.K3.Đb","d","Đối với trường hợp quy định tại khoản 3 và khoản 4 Điều 1 của Luật này"],["D5.K4","k","Việc quyết định áp dụng văn bản quy phạm pháp luật quy định tại khoản 3 Điều này không bao gồm Luật Thủ đô và văn bản thi hành Luật Thủ đô."]],"u":188},{"n":"Điều 6","t":"Nhiệm vụ, quyền hạn về tổ chức bộ máy và chế độ công vụ","p":[["D6.K1","k","Hội đồng nhân dân Thành phó có thấm quyền: cấp xã; tỷ lệ đại biểu hoạt động chuyên trách của Hội đồng nhân dân Thành phố và Hội đồng nhân dân cấp xã; khung số lượng Phó Trưởng Ban các Ban của Hội đồng nhân dân Thành phố; số lượng, chức năng, nhiệm vụ và quyền hạn của các Ban của Hội đồng nhân dân Thành phố và Hội đồng nhân dân cấp xã; với đặc thù quản lý đô thị, quy mô dân số, yêu cầu cung cấp địch vụ công và điều kiện thực tiễn của Thành phố; môn, tô chức hành chính khác thuộc phạm vi quản lý của Thành phó; quyết định thay đổi tên gọi, điều chỉnh chức năng của các cơ quan chuyên môn, tổ chức hành chính khác thuộc phạm vi quản lý của Thành phố; quản của cộng đồng dân cư; số lượng, chức danh và chế độ, chính sách đối với người hoạt động không chuyên trách ở tô chức tự quản của cộng đồng dân cư; 7 phạm vi quản lý của Thành phố; ©) Quy định việc thuê, tuyển dụng và bỗ nhiệm người đứng đầu đơn vị sự nghiệp công lập và người quản lý doanh nghiệp nhà nước thuộc phạm vi quản lý của Thành phố; ø) Quy định chính sách về thu nhập đối với cán bộ, công chức, viên chức, người làm việc, người lao động tại cơ quan nhà nước, tổ chức chính trị, tổ chức chính trị - xã hội, đơn vị sự nghiệp công lập, một số hội được Đảng và Nhà nước giao nhiệm vụ thuộc phạm vi quản lý của Thành phố và người làm việc tại một số cơ quan trung ương trên địa bàn Thành phố; việc sử dụng ngân sách Thành phố và nguồn tài chính hợp pháp khác để thực hiện chính sách này; đối của ngân sách Thành phố; |"],["D6.K1.Đa","d","Quy định số lượng, tiêu chí xác định số lượng đại biểu Hội đồng nhân dân"],["D6.K1.Đb","d","Quy định khung số lượng Phó Chủ tịch Ủy ban nhân dân cấp xã phù hợp"],["D6.K1.Đc","d","Quy định số lượng, việc thành lập, tổ chức lại, giải thể cơ quan chuyên"],["D6.K1.Đd","d","Quy định việc thành lập, tổ chức lại, giải thể, đặt tên, đôi tên tổ chức tự"],["D6.K1.Đđ","d","Quy định về việc tuyến dụng, vị trí việc làm công chức, viên chức thuộc"],["D6.K1.Đh","d","Quy định việc ký kết hợp đồng thực hiện chuyên môn trong khả năng cân"],["D6.K1~2","k","Quyết định số lượng và cơ cấu Ủy viên Ủy ban nhân dân Thành phố; quy định số lượng và cơ cầu Ủy viên Ủy ban nhân dân cấp xã; chức, viên chức Trung ương giao với điều kiện tự cân đối, chỉ trả lương từ nguồn ngân sách Thành phó, bảo đảm yêu cầu khối Tượng công việc thực tế, trừ trường hợp có quyết định khác của cấp có thẩm quyền."],["D6.K1~2.Đk","d","Quyết định tổng số lượng biên chế không xzượt quá 20% số biên chế công"],["D6.K2","k","Ủy ban nhân dân Thành phố quy định: người dân trong quản trị địa phương; cơ chế khoán việc; cơ chế, biện pháp cần thiết khác để phát huy vai trỏ tự quản của tổ chức tự quản của cộng đồng dân cư; chủ của đơn vị sự nghiệp công lập thuộc phạm vi quản lý của Thành phố phù hợp với đặc thù quản lý đô thị, quy mô dân số, yêu cầu cung cấp dịch vụ công và điều kiện thực tiễn của Thành phố; khác, đơn vị sự nghiệp công lập thuộc phạm vị quản lý của Thành phố; Thành phố; § ban nhân dân Thành phố, trừ nội dung Ủy ban nhân dân Thành phố thảo luận tập thể và quyết định theo quy định của pháp luật về tô chức chính quyền địa phương."],["D6.K2.Đa","d","Chính sách, biện pháp tổ chức thực hiện nền hành chính số và công vụ số;"],["D6.K2.Đb","d","Cơ chế, biện pháp phát huy dân chủ ở cơ sở, huy động sự tham gia của"],["D6.K2.Đc","d","Việc thành lập, tô chức lại, chuyển đổi, giải thể; cơ cấu tổ chức, chế độ tự"],["D6.K2.Đd","d","Khung số lượng cấp phó của cơ quan chuyên môn, tổ chức hành chính"],["D6.K2.Đđ","d","Việc sử dụng, quản lý công chức, viên chức thuộc phạm vi quản lý của"],["D6.K2.Đe","d","Việc giao thẩm quyển của Ủy ban nhân dân Thành phố cho Chủ tịch Ủy"]],"u":195},{"n":"Điều 7","t":"Xây dựng, ban hành văn bản quy phạm pháp luật","p":[["D7.K1","k","Văn bản thi hành Luật Phát triển đô thị quy định tại khoản 2 Điều 5 của Luật này được quy định khác với văn bản quy phạm pháp luật do cơ quan nhà nước ở trung ương ban hành."],["D7.K2","k","Khi thực hiện nhiệm vụ, quyền hạn của chính quyền địa phương theo quy định của pháp luật, Hội đồng nhân dân, Ủy ban nhân dân, Chủ tịch Ủy ban nhân dân Thành phố được ban hành văn bản quy phạm pháp luật đề: đang được quy định trong văn bản quy phạm pháp luật của cơ quan nhà nước ở trung ương để thực hiện nhiệm vụ, quyền hạn của cơ quan, tô chức thuộc Thành phố, bảo đảm yêu cầu về cải cách hành chính, tạo thuận lợi cho tổ chức, cá nhân theo hướng đơn giản hóa thủ tục hành chính, ứng dụng khoa học, công nghệ, đôi mới sáng tạo và chuyên đổi số trong giải quyết thủ tục hành chính, không quy định thêm thành phần hồ sơ, không tăng thêm yêu cầu, điều kiện, thời gian giải quyết thủ tục đang áp dụng; tổ chức, hướng dẫn thi hành luật, nghị quyết của Quốc hội mà khác hoặc chưa có quy định của Chính phủ, Thủ tướng Chính phủ, các Bộ, cơ quan ngang Bộ."],["D7.K2.Đa","d","Điều chỉnh trình tự, thủ tục, thẩm quyền giải quyết thủ tục hành chính"],["D7.K2.Đb","d","Quy định biện pháp đặc thù phù hợp với yêu cầu phát triển Thành phó đề"],["D7.K3","k","Việc ban hành văn bản quy phạm pháp luật quy định tại khoản 1 và khoản 2 Điều này không áp dụng đối với lĩnh vực quốc phòng, an ninh."],["D7.K4","k","Việc ban hành văn bản quy phạm pháp luật quy định tại khoản 1 và điểm b khoản 2 Điều này thực hiện theo quy định sau đây: bản để quy định khác với văn bản của cơ quan nhà nước ở trung ương hoặc chưa có quy định của Chính phủ, Thủ tướng Chính phủ, các Bộ, cơ quan ngang Bộ; xác định rõ mục tiêu và đự kiến kết quả cần đạt được khi ban hành văn bản, cơ chế kiểm tra, giám sát và trách nhiệm giải trình; Luật này; 9 quan, tô chức khác có liên quan, lấy ý kiến của đối tượng chịu sự tác động trực tiếp của văn bản, truyền thông nội dung, đăng tải hồ sơ dự thảo văn bản và nội dung tiếp thu, giải trình ý kiến tham vấn, góp ý của cơ quan, tổ chức, cá nhân đối với dự thảo văn bản; \"¬ phạm pháp luật. Không áp dụng trình tự, thủ tục rút gọn, trừ trường hợp tạm ngưng hiệu lực toàn bộ hoặc một phần của văn bản hoặc bãi bỏ văn bản."],["D7.K4.Đa","d","Đánh giá sự cần thiết, tính cân đối, hợp lý của việc cần phải ban hành văn"],["D7.K4.Đb","d","Đánh giá sự phù hợp của văn bản với quy định tại Điều 3 hoặc Điều 4 của"],["D7.K4.Đc","d","Đánh giá tác động của chính sách trong dự thảo văn bản;"],["D7.K4.Đđ","d","Thực hiện tham vấn dự thảo văn bản với các Bộ, cơ quan ngang Bộ, cơ"],["D7.K4.Đđ~2","d","Tuân thủ trình tự, thủ tục theo quy định của pháp luật về văn bản quy"],["D7.K5","k","Hội đồng nhân dân Thành phố quy định việc xác định thẩm quyền ban hành văn bản quy phạm pháp luật quy định tại khoản 2 Điều này và quy định chỉ tiết khoản 4 Điều này."],["D7.K6","k","Hội đồng nhân dân Thành phố quy định việc ban hành nghị quyết quy phạm pháp luật để quyết định lựa chọn áp dụng pháp luật quy định tại điểm a khoản 3 Điều 5 của Luật này. Nội dung nghị quyết lựa chọn áp dụng pháp luật phải. xác định rõ quy định của văn bản quy phạm pháp luật được lựa chọn áp dụng, phạm vi, đối tượng được áp dụng, thời điểm áp dụng, quy định chuyền tiếp (nếu có)."],["D7.K7","k","Chính phủ quy định việc ban hành văn bản quy phạm pháp luật của chính. quyền thành phố thuộc trường hợp quy định tại khoản 3 Điều 1 của Luật này và chính quyền địa phương cấp tỉnh nơi có khu kinh tế đặc biệt, chính quyền địa phương ở khu kinh tế đặc biệt để thi hành Luật này."]],"u":212},{"n":"Điều 8","t":"Thí điểm cơ chế, chính sách","p":[["D8.K2","k","Việc thí điểm cơ chế, chính sách phải tuân thủ các nguyên tắc sau đây: hòa xã hội chủ nghĩa Việt Nam là thành viên; ích hợp pháp của tổ chức, cá nhân; bảo đảm môi trường đầu tư, kinh doanh bình đẳng, cạnh tranh lành mạnh; bảo đảm công khai, minh bạch; 10 trật tự, an toàn xã hội; thuần phong mỹ tục; không làm ảnh hưởng đến chính sách đại đoàn kết toàn dân tộc và chính sách tôn giáo của Nhà nước; 05 năm."],["D8.K2.Đa","d","Phù hợp với Hiến pháp, không trái với điều ước quốc tế mà nước Cộng"],["D8.K2.Đb","d","Không hạn chế quyền con người, quyền cơ bản của công dân, quyền, lợi"],["D8.K2.Đc","d","Không phương hại đến quốc phòng, an ninh, đối ngoại quốc gia; bảo đảm"],["D8.K2.Đd","d","Không gây ảnh hưởng xấu đến sức khỏe của cộng đồng, đạo đức xã hội,"],["D8.K2.Đđ","d","Thời gian thí điểm không quá 05 năm và có thể được gia hạn không quá"],["D8.K3","k","Phạm vi thí điểm cơ chế, chính sách bao gồm: hình quản trị, kiến tạo tiên tiến, hiện đại; chế độ công vụ, công chức; đổi số, giáo dục, đào tạo, văn hóa, thể thao, du lịch, y tế và chăm sóc sức khỏe; nông nghiệp đô thị, nông nghiệp giảm phát thải khí nhà kính; __ đ) Mô hình quản lý đô thị. nông thôn, không gian và phát triển bền vững: đề phát triển và quản trị Thành phó; lượng sống của người dân hoặc sự phát triển kinh tế - xã hội của Thành phố; ø) Cơ chế, chính sách khác theo chỉ đạo của cấp có thâm quyền."],["D8.K3.Đa","d","Mô hình mới về tô chức bộ máy các cấp chính quyền của Thành phố, mô"],["D8.K3.Đb","d","Mô hình kinh tế mới dựa trên khoa học, công nghệ, đổi mới sáng tạo, chuyển"],["D8.K3.Đc","d","Mô hình nông nghiệp sinh thái, nông nghiệp ứng dụng công nghệ cao,"],["D8.K3.Đđ","d","Phương thức khai thác, huy động, phân bỗ và sử đụng hiệu quả nguồn lực"],["D8.K3.Đe","d","Giải pháp xử lý các vấn đề ảnh hưởng nghiêm trọng, trực tiếp đến chất"],["D8.K4","k","Trên cơ sở chấp thuận của cấp có thấm quyền, Hội đồng nhân dân Thành phố ban hành nghị quyết thí điểm cơ chế, chính sách, trong đó xác định rõ mục ._ tiêu, phạm vi, đối tượng, nội dung, thời gian, không gian, địa bàn thí điểm; dự kiến kết quả, tác động của thí điểm; quyên, nghĩa vụ và trách nhiệm của cơ quan, tổ chức, cá nhân có liên quan; biện pháp quản trị rủi ro; cơ chế kiểm soát, giám sát, đánh giá; điều kiện, trình tự điều chỉnh, gia hạn hoặc kết thúc việc thí điểm."],["D8.K5","k","Ủy ban nhân dân Thành phố có trách nhiệm: chính sách. Trường hợp đề xuất thí điểm cơ ché, chính sách có tác động đến vùng đô thị đặc biệt, Ủy ban nhân dân Thành phó có.trách nhiệm đánh giá tác động kinh tế - HH xã hội vùng, quốc gia, lấy ý kiến của Ủy ban nhân dân cấp tỉnh của các địa phương có liên quan trước khi trình Hội đồng nhân dân Thành phố xem xét, quyết định; phối hợp giữa các cơ quan, tổ chức, cá nhân có liên quan; tạm dừng việc thí điểm và báo cáo Hội đồng nhân dân Thành phố xem xét, quyết định trong trường hợp việc thí điểm có ảnh hưởng tiêu cực vượt quá mức độ đã được dự bảo; dân Thành phô và cơ quan có thâm quyền về tình hình, kết quả thực hiện thí điểm; mục tiêu, hiệu quả, tác động đối với phát triển Thành phố và vùng đô thị đặc biệt; đề nghị Hội đồng nhân dân Thành phố quyế định việc điều chỉnh, gia hạn hoặc kết thúc việc thí điểm; : mới văn bản quy phạm pháp luật để thực hiệ: chính thức. :"],["D8.K5.Đa","d","Trình Hội đồng nhân dân Thành phó ban hành nghị quyết thí điểm cơ chế,"],["D8.K5.Đb","d","Tổ chức thực hiện nghị quyết thí điểm cơ chế, chính sách; bảo đảm sự"],["D8.K5.Đc","d","Xử lý hoặc kiến nghị xử lý các vấn đề phát sinh trong quá trình thực hiện;"],["D8.K5.Đd","d","Báo cáo đánh giá định kỳ hằng năm hoặc theo yêu cầu của Hội đồng nhân"],["D8.K5.Đđ","d","Tổ chức đánh giá kết quả thực hiện thí điểm, xác định mức độ hoàn thành"],["D8.K5.Đe","d","Trình hoặc kiến nghị cơ quan có thâm quyền sửa đỗi, bộ sung, ban hành"],["D8.K6","k","Việc xây dựng, ban hành nghị quyết thí điểm cơ chế, chính sách thực hiện theo quy định tại khoản 4 và khoản 5 Điều .7 của Luật này."]],"u":227},{"n":"Điều 9","t":"Xã hội hóa hoạt động chuyên môn, nghiệp vụ hỗ \"nợ giải quyết thủ tục hành chính","p":[["D9.K1","k","Việc xã hội hóa hoạt động chuyên môn, nghiệp vụ hỗ trợ giải quyết thủ tục hành chính phải tuân thủ các nguyên tắc sau đây: thâm quyển, trách nhiệm của cơ quan nhà nước trong giải quyết thủ tục hành chính; không chuyển giao thấm quyền quản lý nhà nước cho cá nhân, tổ chức ngoài nhà nước; không tăng biên chế của bộ máy hành chính; hành chính; tin, bảo vệ đữ liệu; bảo: đảm quyền, lợi ích hợp pháp của tổ chức, cá nhân; công nghệ, đổi mới sáng tạo và chuyển đôi số trong giải quyết thủ tục hành chính. 12 - 2. Hội đồng nhân dân Thành phố quy định: ._ -hễ trợ giải quyết thủ tục hành chính để nâng cao chất tượng cung cấp dịch vụ công phù hợp với đặc thù quản lý đô thị, quy mô dân số, yêu cầu cung cấp dịch vụ công .và điều kiện thực tiễn của Thành phố; - hễ trợ và nguồn lực khác bảo đảm thực hiện cơ chế xã hội hóa quy định tại điểm a khoản này. _ 3. Chủ tịch Ủy ban nhân dân Thành phố quyết định hoạt động chuyên môn, nghiệp vụ hỗ trợ giải quyết thủ tục hành chính được thực hiện cơ chế xã hội hóa theo quy định của Hội đồng nhân dân Thành phố; tô chức kiểm tra, đánh giá hiệu . quả thực hiện và xử lý vi phạm theo thẩm quyền."],["D9.K1.Đa","d","Bảo đảm hiệu lực, hiệu quả trong quản lý nhà nước; không làm thay đổi"],["D9.K1.Đb","d","Bảo đảm quyền lựa chọn của tổ chức, cá nhân trong thực hiện thủ tục"],["D9.K1.Đc","d","Bảo đảm công khai, minh bạch, khách quan, có kiểm soát; an toàn thông"],["D9.K1.Đđ","d","Tiết kiệm thời gian cho tô chức, cá nhân; đây mạnh ứng dụng khoa học,"],["D9.K1.Đa~2","d","Cơ chế xã hội hóa có kiểm soát đối với hoạt động chuyên môn, nghiệp vụ"],["D9.K1.Đb~2","d","Khung giá dịch vụ hỗ trợ giải quyết thủ tục hành chính; chính sách ưu đãi,"]],"u":249},{"n":"Điều 10","t":"Quy hoạch của Thành phố","p":[["D10.K2","k","Hội đồng nhân dân Thành phố quy định: định, phê duyệt Quy hoạch tổng thể Thành phố, phê duyệt điều chỉnh Quy hoạch tổng thể Thành phó, công bố, cung cấp thông tin, thực hiện, đánh giá Quy hoạch tông thê Thành phó; việc điều chỉnh cục bộ Quy hoạch tổng thể Thành: phố, bao gồm trường hợp quy định tại điểm c khoản 1 Điều 45 của Luật này (nếu có). 13 Quy hoạch tổng thể Thành phó, điều chỉnh Quy hoạch tổng thể Thành phố phải lấy ý kiến Bộ Công an, Bộ Quốc phòng, Bộ Tài chính, Bộ Xây dựng, Bộ Nông nghiệp và Môi trường và Ủy ban nhân dân cấp tỉnh liền kề, cộng đồng dân cư, Các cơ quan, tổ chức, cá nhân có liên quan trước khi phê duyệt; kiến trúc."],["D10.K2.Đa","d","Nội dung, thành phần hồ sơ, định mức chỉ phí, trình tự, thủ tục lập, thẩm"],["D10.K2.Đb","d","Loại quy hoạch, hoạt động quy hoạch đô thị và nông thôn, hoạt động"],["D10.K3","k","Chủ tịch Ủy ban nhân dân Thành phố có thâm quyền phê duyệt, phê duyệt điều chỉnh Quy hoạch tông thể Thành phố sau khi được Hội đồng nhân dân Thành phố thông qua. ."]],"u":257},{"n":"Điều 11","t":"Quản lý, phát triển, khai thác, sử đựng không gian ngầm, không gian tầm thấp, không gian tầm cao","p":[["D11.K2","k","Không gian ngầm, không gian tầm thấp, không gian tầm cao phải được quy hoạch, phân vùng chức năng để quản lý, phát triển, khai thác, sử dụng."],["D11.K3","k","Hội đồng nhân dân Thành phố quy định: gian ngầm, không gian tầm thấp, không gian tầm cao. Việc phê duyệt, phê duyệt điều chỉnh quy hoạch được thực hiện sau khi có ý kiến thống nhất của Bộ Quốc phòng, Bộ Công an, lấy ý kiến Bộ Xây dựng, Bộ Tài chính và tham vấn ý kiến của cộng đồng dân cư, cơ quan, tổ chức, cá nhân có liên quan; 14 - phù hợp với quy hoạch và không phải trả tiền sử dụng không gian ngầm; nầy; việc nộp tiền, miễn, giảm tiền sử dụng không gian ngầm; khi chưa có quy hoạch không gian ngầm, không gian tầm thấp, không gian tầm cao nhưng phải bảo đảm quyền, lợi ích hợp pháp của người sử dụng đất; hợp pháp bị ảnh hưởng khi khai thác, sử dụng không gian ngầm, không gian tầm thấp, không gian tầm cao vì lợi ích công cộng; ._ trình ngầm, không gian tầm thấp, không gian tầm cao; ø) Các khoản thu từ việc khai thác, sử ử dụng không gian ngầm, không gian tầm thấp, không gian tầm cao."],["D11.K3.Đa","d","Việc lập, thâm định, phê duyệt, phê duyệt điều chỉnh uy hoạch không"],["D11.K3.Đb","d","Mức giới hạn độ sâu trong lòng đất mà người sử dụng đất được sử dụng"],["D11.K3.Đc","d","Việc sử dụng lòng đất ngoài giới hạn độ sâu quy định tại điểm b khoản"],["D11.K3.Đđ","d","Việc sử dụng không gian ngầm, không gian tầm thấp, không gian tầm cao"],["D11.K3.Đđ~2","d","Chính sách bồi thường, hỗ trợ đối với tổ chức, cá nhân có quyền, lợi ích"],["D11.K3.Đe","d","Chính sách ưu đãi, hỗ trợ, khuyến khích đầu tư, phát triển, khai thác công"],["D11.K4","k","Ủy ban nhân dân Thành phố quy định biện pháp quản lý, khai thác, sử ` l I ` dụng không gian ngầm, xhông gian tằm thấp, không gian tầm cao; quản lý hạ tầng, công nghệ, phương tiện hoạt động trong không gian ngầm, không gian tầm thấp, không gian tầm cao."]],"u":262},{"n":"Điều 12","t":"Quản lý đô thị và nhà ở.","p":[],"u":272,"cut":1},{"n":"Điều 13","t":"Phát triển đô thị theo định hướng giao thông công cộng","p":[],"u":289,"cut":1},{"n":"Điều 14","t":"Phát triển hạ tầng giao thông, vận tải, logistics và bảo vệ môi trường","p":[],"u":301,"cut":1},{"n":"Điều 15","t":"Đầu tư xây dựng công trình","p":[],"u":323,"cut":1},{"n":"Điều 16","t":"Báo đảm trật tự, an toàn trên địa bàn Thành phố","p":[],"u":333,"cut":1},{"n":"Điều 17","t":"Phát triển đoanh nghiệp nhà nước và quản lý, đầu tư vốn nhà nước tại doanh nghiệp","p":[],"u":347,"cut":1},{"n":"Điều 18","t":"Phát triển kinh tế biển","p":[],"u":353,"cut":1},{"n":"Điều 19","t":"Cơ chế, chính sách thúc đẩy phát triển khu đô thị lắn biến","p":[],"u":359,"cut":1},{"n":"Điều 20","t":"Phát triển các ngành dịch vụ, thương mại","p":[],"u":378,"cut":1},{"n":"Điều 21","t":"Phát triển khu thương mại tự do, khu logistics tích hợp","p":[],"u":382,"cut":1},{"n":"Điều 22","t":"Phát triển khu phi thuế quan","p":[],"u":401,"cut":1},{"n":"Điều 23","t":"Phát triển khu chức năng mới, loại hình kinh tế mới","p":[],"u":407,"cut":1},{"n":"Điều 24","t":"Cơ chế, chính sách thúc đây phát triển Trung tâm tài chính quốc tế tại Việt Nam","p":[],"u":418,"cut":1},{"n":"Điều 25","t":"Phát triển hạ tầng năng lượng và công nghiệp năng lượng gắn với an ninh năng lượng quốc gia","p":[],"u":432,"cut":1},{"n":"Điều 26","t":"Phát triển văn hóa, thể thao, du lịch","p":[],"u":439,"cut":1},{"n":"Điều 27","t":"Phát triển giáo dục, đào tạo","p":[],"u":456,"cut":1},{"n":"Điều 28","t":"Phát triển hệ thống y tế, an sinh xã hội","p":[],"u":471,"cut":1},{"n":"Điều 29","t":"Cơ chế, chính sách về bảo đầm an toàn thực phẩm","p":[],"u":476,"cut":1},{"n":"Điều 30","t":"Phát triển khoa học, công nghệ, đối mới sáng tạo và chuyên đôi số","p":[],"u":482,"cut":1},{"n":"Điều 31","t":"Thử nghiệm có kiểm soát","p":[],"u":504,"cut":1},{"n":"Điều 32
