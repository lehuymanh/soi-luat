D39.K3","k","Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với hành vi cung cấp thông tin, số liệu không đầy đủ, không chính xác trong báo cáo gửi cho cơ quan quản lý nhà nước có thâm quyền."],["D39.K4","k","Biện pháp khắc phục hậu quả: Buộc gửi báo cáo, cung cấp thông tin, số liệu đầy đủ, chính xác cho cơ quan quản lý nhà nước có thẩm quyền đối với hành vi vi phạm hành chính quy định tại Điều này."]],"u":2387},{"n":"Điều 40","t":"Hành vi vi phạm quy định về hồ sơ cấp Giấy chứng nhận đủ điều kiện kinh doanh trò chơi điện tử có thưởng","p":[["D40.K1","k","Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với hành vi tự ý sửa chữa, tây xóa các tài liệu trong hồ sơ đề nghị cấp, cấp lại, điều chỉnh và gia hạn Giấy chứng nhận đủ điều kiện kinh doanh trò chơi điện tử có thưởng mà chưa đến mức bị truy cứu trách nhiệm hình sự."],["D40.K2","k","Phạt tiền từ 80.000.000 đồng đến 100.000.000 đồng đối với hành vi lập, xác nhận hồ sơ, tài liệu giả mạo hoặc có thông tin sai lệch, sai sự thật hoặc che giấu sự thật trong hồ sơ đề nghị cấp, cấp lại, điều chỉnh và gia hạn Giấy chứng nhận đủ điều kiện kinh doanh trò chơi điện tử có thưởng mà không bị truy cứu trách nhiệm hình sự."],["D40.K3","k","Hình thức xử phạt bổ sung: Tịch thu tang vật, phương tiện vi phạm hành chính là tài liệu bị sửa chữa, tây xóa, giả mạo hoặc có thông tin sai lệch, sai sự thật hoặc che giấu sự thật đối với hành vi vi phạm quy định tại Điều này."],["D40.K4","k","Biện pháp khắc phục hậu quả: Buộc nộp lại số lợi bất hợp pháp có được do thực hiện vi phạm hành chính quy định tại Điều này. 26"]],"u":2392},{"n":"Điều 41","t":"Hành vi vi phạm quy định về quản lý, sử dụng Giấy chứng nhận đủ điều kiện kinh doanh trò chơi điện tử có thưởng","p":[["D41.K1","k","Phạt tiền từ 90.000.000 đồng đến 100.000.000 đồng đối với hành vi sửa chữa, tẩy xóa làm thay đổi nội dung Giấy chứng nhận đủ điều kiện kinh doanh trò chơi điện tử có thưởng mà chưa đến mức bị truy cứu trách nhiệm hình sự."],["D41.K2","k","Phạt tiền từ 160.000.000 đồng đến 180.000.000 đồng đối với hành vi cho thuê, cho mượn, chuyển nhượng Giấy chứng nhận đủ điều kiện kinh doanh trò chơi điện tử có thưởng hoặc văn bản của cơ quan quản lý nhà nước có thẩm quyền cho phép kinh doanh trò chơi điện tử có thưởng."],["D41.K3","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi vi phạm sau: nhà nước có thâm quyền cấp phép kinh doanh trò chơi điện tử có thưởng theo quy định của pháp luật mà chưa đến mức bị truy cứu trách nhiệm hình sự; dứt kinh doanh trò chơi điện tử có thưởng, đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng có thời hạn mà chưa đến mức bị truy cứu trách nhiệm hình sự; cơ quan quản lý nhà nước có thâm quyền cấp phép kinh doanh theo quy định của pháp luật; trò chơi điện tử có thưởng sau khi tổ chức lại doanh nghiệp theo quy định."],["D41.K3.Đa","d","Kinh doanh trò chơi điện tử có thưởng khi chưa được cơ quan quản lý"],["D41.K3.Đb","d","Kinh doanh trò chơi điện tử có thưởng trong thời gian bị thu hồi, chấm"],["D41.K3.Đc","d","Kinh doanh trò chơi điện tử có thưởng không đúng với nội dung được"],["D41.K3.Đd","d","Không làm thủ tục cấp lại Giấy chứng nhận đủ điều kiện kinh doanh"],["D41.K4","k","Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 06 tháng đến 12 tháng đối với hành vi vi phạm hành chính quy định tại khoản 2 và điểm d khoản 3 Điều này."],["D41.K5","k","Biện pháp khắc phục hậu quả: có thưởng đã bị tây xóa, sửa chữa đối với hành vi vi phạm hành chính quy định tại khoản 1 Điều này; #214 chính quy định tại khoản 2 và khoản 3 Điều này."],["D41.K5.Đa","d","Buộc nộp lại Giấy chứng nhận đủ điều kiện kinh doanh trò chơi điện tử"],["D41.K5.Đb","d","Buộc nộp lại số lợi bất hợp pháp có được do thực hiện vi phạm hành"]],"u":2397},{"n":"Điều 42","t":"Hành vi vi phạm quy định về việc bố trí Điểm kinh doanh, khu vực bố trí Điểm kinh doanh trong cơ sở lưu trú du lịch","p":[["D42.K1","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi vi phạm sau: định của pháp luật; được cơ quan quản lý nhà nước có thâm quyền cấp phép kinh doanh trò chơi điện tử có thưởng theo quy định của pháp luật mà chưa đến mức bị truy cứu trách nhiệm hình sự; chức hoạt động kinh doanh trò chơi điện tử có thưởng."],["D42.K1.Đa","d","Bồ trí Điểm kinh doanh không đáp ứng đầy đủ các điều kiện theo quy"],["D42.K1.Đb","d","Tổ chức kinh doanh trò chơi điện tử có thưởng không đúng địa điểm"],["D42.K1.Đc","d","Chuyển nhượng, cho thuê, cho mượn trái phép Điểm kinh doanh để tổ"],["D42.K2","k","Hình thức xử phạt bố sung: đến 06 tháng đối với hành vi vi phạm hành chính quy định tại điểm a khoản I Điều này; đến 12 tháng đối với hành vi vi phạm hành chính quy định tại điểm b và điểm c khoản 1 Điều này."],["D42.K2.Đa","d","Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 03 tháng"],["D42.K2.Đb","d","Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 06 tháng"],["D42.K3","k","Biện pháp khắc phục hậu quả: Buộc khôi phục Điểm kinh doanh trò chơi điện tử có thưởng đáp ứng đầy đủ các điều kiện và theo đúng địa điểm được cơ quan quản lý nhà nước có thâm quyền cấp phép kinh doanh đối với hành vi vi phạm hành chính quy định tại điểm a và điểm b khoản 1 Điều này."]],"u":2409},{"n":"Điều 43","t":"Hành vi vi phạm về thời gian hoạt động","p":[["D43.K1","k","Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi vi phạm sau: động kinh doanh không đúng thời hạn theo quy định của pháp luật; lại không đúng thời hạn theo quy định của pháp luật; 28 quy định của pháp luật."],["D43.K1.Đa","d","Thông báo đến cơ quan quản lý nhà nước về thời điểm tạm ngừng hoạt"],["D43.K1.Đb","d","Thông báo đến cơ quan quản lý nhà nước về thời điểm kinh doanh trở"],["D43.K1.Đc","d","Thông báo đến cơ quan quản lý nhà nước không đầy đủ nội dung theo"],["D43.K2","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi phạm sau: nhà nước yêu cầu tạm ngừng kinh doanh; doanh đã thông báo đến cơ quan quản lý nhà nước có thâm quyền."],["D43.K2.Đa","d","Kinh doanh trò chơi điện tử có thưởng trong thời gian cơ quan quản lý"],["D43.K2.Đb","d","Kinh doanh trò chơi điện tử có thưởng trong thời gian tạm ngừng kinh"],["D43.K3","k","Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 06 tháng đến 12 tháng đối với hành vi vi phạm hành chính quy định tại khoản 2 Điều này."],["D43.K4","k","Biện pháp khắc phục hậu quả: Buộc nộp lại số lợi bất hợp pháp có được do thực hiện hành vi vỉ phạm hành chính quy định tại khoản 2 Điều này."]],"u":2418},{"n":"Điều 44","t":"Hành vi vi phạm quy định về số lượng, chúng loại, loại hình trò chơi điện tử có thưởng","p":[["D44.K1","k","Phạt tiền từ 160.000.000 đồng đến 180.000.000 đồng đối với hành vi kinh doanh không đúng chủng loại máy, loại hình trò chơi điện tử có thưởng theo quy định của pháp luật."],["D44.K2","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với hành vi tổ chức kinh doanh vượt quá số lượng máy trò chơi điện tử có thưởng được phép kinh doanh theo quy định của pháp luật."],["D44.K3","k","Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 06 tháng đến 12 tháng đối với hành vi vi phạm hành chính quy định tại Điều này."],["D44.K4","k","Biện pháp khắc phục hậu quả: vượt quá sô lượng, không đúng chủng loại máy, loại hình trò chơi điện tử có thưởng đối với hành vi vi phạm hành chính quy định tại Điều này; chính quy định tại Điêu này. 29"],["D44.K4.Đa","d","Buộc phải tiêu hủy hoặc tái xuất các máy trò chơi điện tử có thưởng"],["D44.K4.Đb","d","Buộc nộp lại số lợi bất hợp pháp có được do thực hiện vi phạm hành"]],"u":2428},{"n":"Điều 45","t":"Hành vi vi phạm quy định về xây dựng, gửi và công bố Thể lệ trò chơi","p":[["D45.K1","k","Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với hành vi gửi Thể lệ trò chơi cho cơ quan quản lý nhà nước có thâm quyền không đúng thời hạn theo quy định của pháp luật."],["D45.K2","k","Phạt tiền từ 90.000.000 đồng đến 100.000.000 đồng đối với một trong các hành vi sau: quyền theo quy định của pháp luật; kinh doanh."],["D45.K2.Đa","d","Không gửi Thể lệ trò chơi cho cơ quan quản lý nhà nước có thẩm"],["D45.K2.Đb","d","Không niêm yết và phát hành tờ rơi công khai Thể lệ trò chơi tại Điểm"],["D45.K3","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với hành vi không xây dựng Thể lệ trò chơi theo quy định của pháp luật."],["D45.K4","k","Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 03 tháng đến 06 tháng đối với hành vi vi phạm hành chính quy định tại khoản 3 Điều này."]],"u":2435},{"n":"Điều 46","t":"Hành vi vi phạm quy định về theo dõi, quản lý đối tượng được phép chơi và ra, vào Điểm kinh doanh","p":[["D46.K1","k","Phạt tiền từ 130.000.000 đồng đến 150.000.000 đồng đối với một trong các hành vi vi phạm sau: được ra, vào Điểm kinh doanh; doanh không đầy đủ các nội dung theo quy định của pháp luật; tại Điểm kinh doanh đủ thời hạn tối thiểu theo quy định của pháp luật."],["D46.K1.Đa","d","Không mở số theo dõi hoặc cấp thẻ điện tử để kiểm soát các đối tượng"],["D46.K1.Đb","d","Số theo dõi để kiểm soát các đối tượng được phép chơi tại Điểm kinh"],["D46.K1.Đc","d","Không lưu trữ số theo dõi để kiểm soát các đối tượng được phép chơi"],["D46.K2","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi sau: pháp luật;"],["D46.K2.Đa","d","Cho phép đối tượng ra, vào Điểm kinh doanh không đúng quy định của"],["D46.K2.Đb","d","Không theo dõi đầy đủ các đối tượng ra, vào Điểm kinh doanh."],["D46.K3","k","Hình thức xử phạt bổ sung: 30 đến 06 tháng đối với hành vi vi phạm hành chính quy định tại khoản l Điều này; đến 12 tháng nếu vi phạm lần đầu; từ 12 tháng đến 24 tháng nếu vi phạm từ lần thứ hai trở lên đối với hành vi vi phạm hành chính quy định tại khoản 2 Điều này."],["D46.K3.Đa","d","Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 03 tháng"],["D46.K3.Đb","d","Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 06 tháng"],["D46.K4","k","Biện pháp khắc phục hậu quả: Buộc mở sổ theo dõi hoặc cấp thẻ điện tử để theo dõi, quản lý đầy đủ đối tượng được phép chơi và ra, vào Điểm kinh doanh đối với hành vi vi phạm hành chính quy định tại khoản 1 Điều này."]],"u":2442},{"n":"Điều 47","t":"Hành vi vi phạm quy định về nghĩa vụ của người chơi","p":[["D47.K1","k","Phạt cảnh cáo đối với cá nhân vi phạm một trong các hành vi sau:"],["D47.K1.Đa","d","Không tuân thủ Thẻ lệ trò chơi do doanh nghiệp công bố;"],["D47.K1.Đb","d","Không tuân thủ nội quy Điểm kinh doanh do doanh nghiệp công bố;"],["D47.K1.Đc","d","Không tuân thủ các quy định quản lý nội bộ do doanh nghiệp công bố."],["D47.K2","k","Phạt tiền từ 90.000.000 đồng đến 100.000.000 đồng đối với hành vi gian lận trong quá trình tham gia các trò chơi điện tử có thưởng tại Điểm kinh doanh."],["D47.K3","k","Biện pháp khắc phục hậu quả: Buộc nộp lại số lợi bất hợp pháp có được do thực hiện hành vi vi phạm hành chính quy định tại khoản 2 Điều này để hoàn trả lại cho doanh nghiệp kinh doanh trò chơi điện tử có thưởng dành cho người nước ngoài."]],"u":2454},{"n":"Điều 48","t":"Hành vi vi phạm quy định về quản lý đồng tiền quy ước","p":[["D48.K1","k","Phạt tiền từ 60.000.000 đồng đến 70.000.000 đồng đối với hành vi không thông báo bằng văn bản về mẫu mã, số lượng, chủng loại đồng tiền quy ước với cơ quan quản lý nhà nước theo quy định."],["D48.K2","k","Phạt tiền từ 90.000.000 đồng đến 100.000.000 đồng đối với hành vi sử dụng đồng tiền quy ước của doanh nghiệp khác hoặc không đúng với đồng tiền quy ước đã thông báo với các cơ quan quản lý nhà nước."],["D48.K3","k","Biện pháp khắc phục hậu quả: Buộc tiêu hủy hoặc tái xuất toàn bộ đồng tiền quy ước đối với hành vi vi phạm hành chính quy định tại khoản 2 Điều này. 31"]],"u":2461},{"n":"Điều 49","t":"Hành vi vi phạm quy định về quản lý máy, thiết bị trò chơi điện tử có thưởng","p":[["D49.K1","k","Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với hành vi không mở số quản lý máy trò chơi điện tử có thưởng."],["D49.K2","k","Phạt tiền từ 60.000.000 đồng đến 70.000.000 đồng đối với hành vi nhập khẩu máy, thiết bị dự phòng, quản lý máy, thiết bị dự phòng không đúng quy định của pháp luật."],["D49.K3","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi sau: kiện, tiêu chuẩn kỹ thuật theo quy định của pháp luật; tổ chức kiểm định độc lập máy trò chơi điện tử có thưởng chứng minh máy trò chơi điện tử có thưởng đáp ứng các điều kiện theo quy định của pháp luật; có nội dung, hình ảnh văn hóa chưa được cơ quan quản lý nhà nước có thấm quyền thâm định cho phép phổ biến, lưu hành theo quy định của pháp luật."],["D49.K3.Đa","d","Kinh doanh máy trò chơi điện tử có thưởng không đáp ứng đủ các điều"],["D49.K3.Đb","d","Không có tài liệu của nhà sản xuất máy trò chơi điện tử có thưởng hoặc"],["D49.K3.Đc","d","Kinh doanh các máy trò chơi điện tử có thưởng và các thiết bị trò chơi"],["D49.K4","k","Hình thức xử phạt bổ sung: đến 02 tháng đối với hành vi vi phạm hành chính quy định tại khoản 2 Điều này; đến 06 tháng đối với hành vi vi phạm hành chính quy định tại khoản 3 Điều này."],["D49.K4.Đa","d","Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 01 tháng"],["D49.K4.Đb","d","Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 03 tháng"],["D49.K5","k","Biện pháp khắc phục hậu quả: hành chính quy định tại khoản 2 và khoản 3 Điều này. thiết bị trò chơi vi phạm đối với hành vi vi phạm hành chính quy định tại khoản 2 và khoản 3 Điều này. “Điều 50. Hành vi vi phạm quy định về kiểm soát nội bộ, người quản lý, điều hành Điểm kinh doanh và Quy chế giải quyết tranh chấp 1. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi vi phạm sau: 32 a) Gửi Quy chế quản lý nội bộ cho cơ quan quản lý nhà nước có thâm quyền không đúng thời hạn theo quy định của pháp luật; b) Thông báo đến cơ quan quản lý nhà nước không đúng thời hạn theo quy định của pháp luật khi thay đổi người quản lý, điều hành Điểm kinh doanh; c) Không niêm yết công khai Quy chế giải quyết tranh chấp tại Điểm kinh doanh hoặc không phát hành tờ rơi Quy chế giải quyết tranh chấp cho người chơi. 2. Phạt tiền từ 90.000.000 đồng đến 100.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Không xây dựng và ban hành Quy chế quản lý nội bộ theo quy định của pháp luật; b) Không thành lập bộ phận kiểm soát nội bộ theo quy định của pháp luật; c) Không xây dựng và ban hành Quy chế giải quyết tranh chấp theo quy định của pháp luật. 3. Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với hành vi bố trí người quản lý, điều hành Điểm kinh doanh không đáp ứng đầy đủ điều kiện theo quy định của pháp luật. 4. Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 06 tháng đến 12 tháng đối với hành vi vi phạm hành chính quy định tại khoản 3 Điều này. 5. Biện pháp khắc phục hậu quả: Buộc thành lập bộ phận kiểm soát nội bộ và bố trí người quản lý, điều hành Điểm kinh doanh đáp ứng đầy đủ điều kiện theo đúng quy định đối với hành vi vi phạm hành chính quy định tại điểm b khoản 2 và khoản 3 Điều này. Điều 51. Hành vi vi phạm quy định về trả thưởng và xác nhận tiền trúng thưởng 1. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với hành vi cố tình kéo dài thời gian trả thưởng cho người chơi mà không có lý do chính đáng. 2. Phạt tiền từ 90.000.000 đồng đến 100.000.000 đồng đối với hành vi xác nhận tiền trúng thưởng không đúng đối tượng hoặc không đúng với giá trị trúng thưởng thực tế. 3. Hình thức xử phạt bổ sung: 33 Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 03 tháng đến 06 tháng đối với hành vi vi phạm hành chính quy định tại khoản 2 Điều này. 4. Biện pháp khắc phục hậu quả: a) Buộc thực hiện trả thưởng cho người chơi theo đúng quy định tại Thể lệ trò chơi đối với hành vi vi phạm hành chính quy định tại khoản 1 Điều này; b) Buộc thu hồi giấy xác nhận tiền trúng thưởng không đúng đối tượng trúng thưởng hoặc không đúng với giá trị trúng thưởng thực tế đối với hành vi vi phạm hành chính quy định tại khoản 2 Điều này. Điều 52. Hành vi vi phạm quy định về giảm giá, khuyến mại, quảng cáo và chế độ quản lý tài chính 1. Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với hành vi vi phạm các quy định về giảm giá, khuyến mại theo quy định của pháp luật. 2. Phạt tiền từ 60.000.000 đồng đến 70.000.000 đồng đối với hành vi vi phạm về chế độ quản lý tài chính do cơ quan quản lý nhà nước có thẩm quyền ban hành. 3. Phạt tiền từ 60.000.000 đồng đến 80.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Quảng cáo hoạt động kinh doanh trò chơi điện tử có thưởng khi chưa được cơ quan quản lý nhà nước có thẩm quyền cấp phép kinh doanh trò chơi điện tử có thưởng theo quy định của pháp luật; b) Nội dung và hình thức quảng cáo không đúng quy định của pháp luật về kinh doanh trò chơi điện tử có thưởng. 4. Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh trò chơi điện tử có thưởng từ 01 tháng đến 02 tháng đối với hành vi vi phạm hành chính quy định tại khoản 1 và điểm b khoản 3 Điều này. 5. Biện pháp khắc phục hậu quả: Buộc tháo dỡ nội dung và hình thức quảng cáo không đúng quy định pháp luật đối với hành vi vi phạm hành chính quy định tại khoản 3 Điều này. Điều 53. Hành vi vi phạm quy định về công bó, cung cấp thông tin 1. Phạt tiền từ 40.000.000 đồng đến 50.000.000 đồng đối với hành vi công bố, cung cấp thông tin không đầy đủ, chính xác theo quy định của pháp luật về kinh doanh trò chơi điện tử có thưởng dành cho người nước ngoài. 34 2. Biện pháp khắc phục hậu quả: Buộc cải chính thông tin đã công bố, cung cấp đầy đủ, chính xác thông tin theo quy định pháp luật. Điều 54. Hành vi vi phạm quy định về chế độ báo cáo 1. Phạt cảnh cáo đối với hành vi gửi không đủ báo cáo cho cơ quan quản lý nhà nước có thẩm quyền theo quy định của pháp luật. 2. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với hành vi gửi báo cáo cho cơ quan quản lý nhà nước có thâm quyền không đúng thời hạn theo quy định của pháp luật. 3. Phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng đối với hành vi cung cấp thông tin, số liệu không đầy đủ, không chính xác trong báo cáo gửi cho cơ quan quản lý nhà nước có thâm quyền. 4. Biện pháp khắc phục hậu quả: Buộc gửi báo cáo, cung cấp thông tin, số liệu đầy đủ, chính xác cho cơ quan quản lý nhà nước có thẩm quyền đối với hành vi vi phạm hành chính quy định tại Điều này. Mục 4 HÀNH VI VI PHẠM QUY ĐỊNH VÈ PHÒNG, CHÓNG RỬA TIÈN; PHÒNG, CHÓNG TÀI TRỢ KHỦNG BÓ; PHÒNG, CHÓNG TÀI TRỢ PHỎ BIẾN VŨ KHÍ HỦY DIỆT HÀNG LOẠT Điều 55. Hành vi vi phạm quy định về nhận biết khách hàng, về đánh giá rủi ro, về phân loại khách hàng theo mức độ rủi ro và vi phạm quy định liên quan đến khách hàng nước ngoài là cá nhân có ảnh hưởng chính trị 1. Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với một trong các hành vi vi phạm sau đây: a) Không nhận biết khách hàng; không cập nhật, không xác minh thông tin nhận biết khách hàng; cập nhật, xác minh thông tin nhận biết khách hàng không đúng quy định của pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt; b) Không cập nhật danh sách đen; c) Không thực hiện đánh giá, không cập nhật kết quả đánh giá rủi ro rửa 35 tiền, tài trợ khủng bố, tài trợ phổ biến vũ khí huỷ diệt hàng loạt theo quy định của pháp luật; d) Không báo cáo kết quả đánh giá, cập nhật rủi ro hoặc không phổ biến kết quả đánh giá hoặc cập nhật rủi ro về rửa tiền, tài trợ khủng bố, tài trợ phổ biến vũ khí huỷ diệt hàng loạt theo quy định của pháp luật. 2. Phạt tiền từ 60.000.000 đồng đến 100.000.000 đồng đối với hành vi không xây dựng và ban hành quy trình quản lý rủi ro; không phân loại khách hàng theo mức độ rủi ro; phân loại khách hàng theo mức độ rủi ro không đúng quy định của pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bó, phòng, chống tài trợ phô biến vũ khí huỷ diệt hàng loạt. 3. Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với hành vi không thực hiện các quy định liên quan đến khách hàng là cá nhân nước ngoài có ảnh hưởng chính trị theo quy định của Luật Phòng, chống rửa tiền. 4. Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh từ 01 tháng đến 03 tháng đối với hành vi vi phạm hành chính quy định tại khoản 3 Điều này. Điều 56. Hành vi vi phạm quy định về quy định nội bộ về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phố biến vũ khí huỷ diệt hàng loạt 1. Phạt tiền từ 60.000.000 đồng đến 100.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Không áp dụng hoặc áp dụng không đúng quy định nội bộ trong việc thực hiện kiểm soát, kiểm toán nội bộ theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt; b) Không áp dụng quy định nội bộ về phân công hoặc không đăng ký phân công cán bộ, bộ phận chịu trách nhiệm về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt; c) Không áp dụng hoặc áp dụng không đúng quy định nội bộ về đào tạo, bôi dưỡng, tuyển dụng theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chồng tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt. 2. Phạt tiền từ 130.000.000 đồng đến 150.000.000 đồng đối với hành vi không ban hành quy định nội bộ hoặc ban hành quy định nội bộ không đúng quy 36 định của pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bó, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt. Điều 57. Hành vi vi phạm quy định về báo cáo giao dịch có giá trị lớn, giao dịch đáng ngờ, báo cáo hành vi nghỉ ngờ rửa tiền, tài trợ khủng bố, tài trợ phổ biến vũ khí hủy diệt hàng loạt, về trì hoãn giao dịch, phong toả tài khoản, niêm phong hoặc tạm giữ tài sản, về lưu trữ, cung cấp và bảo đảm bí mật thông tin, hồ sơ, tài liệu, báo cáo 1. Phạt tiền từ 60.000.000 đồng đến 100.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Gửi báo cáo không đúng thời hạn hoặc không đầy đủ, chính xác đối với báo cáo giao dịch có giá trị lớn theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt; b) Gửi báo cáo không đầy đủ thông tin theo quy định của pháp luật đối với báo cáo giao dịch đáng ngờ liên quan đến rửa tiền, tài trợ khủng bó, tài trợ phô biến vũ khí huỷ diệt hàng loạt; c) Không cung cấp kịp thời thông tin, hồ sơ, tài liệu, báo cáo theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống khủng bố, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt; d) Không lưu trữ hoặc lưu trữ không đầy đủ thông tin, hồ sơ, tài liệu báo cáo; lưu trữ thông tin, hồ sơ, tài liệu không đúng thời hạn theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống khủng bố, phòng, chống tài trợ phô biến vũ khí huỷ diệt hàng loạt; đ) Không tuân thủ quy định về bảo mật thông tin nhận biết khách hàng đối với thông tin, hồ sơ, tài liệu, báo cáo liên quan đến các giao dịch báo cáo theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống khủng bó, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt. 2. Phạt tiền từ 130.000.000 đồng đến 150.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Không báo cáo giao dịch có giá trị lớn phải báo cáo; b) Không báo cáo giao dịch đáng ngờ liên quan đến rửa tiền, tài trợ khủng bô, tài trợ phổ biến vũ khí huỷ diệt hàng loạt; c) Không báo cáo khi có nghỉ ngờ khách hàng hoặc giao dịch của khách hàng liên quan đến tài trợ khủng bó, tài trợ phổ biến vũ khí huỷ diệt hàng loạt 37 hoặc khách hàng nằm trong danh sách đen, danh sách bị chỉ định theo quy định của pháp luật về phòng, chống khủng bố, pháp luật về phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt; đ) Không báo cáo việc trì hoãn giao dịch theo quy định pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố; đ) Không báo cáo ngay khi thực hiện việc tạm dừng lưu thông, phong toả tiền, tài sản liên quan đến tài trợ khủng bố, tài trợ phổ biến vũ khí huỷ diệt hàng loạt theo quy định của pháp luật. 3. Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Không áp dụng biện pháp trì hoãn giao dịch theo quy định pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố; b) Không phong toả tài khoản, không áp dụng biện pháp niêm phong, phong toả hoặc tạm giữ tài sản khi có quyết định của cơ quan nhà nước có thẩm quyền theo quy định của pháp luật; c) Không thực hiện tạm dừng lưu thông, phong toả tiền, tài sản liên quan đến khủng bó, tài trợ khủng bó, tài trợ phổ biến vũ khí huỷ diệt hàng loạt theo quy định của pháp luật. 4. Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh từ 06 tháng đến 12 tháng đối với hành vi vi phạm hành chính quy định tại khoản 3 Điều này. Điều 58. Hành vi vi phạm quy định về các hành vi bị cẤm trong phòng, chống rửa tiền, phòng, chống tài trợ khủng bố 1. Phạt tiền từ 130.000.000 đồng đến 150.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Thiết lập hoặc duy trì tài khoản vô danh hoặc tài khoản sử dụng tên giả; b) Cung cấp trái phép dịch vụ nhận tiền mặt, séc, công cụ tiền tệ khác và thực hiện thanh toán cho người thụ hưởng mà không bị truy cứu trách nhiệm hình sự. 2. Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi vi phạm sau: a) Tổ chức, tham gia hoặc tạo điều kiện, trợ giúp thực hiện hành vi rửa tiên mà không bị truy cứu trách nhiệm hình sự; 38 b) Không tố giác hành vi tài trợ khủng bố mà không bị truy cứu trách nhiệm hình sự; ©) Trực tiếp hoặc gián tiếp cung cấp tiền, tài sản, nguồn tài chính, nguồn lực kinh tế, dịch vụ tài chính hoặc dịch vụ khác cho tổ chức, cá nhân liên quan đến khủng bố, tài trợ khủng bố mà không bị truy cứu trách nhiệm hình sự; d) Cản trở việc cung cấp thông tin phục vụ công tác phòng, chống rửa tiền, phòng, chống tài trợ khủng bố mà không bị truy cứu trách nhiệm hình sự. 3. Hình thức xử phạt bổ sung Đình chỉ hoạt động kinh doanh từ 12 tháng đến 24 tháng đối với hành vi vi phạm hành chính quy định tại khoản 2 Điều này. Chương III THÁM QUYÈN XỬ PHẠT VI PHẠM HÀNH CHÍNH, ÁP DỤNG BIỆN PHÁP KHÁC PHỤC HẬU QUÁ Điều 59. Thâm quyền của Công an nhân dân 1. Chiến sĩ Công an nhân dân đang thi hành công vụ có thầm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 20.000.000 đồng: c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị đến 40.000.000 đồng. 2. Thủ trưởng đơn vị Cảnh sát cơ động cấp đại đội có thẩm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 40.000.000 đồng: c) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị đến 80.000.000 đồng: d) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm e khoản 1 Điều 28 Luật Xử lý vi phạm hành chính. 39 3. Trưởng đồn Công an, Thủ trưởng đơn vị Cảnh sát cơ động cấp tiểu đoàn, Thủy đội trưởng, Trưởng trạm, Đội trưởng có thâm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 60.000.000 đồng; e) Đình chỉ hoạt động kinh doanh có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị đến 120.000.000 đồng; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại điểm e khoản 1 Điều 28 Luật Xử lý vi phạm hành chính. 4. Trưởng Công an cấp xã có thẩm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 100.000.000 đồng; c) Đình chỉ hoạt động kinh doanh có thời hạn; đ) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. 5. Trưởng Công an cửa khẩu Cảng hàng không quốc tế; Trưởng phòng nghiệp vụ thuộc Cục An ninh nội địa gồm: Trưởng phòng An ninh Công giáo, Trưởng phòng An ninh tôn giáo khác, Trưởng phòng An ninh dân tộc, Trưởng phòng Chống phản động, Trưởng phòng Chống khủng bố, Trưởng phòng An ninh xã hội; Trưởng phòng nghiệp vụ thuộc Cục An ninh chính trị nội bộ gồm: Trưởng phòng Bảo vệ nội bộ các cơ quan Đảng, Nhà nước Trung ương, Trưởng phòng An ninh các cơ quan tư pháp, xây dựng pháp luật, tô chức chính trị - xã hội Trung ương, Trưởng phòng An nỉnh báo chí, xuất bản, Trưởng phòng An ninh y tế, giáo dục, Trưởng phòng An ninh văn hóa, thể thao và lao động xã hội, Trưởng phòng An nỉnh bưu chính, viễn thông và công nghệ thông tin, Trưởng phòng Quản lý nhà nước về bảo vệ bí mật Nhà nước; Trưởng phòng nghiệp vụ thuộc Cục An ninh kinh tế gồm: Trưởng phòng An nỉnh công thương, Trưởng phòng An nỉnh tiền tệ, Trưởng phòng An ninh giao thông, xây dựng, Trưởng phòng An nỉnh tài chính, đầu tư, Trưởng phòng An ninh nông, lâm, ngư nghiệp, Trưởng phòng An ninh khoa học, công nghệ và tài nguyên, môi trường; Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát quản lý hành chính về trật tự xã hội gồm: 40 Trưởng phòng Hướng dẫn, quản lý vũ khí, vật liệu nổ, công cụ hỗ trợ và pháo, Trưởng phòng Hướng dẫn, quản lý các ngành, nghề đầu tư kinh doanh có điều kiện về an ninh, trật tự và con dấu, Trưởng phòng Hướng dẫn Cảnh sát khu vực, Cảnh sát trật tự và Cảnh sát phản ứng nhanh, Giám đốc Trung tâm dữ liệu quốc gia về dân cư; Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát giao thông gồm: Trưởng phòng Quản lý, khai thác, xử lý, vận hành dữ liệu và chuyển đổi số, Trưởng phòng Hướng dẫn tuyên truyền, điều tra, giải quyết tai nạn giao thông, Trưởng phòng Hướng dẫn, đăng ký và kiểm định phương tiện, Trưởng phòng Hướng dẫn, đào tạo, sát hạch, quản lý giấy phép của người điều khiển phương tiện giao thông, Trưởng phòng Hướng dẫn tuần tra, kiểm soát giao thông đường bộ, đường sắt, Trưởng phòng Hướng dẫn điều khiển giao thông và dẫn đoàn, Trưởng phòng Hướng dẫn tuần tra, kiểm soát và đấu tranh phòng, chống tội phạm trên đường thủy, Thủy đoàn trưởng; Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ gồm: Trưởng phòng Công tác phòng cháy, Trưởng phòng Thẩm duyệt về phòng cháy, chữa cháy, Trưởng phòng Công tác chữa cháy và cứu nạn, cứu hộ, Trưởng phòng Quản lý khoa học - công nghệ và kiểm định phương tiện phòng cháy, chữa cháy và cứu nạn, cứu hộ; Trưởng phòng nghiệp vụ thuộc Cục An ninh mạng gồm: Trưởng phòng Phòng, chống tội phạm sử dụng không gian mạng xâm phạm trật tự quản lý kinh tế, Trưởng phòng Phòng, chống tội phạm sử dụng không gian mạng xâm phạm trật tự xã hội, Trưởng phòng An nỉnh thông tin mạng, Trưởng phòng Bảo vệ an ninh hệ thống mạng thông tin quốc gia, Trưởng phòng Giám sát thông tin mạng và phòng, chống hoạt động sử dụng không gian mạng xâm phạm an ninh quốc gia; Trưởng phòng nghiệp vụ thuộc Cục quản lý xuất nhập cảnh gồm: Trưởng phòng Quản lý nhập cảnh, xuất cảnh, cư trú của người nước ngoài, Trưởng phòng Quản lý xuất cảnh, nhập cảnh của công dân Việt Nam, Giám đốc Trung tâm An ninh hàng không quốc gia; Trưởng phòng nghiệp vụ thuộc Cục Cảnh sát điều tra tội phạm về tham những, kinh tế, buôn lậu gồm: Trưởng phòng Phòng ngừa, điều tra án kinh tế, tham những trong lĩnh vực tài chính, ngân hàng, đầu tư; Trưởng phòng Phòng ngừa, điều tra án buôn lậu và sản xuất, buôn bán hàng xâm phạm sở hữu trí tuệ; Trưởng phòng Công an cấp tỉnh gồm: Trưởng phòng An ninh nội địa, Trưởng phòng An ninh chính trị nội bộ, Trưởng phòng Cảnh sát quản lý hành chính về trật tự xã hội, Trưởng phòng Cảnh sát điều tra tội phạm về trật tự xã hội, Trưởng phòng Cảnh sát điều tra tội phạm về tham nhũng, kinh tế, buôn lậu, môi trường, Trưởng phòng Cảnh sát điều tra tội phạm về ma túy, Trưởng phòng Cảnh sát giao thông, Trưởng phòng Cảnh sát cơ động, Trưởng phòng Cảnh sát thi hành án hình sự và hỗ trợ tư pháp, Trưởng phòng Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ, Trưởng phòng An ninh mạng, 41 Trưởng phòng An ninh kinh tế, Trưởng phòng An ninh đối ngoại, Chánh Văn phòng Cơ quan Cảnh sát điều tra Công an cấp tỉnh có thâm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 160.000.000 đồng; c) Đình chỉ hoạt động kinh doanh có thời hạn; đ) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. 6. Giám đốc Công an cấp tỉnh có thâm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 200.000.000 đồng; c) Đình chỉ hoạt động kinh doanh có thời hạn; đ) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. 7. Cục trưởng Cục An ninh chính trị nội bộ, Cục trưởng Cục An ninh kinh tế, Chánh Văn phòng Cơ quan Cảnh sát điều tra Bộ Công an, Cục trưởng Cục Cảnh sát quản lý hành chính về trật tự xã hội, Cục trưởng Cục Cảnh sát điều tra tội phạm về trật tự xã hội, Cục trưởng Cục Cảnh sát điều tra tội phạm về tham nhũng, kinh tế, buôn lậu, Cục trưởng Cục Cảnh sát điều tra tội phạm về ma túy, Cục trưởng Cục Cảnh sát giao thông, Cục trưởng Cục Cảnh sát phòng cháy, chữa cháy và cứu nạn, cứu hộ, Cục trưởng Cục Cảnh sát phòng, chống tội phạm về môi trường, Cục trưởng Cục An ninh mạng, Cục trưởng Cục An ninh nội địa, Cục trưởng Cục Cảnh sát quản lý tạm giữ, tạm giam và thi hành án hình sự tại cộng đồng, Tư lệnh Cảnh sát cơ động có thâm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 200.000.000 đồng; c) Đình chỉ hoạt động kinh doanh có thời hạn; d) Tịch thu tang vật, phương tiện vi phạm hành chính; 42 đ) Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. Điều 60. Thắm quyền của Giám đốc Sở Tài chính và Chủ tịch Ủy ban nhân dân 1. Giám đốc Sở Tài chính có thẩm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 160.000.000 đồng; e) Đình chỉ hoạt động kinh doanh có thời hạn; đ) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. 2. Chủ tịch Ủy ban nhân dân cấp tỉnh có thẩm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 200.000.000 đồng; c) Đình chỉ hoạt động kinh doanh có thời hạn; đ) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. 3. Chủ tịch Ủy ban nhân dân cấp xã có thâm quyền xử phạt đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: a) Phạt cảnh cáo; b) Phạt tiền đến 100.000.000 đồng; c) Đình chỉ hoạt động kinh doanh có thời hạn; đ) Tịch thu tang vật, phương tiện vi phạm hành chính; đ) Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. Điều 61. Thắm quyền của cơ quan thực hiện nhiệm vụ quản lý nhà nước trong lĩnh vực đặt cược và trò chơi có thưởng Trưởng đoàn kiểm tra do Bộ trưởng Bộ Tài chính thành lập, Thủ trưởng tổ chức thuộc Bộ Tài chính được giao thực hiện nhiệm vụ kiểm tra trong phạm 43 vi quản lý nhà nước của Bộ Tài chính có thẩm quyền xử phạt: đối với hành vi vi phạm tại Chương II Nghị định này, cụ thể: 1. Phạt cảnh cáo; 2. Phạt tiền đến 200.000.000 đồng; 3. Tịch thu tang vật, phương tiện vi phạm hành chính; 4. Đình chỉ hoạt động kinh doanh có thời hạn; 5. Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3 Nghị định này. Điều 62. Thắm quyền lập biên bản vi phạm hành chính Người có thâm quyền lập biên bản vi phạm hành chính trong lĩnh vực đặt cược và trò chơi có thưởng gồm: 1. Người có thâm quyền xử phạt vi phạm hành chính quy định từ Điều 59 đến Điều 61 Nghị định này trong phạm vi chức năng, nhiệm vụ, quyền hạn được giao. 2. Công chức, viên chức trong các cơ quan quy định tại Điều 60 và Điều 61 Nghị định này trong khi thi hành công vụ, nhiệm vụ mà phát hiện hành vi vi phạm hành chính.cớ quyền lập biên bản vi phạm hành chính trong phạm vi chức năng, nhiệm vú, quyền hạn được giao. 3. Người thuộc lực lượng Công an nhân dân quy định tại Điều 59 Nghị định này trong khi thi hành công vụ, nhiệm vụ mà phát hiện hành vi vi phạm hành chính cö quyền lập biên Bản vi phạm hành chính trong phạm vi chức năng, nhiệm vụ, quyền hạn được Ø1ao. Chương IV ĐIÊU KHOẢN THỊ HÀNH Điều 63. Hiệu lực thi hành 1. Nghị định này có hiệu lực từ ngày 05 tháng 12 năm 2026. 2. Nghị định này thay thế Nghị định số 137/2021/NĐ-CP ngày 31 tháng 12 năm 2021 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực đặt cược và trò chơi có thưởng. 44 Điều 64. Điều khoản chuyền tiếp 1. Đối với hành vi vi phạm đã xảy ra và kết thúc trước thời điểm Nghị định này có hiệu lực thi hành mà sau đó mới bị phát hiện hoặc đang xem xét giải quyết thì áp dụng xử phạt theo quy định của Nghị định đang có hiệu lực tại thời điểm thực hiện hành vi vi phạm. 2. Đối với hành vi vi phạm xảy ra trước thời điểm Nghị định này có hiệu lực nhưng vẫn đang diễn ra khi Nghị định này đã có hiệu lực thì áp dụng quy định của Nghị định này để xử lý. Điều 65. Trách nhiệm thi hành 1. Bộ trưởng Bộ Tài chính có trách nhiệm hướng dẫn, tổ chức thi hành Nghị định này. 2. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này. Nơi nhận: TM. CHÍNH PHỦ - Ban Bí thư Trung ương Đảng; 2 ˆ - Thủ tướng, các Phó Thủ tướng Chính phủ; KT. THỦ TƯỜNG - Các bộ, cơ quan ngang bộ; -PHÓ THỦ TƯỚNG - HĐND, UBND các tỉnh, thành phố; - Văn phòng Trung ương và các Ban của Đảng; - Văn phòng Tổng Bí thư; - Văn phòng Chủ tịch nước; - Hội đồng Dân tộc và các Ủy ban của Quốc hội; - Văn phòng Quốc hội; - Tòa án nhân dân tối cao; - Viện kiểm sát nhân dân tối cao; - Kiểm toán nhà nước; - Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam; - Cơ quan trung ương của các tổ chức chính trị - xã hội; - VPCP: BTCN, các PCN, Trợ lý TTg, các Vụ, Cục, Công báo; - Lưu: VT, KTTH @2).4Z"],["D49.K5.Đa","d","Buộc nộp lại số lợi bất hợp pháp có được do thực hiện hành vi vi phạm"],["D49.K5.Đb","d","Buộc tiêu hủy hoặc tái xuất toàn bộ máy trò chơi điện tử có thưởng,"]],"u":2465}],"48/2026/QĐ-TTg":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Luật Tổ chức Chính phủ số 63/2025/QH15;"],["CC1","c","Căn cứ Luật Tổ chức chính quyên địa phương số 72/2025/QH15;"],["CC2","c","Căn cứ Pháp lệnh Phòng, chống mại dâm số 10/2003/PL-UB TOHI]; Theo đề nghị của Bộ trưởng Bộ V tế tại Tờ trình số 1854/TT+-BYT ngày 29 tháng 9 năm 2026; Thủ tướng Chính phủ ban hành Quyết định sửa đổi, bổ sưng một số điễu của Quyết định số 155/2007/QĐ-TTg ngày 25 tháng 9 năm 2007 của Thủ tướng Chính phủ và Quy chế phối hợp liên ngành phòng, chống tệ nạn mại dâm ban hành kèm theo Quyết định số 155/2"]],"u":0},{"n":"Điều 1","t":"Sửa đối, bố sung Điều 3 của Quyết định số 155/2007/QĐ-TTg ngày","p":[],"u":2478},{"n":"Điều 2","t":"Sửa đối, bỗ sung một số điều của Quy chế phối hợp liên ngành phòng, chống tệ nạn mại dâm ban hành kèm theo Quyết định số 155/2007/QĐ-TTg","p":[["D2.K1","k","Sửa đôi, bổ sung khoản 2 Điều 2 như sau: “2, Hoạt động phối hợp trong công tác phòng, chống mại dâm được thực hiện giữa các bộ, ngành, tô chức chính trị - xã hội ở Trung ương; giữa cơ quan Trung ương và địa phương; giữa các cơ quan chức năng ở địa phương, bao gồm: nghiên cứu, tham mưu, tư vấn, trao đôi thông tin; đề xuất phương hướng, giải pháp; phối hợp xây đựng và tổ chức thực hiện chương trình, kế hoạch phòng, chống mại dâm trong phạm vi chức năng, nhiệm vụ, quyền hạn của từng cơ quan, tổ chức được giao”."],["D2.K2","k","Sửa đổi, bổ sung Điều 3 như sau: “Điều 3. Nội dung phối hợp 1. Nghiên cứu, đề xuất xây dựng, hoàn thiện và tổ chức thực hiện pháp luật, chính sách, chương trình, kê hoạch về phòng, chông mại dâm. 2. Trao đồi thông tin, phối hợp quản lý địa bàn; phòng ngừa, phát hiện, ngăn chặn và xử lý hành vi vi phạm pháp luật về phòng, chống mại dâm; phối hợp kiểm tra các cơ sở kinh doanh dịch vụ dễ bị lợi dụng đề hoạt động mại dâm theo quy định của pháp luật. 3. Phối hợp truyền thông, phổ biến, giáo dục pháp. luật về phòng, chống mại dâm; thực hiện các biện pháp phòng ngừa mại dâm; tư vấn, kết nói và hỗ trợ người bán dâm hòa nhập cộng đồng.”"],["D2.K3","k","Sửa đổi, bổ sung khoản I Điều 4 như sau: “1, Cơ quan chủ trì ở Trung ương giúp Thủ tướng Chính phủ là Bộ Y tế; ở cấp tỉnh do Sở Y tế chủ trì giúp Ủy ban nhân dân cấp tỉnh; ở cấp xã, Phòng Văn hóa - Xã hội là cơ quan đầu mối tham mưu, giúp Ủy ban nhân dân cấp xã tô chức thực hiện hoạt động phối hợp liên ngành về phòng, chống mại dâm.”"],["D2.K4","k","Sửa đổi, bổ sung Điều 9 như sau: “Điều 9. Thành lập Tổ công tác liên ngành 1. Ở Trung ương, Bộ trưởng Bộ Y tế quyết định thành lập, ban hành quy chế hoạt động và phân công Tổ trưởng Tổ công tác liên ngành. Thành viên Tổ công tác liên ngành gồm đại diện các Bộ: Công an, Quốc phòng, Văn hóa, Thể thao và Du lịch, Nội vụ, Công Thương, Tài chính, Giáo dục và Đào tạo và các bộ, cơ quan có liên quan do Bộ trưởng, Thủ trưởng cơ quan cử tham gia; mời đại diện Viện kiểm sát nhân dân tối cao, Tòa án nhân dân tối cao, Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam và các tô chức chính trị - xã hội tham gia. 2.Ở cấp tỉnh, Chủ tịch Ủy ban nhân dân cấp tỉnh quyết định thành lập, ban hành quy chế hoạt động và phân công Tổ trưởng Tổ công tác liên ngành. Thành viên Tổ công tác liên ngành gồm đại diện Sở Y tế, các cơ quan chuyên môn thuộc Ủy ban nhân dân cấp tỉnh và cơ quan, tổ chức có liên quan do người đứng đầu cơ quan, tô chức cử tham gia. 3. Ở cấp xã, căn cứ tình hình, yêu cầu thực tế của công tác phòng, chống mại dâm tại địa phương, Chủ tịch Ủy ban nhân dân câp xã quyềt định việc thành lập Tổ công tác liên ngành, thành phần và quy chế hoạt động của Tổ công tác liên ngành. 4.Tổ công tác liên ngành thực hiện nhiệm vụ tham mưu, tư vấn, trao đổi thông tin, để xuất và phối hợp thực hiện chương trình, kế hoạch phòng, chống mại dâm; hoạt động theo chế độ kiêm nhiệm; không làm thay nhiệm vụ của cơ quan, tổ chức tham gia phối hợp.”"],["D2.K5","k","Sửa đổi, bổ sung Điều 11 như sau: “Điều 11. Phối hợp trong hoạt động kiểm tra 1. Cơ quan, người có thâm quyền thực hiện việc xây dựng kế hoạch kiểm tra, quyết định kiểm tra, tổ chức kiêm tra và xử lý kết quả kiểm tra về phòng, chống mại dâm theo quy định của pháp luật về kiểm tra chuyên ngành và pháp luật có liên quan. 2. Cơ quan, tổ chức có liên quan có trách nhiệm cung cấp thông tin, tài liệu, cử người và phối hợp thực hiện hoạt động kiểm tra theo đề nghị của cơ quan, người có thâm quyên, phù hợp với chức năng, nhiệm vụ, quyên hạn được giao. 3. Tổ công tác liên ngành thực hiện việc tham mưu, tư vấn, trao đổi thông tin và đề xuất nội dung phối hợp phục vụ hoạt động kiểm tra; không quyết định kiểm tra, không trực tiếp thực hiện thâm quyền kiểm tra và không thay thế trách nhiệm của cơ quan, người có thâm quyền. 4. Việc kiểm tra chấp hành quy định về phòng, chống mại dâm tại cơ sở kinh doanh dịch vụ dễ bị lợi dụng để hoạt động mại dâm được thực hiện theo quy định về hoạt động kiểm tra chuyên ngành. Thâm quyền ban hành quyết định kiểm tra, thành lập đoàn kiểm tra; nhiệm vụ, quyền hạn của người tiến hành kiểm tra; trách nhiệm phối hợp và trình tự, thủ tục kiểm tra thực hiện theo Điều 6, Điều 7 và các điều từ Điều 10 đến Điều 16 Nghị định số 217/2025/NĐ-CP ngày 05 tháng § năm 2025 của Chính phủ về hoạt động kiểm tra chuyên ngành.”"],["D2.K6","k","Sửa đổi, bổ sung khoản 1 Điều 12 như sau: \"Đối với tụ điểm mại dâm xảy ra tại địa bàn giáp ranh giữa các xã, phường, đặc khu thì Chủ tịch Ủy ban nhân dân cấp xã nơi có tụ điểm mại dâm có thâm quyền xử lý. Chủ tịch Ủy ban nhân dân cấp xã tại địa bàn giáp ranh có trách nhiệm phối hợp để xử lý trong phạm vi địa bàn quản lý. Trường hợp phối hợp không hiệu quả hoặc tụ điểm mại dâm quá phức tạp thì Chủ tịch Ủy ban nhân dân cấp xã nơi có tụ điểm mại dâm báo cáo Chủ tịch Ủy ban nhân dân cấp tỉnh chỉ đạo giải quyết theo thâm quyêền.\"."],["D2.K7","k","Sửa đổi, bỗ sung Điều 14 như sau: “Điều 14. Chế độ báo cáo, sơ kết, tổng kết 1. Kết quả hoạt động phối hợp liên ngành phòng, chống mại dâm được tổng hợp, lồng ghép trong báo cáo định kỳ về công tác phòng, chống mại dâm; không lập báo cáo định kỳ riêng về hoạt động phối hợp liên ngành. 4 2. Cơ quan phối hợp có trách nhiệm cung cấp thông tin, số liệu và kết quả thực hiện nhiệm vụ được phân công cho cơ quan chủ trì để tổng hợp vào báo cáo công tác phòng, chống mại dâm. 3. Nội dung, kỳ báo cáo, thời hạn và phương thức gửi báo cáo về hoạt động phối hợp liên ngành được thực hiện thống nhất với chế độ báo cáo về công tác phòng, chống mại dâm.”"],["D2.K8","k","Sửa đôi, bố sung Điều 15 như sau:"]],"u":2479},{"n":"Điều 15","t":"Trách nhiệm của các cơ quan quản lý nhà nước","p":[["D15.K1","k","Bộ Y tế chủ trì hướng dẫn, kiểm tra, đôn đốc việc thực hiện Quy chế; hướng dẫn việc trao đồi, cung cấp thông tin, gửi, nhận tài liệu, tổ chức họp, tổ chức hoạt động phối hợp và thực hiện chế độ báo cáo bằng phương thức điện tử; ưu tiên khai thác, sử dụng hệ thống thông tin, cơ sở dữ liệu hiện có; bảo đảm kết nối, chia sẻ thông tin phù hợp với chức năng, nhiệm vụ của từng cơ quan và tuân thủ quy định về an toàn thông tin, an ninh mạng, bảo vệ dữ liệu; định kỳ báo cáo Thủ tướng Chính phủ."],["D15.K2","k","Các bộ, cơ quan ngang bộ và Ủy ban nhân dân cấp tỉnh có trách nhiệm tổ chức thực hiện Quy chế trong phạm vi chức năng, nhiệm vụ, quyền hạn được giao; phối hợp với Bộ Y tế và cơ quan, tổ chức có liên quan trong công tác phòng, chống mại dâm.”"]],"u":2488},{"n":"Điều 3","t":"Hiệu lực thi hành và quy định chuyển tiếp","p":[["D3.K1","k","Quyết định này có hiệu lực thi hành từ ngày 01 tháng 3 năm 2027."],["D3.K2","k","Chương trình, kế hoạch và nhiệm vụ phối hợp liên ngành về phòng, chống mại dâm đã được cơ quan có thẩm quyền phê duyệt hoặc giao thực hiện trước ngày Quyết định này có hiệu lực được tiếp tục thực hiện cho đến khi hoàn thành hoặc được cơ quan có thâm quyền sửa đổi, thay thế."],["D3.K3","k","Tổ công tác liên ngành ở Trung ương, cấp tỉnh và cấp xã đã được thành lập trước ngày Quyết định này có hiệu lực được tiếp tục hoạt động cho đến khi cơ quan, người có thâm quyền quyết định kiện toàn hoặc chấm dứt hoạt động. Cơ quan, người có thầm quyền thành lập Tổ công tác liên ngành có trách nhiệm rà soát, kiện toàn thành phần và quy chế hoạt động của Tổ công tác phù hợp với Quyết định này."],["D3.K4","k","Vụ việc đang được xem xét, giải quyết nhưng chưa hoàn thành trước ngày Quyết định này có hiệu lực được cơ quan, người có thâm quyên tiếp tục giải quyết theo Quyết định này và quy định của pháp luật có liên quan."],["D3.K5","k","Bộ trưởng Bộ Y tế, Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân cấp tỉnh và cơ quan, tổ chức có liên quan chịu trách nhiệm thi hành Quyết định này./. \" Nơi nhận: KT. THỦ TƯỚNG - Ban Bí thư Trung ương Đảng; PHÓ THỦ TƯỚNG - Thủ tướng, các Phó Thủ tướng Chính phủ; - Các bộ, cơ quan ngang bộ; - HĐND, UBND các tỉnh, thành phố ; - Văn phòng Trung ương và các Ban của Đảng; - Văn phòng Tổng Bí thư; - Văn phòng Chủ tịch nước; - Hội đồng Dân tộc và các Ủy ban của Quốc hội; - Văn phòng Quốc hội; ~ Tòa án nhân dân tối cao; - Viện kiểm sát nhân dân tối cao; - Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam; Phạm Thị Thanh Trà - Cơ quan trung ương của các tổ chức chính trị - xã hội; - VPCP: BTCN, các PCN, Trợ lý TTg, các Vụ, Cục, đơn vị trực thuộc, Công báo; - Lưu: VT, KGVX (@b).vt. 1w"]],"u":2491}],"61/2026/TT-BKHCN":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Luật Chuyển đổi số số 148/2025/QH15;"],["CC1","c","Căn cứ Nghị định số 225/2026/NĐ-CP của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Khoa học và Công nghệ;"],["CC2","c","Căn cứ Nghị định số 224/2026/NĐ-CP của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Chuyển đổi số; Theo đề nghị của Cục trưởng Cục Chuyển đổi số quốc gia; Bộ trưởng Bộ Khoa học và Công nghệ ban hành Thông tư quy định cấu trúc, bố cục, yêu cầu kỹ thuật cho cổng thông tin điện tử và trang thông tin điện tử."]],"u":0},{"n":"Điều 1","t":"Phạm vi điều chỉnh","p":[],"u":2497},{"n":"Điều 2","t":"Đối tượng áp dụng","p":[["D2.K1","k","Bộ, cơ quan ngang bộ, cơ quan khác ở trung ương; cơ quan, đơn vị thuộc bộ, cơ quan ngang bộ, cơ quan khác ở trung ương; Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương (sau đây gọi chung là Ủy ban nhân dân cấp tỉnh); các sở, ban, ngành và cơ quan chuyên môn thuộc Ủy ban nhân dân cấp tỉnh; Ủy ban nhân dân xã, phường, đặc khu thuộc tỉnh, thành phố trực thuộc trung ương (sau đây gọi chung là Ủy ban nhân dân cấp xã). 2"],["D2.K2","k","Các tổ chức, cá nhân tham gia hoặc có liên quan trong việc cung cấp giải pháp, xây dựng, phát triển, nâng cấp, mở rộng, vận hành, kết nối với cổng thông tin điện tử và trang thông tin điện tử của cơ quan nhà nước."]],"u":2498},{"n":"Điều 3","t":"Giải thích từ ngữ","p":[["D3.K1","k","Cổng thông tin điện tử, trang thông tin điện tử của cơ quan nhà nước là kênh cung cấp thông tin thống nhất, tập trung của cơ quan nhà nước trên môi trường số. Trong đó: thông tin điện tử) có chức năng làm đầu mối tích hợp, liên kết, điều hướng thông tin của các cơ quan, đơn vị, trang thông tin điện tử thuộc phạm vi quản lý và các nguồn thông tin có liên quan; thành phần) là thành phần của cổng thông tin điện tử, cung cấp thông tin thuộc phạm vi chức năng, nhiệm vụ, quyền hạn của cơ quan, đơn vị."],["D3.K1.Đa","d","Cổng thông tin điện tử của cơ quan nhà nước (sau đây gọi tắt là cổng"],["D3.K1.Đb","d","Trang thông tin điện tử của cơ quan nhà nước (sau đây gọi tắt là trang"],["D3.K2","k","Cơ quan chủ quản cổng thông tin điện tử hoặc trang thông tin điện tử (sau đây gọi tắt là cơ quan chủ quản) là cơ quan nhà nước chịu trách nhiệm thiết lập, quản lý, duy trì hoạt động và cung cấp thông tin trên cổng thông tin điện tử hoặc trang thông tin điện tử."],["D3.K3","k","Đầu trang (Header) là phần nằm trên cùng của cổng thông tin điện tử và trang thông tin điện tử, hiển thị đồng nhất trên các giao diện, bao gồm thông tin nhận diện cơ quan chủ quản, thanh điều hướng và các tiện ích hỗ trợ."],["D3.K4","k","Thân trang (Body) là phần nằm giữa Đầu trang và Chân trang, hiển thị nội dung chính và các chức năng, thành phần tương tác phục vụ việc khai thác thông tin trên cổng thông tin điện tử và trang thông tin điện tử."],["D3.K5","k","Chân trang (Footer) là phần nằm cuối cùng của cổng thông tin điện tử và trang thông tin điện tử, hiển thị đồng nhất trên các giao diện, bao gồm các thông tin về nhận diện, trách nhiệm pháp lý và liên hệ của cơ quan chủ quản."],["D3.K6","k","Thanh điều hướng là phần chứa các liên kết hoặc biểu tượng để giúp người dùng định vị và truy cập các nội dung trên cổng thông tin điện tử và trang thông tin điện tử."],["D3.K7","k","Dữ liệu có cấu trúc (Structured data) là dữ liệu được định dạng, phân loại theo bộ từ vựng chuẩn hóa và nhúng vào mã nguồn của trang web, giúp các công 3 cụ tìm kiếm và hệ thống trí tuệ nhân tạo nhận diện, phân tích và hiểu chính xác nội dung và ý nghĩa của thông tin được đăng tải."],["D3.K8","k","HTML ngữ nghĩa (Semantic HTML) là phương pháp sử dụng các thẻ đánh dấu siêu văn bản mang ý nghĩa tự mô tả, nhằm xác định cấu trúc, vai trò của từng vùng nội dung trên trang web đối với trình duyệt, công cụ tìm kiếm và các thiết bị hỗ trợ người khuyết tật."],["D3.K9","k","Hướng dẫn khả năng tiếp cận nội dung web (Web Content Accessibility Guidelines - WCAG) là bộ tiêu chuẩn quốc tế về khả năng tiếp cận nội dung web, được áp dụng để bảo đảm cổng thông tin điện tử và trang thông tin điện tử có thể được sử dụng bởi mọi đối tượng, bao gồm cả người khuyết tật."]],"u":2501},{"n":"Điều 4","t":"Yêu cầu chung","p":[["D4.K1","k","Cổng thông tin điện tử và trang thông tin điện tử phải tuân thủ quy định về tên miền tại khoản 4 Điều 11 Nghị định số 224/2026/NĐ-CP."],["D4.K2","k","Tuân thủ quy định về cung cấp thông tin của cơ quan nhà nước trên môi trường số tại điểm b, c khoản 1 và khoản 2, khoản 3 Điều 9 Nghị định số 224/2026/NĐ-CP."],["D4.K3","k","Việc xây dựng, phát triển, nâng cấp, mở rộng, vận hành cổng thông tin điện tử và trang thông tin điện tử phải bảo đảm phù hợp với Khung kiến trúc tổng thể quốc gia số hoặc Khung kiến trúc số của cơ quan, tổ chức quy định tại Điều 13 của Luật Chuyển đổi số số 148/2025/QH15."],["D4.K4","k","Căn cứ điều kiện thực tế, nhu cầu quản lý và yêu cầu cung cấp thông tin, cơ quan nhà nước xem xét, quyết định việc tổ chức cổng thông tin điện tử hoặc trang thông tin điện tử phù hợp. Cổng thông tin điện tử hoặc trang thông tin điện tử của cơ quan, đơn vị thuộc bộ, cơ quan ngang bộ, cơ quan khác ở trung ương; cơ quan chuyên môn thuộc Ủy ban nhân dân cấp tỉnh; Ủy ban nhân dân cấp xã được tổ chức trong cấu trúc cổng thông tin điện tử của bộ, cơ quan ngang bộ, cơ quan khác ở trung ương, Ủy ban nhân dân cấp tỉnh tương ứng, bảo đảm liên kết, tích hợp và điều hướng thông tin thống nhất."],["D4.K5","k","Đối với trang thành phần, không tổ chức các trang thông tin điện tử thành phần trực thuộc. 4"]],"u":2513},{"n":"Điều 5","t":"Yêu cầu chung về cấu trúc và bố cục","p":[["D5.K1","k","Giao diện cổng thông tin điện tử và trang thông tin điện tử phải bảo đảm tương thích với các trình duyệt web phổ biến và hiển thị tối ưu trên các loại thiết bị khác nhau bao gồm điện thoại thông minh, máy tính bảng, máy tính để bàn, màn hình cảm ứng."],["D5.K2","k","Cấu trúc và bố cục của cổng thông tin điện tử và trang thông tin điện tử gồm ba phần chính: Đầu trang, Thân trang và Chân trang. Yêu cầu tối thiểu như sau: a1) Biểu tượng (Logo) của cơ quan chủ quản (nếu có); a2) Tên đầy đủ của cơ quan chủ quản; a3) Thanh điều hướng, công cụ tìm kiếm và các tiện ích khác (nếu có). nhiệm vụ và mục đích cung cấp thông tin của cổng thông tin điện tử và trang thông tin điện tử. Đối với trang chủ, tối thiểu phải có các thành phần sau: b1) Nội dung thông tin của cổng thông tin điện tử và trang thông tin điện tử, được thể hiện dưới dạng tin bài, đa phương tiện hoặc các hình thức hiển thị khác; b2) Đối với trang thành phần phải có liên kết điều hướng đến cổng thông tin điện tử mà trang trực thuộc, khuyến khích sử dụng hình ảnh có gắn liên kết để tăng mức độ nhận diện; b3) Đối với cổng thông tin điện tử phải có liên kết điều hướng đến các trang thành phần trực thuộc, việc điều hướng được thể hiện dưới dạng danh mục, trình đơn, liên kết hoặc hình thức phù hợp khác. c1) Cụm từ “Cổng thông tin điện tử” hoặc “Trang thông tin điện tử” kèm theo tên đầy đủ của cơ quan chủ quản; c2) Thông tin về tổ chức, cá nhân chịu trách nhiệm quản lý, vận hành và cung cấp nội dung; số giấy phép, ngày cấp, cơ quan cấp phép đối với trường hợp cổng thông tin điện tử hoặc trang thông tin điện tử phải có giấy phép theo quy định của pháp luật; c3) Thông tin liên hệ của cơ quan chủ quản, bao gồm: địa chỉ, số điện thoại và địa chỉ thư điện tử chính thức của cơ quan chủ quản. 5"],["D5.K2.Đa","d","Đầu trang phải hiển thị tối thiểu các thành phần sau:"],["D5.K2.Đb","d","Thân trang bảo đảm hiển thị nội dung chính phù hợp với chức năng,"],["D5.K2.Đc","d","Chân trang phải hiển thị tối thiểu các thành phần sau:"]],"u":2519},{"n":"Điều 6","t":"Yêu cầu về chức năng","p":[],"u":2525},{"n":"Điều 7","t":"Yêu cầu về dữ liệu đặc tả","p":[],"u":2526},{"n":"Điều 8","t":"Yêu cầu về tính sẵn sàng cho công cụ tìm kiếm và trí tuệ nhân tạo","p":[["D8.K1","k","Nội dung trên cổng thông tin điện tử và trang thông tin điện tử được cấu trúc và trình bày theo các nguyên tắc giúp công cụ tìm kiếm và hệ thống trí tuệ nhân tạo có thể thu thập, phân tích và đánh giá thông qua việc đáp ứng các yêu cầu kỹ thuật sau: thẻ HTML ngữ nghĩa; cấu trúc địa chỉ URL thân thiện, chứa từ khóa chính; thiết lập sơ đồ trang web định dạng XML (XML Sitemap) phù hợp với quy mô, tính chất của cổng thông tin điện tử, trang thông tin điện tử; hoặc các nội dung cần tăng cường khả năng nhận diện, phân tích và hiểu chính xác bởi công cụ tìm kiếm và hệ thống trí tuệ nhân tạo theo quy định tại Phụ lục III ban hành kèm theo Thông tư này."],["D8.K1.Đa","d","Phân cấp nội dung rõ ràng, sử dụng hợp lý các thẻ tiêu đề, thẻ mô tả và"],["D8.K1.Đb","d","Áp dụng dữ liệu có cấu trúc đối với các nội dung thông tin quan trọng"],["D8.K2","k","Khuyến khích cơ quan chủ quản áp dụng các kỹ thuật tiên tiến khác để tối ưu hóa khả năng hiển thị thông tin trên các công cụ tìm kiếm và nền tảng trí tuệ nhân tạo."],["D8.K3","k","Khuyến khích cơ quan chủ quản nghiên cứu, ứng dụng các giải pháp trí tuệ nhân tạo để nâng cao trải nghiệm người dùng trên cổng thông tin điện tử và trang thông tin điện tử, như tóm tắt nội dung, chuyển văn bản thành giọng nói hoặc cá nhân hóa thông tin, đồng thời bảo đảm việc tạo và cung cấp nội dung bằng các giải pháp này tuân thủ quy định của pháp luật về trí tuệ nhân tạo."]],"u":2527},{"n":"Điều 9","t":"Yêu cầu về hạ tầng kỹ thuật","p":[["D9.K1","k","Cổng thông tin điện tử và trang thông tin điện tử phải được thiết kế, xây dựng và vận hành tuân thủ các nguyên tắc kiến trúc và đáp ứng các yêu cầu tối thiểu đối với hệ thống số quy định tại Điều 7, Điều 8 của Luật số 148/2025/QH15."],["D9.K2","k","Cổng thông tin điện tử phải được triển khai trên hạ tầng có khả năng mở rộng theo nhu cầu sử dụng, ưu tiên áp dụng công nghệ điện toán đám mây và kiến 6 trúc mô-đun. Đối với trang thông tin điện tử, khuyến khích triển khai trên hạ tầng có khả năng mở rộng phù hợp với điều kiện thực tế của cơ quan chủ quản."],["D9.K3","k","Cổng thông tin điện tử và trang thông tin điện tử phải có phương án bảo đảm tính sẵn sàng, duy trì hoạt động liên tục và khả năng phục hồi nhanh khi xảy ra sự cố."]],"u":2533},{"n":"Điều 10","t":"Yêu cầu về hiệu năng","p":[],"u":2537},{"n":"Điều 11","t":"Yêu cầu về khả năng tiếp cận","p":[["D11.K1","k","Khuyến khích cơ quan chủ quản áp dụng tiêu chuẩn WCAG từ phiên bản 2.1 cấp độ AA trở lên nhằm đáp ứng yêu cầu kỹ thuật về khả năng tiếp cận đối với người sử dụng. Việc áp dụng tiêu chuẩn được thực hiện linh hoạt, phù hợp với chức năng, nội dung thực tế của cổng thông tin điện tử và trang thông tin điện tử; ưu tiên các tiêu chí liên quan trực tiếp đến thành phần, tính năng hoặc loại hình nội dung đang được triển khai."],["D11.K2","k","Khuyến khích cơ quan chủ quản sử dụng các công cụ mã nguồn mở phổ biến để tự kiểm tra, đánh giá mức độ đáp ứng khả năng tiếp cận nội dung web của cổng thông tin điện tử và trang thông tin điện tử."]],"u":2538},{"n":"Điều 12","t":"Yêu cầu về bảo đảm an ninh mạng","p":[["D12.K1","k","Tuân thủ quy định của pháp luật về bảo đảm an ninh mạng đối với hệ thống thông tin theo cấp độ."],["D12.K2","k","Triển khai các biện pháp quản lý, kỹ thuật để kiểm soát chặt chẽ nội dung thông tin; bảo đảm không cung cấp, đăng tải, phát tán các thông tin vi phạm pháp luật trên không gian mạng."],["D12.K3","k","Sử dụng giao thức HTTPS, áp dụng phiên bản TLS tối thiểu 1.2; triển khai các giải pháp bảo mật để ngăn chặn các nguy cơ tấn công mạng phổ biến."],["D12.K4","k","Sử dụng công nghệ địa chỉ Internet IPv6 và áp dụng cơ chế mở rộng bảo mật DNSSEC cho hệ thống phân giải tên miền (DNS)."],["D12.K5","k","Thường xuyên rà soát, kiểm tra để phát hiện, loại bỏ phần mềm độc hại; duy trì việc lưu trữ nhật ký hệ thống phục vụ công tác giám sát và xác minh thông tin. 7"],["D12.K6","k","Có phương án dự phòng, sao lưu và khôi phục dữ liệu để bảo đảm an ninh dữ liệu; kịp thời ứng phó, khắc phục khi xảy ra sự cố an ninh mạng."],["D12.K7","k","Các tệp tin được đăng tải phải bảo đảm khả năng truy cập, khai thác và sử dụng trên các phần mềm, nền tảng phổ biến; không đăng tải tệp tin bị lỗi, bị hỏng hoặc chứa mã độc."]],"u":2541},{"n":"Điều 13","t":"Yêu cầu về kết nối và thu thập dữ liệu","p":[["D13.K1","k","Cổng thông tin điện tử và trang thông tin điện tử phải được kết nối với Nền tảng thống kê, đo lường, giám sát, đánh giá triển khai chuyển đổi số trên cơ sở thông tin được cung cấp theo quy định tại Phụ lục V ban hành kèm theo Thông tư này."],["D13.K2","k","Nền tảng thống kê, đo lường, giám sát, đánh giá triển khai chuyển đổi số do Bộ Khoa học và Công nghệ xây dựng, quản lý, phát triển và vận hành để thực hiện thu thập tự động các nhóm dữ liệu sau: thuật, tình trạng kết nối và khả năng hoạt động của hệ thống theo quy định tại Phụ lục VI ban hành kèm theo Thông tư này; của Thông tư này."],["D13.K2.Đa","d","Dữ liệu về lưu lượng, mức độ sử dụng, hành vi tương tác, thông số kỹ"],["D13.K2.Đb","d","Dữ liệu đặc tả và dữ liệu có cấu trúc theo quy định tại Điều 7 và Điều 8"]],"u":2549},{"n":"Điều 14","t":"Trách nhiệm của cơ quan chủ quản","p":[["D14.K1","k","Tổ chức triển khai thực hiện các quy định tại Thông tư này đối với cổng thông tin điện tử và trang thông tin điện tử thuộc phạm vi quản lý của cơ quan chủ quản."],["D14.K2","k","Bảo đảm nguồn lực để duy trì, vận hành và phát triển cổng thông tin điện tử và trang thông tin điện tử, đáp ứng các yêu cầu về kỹ thuật và an ninh mạng."],["D14.K3","k","Tổ chức thực hiện các biện pháp bảo vệ dữ liệu cá nhân của người dùng trong quá trình thu thập, lưu trữ và xử lý thông tin trên cổng thông tin điện tử và trang thông tin điện tử theo quy định của pháp luật về bảo vệ dữ liệu cá nhân."],["D14.K4","k","Phối hợp với Bộ Khoa học và Công nghệ (Cục Chuyển đổi số quốc gia) trong việc bảo đảm kết nối, cung cấp dữ liệu phục vụ hoạt động thống kê, đo lường, giám sát và đánh giá trên Nền tảng thống kê, đo lường, giám sát, đánh giá triển khai chuyển đổi số. 8"]],"u":2554},{"n":"Điều 15","t":"Trách nhiệm của Bộ Khoa học và Công nghệ","p":[["D15.K1","k","Xây dựng, ban hành và cập nhật các tài liệu hướng dẫn kỹ thuật để tổ chức triển khai thực hiện các quy định tại Thông tư này."],["D15.K2","k","Xây dựng, quản lý và vận hành Nền tảng thống kê, đo lường, giám sát, đánh giá triển khai chuyển đổi số theo quy định của Luật số 148/2025/QH15."],["D15.K3","k","Thực hiện các biện pháp lưu trữ và bảo vệ dữ liệu theo quy định của pháp luật trong quá trình thu thập, lưu trữ, xử lý và khai thác dữ liệu trên Nền tảng thống kê, đo lường, giám sát, đánh giá triển khai chuyển đổi số; việc thu thập, xử lý dữ liệu chỉ được thực hiện trong phạm vi cần thiết để phục vụ hoạt động thống kê, đo lường, giám sát và đánh giá."],["D15.K4","k","Chủ trì tổ chức thực hiện đánh giá và công bố kết quả sự đáp ứng các yêu cầu kỹ thuật của cổng thông tin điện tử và trang thông tin điện tử của cơ quan nhà nước định kỳ hằng năm như sau: trung vào các nhóm nội dung về cấu trúc, bố cục, yêu cầu kỹ thuật; phù hợp với yêu cầu quản lý và định hướng ưu tiên trong từng giai đoạn; hai mức: Đạt hoặc Không đạt."],["D15.K4.Đa","d","Nội dung đánh giá dựa trên cơ sở các quy định tại Thông tư này, tập"],["D15.K4.Đb","d","Kết quả đánh giá đối với từng nội dung được xác định theo một trong"],["D15.K5","k","Bộ Khoa học và Công nghệ (Cục Chuyển đổi số quốc gia) có trách nhiệm tiếp nhận, xử lý và trả lời các ý kiến phản hồi về kết quả đánh giá nhận được từ các cơ quan chủ quản của cổng thông tin điện tử, trang thông tin điện tử."]],"u":2559},{"n":"Điều 16","t":"Điều khoản chuyển tiếp","p":[["D16.K1","k","Đối với cổng thông tin điện tử và trang thông tin điện tử đã vận hành trước ngày Thông tư này có hiệu lực, trong thời gian chưa hoàn thành việc chỉnh sửa, nâng cấp, các quy định về cấu trúc, bố cục, yêu cầu kỹ thuật tại Thông tư số 22/2023/TT-BTTTT ngày 31 tháng 12 năm 2023 của Bộ trưởng Bộ Thông tin và Truyền thông quy định cấu trúc, bố cục, yêu cầu kỹ thuật cho cổng thông tin điện tử và trang thông tin điện tử của cơ quan nhà nước được tiếp tục áp dụng cho đến khi hoàn thành nâng cấp, nhưng không quá 01 năm kể từ ngày Thông tư này có hiệu lực thi hành."],["D16.K2","k","Đối với nội dung tin, bài đã được đăng tải trên cổng thông tin điện tử và trang thông tin điện tử trước ngày Thông tư này có hiệu lực, vẫn tiếp tục thực hiện 9 yêu cầu về dữ liệu đặc tả, dữ liệu có cấu trúc và tối ưu hóa thông tin theo quy định tại Thông tư số 22/2023/TT-BTTTT, trừ trường hợp lựa chọn áp dụng theo quy định tại Thông tư này."]],"u":2567},{"n":"Điều 17","t":"Hiệu lực và trách nhiệm thi hành","p":[["D17.K1","k","Thông tư này có hiệu lực thi hành kể từ ngày 01 tháng 12 năm 2026."],["D17.K2","k","Thông tư số 22/2023/TT-BTTTT hết hiệu lực kể từ ngày Thông tư này có hiệu lực, trừ trường hợp quy định tại Điều 16 Thông tư này."],["D17.K3","k","Bộ trưởng, Thủ trưởng cơ quan ngang bộ, cơ quan khác ở trung ương, Chủ tịch Ủy ban nhân dân các cấp và cơ quan, tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này. Trong quá trình thực hiện, nếu có vướng mắc, đề nghị cơ quan, tổ chức, cá nhân phản ánh kịp thời về Bộ Khoa học và Công nghệ (Cục Chuyển đổi số quốc gia) để phối hợp giải quyết./."]],"u":2570}],"89/2026/TT-BGDĐT":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Luật Giáo dục số 43/2019/QH14 được sửa đổi, bồ sưng bởi Luật số 123/2025⁄QH!5,"],["CC1","c","Căn cứ Luật Giao dịch điện tử số 20/2023/QH15;"],["CC2","c","Căn cứ Nghị định số 2 79/202/NĐ-CP ngày 12 tháng 7 năm 2026 của Chính phủ quy định chức năng, nhiệm vụ, quyên hạn và cơ cấu của Bộ Giáo dục và Đào tạo; Theo đè nghị của Vụ trưởng Vụ Giáo dục Phổ thông; Bộ trưởng Bộ Giáo dục và Đào tạo ban hành Thông tr sửa đổi, bổ sung một số điều của Quy định đánh giá học sinh tiểu học ban hành kèm theo Thông tư số 27/2020/TT-BGDĐT ngày 04 tháng 9 năm 2020 và Quy"]],"u":0},{"n":"Điều 1","t":"Sửa đổi, bỗ sung khoản 4 Điều 2 như sau:","p":[],"u":2574},{"n":"Điều 2","t":"Sửa đổi, bỗ sung Điều 8 như sau:","p":[],"u":2575},{"n":"Điều 3","t":"Sửa đổi, bỗ sung điểm b khoản 2 Điều 9 như sau:","p":[],"u":2576},{"n":"Điều 4","t":"Sửa đổi, bổ sung khoản 2 Điều 10 như sau:","p":[],"u":2577},{"n":"Điều 5","t":"Sửa đổi, bổ sung khoản 2 Điều 11 như sau:","p":[],"u":2578},{"n":"Điều 6","t":"Sửa đổi, bổ sung khoản 2 và khoản 3 Điều 12 như sau:","p":[],"u":2579},{"n":"Điều 7","t":"Sửa đổi, bổ sung Điều 14 như sau:","p":[],"u":2580},{"n":"Điều 8","t":"Sửa đổi, bổ sung khoản 1 và khoản 3 Điều 15 như sau:","p":[["D8.K1","k","Sửa đổi, bô sung khoản 1 Điều 15 như sau: “1, Tổ chức thực hiện đánh giá học sinh theo Quy định này; bảo đảm chất lượng đánh giá; báo cáo kết quả thực hiện với Sở Giáo dục và Đào tạo, đồng thời gửi Ủy ban nhân dân cấp xã theo quy định.”."],["D8.K2","k","Sửa đổi, bổ sung khoản 3 Điều 15 như Sazg 5 “3, Tổ chức kiểm tra định kỳ cuối học kỳ I, cuối năm học đối với học sinh lớp 5 theo đề chung do Sở Giáo dục và Đào tạo cung cấp ở các môn học được Sở Giáo dục và Đào tạo ra đề chung: tổ chức ra đề kiểm tra định kỳ đối với các môn học, thời điểm kiểm tra và khối lớp còn lại; tổ chức coi, chấm, nhận xét, tổng hợp kết quả. kiêm tra định kỳ bảo đảm khách quan, công bằng, thực chất và chịu trách nhiệm về kết quả kiểm tra, đánh giá học sinh của nhà trường; xây dựng và thực hiện kế hoạch bồi dưỡng, giúp đỡ học sinh; nghiệm thu, bàn giao kết quả giáo dục học sinh; xác nhận kết quả đánh giá học sinh cuôi năm học; xét lên lớp; quản lý hồ sơ đánh giá học sinh; cập nhật, xác nhận, quản lý và sử dụng Học bạ số theo quy định.”."]],"u":2581},{"n":"Điều 9","t":"Sửa đổi, bổ sung điểm a khoản 1 và điểm b khoản 2 Điều 16 như sau:","p":[["D9.K1","k","Sửa đổi, bổ sung điểm a khoản 1 Điều 16 như sau: “a) Đánh giá, tông hợp kết quả giáo dục học sinh trong lớp; hoàn thành hồ sơ đánh giá học sinh; cập nhật nhận xét, kết quả tổng hợp chung của lớp để lập Học bạ số; thực hiện ký số xác nhận Học bạ số của lớp chủ nhiệm sau khi giáo viên bộ môn đã hoàn thành ký số môn học; nghiệm thu, bàn giao kết quả giáo dục học sinh cho lớp học sau; bảo đảm dữ liệu đánh giã học sinh đầy đủ, chính xác, kịp thời, thống nhất với hồ sơ quản lý của nhà trường.”."],["D9.K2","k","Sửa đổi, bổ sung điểm b khoản 2 Điều 16 như sau: “b) Phối hợp với giáo viên chủ nhiệm, giáo viên cùng lớp, cha mẹ học sinh trong đánh giá học sinh; hoàn thành hồ sơ đánh giá học sinh; chịu trách nhiệm hoàn toàn về tính chính xác, đầy đủ của dữ liệu, kết quả học tập thuộc môn học, hoạt động giáo dục được phân công và trực tiếp ký số xác nhận kết quả môn học đó trên Học bạ số; nghiệm thu kết quả giáo dục học sinh theo quy định.”"]],"u":2584},{"n":"Điều 10","t":"Sửa đi tên Phụ lục 2","p":[],"u":2587},{"n":"Điều 11","t":"Thay thế cụm từ","p":[],"u":2588},{"n":"Điều 12","t":"Sửa đổi, bỗ sung khoản 2 Điều 1 như sau:","p":[],"u":2589},{"n":"Điều 13","t":"Sửa đôi, bỗ sung Điều 3 như sau:","p":[],"u":2590},{"n":"Điều 14","t":"Bỗ sung khoản 4 vào Điều 6 như sau:","p":[],"u":2591},{"n":"Điều 16","t":"Bổ sung khoản 3 vào Điều 8 như sau:","p":[],"u":2592},{"n":"Điều 17","t":"Sửa đổi, bỗ sung Điều 11 như sau:","p":[],"u":2593},{"n":"Điều 18","t":"Bổ sung khoản 4 vào Điều 13 như sau:","p":[],"u":2594},{"n":"Điều 19","t":"Sửa đổi, bổ sung Điều 14 như sau:","p":[],"u":2595},{"n":"Điều 20","t":"Sửa đổi, bỗ sung khoản 1, khoản 2, bỗ sung khoản 5 vào Điều 16 và sửa đổi, bỗ sung Điều 17 như sau:","p":[["D20.K1","k","Sửa đổi, bổ sung khoản 1 và khoản 2 Điều 16 như sau: “1, Trực tiếp quản lý, hướng dẫn chuyên môn, nghiệp vụ và kiểm tra việc thực hiện đánh giá học sinh tại các cơ sở giáo dục có câp trung học cơ sở, cấp trung học phổ thông trên địa bàn theo quy định tại Thông tư này; hướng dẫn Ủy ban nhân dân cấp xã thực hiện trách nhiệm quy định tại Điều 17 Thông tư này. 2. Hướng dẫn các cơ sở giáo dục sử dụng số theo dõi và đánh giá học sinh (theo lớp học), số theo dõi và đánh giá học sinh (của giáo viên) theo mâu quy định tại Phụ lục kèm theo Thông tư này và Học bạ sô theo quy định. Trường hợp sử dụng dạng hồ sơ điện tử, Sở Giáo dục và Đào tạo hướng dẫn thực hiện theo lộ trình phù hợp với điều kiện của địa phương, nhà trường, khả năng thực hiện của giáo viên và bảo đảm tính hợp pháp của hô sơ điện tử.”."],["D20.K2","k","Bồ sung khoản 5 vào Điều 16 như sau: “5, Chủ trì xây dựng, thẩm định, cung cấp đề kiểm tra định kỳ cuối học kỳ I và cuối học kỳ II chung cho các cơ sở giáo dục có cấp trung học cơ sở, trung học phổ thông trên địa bàn đối với một số môn học đánh giá bằng điểm số của học sinh lớp 9, lớp 12 do Sở Giáo dục và Đào tạo lựa chọn và thông báo cho các cơ sở giáo dục trước khi tổ chức thực hiện, bảo đảm nội dung, hình thức, mức độ đề kiểm tra phù hợp với yêu cầu cần đạt của Chương trình giáo dục phô thông và thống nhất giữa các cơ sở giáo dục cùng cấp học: hướng dẫn, kiểm tra việc tổ chức kiểm tra, đánh giá định kỳ tại các cơ sở giáo dục bảo đảm khách quan, công bằng, thực chất.”"],["D20.K3","k","Sửa đổi, bổ sung Điều 17 như sau: “Điều 17. Trách nhiệm của Ủy ban nhân dân cấp xã 1. Tổ chức phổ biến, triển khai Thông tư này đến các cơ sở giáo dục có cấp trung học cơ sở thuộc phạm vi quản lý; bảo đảm các điều kiện về đội ngũ, cơ sở vật chất, thiết bị, hạ tầng công nghệ thông tin để các cơ sở giáo dục thực hiện đánh giá học sinh, quản lý và sử dụng Học bạ số theo quy định. 2. Kiểm tra việc tuân thủ pháp luật về đánh giá học sinh, quản lý hồ sơ đánh giá học sinh tại các cơ sở giáo dục thuộc phạm vi quản lý; phối hợp với Sở Giáo dục và Đào tạo trong hướng dẫn, kiểm tra chuyên môn, nghiệp vụ. „ 3. Theo dõi, kiểm tra việc cập nhật, quản lý, khai thác, sử dụng dữ liệu Học bạ số của các cơ sở giáo dục thuộc phạm vi quản lý theo hướng dân của Sở Giáo dục và Đào tạo. 4. Giải quyết theo thâm quyền những khó khăn, vướng mắc về điều kiện bảo đảm thực hiện Thông tư này tại các cơ sở giáo dục thuộc phạm vi quản lý; kiến nghị Sở Giáo dục và Đào tạo giải quyết những vướng mắc về chuyên môn, nghiệp vụ. 5. Báo cáo Sở Giáo dục và Đào tạo việc bảo đảm điều kiện thực hiện đánh giá học sinh, quản lý, sử dụng Học bạ số tại các cơ sở giáo dục thuộc phạm vi quản lý theo quy định.” 9"]],"u":2596},{"n":"Điều 21","t":"Bổ sung khoản 7 vào Điều 18 như sau:","p":[],"u":2600},{"n":"Điều 22","t":"Bồ sung cuối phần “HƯỚNG DẪN SỬ DỰNG HỌC BẠ” tại Phụ lục","p":[],"u":2601},{"n":"Điều 23","t":"Thay thế, bãi bỏ một số cụm từ","p":[["D23.K1","k","Thay thế cụm từ “Học bạ học sinh” bằng cụm từ “Học bạ số theo quy định” tại khoản 3 và khoản 5 Điều 18, khoản 2 Điều 19, khoản 2 và khoản 4 Điều 20 của Thông tư số 22/2021/TT-BGDĐT ngày 20/7/2021."],["D23.K2","k","Bãi bỏ cụm từ “chỉ đạo,” tại khoản 2 Điều 18 của Thông tư số 22/2021/TT- BGDĐT ngày 20/7/2021."]],"u":2602},{"n":"Điều 24","t":"Hiệu lực thi hành","p":[],"u":2605},{"n":"Điều 25","t":"Điều khoản chuyển tiếp","p":[["D25.K1","k","Việc sử dụng Học bạ giấy, việc tạo lập, quản lý và sử dụng Học bạ số thực hiện theo quy định của Bộ trưởng Bộ Giáo dục và Đào tạo về quản lý và sử dụng Học bạ số trong các cơ sở giáo dục phô thông và cơ sở giáo dục thường xuyên."],["D25.K2","k","Cơ sở giáo dục thực hiện tạo lập Học bạ số đối với học sinh đang theo học và học sinh mới được tuyển theo quy định của Bộ trưởng Bộ Giáo dục và Đào tạo về quản lý và sử dụng Học bạ số trong các cơ sở giáo dục phổ thông và cơ sở giáo dục thường xuyên."],["D25.K3","k","Việc số hóa, chuẩn hóa và cập nhật dữ liệu Học bạ giấy, dữ liệu học tập hiện có đề tạo lập Học bạ số được thực hiện theo lộ trình quy định của Bộ trưởng Bộ Giáo dục và Đào tạo về quản lý và sử dụng Học bạ số trong các cơ sở giáo dục phổ thông Và cơ sở giáo dục thường ” “x 10"]],"u":2606},{"n":"Điều 26","t":"Chánh Văn phòng, Vụ trưởng Vụ Giáo dục Phổ thông, Thủ trưởng các đơn vị có liên quan thuộc Bộ Giáo dục và Đào tạo, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố, Giám đốc Sở Giáo dục và Đào tạo, các cơ quan tô chức và cá nhân có liên quan chịu trách nhiệm thi hành Thông tư này","p":[],"u":2610}]},"projects":[{"id":"xo-so","name":"Xổ số, đặt cược","pin":true,"last":"09:14","docs":["389/2026/NĐ-CP","391/2026/NĐ-CP","385/2026/NĐ-CP"],"ctx":"Nhóm xử phạt vi phạm hành chính trong lĩnh vực xổ số, đặt cược và trò chơi có thưởng. Cần biết hành vi nào của đại lý và điểm kinh doanh bị phạt nặng nhất, và còn thiếu văn bản nào.","notes":["Ưu tiên đại lý bán vé: rà hợp đồng đại lý trước khi gia hạn.","Hai Nghị định 389 và 391 đều chưa có hiệu lực (30/11 và 05/12/2026): ghi rõ ngày áp dụng khi báo cáo."]},{"id":"tai-chinh","name":"Tài chính và phí","pin":true,"last":"Hôm qua","docs":["154/2026/TT-BTC","155/2026/TT-BTC","156/2026/TT-BTC","390/2026/NĐ-CP","389/2026/NĐ-CP","23/2026/QH16"],"ctx":"Các thông tư của Bộ Tài chính về hải quan, đơn vị sự nghiệp và phí, cùng nghị định về kinh doanh vàng và luật liên quan đến ngân hàng. Dùng để trả lời câu hỏi về phí và thủ tục cho đơn vị.","notes":["Thông tư 154/2026 chưa đọc được số ngày ban hành: kiểm lại trên tệp gốc."]},{"id":"tthc","name":"Thủ tục hành chính 2026","pin":false,"last":"25/10","docs":["24/2026/QH16","21/2026/QH16","385/2026/NĐ-CP","384/2026/NĐ-CP","61/2026/TT-BKHCN"],"ctx":"Luật và nghị định mới về đầu tư, điều kiện kinh doanh và kiểm soát thủ tục hành chính.","notes":[]},{"id":"do-thi","name":"Phát triển đô thị","pin":false,"last":"Vừa tạo","docs":[],"ctx":"","notes":[]}],"risks":[{"id":"r1","note":"Cho mượn hay cho thuê giấy chứng nhận kinh doanh xổ số là bị phạt nặng. Rà lại hợp đồng với các đại lý.","st":"xu_ly","src":"tay","scope":"chung","date":"12/10","file":null,"doc":"389/2026/NĐ-CP","path":"D7.K2","addr":"Khoản 2 Điều 7","quote":"Phạt tiền từ 120.000.000 đồng đến 160.000.000 đồng đối với hành vi cho mượn, cho thuê hoặc chuyển nhượng Giấy chứng nhận đủ điều kiện kinh doanh xổ số.","page":5,"uid":1843},{"id":"r2","note":"Không dùng vốn hay tài sản của nhà nước để mua vé xổ số (quỹ cơ quan, quỹ đơn vị).","st":"da","src":"tay","scope":"chung","date":"14/10","file":null,"doc":"389/2026/NĐ-CP","path":"D11.K2","addr":"Khoản 2 Điều 11","quote":"Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với hành vi sử dụng vốn và tài sản của nhà nước đề tham gia mua vé xổ số.","page":7,"uid":1879},{"id":"r3","note":"Bán vé cho người không được phép tham gia đặt cược.","st":"xu_ly","src":"tep","scope":"chung","date":"20/10","file":"tom-tat-rui-ro-dat-cuoc.docx","doc":"391/2026/NĐ-CP","path":"D12.K1","addr":"Khoản 1 Điều 12","quote":"Phạt tiền từ 130.000.000 đồng đến 150.000.000 đồng đối với hành vi bán vé đặt cược cho các đối tượng không được phép tham gia đặt cược.","page":10,"uid":2186},{"id":"r4","note":"Cho người chơi vay tiền để chơi là vi phạm; nhắc điểm kinh doanh trong dự án này.","st":"xu_ly","src":"tay","scope":"xo-so","date":"21/10","file":null,"doc":"391/2026/NĐ-CP","path":"D12.K2","addr":"Khoản 2 Điều 12","quote":"Phạt tiền từ 160.000.000 đồng đến 180.000.000 đồng đối với hành vi cho người chơi vay tiền để tham gia đặt cược.","page":10,"uid":2187},{"id":"r5","note":"Ti const secsOf = k => D.text[k] || [];

function foldMap(t) {
