  const find = empty ? '' : `<p class="find" ${ph('P4')}><b>Cần chú ý:</b> <button type="button" class="link" data-a="goLedger" data-f="xu_ly"><span class="num">${open.length}</span> rủi ro cần xử lý</button> · <button type="button" class="link" data-a="goDocs" data-f="chua_co"><span class="num">${nHL}</span> văn bản chưa có hiệu lực</button> · <button type="button" class="link" data-a="goDocs" data-f="missing"><span class="num">${mg.length}</span> văn bản được nhắc tới mà chưa có trong kho</button></p>`;
  const hist = HIST[p.id] || [];
  return `<div class="col"><div class="title-row"><div><h1>${esc(p.name)}</h1><p class="sub num">${p.docs.length} văn bản · ${mine.length} rủi ro · cập nhật hôm nay 09:14</p></div>
    <div class="acts"><button type="button" class="btn" data-a="addDocs">${ic('plus')}Thêm vào dự án từ kho</button><button type="button" class="btn" data-a="goLedger">${ic('flag')}Mở sổ rủi ro</button></div></div>
    ${find}
    ${empty ? `<div class="sec">${emptyNone('Dự án chưa có văn bản', 'Một văn bản có thể ở nhiều dự án; bỏ khỏi dự án không xoá văn bản. Thêm từ kho, chọn theo thẻ, hoặc nạp tệp mới từ máy.', `<button type="button" class="btn primary" data-a="addDocs">Thêm vào dự án từ kho</button><button type="button" class="btn" data-a="addFile">Nạp tệp từ máy</button><button type="button" class="btn" data-a="addByTag" data-t="${sugTag[0]}">Chọn theo thẻ #${esc(sugTag[0])} (${sugTag[1]} văn bản)</button>`)}</div>` : `
    <div class="pgrid">
      <div>
        <section class="sec" style="margin-top:14px" aria-labelledby="h-open" ${ph('P2')}><div class="sec-h"><h2 id="h-open">Rủi ro đang mở <span class="num">(${Math.min(5, open.length)} trên ${open.length})</span></h2><button type="button" class="link" data-a="goLedger">Xem sổ rủi ro (${mine.length})</button></div>
        ${open.length ? `<div class="panel">${rows(open.slice(0, 5), r => `<li><button type="button" class="prow" data-a="goLedger" data-open="${r.id}"><span class="t">${esc(r.note)}</span><span class="s">${r.unlinked ? 'Chưa gắn điều luật' : esc(r.addr + ' · ' + r.doc)}</span>${pillOf(docs.get(r.doc).st)}</button></li>`)}</div>` : '<p class="none" style="margin:0">Không có rủi ro nào cần xử lý.</p>'}</section>
        <section class="sec" aria-labelledby="h-docs"><div class="sec-h"><h2 id="h-docs">Văn bản trong dự án <span class="num">(${Math.min(6, p.docs.length)} trên ${p.docs.length})</span></h2><button type="button" class="link" data-a="goDocs">Xem cả ${p.docs.length}</button></div>
        <div class="panel">${rows(p.docs.slice(0, 6), k => { const d = docs.get(k); return `<li><button type="button" class="prow" data-a="open" data-k="${esc(k)}"><span class="t">${esc(LOAI[d.l])} ${esc(d.k)}</span><span class="s">${esc(d.title)}</span>${pillOf(d.st)}</button></li>`; })}</div></section>
      </div>
      <div>
        <section class="sec" style="margin-top:14px" aria-labelledby="h-ctx" ${ph('P3')}><div class="sec-h"><h2 id="h-ctx">Bối cảnh và ghi chú dự án</h2><span class="meta">ví dụ</span></div>
          <label class="sr" for="ctx">Bối cảnh dự án</label><textarea class="ctx" id="ctx" maxlength="2000">${esc(p.ctx)}</textarea>
          <div class="ctx-f"><span>Máy đọc phần này mỗi khi trả lời trong dự án này (khi bật AI).</span><span class="num" id="ctxN">${p.ctx.length} / 2.000</span></div>
          <ul class="pnotes" aria-label="Ghi chú dự án">${p.notes.map((n, i) => `<li><span>${esc(n)}</span><button type="button" class="icon-btn" data-a="delPNote" data-i="${i}" aria-label="Xoá ghi chú: ${esc(n.slice(0, 40))}">${ic('x', 14)}</button></li>`).join('')}</ul>
          <div class="pn-add"><label class="sr" for="pnote">Ghi chú mới cho dự án</label><input type="text" id="pnote" placeholder="Thêm một ghi chú cho dự án"><button type="button" class="btn sm" data-a="addPNote">Thêm</button></div></section>
        <section class="sec" aria-labelledby="h-conv"><div class="sec-h"><h2 id="h-conv">Cuộc trò chuyện gần đây <span class="num">(${hist.length})</span></h2></div>
          ${hist.length ? `<div class="panel">${rows(hist, x => `<li><button type="button" class="prow" data-a="ask" data-q="${esc(x[2])}"><span class="t">${esc(x[1])}</span></button></li>`)}</div>` : '<p class="meta">Chưa có cuộc trò chuyện.</p>'}</section>
        <section class="sec" aria-labelledby="h-miss" ${ph('P4')}><div class="sec-h"><h2 id="h-miss">Chưa có trong kho <span class="num">(${mg.length})</span></h2><button type="button" class="link" data-a="addFile">Nạp tệp</button></div>
          <div class="panel">${rows(mg.slice(0, 4), o => { const g = ghosts.get(o.k); return `<li><div class="prow" style="cursor:default"><span class="t">${esc(g.s)}</span><span class="s">${esc(g.nm || g.title)} · nhắc ${o.by.size} lần trong dự án</span><button type="button" class="btn sm" data-a="addFileFor" data-k="${esc(o.k)}">Nạp tệp</button></div></li>`; })}</div>
          ${mg.length > 4 ? `<p class="meta" style="margin-top:6px">và ${mg.length - 4} văn bản khác, xếp theo mức ảnh hưởng tới hiệu lực. <button type="button" class="link" data-a="goDocs" data-f="missing">Xem đủ</button></p>` : ''}</section>
      </div>
    </div>`}</div>`;
}

/* ---------- Màn: kết quả tra từ khoá và câu trả lời xem trước ---------- */
const isAIQ = q => fold(q) === fold(D.ans.q);
function threadHTML() {
  const T = S.thread, q = T.q, p = scopeProj();
  const scopeLine = (n, extra) => `<p class="scopeline"><span class="pen-chip">${ic('folder', 12)}${p ? esc(p.name) : 'Toàn kho'}</span>${S.chips.map(c => `<span class="pen-chip">${c.t === 'doc' ? esc(docs.get(c.k).s) : '#' + esc(c.k)}</span>`).join('')}<span class="num">Dựa trên ${n} văn bản${extra || ''}</span></p>`;
  const qb = `<div class="q"><p>${esc(q)}</p></div>`;
  const keys = chipKeys();
  if (isAIQ(q)) {
    const A = D.ans, scopeNm = p ? 'dự án «' + esc(p.name) + '»' : 'Toàn kho';
    if (!keys.includes(A.doc)) return `<div class="col"><div class="title-row"><div><h1>${esc(q)}</h1></div></div><div class="thread">${qb}<div>${scopeLine(keys.length)}${emptyNone(`Không tìm thấy trong phạm vi này (${scopeNm}, ${keys.length} văn bản)`, 'Không dùng trí nhớ của mô hình để lấp chỗ trống.', `<button type="button" class="btn" data-a="widen">Mở rộng ra Toàn kho (1 văn bản có khớp)</button>`)}</div></div></div>`;
    const dd = docs.get(A.doc), used = A.used.map(id => risks.find(r => r.id === id));
    // một danh sách nguồn duy nhất: chip [n] ở tóm tắt, hàng "Bạn đã ghi" và khung "Điều luật liên quan" dùng chung số thứ tự
    const refs = A.cites.map(c => ({ ...c }));
    for (const r of used) if (!refs.some(c => c.path === r.path)) refs.push({ doc: r.doc, path: r.path, addr: r.addr, quote: r.quote, page: r.page });
    const nOf = r => refs.findIndex(c => c.path === r.path) + 1, nHLa = keys.filter(k => docs.get(k).st === 'chua_co').length;
    const SUBJ = ['đại lý', 'doanh nghiệp', 'cá nhân', 'tổ chức'];   // chủ thể nêu trong câu tóm tắt mà đoạn trích không có thì đánh dấu "chưa kiểm"
    const say = A.say.map(t => `<p class="ai-say">${esc(t).replace(/\[(\d)\]/g, (m, n, off, str) => { const c = refs[n - 1], sent = str.slice(0, off).split(/[.;]\s/).pop(), sub = SUBJ.find(s => fold(sent).includes(fold(s)) && !fold(c.quote).includes(fold(s))); return chipSrc(n, c.doc, c.path) + (sub ? `<span class="unv">chưa kiểm: đoạn trích không nêu “${sub}”</span>` : ''); })}</p>`).join('');
    return `<div class="col"><div class="title-row"><div><h1>${esc(q)}</h1><p class="sub">Bản xem trước câu trả lời AI (chưa chạy mô hình)</p></div></div>
    <div class="thread">${qb}<div class="ai">${scopeLine(keys.length, `, đã đọc ${keys.length}/${keys.length}. ${nHLa} chưa có hiệu lực (vẫn hiện, có đánh dấu)`)}
      <p class="find"><b>${refs.length} đoạn khớp · ${used.length} ghi chú của bạn${dd.st === 'chua_co' ? ` · ${esc(shortOf(dd.k))} chưa có hiệu lực, từ ${fd(dd.nhl)}` : ''}</b></p>
      <p style="margin:8px 0 0"><span class="mlabel" ${ph('P3')}>Tóm tắt (do máy viết)</span></p>${say}
      <h2 class="sec-h" style="margin:18px 0 0;font-size:15px"><span>Bạn đã ghi (${used.length})</span></h2>${used.map(r => riskRow(r, { n: nOf(r) })).join('')}
      <div class="basisbox" style="margin-top:18px"><h2 style="margin:0 0 4px;font-size:15px;font-weight:600">Điều luật liên quan <span class="mlabel">Đoạn có thật trong kho</span></h2>${ocrNote(dd.k)}
      ${refs.map((c, i) => `<div class="quote"><span class="n num">${i + 1}</span><div><p class="lab" style="margin:0"><b style="color:var(--text)">${esc(c.addr)}</b> · ${esc(docs.get(c.doc).k)}</p><p>${esc(c.quote)}</p><p class="lab">${ic('check', 12)} Đoạn có thật trong kho. Chưa kiểm chủ thể và điều kiện áp dụng · <button type="button" class="go" data-a="open" data-k="${esc(c.doc)}" data-path="${esc(c.path)}">Mở tại đoạn này</button></p></div></div>`).join('')}
      <p class="meta" style="margin:8px 0 0">Dấu tick chỉ nghĩa là đoạn này có thật trong văn bản. Bạn vẫn cần đọc để biết có đủ để kết luận.</p></div>
      <details class="verify" ${ph('P3')}><summary>Kiểm tra hiệu lực: ${refs.length} đoạn trong ${new Set(refs.map(c => c.doc)).size} văn bản · ${nHLa} văn bản chưa có hiệu lực</summary><ul><li>${esc(dd.k)}: ${esc(reasonOf(dd.k))}</li></ul></details>
      <div class="used" ${ph('P3')}>Đã dùng: ${p ? `<span class="pen-chip">${ic('pen', 12)}Bối cảnh dự án</span>` : ''}<button type="button" class="pen-chip" data-a="openNotes" data-k="${esc(A.doc)}" style="border:0;cursor:pointer">${ic('pen', 12)}${used.length} ghi chú của bạn</button><span class="pen-chip">${keys.length} văn bản trong phạm vi</span></div>
      <div class="used"><button type="button" class="btn sm" data-a="toast" data-m="Đã lưu mã đơn vị của ${refs.length} điều luật vào ghi chú (mô phỏng)">Lưu vào ghi chú</button><button type="button" class="btn sm" disabled>Xuất Word (P5)</button></div></div></div></div>`;
  }
  const L = lookup(q), nHL = new Set(L.notes.filter(r => docs.get(r.doc).st === 'chua_co').map(r => r.doc)).size;
  const shown = L.groups.slice(0, 4);
  const none = !L.notes.length && !L.groups.length;
  const scopeName = p ? 'dự án «' + esc(p.name) + '»' : 'Toàn kho';
  let body = '';
  if (none) {
    body = emptyNone(`Không tìm thấy trong phạm vi này (${scopeName}, ${L.n} văn bản)`, `Không có ghi chú rủi ro hay điều luật nào khớp “${esc(q)}”. Không dùng trí nhớ của mô hình để lấp chỗ trống.`,
      (L.outside.length ? `<button type="button" class="btn" data-a="widen">Mở rộng ra Toàn kho (${L.outside.length} văn bản có khớp)</button>` : '') + `<button type="button" class="btn text" data-a="addFile">Nạp tệp</button>`);
  } else {
    body += `<p class="find"><b>${L.notes.length ? `Bạn đã ghi ${L.notes.length} rủi ro cho “${esc(q)}”, ${todo(L.notes)} còn cần xử lý.` : `Chưa có ghi chú rủi ro nào cho “${esc(q)}”.`}</b>${nHL ? ` ${nHL} văn bản chưa có hiệu lực.` : ''} Có ${L.total} đoạn luật khớp từ khoá.</p>`;
    if (L.notes.length) body += `<section class="sec" aria-labelledby="g-you" ${ph('P2')}><div class="sec-h" style="margin:0"><h2 id="g-you">Bạn đã ghi <span class="num">(${L.notes.length})</span></h2><span class="meta">đứng trên điều luật, không cần AI</span></div>${L.notes.slice(0, 3).map((r, i) => riskRow(r, { fq: L.fq, n: i + 1 })).join('')}${L.notes.length > 3 ? `<p class="meta" style="margin-top:8px">và ${L.notes.length - 3} ghi chú khác trong <button type="button" class="link" data-a="goLedger">Sổ rủi ro</button></p>` : ''}</section>`;
    if (L.groups.length) body += `<section class="sec" aria-labelledby="g-law"><div class="sec-h" style="margin:0"><h2 id="g-law">Điều luật khớp từ khoá, chưa có ghi chú <span class="num">(${L.groups.reduce((a, g) => a + g[1].length, 0)})</span></h2><span class="meta">${shown.length} trên ${L.groups.length} văn bản · đoạn nêu mức phạt hoặc điều cấm xếp trước</span></div>
      ${shown.map(([k, hs]) => `<div class="grp ${docs.get(k).st === 'chua_ro' ? '' : ''}">${groupHead(k, hs.length)}${hs.slice(0, 2).map(x => `<div class="item"><button type="button" class="addr" data-a="open" data-k="${esc(k)}" data-path="${esc(x.path)}">${esc(addrOf(x.path))}</button><p class="snip">${markText(x.t, L.fq, 280)}</p>
        <div class="item-f"><button type="button" class="go" data-a="open" data-k="${esc(k)}" data-path="${esc(x.path)}">Mở tại đoạn này</button><button type="button" class="quiet" data-a="addRisk" data-k="${esc(k)}" data-path="${esc(x.path)}" ${ph('P2')}>Thêm vào sổ rủi ro</button></div></div>`).join('')}${hs.length > 2 ? `<div class="item"><button type="button" class="link" data-a="open" data-k="${esc(k)}" data-path="${esc(hs[2].path)}">Xem thêm ${hs.length - 2} kết quả trong văn bản này</button></div>` : ''}</div>`).join('')}</section>`;
    else if (L.notes.length) body += '';
    if (!L.notes.length) body += `<p class="cap meta" style="margin-top:14px">Chưa có ghi chú rủi ro nào khớp. Bấm “Thêm vào sổ rủi ro” ở một điều luật, hoặc <button type="button" class="link" data-a="importFile">nhập tệp tóm tắt rủi ro của bạn</button>.</p>`;
    const dset = new Set([...L.notes.map(r => r.doc), ...L.groups.map(g => g[0])]);
    body += `<p class="basis" style="margin-top:16px">Kiểm tra hiệu lực: ${[...dset].map(k => `${esc(docs.get(k).s)} · ${VS[docs.get(k).st][0].toLowerCase()}`).join('; ')}. ${esc(BASIS())}</p>`;
  }
  return `<div class="col"><div class="title-row"><div><h1>Tra rủi ro: ${esc(q)}</h1></div></div>
    <div class="thread">${qb}<div>${scopeLine(L.n)}${body}</div></div></div>`;
}

/* ---------- Màn: Sổ rủi ro ---------- */
function ledgerHTML() {
  const p = scopeProj(), list = risksIn();
  const cnt = { xu_ly: list.filter(r => r.st === 'xu_ly').length, da: list.filter(r => r.st === 'da').length, unl: list.filter(r => r.unlinked).length, rev: list.filter(r => r.review).length };
  const f = S.ledgerFilter;
  const vis = list.filter(r => !f || (f === 'xu_ly' && r.st === 'xu_ly') || (f === 'da' && r.st === 'da') || (f === 'unl' && r.unlinked) || (f === 'rev' && r.review));
  const strip = [['xu_ly', 'Cần xử lý'], ['da', 'Đã xử lý'], ['unl', 'Chưa gắn điều luật'], ['rev', 'Cần xem lại']];
  const empty = !list.length;
  const row = r => {
    const d = docs.get(r.doc), open = S.ledgerOpen === r.id;
    return `<tr class="row" ><td class="first"><button type="button" class="rowb" data-a="ledgerOpen" data-id="${r.id}" aria-expanded="${open}">${esc(r.note)}</button><div class="meta">${r.src === 'tep' ? 'Bạn ghi (từ tệp)' : 'Bạn ghi'} · ${r.scope === 'chung' ? 'Mọi dự án' : 'Chỉ dự án «' + esc(proj(r.scope).name) + '»'}</div></td>
      <td class="sec2">${r.unlinked ? '<span class="dash">—</span> Chưa gắn điều luật' : `<b>${esc(r.addr)}</b><div class="tt">${esc(r.quote)}</div>`}</td>
      <td class="hide-s nw">${pillOf(d.st)}</td><td class="hide-s nw">${esc(d.s)}</td>
      ${S.scope === 'all' ? `<td class="hide-s">${projsOf(r.doc).map(x => esc(x.name)).join(', ') || '<span class="dash">—</span>'}</td>` : ''}
      <td class="end nw"><button type="button" class="stt" data-a="toggleRisk" data-id="${r.id}" data-v="${r.st}" aria-label="Trạng thái: ${r.st === 'xu_ly' ? 'Cần xử lý' : 'Đã xử lý'}. Bấm để đổi sang ${r.st === 'xu_ly' ? 'Đã xử lý' : 'Cần xử lý'}">${r.st === 'xu_ly' ? 'Cần xử lý' : 'Đã xử lý'}</button></td></tr>
      ${open ? `<tr class="ex-row"><td colspan="7">${riskRow(r, { n: 1 })}</td></tr>` : ''}`;
  };
  return `<div class="col" style="width:min(100%,1180px)"><div class="title-row"><div><h1>Sổ rủi ro</h1><p class="sub num">${p ? 'Dự án «' + esc(p.name) + '»' : 'Toàn kho'} · ${list.length} rủi ro</p></div>
    <div class="acts"><button type="button" class="btn" data-a="newRisk">${ic('plus')}Thêm rủi ro</button><button type="button" class="btn" data-a="importFile">${ic('upload')}Nhập từ tệp tóm tắt</button><button type="button" class="btn" data-a="toast" data-m="Xuất Excel: bản thử không tạo tệp">Xuất Excel</button></div></div>
    ${empty ? `<div class="sec">${emptyNone('Chưa có rủi ro nào', 'Chọn một đoạn trong văn bản rồi bấm “Thêm vào sổ rủi ro”, hoặc nhập tệp của bạn.', `<button type="button" class="btn primary" data-a="importFile">Nhập từ tệp tóm tắt</button><button type="button" class="btn" data-a="goDocs">Mở văn bản</button>`)}</div>` : `
    <div class="sec" style="margin-top:16px"><div class="stripline" role="group" aria-label="Lọc theo trạng thái" ${ph('P2')}>${strip.map(([k, l]) => `<button type="button" data-a="ledgerFilter" data-f="${k}" aria-pressed="${f === k}"><b class="num">${cnt[k]}</b><span>${l}</span></button>`).join('')}</div>
    ${f ? '<p style="margin:8px 0 0"><button type="button" class="link" data-a="ledgerFilter" data-f="">Bỏ lọc</button></p>' : ''}</div>
    <div class="sec" style="margin-top:12px"><div class="tblwrap"><table class="tbl"><caption class="sr">Sổ rủi ro</caption><thead><tr><th scope="col">Rủi ro (lời bạn)</th><th scope="col">Điều luật</th><th scope="col">Hiệu lực</th><th scope="col">Văn bản</th>${S.scope === 'all' ? '<th scope="col">Dự án</th>' : ''}<th scope="col">Trạng thái</th></tr></thead><tbody>${vis.map(row).join('')}</tbody></table></div>
    <p class="basis">Bạn ghi và Luật quy định tách cột khi xuất; ngày xuất và hiệu lực theo kho. ${esc(BASIS())}</p></div>`}</div>`;
}

/* ---------- Màn: Văn bản (danh sách, bản đồ dự án) ---------- */
function docsHTML() {
  const p = scopeProj(), keys = scopeKeys(), f = S.docsFilter;
  const nRisk = k => risks.filter(r => r.doc === k && r.st === 'xu_ly').length, nNote = k => risks.filter(r => r.doc === k).length;

    case 'Escape': { e.preventDefault(); const sel = inR ? S.reader.rel.sel : S.mapSel; if (sel) { if (inR) { S.reader.rel.sel = null; rerenderRel(g.dataset.k); } else { S.mapSel = null; render(); } } else { const t = inR ? $('#reader [data-a=relView][data-v=graph]') : $('#main [data-a=docsView][data-v=map]'); if (t) t.focus(); } e.stopPropagation(); break; }
  }
}

/* ---------- Ô hỏi: @ và # ---------- */
let pickState = null;
function updatePick(t) {
  const host = $('#pickHost'); const pos = t.selectionStart, m = /(^|\s)([@#])([^\s@#]*)$/.exec(t.value.slice(0, pos));
  if (!m) { pickState = null; host.innerHTML = ''; return; }
  const q = fold(m[3]), at = m[2] === '@';
  const items = at ? scopeKeys().filter(k => !S.chips.some(c => c.t === 'doc' && c.k === k)).filter(k => !q || fold(k + ' ' + docs.get(k).title + ' ' + LOAI[docs.get(k).l]).includes(q)).slice(0, 6).map(k => ({ k, t: `${LOAI[docs.get(k).l]} ${k}`, s: docs.get(k).title, st: docs.get(k).st }))
    : [...new Set(scopeKeys().flatMap(k => docs.get(k).tags))].filter(x => !S.chips.some(c => c.t === 'tag' && c.k === x) && (!q || fold(x).includes(q))).slice(0, 6).map(x => ({ k: x, t: '#' + x, s: scopeKeys().filter(k => docs.get(k).tags.includes(x)).length + ' văn bản' }));
  pickState = { at, items, i: 0, start: pos - m[3].length - 1 };
  host.innerHTML = items.length ? `<div class="pick-list" role="listbox" aria-label="${at ? 'Chọn văn bản' : 'Chọn thẻ'}">${items.map((x, i) => `<button type="button" role="option" id="pk${i}" aria-selected="${i === 0}" data-a="pickPick" data-i="${i}"><span class="t">${esc(x.t)}</span><span class="s">${esc(x.s)}</span>${x.st ? pillOf(x.st) : ''}</button>`).join('')}</div>` : `<div class="pick-list"><p class="meta" style="margin:8px 10px">Không có ${at ? 'văn bản' : 'thẻ'} nào khớp trong phạm vi.</p></div>`;
}
function takePick(i) {
  const t = $('#qin'), it = pickState.items[i]; if (!it) return;
  S.chips.push({ t: pickState.at ? 'doc' : 'tag', k: it.k }); t.value = t.value.slice(0, pickState.start) + t.value.slice(t.selectionStart); pickState = null; render(); const q = $('#qin'); q.focus(); q.setSelectionRange(pickState ? 0 : q.value.length, q.value.length);
}
acts.pickPick = el => takePick(+el.dataset.i);

/* ---------- Sự kiện ---------- */
document.addEventListener('click', e => {
  const sw = $('.swp'); if (S.sw && sw && !sw.contains(e.target) && !e.target.closest('[data-a=openSw],#swBtn,#pjBtn')) { S.sw = false; renderLayer(); }
  if (e.target.closest('#swBtn, #pjBtn')) { S.sw = !S.sw; S.swFocus = true; renderLayer(); const b = $('#swBtn'); if (b) b.setAttribute('aria-expanded', S.sw); return; }
  const g = e.target.closest('.gn');

  if (el.closest('#side')) { $('#side').classList.remove('open'); $('#sideScrim').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }
  const f = acts[el.dataset.a]; if (f) { if (el.tagName === 'A') e.preventDefault(); f(el, e); }
  const sb = $('.selbar'); if (sb) sb.remove();
});
document.addEventListener('dblclick', e => { const g = e.target.closest('#reader .gn'); if (g && !g.dataset.k.startsWith('more:')) { e.preventDefault(); acts.relCenter({ dataset: { k: g.dataset.k } }); } });
document.addEventListener('change', e => {
  const t = e.target;

  else if (t.dataset.kind && t.closest('.detail')) { const ed = edges.find(x => ek(x) === t.dataset.kind); ed.k = t.value; ed.src = 'user'; toast('Đã đổi loại: ' + KIND[ed.k]); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'qin') { autoGrow(t); $('#sendBtn').disabled = !t.value.trim(); updatePick(t); }
  else if (t.id === 'ctx') { const p = scopeProj(); p.ctx = t.value; $('#ctxN').textContent = t.value.length.toLocaleString('vi-VN') + ' / 2.000'; }
  else if (t.id === 'swQ') { S.swQ = t.value; renderLayer(); const i = $('#swQ'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  else if (t.id === 'histQ') { const q = fold(t.value); $$('#side .hrow').forEach(b => b.hidden = !!q && !fold(b.textContent).includes(q)); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.id === 'pnote' && e.key === 'Enter') { e.preventDefault(); acts.addPNote(); return; }
  if (t.closest && t.closest('.swp') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { const it = $$('.swp input, .swp .swr'), i = it.indexOf(t); if (i >= 0) { e.preventDefault(); it[(i + (e.key === 'ArrowDown' ? 1 : -1) + it.length) % it.length].focus(); return; } }   // mũi tên đi giữa các dòng của bộ chuyển
  if (t.id === 'qin') {
    if (pickState && pickState.items.length) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pickState.i = (pickState.i + (e.key === 'ArrowDown' ? 1 : -1) + pickState.items.length) % pickState.items.length; $$('#pickHost [role=option]').forEach((b, i) => b.setAttribute('aria-selected', i === pickState.i)); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); takePick(pickState.i); return; }
    }
    if (e.key === 'Escape' && pickState) { pickState = null; $('#pickHost').innerHTML = ''; return; }
    if (e.key === 'Backspace' && !t.value && S.chips.length) { S.chips.pop(); render(); const q = $('#qin'); if (q) q.focus(); return; }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(t.value); return; }
  }
  const cv = t.closest && t.closest('.canvas'); if (cv && t.closest('.gn')) { gKey(e, cv); if (e.defaultPrevented) return; }
  if (e.key === 'Enter' && t.matches && t.matches('a.addr[role=button]')) { t.click(); }
  if (e.altKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); acts.newChat(); }
  if (e.altKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); S.sw = !S.sw; S.swFocus = true; renderLayer(); }
  if (e.key === 'Escape') {
    if (pvEl) return hidePv(); const sb = $('.selbar'); if (sb) return sb.remove();
    if (S.sw) { S.sw = false; renderLayer(); const b = $('#swBtn') || $('#pjBtn'); b && b.focus(); return; }
    if (S.reader && !$('.scrim')) { closeReader(); }
  }
});
document.addEventListener('submit', e => e.preventDefault());
// rê chuột và focus vào [n] và nút sơ đồ
document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const p = e.target.closest('[data-pv]'); if (p && !matchMedia('(hover: none)').matches) showPv(p); const g = e.target.closest('.gn'); if (g) gHover(g, true); });
document.addEventListener('pointerout', e => { const p = e.target.closest('[data-pv]'); if (p && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.pv'))) { clearTimeout(pvT); setTimeout(() => { if (pvEl && !pvEl.matches(':hover')) hidePv(); }, 120); } const g = e.target.closest('.gn'); if (g && !(e.relatedTarget && g.contains(e.relatedTarget))) gHover(g, false); });
document.addEventListener('focusin', e => { const p = e.target.closest && e.target.closest('[data-pv]'); if (p) showPv(p); const g = e.target.closest && e.target.closest('.gn'); if (g) { gHover(g, true); const cv = g.closest('.canvas'), L = cv && cv.closest('#reader') ? LASTR : LASTM; if (L) { const o = graphOrder(L); $('#live').textContent = `Nút ${o.indexOf(g.dataset.k) + 1} trên ${o.length}`; } } });
document.addEventListener('focusout', e => { const p = e.target.closest && e.target.closest('[data-pv]'); if (p) { clearTimeout(pvT); setTimeout(() => { if (pvEl && !pvEl.matches(':hover')) hidePv(); }, 120); } const g = e.target.closest && e.target.closest('.gn'); if (g) gHover(g, false); });
// Ctrl+cuộn để thu phóng, kéo để dịch chuyển (chỉ bổ sung)
document.addEventListener('wheel', e => { const cv = e.target.closest && e.target.closest('.canvas'); if (cv && e.ctrlKey) { e.preventDefault(); acts.gZoom({ closest: () => cv.closest('#reader'), dataset: { v: e.deltaY < 0 ? 1 : -1 } }); } }, { passive: false });
let pan = null;
document.addEventListener('pointerdown', e => { const cv = e.target.closest && e.target.closest('.canvas'); if (cv && !e.target.closest('.gn, .hit') && e.button === 0) pan = { cv, x: e.clientX, y: e.clientY, l: cv.scrollLeft, t: cv.scrollTop }; });
document.addEventListener('pointermove', e => { if (pan) { pan.cv.scrollLeft = pan.l - (e.clientX - pan.x); pan.cv.scrollTop = pan.t - (e.clientY - pan.y); } });
document.addEventListener('pointerup', () => { pan = null; });
// bôi chọn một đoạn trong trình đọc
document.addEventListener('mouseup', e => {
  const tx = e.target.closest && e.target.closest('#rdText'); if (!tx) return;
  setTimeout(() => {
    const s = getSelection(); $$('.selbar').forEach(x => x.remove()); if (!s || s.isCollapsed || s.toString().trim().length < 4) return;
    const u = (s.anchorNode.nodeType === 3 ? s.anchorNode.parentElement : s.anchorNode).closest('.u'); if (!u) return; const r = s.getRangeAt(0).getBoundingClientRect();
    const b = document.createElement('div'); b.className = 'selbar'; b.setAttribute('role', 'toolbar'); b.setAttribute('aria-label', 'Việc với đoạn đã chọn');
    b.innerHTML = `<button type="button" data-a="toast" data-m="Ghi chú đoạn: ngoài phạm vi bản thử">Ghi chú</button><button type="button" data-a="addRisk" data-k="${esc(S.reader.k)}" data-path="${esc(u.dataset.path)}">Thêm vào sổ rủi ro</button><button type="button" data-a="copyCite" data-k="${esc(S.reader.k)}" data-path="${esc(u.dataset.path)}">Sao chép trích dẫn</button>`;
    $('#layer').append(b); b.style.left = Math.max(8, Math.min(innerWidth - b.offsetWidth - 8, r.left)) + 'px'; b.style.top = Math.max(8, r.top - 44) + 'px';
  }, 0);
});
$('#menuBtn').addEventListener('click', () => { const o = !$('#side').classList.contains('open'); $('#side').classList.toggle('open', o); $('#sideScrim').classList.toggle('open', o); $('#menuBtn').setAttribute('aria-expanded', o); });
$('#sideScrim').addEventListener('click', () => { $('#side').classList.remove('open'); $('#sideScrim').classList.remove('open'); });
$('#rdScrim').addEventListener('click', () => closeReader());
$('#phToggle').addEventListener('change', e => document.body.classList.toggle('ph', e.target.checked));
function applyTheme(t) { S.theme = t; if (t) document.documentElement.setAttribute('data-theme', t); $('#themeLbl').textContent = t === 'dark' ? 'Sáng' : 'Tối'; }
$('#themeToggle').addEventListener('click', () => applyTheme(S.theme === 'dark' ? 'light' : 'dark'));
applyTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
window.addEventListener('resize', () => { if (S.sw) renderLayer(); });

/* ---------- Kiểm tra dữ liệu và đo tốc độ ---------- */
// cạnh "cùng căn cứ": hai văn bản trong kho cùng nêu từ 3 văn bản trở lên (tính từ dữ liệu căn cứ, dẫn chiếu có sẵn; không phải quan hệ pháp lý)
(() => { const tg = new Map(D.docs.map(d => [d.k, new Set(edges.filter(e => e.s === d.k && e.k !== 'tuong_tu').map(e => e.t))])), ks = [...tg.keys()];
  for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) { const sh = [...tg.get(ks[i])].filter(x => tg.get(ks[j]).has(x)); if (sh.length >= 3) edges.push({ s: ks[i], t: ks[j], k: 'cung_can_cu', l: 'cùng căn cứ ' + sh.length, src: 'calc', ev: `Cùng nêu ${sh.length} văn bản: ${sh.slice(0, 5).map(shortOf).join(', ')}${sh.length > 5 ? '…' : ''}.`, u: null, n: sh.length }); } })();
console.assert(D.docs.every(d => d.k && d.title), 'mỗi văn bản có số hiệu và trích yếu');
console.assert(D.edges.every(e => nodeOf(e.s) && nodeOf(e.t)), 'mọi cạnh có hai đầu');
console.assert(D.risks.every(r => docs.has(r.doc)), 'mọi rủi ro trỏ tới văn bản có trong kho');
console.assert(D.risks.filter(r => r.path).every(r => { const f = findPara(r.doc, r.path); return f && f.p && f.p[2].startsWith(r.quote.replace(/…$/, '').slice(0, 40)); }), 'trích dẫn rủi ro khớp nguyên văn đoạn trong kho');
window.__S = S;
window.__bench = n => {
  n = n || 200; const made = [];
  const mk = (i, t) => { const k = 'x' + i + '/2020/NĐ-CP'; ghosts.set(k, { k, s: 'NĐ ' + i + '/2020', l: 'nghi_dinh', t: t, y: 2000 + (i % 26), nm: '', m: 1, st: 'chua_ro', why: '', title: 'x' }); made.push(k); return k; };
  const c = mk(0, 1); const keys = [c]; for (let i = 1; i < n; i++) keys.push(mk(i, i % 3));
  const es = []; for (let i = 1; i < n; i++) es.push({ s: keys[i], t: keys[i < 40 ? 0 : i % 40], k: ['can_cu', 'sua_doi', 'dan_chieu', 'huong_dan'][i % 4], l: '', src: 'doc', ev: '', u: null, n: 1 });
  const M = { c, nodes: keys.map((k, i) => ({ k, d: i ? 1 : 0, cl: ['L', 'R', 'B'][i % 3], w: nodeW(k), h: i ? 28 : 36 })), edges: es };
  const t0 = performance.now(); layoutEgo(M); const html = svgOf(M, { zoom: 1 }); const ms1 = performance.now() - t0;
  const t3 = performance.now(); const dv = document.createElement('div'); dv.innerHTML = html; document.body.append(dv); dv.getBoundingClientRect(); const msDom = performance.now() - t3; dv.remove();
  const FN = keys.map(k => ({ k, w: 100, h: 28 })); const t1 = performance.now(); forceLayout(FN, es, 7, 940); const ms2 = performance.now() - t1;
  const F60 = keys.slice(0, 60).map(k => ({ k, w: 100, h: 28 })); const t2 = performance.now(); forceLayout(F60, es.filter(e => keys.indexOf(e.s) < 60 && keys.indexOf(e.t) < 60), 7, 940); const ms3 = performance.now() - t2;
  made.forEach(k => ghosts.delete(k));
  return { nodes: n, domInsertAndLayoutMs: +msDom.toFixed(1), tierAndSvgMs: +ms1.toFixed(1), svgBytes: html.length, force200Ms: +ms2.toFixed(1), force60Ms: +ms3.toFixed(1) };
};

window.__layoutHash = () => { const R = { k: '389/2026/NĐ-CP', rel: { filter: 'all', depth: 2, center: '389/2026/NĐ-CP', hubs: false, sim: false, only: false }, wide: true }; const M = localModel(R); layoutEgo(M); return M.nodes.map(n => n.k + ':' + n.x + ',' + n.y).join('|'); };
render();
})();
