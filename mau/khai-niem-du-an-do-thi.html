p đồng và phải có các nội dung chủ yếu sau đây: a) Quyền, nghĩa vụ của mỗi bên và phù hợp với nội dung đăng ký hợp đồng cung ứng lao động đã được chấp thuận; b) Tiền dịch vụ thu từ người lao động; các khoản khác doanh nghiệp dịch vụ thu từ người lao động (nếu có); c) Tiền ký quỹ (nếu có); d) Điều kiện đơn phương chấm dứt hợp đồng; đ) Việc giải quyết tranh chấp hợp đồng, bồi thường thiệt hại. 2. Bộ trưởng Bộ Nội vụ quy định mẫu hợp đồng đưa người lao động Việt Nam đi làm việc ở nước ngoài, các khoản doanh nghiệp dịch vụ được thu từ người lao động.”."],["D1.K10","k","Sửa đổi, bố sung một số điểm của khoản 2 Điều 26 như sau: “a) Thực hiện các quy định về công bố và niêm yết Giây phép theo quy định của Chính phủ; quy định tại khoản 1 Điều 16, các điều 17, 18, 19, 20, 27, 28 và 29 của Luật này; b) Đăng tải trên trang thông tin điện tử của doanh nghiệp dịch vụ và cập nhật trên cơ sở dữ liệu về người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng trong thời hạn 05 ngày kế từ ngày có sự thay đổi thông tin về: người đại diện theo pháp luật, nhân viên nghiệp vụ, địa chỉ trụ sở chính, chi nhánh, địa điểm kinh doanh, cơ sở vật chất để thực hiện hoạt động giáo dục định hướng cho người lao động trước khi đi làm việc ở nước ngoài, quyết định giao nhiệm vụ cho chỉ nhánh; đăng tải và cập nhật trên trang thông tin điện tử của doanh nghiệp dịch vụ thông tin đầy đủ, chính xác về số lượng, tiêu chuẩn tuyển chọn, điều kiện làm việc, quyền lợi, nghĩa vụ của người lao động theo nội dung hợp đồng cung ứng lao động, thông tin chuẩn bị nguồn lao động; các thông tin khác theo quy định của pháp luật có liên quan;”; “đ) Cam kết bằng văn bản về thời gian chờ xuất cảnh sau khi người lao động trúng tuyển đi làm việc ở nước ngoài với thời hạn không quá 180 ngày kể từ ngày người lao động trúng tuyên; trường hợp doanh nghiệp dịch vụ không thực hiện đúng cam kết về thời gian chờ xuất cảnh thì phải bồi thường theo thỏa thuận và hoàn trả tiền dịch vụ thu tử người lao động, các khoản thu khác người lao động đã nộp sau khi trừ đi các khoản đã chỉ, trừ trường hợp bất khả kháng hoặc hai bên có thỏa thuận khác. 6 Bộ trưởng Bộ Nội vụ quy định về thời hạn bồi thường và hoàn trả tiền cho người lao động; e) Tổ chức quản lý, bảo vệ quyền và lợi ích hợp pháp của người lao động do doanh nghiệp dịch vụ đưa đi làm việc ở nước ngoài và phù hợp với hợp đồng cung ứng lao động đã được chấp thuận; có người đại diện ở nước ngoài để hỗ trợ, giải quyết vấn đề phát sinh liên quan đến người lao động theo quy định của Bộ trưởng Bộ Nội vụ; thông tin, báo cáo cho cơ quan nhà nước có thâm quyền và cơ quan đại diện Việt Nam ở nước ngoài ngay sau khi có thông tin về vụ việc ảnh hưởng đến tính mạng, sức khỏe, quyền và lợi ích hợp pháp của người lao động hoặc tình huống khẩn cấp liên quan đến an ninh, an toàn tại địa bàn tiếp nhận; tư vấn và hỗ trợ người lao động tiếp cận dịch vụ trợ giúp pháp lý trong trường hợp người lao động có nhu cầu hỗ trợ pháp lý;”."],["D1.K10.Đa","d","Sửa đôi, bỗ sung điểm a và điểm b như sau:"],["D1.K10.Đb","d","Sửa đổi, bỗ sung điểm đ và điểm e như sau:"],["D1.K11","k","Sửa đôi, bổ sung khoản 2 Điều 29 như sau: “2, Kể từ ngày Tòa án ra quyết định mở thủ tục phá sản, doanh nghiệp dịch vụ không được ký kết hợp đồng cung ứng lao động, tổ chức chuẩn bị nguồn và tuyển chọn lao động mới để đưa đi làm việc ở nước ngoài; hợp đồng đưa người lao động Việt Nam đi làm việc ở nước ngoài đã ký kết tiếp tục được thực hiện dưới sự giám sát theo quy định của pháp luật về phục hồi, phá sản.”."],["D1.K12","k","Sửa đổi, bố sung khoản 2 và khoản 3 Điều 30 như sau: “2, Có phương án đưa người lao động Việt Nam đi làm việc ở nước ngoài phù hợp với quy định của pháp luật Việt Nam, pháp luật của nước mà người lao động đến làm việc và thông báo đến Ủy ban nhân dân cấp tỉnh nơi doanh nghiệp đặt trụ sở chính, chi nhánh theo quy định tại Điều 31 của Luật này. 3. Chỉ đưa người lao động Việt Nam có giao kết hợp đồng lao động với doanh nghiệp trúng thầu, nhận thầu đi làm việc tại công trình, dự án ở nước ngoài theo hợp đồng trúng thầu, nhận thầu.”."],["D1.K13","k","Sửa đổi, bỗ sung Điều 31 như sau: “Điều 31. Thông báo đưa người lao động Việt Nam đi làm việc ở nước ngoài của doanh nghiệp trúng thầu, nhận thầu công trình, dự án ở nước ngoài 1. Doanh nghiệp Việt Nam trúng thầu, nhận thầu công trình, đự án ở nước ngoài có trách nhiệm thông báo bằng văn bản phương án đưa người lao động Việt Nam đi làm việc ở nước ngoài đến Ủy ban nhân dân cấp tỉnh nơi doanh nghiệp đặt trụ sở chính, chi nhánh. 2. Chính phủ quy định về phương thức, thời hạn thông báo, nội dung phương án đưa người lao động Việt Nam đi làm việc ở nước ngoài và trách-nhiệm cập nhật thông tin, dữ liệu về người lao động.”."],["D1.K14","k","Sửa đổi, bổ sung khoản 8 Điều 32 như sau: “§. Báo cáo sau khi hoàn thành hợp đồng trúng thầu, nhận thầu ở nước ngoài 7 và báo cáo đột xuất theo yêu cầu của Ủy ban nhân dân cấp tỉnh nơi doanh nghiệp đặt trụ sở chính, chị nhánh.”."],["D1.K15","k","Sửa đổi, bổ sung khoản 1 và khoản 2 Điều 33 như sau: “1. Có Giấy chứng nhận đăng ký đầu tư ra nước ngoài trừ trường hợp dự án không phải thực hiện thủ tục cấp Giấy chứng nhận đăng ký đầu tư ra nước ngoài theo quy định của pháp luật về đầu tư. 2. Có phương án đưa người lao động Việt Nam đi làm việc ở nước ngoài phù hợp với quy định của pháp luật Việt Nam, pháp luật của nước mà người lao động đến làm việc và thông báo đến Ủy ban nhân dân cấp tỉnh nơi tổ chức đặt trụ sở chính, chỉ nhánh hoặc nơi cá nhân thường trú theo quy định tại Điều 34 của Luật này.”."],["D1.K16","k","Sửa đôi, bổ sung Điều 34 như sau: “Điều 34. Thông báo đưa người lao động Việt Nam đi làm việc ở nước ngoài của tô chức, cá nhân Việt Nam đầu tư ra nước ngoài 1. Tổ chức, cá nhân Việt Nam đầu tư ra nước ngoài có trách nhiệm thông báo bằng văn bản phương án đưa người lao động Việt Nam đi làm việc ở nước ngoài đến Ủy ban nhân dân cấp tỉnh nơi tô chức đặt trụ sở chính, chi nhánh hoặc nơi cá nhân thường trú. 2. Chính phủ quy định về phương thức, thời hạn thông báo, nội dung phương án đưa người lao động Việt Nam đi làm việc ở nước ngoài và trách nhiệm cập nhật thông tin, dữ liệu về người lao động.”."],["D1.K17","k","Sửa đổi, bố sung khoản 8 Điều 35 như sau: “§. Định kỳ hằng năm hoặc đột xuất báo cáo về tình hình thực hiện đưa người lao động Việt Nam đi làm việc ở nước ngoài theo quy định của Bộ trưởng Bộ Nội vụ đến Ủy ban nhân đân cấp tỉnh nơi tổ chức đặt trụ sở chính hoặc nơi cá nhân thường trú.”."],["D1.K18","k","Sửa đổi, bố sung Điều 39 như sau: “Điều 39. Đăng ký hợp đồng nhận lao động thực tập 1. Doanh nghiệp đưa người lao động Việt Nam đi đào tạo, nâng cao trình độ, kỹ năng nghề ở nước ngoài nộp 01 bộ hỗ sơ đến cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh nơi doanh nghiệp đặt trụ sở chính để đăng ký hợp đồng nhận lao động thực tập. 2. Chính phủ quy định về hồ sơ, phương thức, trình tự, thủ tục đăng ký hợp đồng nhận lao động thực tập.”."],["D1.K19","k","Sửa đối, bố sung điểm I khoản 2 Điều 41 như sau: “1 Báo cáo về tình hình thực hiện đưa người lao động đi đào tạo, nâng cao trình độ, kỹ năng nghề ở nước ngoài theo quy định của Bộ trưởng Bộ Nội vụ đến cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh nơi doanh nghiệp đặt trụ sở chính;”. §"],["D1.K20","k","Sửa đối, bỗ sung khoản 3 Điều 42 như sau: “3. Đơn vị sự nghiệp đưa người lao động đi làm việc ở nước ngoài hoạt động theo quy định của pháp luật, không vì mục tiêu lợi nhuận và không được thu tiền địch vụ từ người lao động theo quy định của Luật này.”."],["D1.K21","k","Sửa đổi, bổ sung điểm a khoản I Điều 51 như sau: “a) Được cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh hoặc cơ quan đại diện Việt Nam ở nước ngoài cung cấp thông tin chính sách, pháp luật về người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng; nội dung giáo dục định hướng quy định tại các điểm a, đ, ø, h, ¡, k, I và m khoản l Điều 65 của Luật này;”."],["D1.K22","k","Sửa đổi, bổ sung Điều 53 như sau: “Điều 53. Đăng kỹ hợp đồng lao động trực tiếp giao kết 1. Người lao động đi làm việc ở nước ngoài theo hợp đồng lao động trực tiếp giao kết gửi 01 bộ hồ sơ đến cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh nơi người lao động thường trú để đăng ký hợp đồng lao động trực tiếp giao kết. 2. Chính phủ quy định về hồ sơ, trình tự, thủ tục đăng ký hợp đồng lao động trực tiếp giao kết.”."],["D1.K23","k","Sửa đôi, bổ sung điểm b khoản 1 Điều 65 như sau: “b) Kiến thức cơ bản về pháp luật Việt Nam và pháp luật nước tiếp nhận lao động: nội dung pháp luật về bảo hiểm xã hội đối với người lao động đi làm việc ở nước ngoài theo hợp đồng:”."],["D1.K24","k","Sửa đôi, bỗ sung một số điểm của khoản 2 Điều 70 như sau: “b) Xây dựng, quản lý, vận hành, cập nhật, hướng dẫn, tổ chức kết nối và chia sẻ cơ sở đữ liệu về người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng;”; “d) Phối hợp với Bộ Công an trong công tác trao đổi thông tin, quản lý tình hình người lao động Việt Nam đi làm việc ở nước ngoài; phòng ngừa, phát hiện và xử lý hành vi vi phạm pháp luật xảy ra ở trong nước và nước ngoài liên quan đến hoạt động đưa người lao động Việt Nam đi làm việc ở nước ngoài, hành vi lợi dụng hoạt động đưa người lao động Việt Nam đi làm việc ở nước ngoài để tổ chức, môi giới xuất cảnh trái phép, mua bán người, cưỡng bức lao động, lừa đảo, thu tiền trái pháp luật của người lao động và vẫn đề khác liên quan đến an ninh quốc gia, trật tự, an toàn xã hội; đ) Phối hợp với Bộ Dân tộc và Tôn giáo trong việc thực hiện chính sách hỗ trợ đổi với người lao động là người dân tộc thiểu số, người lao động cư trú tại vùng đồng bào dân tộc thiêu số và miền núi, địa bàn có điều kiện kinh tế - xã hội đặc biệt 9 khó khăn đi làm việc ở nước ngoài theo hợp đồng và hỗ trợ hòa nhập xã hội, tham gia thị trường lao động sau khi về nước.”. :"],["D1.K24.Đa","d","Sửa đôi, bỗ sung điểm b như sau:"],["D1.K24.Đb","d","Bồ sung điểm đ và điểm đ vào sau điểm c như sau:"],["D1.K25","k","Thay thế một số cụm từ tại một số điều, khoản, điểm sau đây: “Bộ Nội vụ” tại khoản 1 Điều 8; khoản 1 và khoản 3 Điều 16; khoản 4 Điều 17; khoản 3 Điều 19; khoản 1, khoản 3 và khoản 4 Điều 20; khoản 3 Điều 22; điểm c khoản 2 và điểm c khoản 4 Điều 23; khoản 2 Điều 24; khoản 4 Điều 25; điểm m và điểm n khoản 2 Điều 26; điểm b khoản 1, khoản 2 và khoản 3 Điều 28; khoản 1, điểm a và điểm b khoản 3 Điều 29; khoản 4 Điều 35; khoản 1 Điều 42; điểm b khoản 1, điểm a và điểm ø khoản 2 Điều 43; khoản 3 Điều 58; khoản I Điều 60; khoản 3 Điều 65; khoản 1 và khoản 2 Điều 66; khoản 2 và khoản 3 Điều 70, khoản 2 Điều 71; đi làm việc ở nước ngoài theo hợp đồng” bằng cụm từ “cơ sở đữ liệu về người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng” tại khoản 4 Điều 17; điểm n khoản 2 Điều 26; điểm d khoản 2 Điều 41; điểm c khoản 2 Điều 43; khoản 1 Điều 60 và khoản 4 Điều 69; chữ ký người địch” tại điểm b khoản 2 Điều 20."],["D1.K25.Đa","d","Thay thế cụm từ “Bộ Lao động - Thương binh và Xã hội” bằng cụm từ"],["D1.K25.Đb","d","Thay thế cụm từ “Hệ thống cơ sở dữ liệu về người lao động Việt Nam"],["D1.K25.Đc","d","Thay thế cụm từ “được chứng thực” bằng cụm từ “được chứng thực"],["D1.K26","k","Bỏ một số cụm từ tại một số điều, khoản sau đây: khoán 3 Điều 72; và “quy định tại khoản 2 Điều 34 của Luật này” tại khoản 4 Điều 35."],["D1.K26.Đa","d","Bỏ cụm từ “, cơ quan thuộc Chính phủ” tại khoản 3 Điều 2; khoản 2 và"],["D1.K26.Đb","d","Bỏ cụm từ “, Thủ trưởng cơ quan thuộc Chính phủ” tại khoản I Điều 42;"],["D1.K26.Đc","d","Bỏ cụm từ “quy định tại khoản 2 Điều 31 của Luật này” tại khoản 4 Điều 32"],["D1.K27","k","Bãi bỏ Điều 11, Điều 12, Điều 13, Điều 14, Điều 15 và Điều 40."]],"u":1085},{"n":"Điều 2","t":"Hiệu lực thi hành","p":[],"u":1134},{"n":"Điều 3","t":"Điều khoản chuyễn tiếp","p":[["D3.K1","k","Doanh nghiệp dịch vụ đã được cấp Giấy phép trước ngày Luật này có hiệu lực thì được tiếp tục hoạt động theo Giấy phép đã được cấp."],["D3.K2","k","Đối với hồ sơ đề nghị cấp, cấp lại và điều chỉnh thông tin Giấy phép, đăng ký hợp đồng nhận lao động thực tập và đăng ký hợp đồng trực tiếp giao kết đã được tiếp nhận trước ngày Luật này có hiệu lực thi hành thì tiếp tục được giải quyết theo quy định của Luật Người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng số 69/2020/QH14 đã được sửa đỗi, bổ sung một số điều theo Luật số 16/2023/QH15 và Luật số 142/2025/QHI5 (sau đây gọi là Luật số 69/2020/QH14), trừ trường hợp quy định tại điểm b khoản 6 Điều 1 của Luật này. 10"],["D3.K3","k","Đối với doanh nghiệp đã được chấp thuận chuẩn bị nguồn lao động theo quy định tại Điều 18 của Luật số 69/2020/QH14 trước ngày Luật này có hiệu lực thi hành thì tiếp tục được thực hiện hoạt động đã được chấp thuận cho đến khi hoàn thành theo phương án đã đăng ký."],["D3.K4","k","Đối với hợp đồng lao động trực tiếp giao kết đã được xác nhận đăng ký trước ngày Luật này có hiệu lực thi hành thì tiếp tục được thực hiện cho đến khi chấm dứt hợp đồng."],["D3.K5","k","Đối với trường hợp doanh nghiệp không thực hiện đúng cam kết về thời gian chờ xuất cảnh trước ngày Luật này có hiệu lực thi hành mà chưa bồi thường, hoàn trả theo quy định tại điểm đ khoản 2 Điều 26 của Luật số 69/2020/QH14 thì phải bồi thường, hoàn trả theo quy định của Luật này. Luật này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa X1, Kỳ họp không thường lệ thứ Nhất thông qua ngày 24 tháng 8 năm 2026. _“=— Trần Thanh Mẫn"]],"u":1135}],"23/2026/QH16":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Hiễn pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đối, bổ sung một số điều theo Nghị quyết số 203/2025/QH15, Quốc hội ban hành Luật sửa đổi, bỗ sung một số điều của Luật Ngân hàng Nhà nước Việt Nam số 46/2010/QH12 đã được sửa đổi, bồ sung một số điều theo Luật số 14/2022/QH15, Luật Phòng, chống rửa tiền số 14/2022/QH15; Luật Các tổ chức tín dụng số 32/2024/QH15 đã được sửa đổi, "]],"u":0},{"n":"Đoạn","t":"","p":[["p1.para1","o","`2 44/9/ Kan ban goi d2ng Cắng bao QUỐC HỘI CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM Độc lập - Tự do - Hạnh phúc Luật số: 23/2026/QH16 LUẬT SỬA ĐỎI, BÓ SUNG MỘT SÓ ĐIỀU CỦA LUẬT NGÂN HÀNG NHÀ NƯỚC VIỆT NAM, LUẬT PHÒNG, CHÓNG RỦA TIỀN VÀ LUẬT CÁC TỎ CHỨC TÍN DỤNG Căn cứ Hiễn pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đối, bổ sung một số điều theo Nghị quyết số 203/2025/QH15, Quốc hội ban hành Luật sửa đổi, bỗ sung một số điều của Luật Ngân hàng Nhà nước Việt Nam số 46/2010/QH12 đã được sửa đổi, bồ sung một số điều theo Luật số 14/2022/QH15, Luật Phòng, chống rửa tiền số 14/2022/QH15; Luật Các tổ chức tín dụng số 32/2024/QH15 đã được sửa đổi, bố sung một số điều theo Luật số 43/2024/QH15, Luật số 96/2025/QH15 và Luật số 142/2025/QH15."]],"u":1141},{"n":"Điều 1","t":"Sửa đỗi, bỗ sung một số điều của Luật Ngân hàng Nhà nước","p":[["D1.K1","k","Sửa đôi, bỗ sung khoản 15 Điều 4 như sau: “15. Chủ trì lập, theo dõi, dự báo và phân tích kết quả thực hiện cán cân thanh toán quốc tế của Việt Nam; chủ trì lập, theo dõi và phân tích trạng thái đầu tư quốc tế của Việt Nam.”"],["D1.K2","k","Sửa đôi, bỗ sung khoản 3 Điều 27 như sau: - “3. Ngân hàng Nhà nước mở tài khoản cho Kho bạc Nhà nước. Ở tỉnh, thành phô không có trụ sở của Ngân hàng Nhà nước chi nhánh, việc thực hiện các giao dịch cho Kho bạc Nhà nước theo quy định của Thông độc Ngân hàng Nhà nước.”."],["D1.K3","k","Bỗ sung Điều 31a vào sau Điều 31 như sau: “Điều 31a. Nguyên tắc sử dụng ngoại hồi trên lãnh thổ Việt Nam Trên lãnh thổ Việt Nam, mọi giao dịch, thanh toán, niêm yết, quảng cáo, báo giá, định giá, ghi giá trồng hợp đồng, thỏa thuận và các hình thức tương tự khác không được thực hiện bằng, ngoại hối, trừ trường hợp được phép theo quy định của luật, nghị quyết của Quốc hội hoặc theo quy định của Thống đốc Ngân hàng Nhà nước.\""],["D1.K4","k","Sửa đỗi, bổ sung một số khoản của Điều 35 như sau: “1. Tổ chức, cá nhân có trách nhiệm cung cấp thông tin cho Ngân hàng Nhà nước để xây dựng Bảng cân đối tiền tệ, lập cán cân thanh toán quốc tế của Việt 2 Nam, lập trạng thái đầu tư quốc tế của Việt Nam và đánh giá, dự báo xu hướng phát triển của thị trường tiền tệ nhằm phục vụ việc ° xây dựng và điều hành chính sách tiền tệ quốc gia, công tác quản lý ngoại hối.” *3. Chính phủ quy định đối tượng, phạm vi, loại thông tin, thời hạn, kỳ hạn và phương thức cung câp thông tin phục vụ việc lập cán cân thanh toán quôc tế và trạng thái đầu tư quốc tế của Việt Nam quy định tại khoản 1 Điều này. Thống đốc Ngân hàng Nhà nước quy định đối tượng, quy trình, phạm vi, loại thông tin, thời hạn, kỳ hạn và phương thức cung cấp thông tin quy định tại khoản 2 Điều này.”."],["D1.K4.Đa","d","Sửa đối, bỗ sung khoản I như sau:"],["D1.K4.Đb","d","Sửa đổi, bỗ sung khoản 3 như sau:"],["D1.K5","k","Sửa đôi, bỗ sung Điều 42 như sau: “Điều 42. Vốn pháp định Vốn pháp định của Ngân hàng Nhà nước do ngân sách nhà nước cấp. Mức vốn pháp định của Ngân hàng Nhà nước do Chính phủ quy định.”"],["D1.K6","k","Sửa đổi, bỗ sung Điều 43 như sau: “Điều 43. Thu, chỉ tài chính Thu, chỉ tài chính của Ngân hàng Nhà nước phản ánh hoạt động thực hiện các chức năng của Ngân hàng Nhà nước theo quy định của Luật này. Chính phủ quy định nội dung, nguyên tắc thu, chỉ đài chính; cơ chế trích lập dự phòng rủi ro; cơ chế tự chủ, tự chịu trách nhiệm về quản lý, sử dụng kinh phí quản lý hành chính và việc xác định kết quả tài chính phù hợp với hoạt động của Ngân hàng Nhà nước.”."],["D1.K7","k","Sửa đối, bố sung Điều 44 như sau: “Điều 44. Kết quả tài chính Kết quả tài chính hằng năm của Ngân hàng Nhà nước được xác định bằng nguồn thu về hoạt động nghiệp vụ ngân hàng và các nguồn thu khác, sau khi trừ các khoản chỉ phí (bao gồm cả chỉ hoạt động nghiệp vụ và chỉ bộ máy quản lý) và khoản dự phòng rủi ro.”."],["D1.K8","k","Sửa đối, bỗ sung Điều 45 như sau: “Điều 45. Các quỹ 1. Ngân hàng Nhà nước được trích từ kết quả tài chính hằng năm để lập các quỹ sau đây: a) Quỹ thực hiện chính sách tiền tệ quốc gia; b) Quỹ dự phòng tài chính; c) Quỹ khác theo quy định của Chính phủ. 2. Mức trích lập và việc sử dụng các quỹ tại khoản 1 Điều này thực hiện theo quy định của Chính phủ. 3 3. Kết quả tài chính của Ngân hàng Nhà nước sau khi trích lập các quỹ tại khoản I Điều này và bù đắp chênh. lệch chỉ lớn hơn thu các năm trước (nếu có) được nộp vào ngân sách nhà nước.\""],["D1.K9","k","Sửa đổi, bổ sung Điều 57 như sau: “Điều 57. Quyền, nghĩa vụ của đối tượng giám sát ngân hàng 1. Cung cấp kịp thời, đầy đủ, chính xác thông tin, tài liệu theo yêu cầu của Ngân hàng Nhà nước và chịu trách nhiệm trước pháp luật về tính chính xác, trung thực của thông tin, tài liệu đã cung câp. 2. Báo cáo, giải trình đối với kiến nghị, khuyến nghị, cảnh báo rủi ro và an toàn hoạt động của Ngân hàng Nhà nước. 3. Thực hiện khuyến nghị, cảnh báo rủi ro và an toàn hoạt động của Ngân hàng Nhà nước.”."],["D1.K10","k","Sửa đổi, bể sung một số điểm, khoản của Điều 59 như sau: “ø) Áp dụng một hoặc một số tỷ lệ bảo đảm an toàn cao hơn mức quy định.”; “3. Căn cứ tính chất, mức độ rủi ro của từng đối tượng thanh tra, giám sát ngân hàng, Ngân hàng Nhà nước xem xét, quyết định áp dụng một hoặc một số tỷ lệ bảo đảm an toàn khác so với mức quy định để thực hiện yêu cầu phát triển kinh tế, xã hội. Đối tượng thanh tra, giám sát ngân hàng phải xây dựng và thực hiện lộ trình để bảo đảm tuân thủ mức quy định. Ngân hàng Nhà nước có trách nhiệm thanh tra, giám sát các đối tượng thanh tra, giám sát quy định tại khoản này theo quy định của pháp luật.”."],["D1.K10.Đa","d","Sửa đổi, bỗ sung điểm g khoản 2 như sau:"],["D1.K10.Đb","d","Bổ sung khoản 3 vào sau khoản 2 như sau:"],["D1.K11","k","Sửa đổi, bỗ sung Điều 62 như sau: “Điều 62. Kiểm soát nội bộ và kiểm toán nội bộ Ngân hàng Nhà nước thực hiện kiểm soát nội bộ và kiểm toán nội bộ theo quy định của Thông đc Ngân hàng Nhà nước.”."],["D1.K12","k","Bãi bỏ khoản 3 Điều 7, khoản 2 Điều 22, khoản 5 Điều 32 và Điều 49."]],"u":1142},{"n":"Điều 2","t":"Sửa đỗi, bỗ sung một số điều của Luật Phòng, chống rứa tiền","p":[["D2.K1","k","Sửa đổi, bổ sung khoản 7 Điều 3 như sau: %1, Chủ sở hữu hưởng lợi là một hoặc nhiều cá nhân trực tiếp hoặc gián tiếp có quyên sở hữu hoặc quyên kiêm soát cuỗi cùng trên thực tê đối với khách hàng, bao gồm cả thỏa thuận pháp lý hoặc cá nhân mà khách hàng thực hiện giao dịch thay mặt họ.”."],["D2.K2","k","Bô sung điểm n vào sau điệm m khoản 1 Điêu 4 như sau: “n) Dịch vụ tài sản mã hóa.”. 4"],["D2.K3","k","Sửa đổi, bỗ sung điểm c khoản 2 Điều 9 như sau: “o) Khi nghỉ ngờ khách hàng hoặc giao dịch của khách hàng hoặc các bên liên quan đên giao dịch, kê cả trường hợp giao dịch chưa hoàn thành, có liên quan đền rửa tiên;”,"],["D2.K4","k","Sửa đổi, bố sung một số điểm, khoản của Điều 10 như sau: “a) Đối với khách hàng cá nhân có một quốc tịch là người Việt Nam và người gốc Việt Nam chưa xác định được quốc tịch: họ và tên; ngày, tháng, năm sinh; quốc tịch (nếu có); nghề nghiệp, chức vụ; số điện thoại liên lạc; số định danh cá nhân hoặc số Hộ chiếu, ngày cấp, nơi cấp; địa chỉ đăng ký thường trú và nơi ở hiện tại khác (nêu có);”; “e) Đối với khách hàng tổ chức: tên giao dịch đầy đủ; tên viết tắt (nếu có); hình thức pháp lý, địa chỉ trụ sở chính và địa điểm kinh đoanh (nếu khác với địa chỉ trụ sở chính); số giây phép thành lập, mã số doanh nghiệp hoặc mã số thuế; số định danh của tổ chức (nếu có); số điện thoại liên lạc; số fax, trang thông tin điện tử (nếu có); lĩnh vực hoạt động và kinh doanh; thông tin về người thành lập, người đại diện theo pháp luật, người đại điện theo ủy quyền (nếu có), Giám đốc hoặc Tổng giám đốc, Kế toán trưởng hoặc người phụ trách kế toán của tổ chức bao gồm các thông tin tương ứng quy định tại điểm a, b, c, d hoặc đ khoản này và các thông tin tại điểm này đối với trường hợp người thành lập lả tổ chức;”; “4. Ngoài các thông tin nhận biết khách hàng quy định tại các khoản 1, 2 và 3 Điêu này, đôi tượng báo cáo thu thập các thông tin khác trong một sô trường hợp cụ thê sau đây: a) Khi khách hàng tham gia thỏa thuận pháp lý dưới hình thức ủy thác, đối tượng báo cáo thu thập các thông tin bao gồm: tên giao địch đầy đủ; tên viết tắt (nếu có) đối với tô chức nhận ủy thác hoặc họ và tên người nhận ủy thác đối với cá nhân nhận ủy thác; địa chỉ trụ sở chính đối với tổ chức nhận ủy thác, địa chỉ tại quốc gia mà cá nhân nhận ủy thác mang quốc. tịch; thông tin đăng ký hoặc cấp phép do cơ quan có thẩm quyền nước ngoài cấp đối với bên nhận ủy thác (nếu có); cơ cầu của ủy thác; thông tin về tên, số định danh của bên ủy thác, người thụ hưởng hoặc nhóm người thụ hưởng, người thụ hưởng, tiềm năng, người giám sát (nêu có), bất kỳ cá nhân nào có quyên kiểm soát cuối cùng đối với ủy thác và người có liên quan khác của ủy thác (nếu có). Khi khách hàng tham gia thỏa thuận pháp lý đưới hình thức khác có bản chât tương tự ủy thác, đôi tượng báo cáo thu thập thông tin đôi với tât cả các bên giữ vai trò tương đương với hình thức ủy thác nêu trên; 5 b) Đối tượng báo cáo xác định và thu thập thông tin về người thụ hưởng của hợp đồng bảo hiểm nhân thọ ngay khi người thụ hưởng được chỉ định bởi bên mua bảo hiểm hoặc người được bảo hiểm. Trong trường hợp người thụ hưởng là cá nhân hoặc pháp nhân hoặc thỏa thuận pháp lý, thông tin thu thập bao gôm họ và tên hoặc tên giao dịch đầy đủ của người thụ hưởng. Trong trường hợp bảo hiểm nhóm, thông tin thu thập bao gồm giấy tờ tùy thân, tài liệu chứng mình quan hệ với người được bảo hiểm của người thụ hưởng và các tài liệu cần thiết khác cho phép đối tượng báo cáo có thể xác định được người thụ hưởng ở thời điểm chỉ trả. ._ Việc xác minh thông tin về người thụ hưởng phải được thực hiện tại thời điểm chỉ trả. $. Trường hợp đối tượng báo cáo có thể kết nối, khai thác được thông tin quy định tại Điều này trong cơ sở dữ liệu quốc gia, cơ sở dữ liệu chuyên ngành theo quy định của pháp luật thì không yêu câu khách hàng cung câp thông tin đã có trong cơ sở đữ liệu.”."],["D2.K4.Đa","d","Sửa đôi, bỗ sung điểm a khoản 1 như sau:"],["D2.K4.Đb","d","Sửa đối, bỗ sung điểm e khoản 1 như sau:"],["D2.K4.Đc","d","Bồ sung khoản 4 và khoản 5 vào sau khoản 3 như sau:"],["D2.K5","k","Sửa đổi, bổ sung khoản 1 Điều 12 như sau: “4, Đối tượng báo cáo sử dụng các tài liệu, đỡ liệu để xác minh thông tin nhận biệt khách hàng, bao gôm: a) Đối với khách hàng cá nhân: Căn cước, Căn cước điện tử, Căn cước công dân hoặc Hộ chiếu còn hiệu lực; giấy tờ khác do cơ quan có thẳm quyền cấp, văn bản chứng minh tư cách đại diện (nêu có); b) Đối với khách hàng tổ chức: giấy phép thành lập, quyết định thành lập hoặc Giây chứng nhận đăng ký doanh nghiệp còn hiệu lực; tài khoản định danh điện tử, quyết định vệ tô chức lại, giải thê, phá sản, châm dứt hoạt động của tô chức (nêu có); điều lệ của tô chức (nêu có); quyết định bỗ nhiệm hoặc hợp đông thuê Giám độc hoặc Tông giám đốc, Kê toán trưởng hoặc người phụ trách kề toán; các tài liệu, đữ liệu liên quan đên người thành lập, người đại diện theo pháp luật, người đại diện theo ủy quyên (nêu có) của tô chức, chủ sở hữu hưởng lợi; c) Đối với khách hàng tham gia thỏa thuận pháp lý: văn bản xác lập thỏa thuận pháp lý; tài liệu đăng ký thỏa thuận pháp lý (nếu có) và các tài liệu khác có liên quan đến việc xác lập thỏa thuận pháp lý (nếu có); đ) Các tài liệu, đữ liệu và nguồn thông tin đáng tin cậy khác có liên quan.”."],["D2.K6","k","Sửa đôi, bổ sung khoản 1 Điều 19 như sau: “1, Đối tượng báo cáo phải ban hành và thực hiện đầy đủ các chính sách, quy trình để nhận diện và đánh giá mức độ rủi ro về rửa tiền trước khi cung cấp sản phẩm, dịch vụ mới; sản phẩm, dịch vụ hiện có áp dụng công nghệ đổi mới nhằm mục đích sau đây: 6S a) Phát hiện, ngăn chặn việc sử đụng sản phẩm, dịch vụ mới; sản phẩm, dịch vụ hiện có áp dụng công nghệ đôi mới đề rửa tiên; b) Quản lý rủi ro về rửa tiền khi thiết lập giao dịch với khách hàng sử dụng sản phẩm, dịch vụ mới; sản phẩm, dịch vụ hiện có áp dụng công nghệ đôi mới.”."],["D2.K7","k","Sửa đối, bố sung Điều 22 như sau: “Điều 22. Minh bạch thông tin của thỏa thuận pháp lý 1. Bên nhận ủy thác trong thỏa thuận pháp lý dưới hình thức ủy thác có trách nhiệm thu thập, cập nhật các thông tin nhận dạng về bên ủy thác, bên nhận ủy thác, người thụ hưởng hoặc nhóm người thụ hưởng, người thụ hưởng tiềm năng, người giám sát (nếu có), bất kỳ cá nhân nào có quyền kiểm soát cuối cùng đối với ủy thác (nếu có). Trường hợp các bên có liên quan trong thỏa thuận pháp lý nêu trên là pháp nhân hoặc thỏa thuận pháp lý, thông tin thu thập, cập nhật bao gồm các thông tin cơ bản và thông tin về chủ sở hữu hưởng lợi của pháp nhân hoặc thỏa thuận pháp lý đó. Ị 2. Bên giữ vai trò tương đương với vai trò bên nhận ủy thác trong thỏa thuận pháp lý đưới hình thức khác có bản chất tương tự ủy thác có trách nhiệm thu thập, cập nhật các thông tin nhận đạng đối với các bên giữ vai trò tương đương như đối với hình thức ủy thác quy định tại khoản 1 Điều này. Trường hợp các bên có liên quan trong thỏa thuận pháp lý dưới hình thức khác có bản chất tương tự ủy thác là pháp nhân hoặc thỏa thuận pháp lý, thông tin thu thập, cập nhật bao gồm các thông tin cơ bản và thông tin về chủ sở hữu hưởng lợi của pháp nhân hoặc thỏa thuận pháp lý đó. 3. Ngoài các thông tin thu thập tại khoản 1 và khoản 2 Điều này, bên nhận ủy thác hoặc bên giữ vai trò tương đương với vai trò bên nhận ủy thác có trách nhiệm thu thập thông tin cơ bản về các đại lý hoặc nhà cung cấp dịch vụ được quản lý khác của thỏa thuận pháp lý (nếu có). 4. Các thông tin quy định tại các khoản 1, 2 và 3 Điều này phải được lưu trữ ít nhất 05 năm kể từ thời điểm bên nhận ủy thác hoặc bên giữ vai trò tương đương với vai trò bên nhận ủy thác ngừng tham gia vào hoạt động thỏa thuận pháp lý. 5. Ngân hàng Nhà nước Việt Nam, các cơ quan nhà nước có thấm quyền trong quá trình thực hiện chức năng, nhiệm vụ quản lý nhà nước về phòng, chống rửa tiền, thực hiện điều tra, truy tố, xét xử có quyên yêu cầu tổ chức, cá nhân cung cấp thông tin quy định tại các khoản 1, 2 và 3 Điều này. . 1 8. Sửa đối, bỗ sung Điều 26 như sau: “Điều 26. Báo cáo giao dịch đáng ngờ 1, Đối tượng báo cáo có trách nhiệm báo cáo giao dịch đáng ngờ cho Ngân hàng Nhà nước Việt Nam khi có cơ sở hợp lý để nghỉ ngờ tài sản trong giao dịch là tài sản do phạm tội mà có. Việc xác định cơ sở hợp lý để nghi ngờ được thực hiện dựa trên phân tích, đánh giá thông tin khách hàng và giao dịch, bao gồm dấu hiệu đáng ngờ quy định tại các điều 27, 28, 29, 30, 31, 32, 33 và 33a của Luật này và các dấu hiệu khác do đối tượng báo cáo xác định. 2. Khi phát hiện dấu hiệu đáng ngờ ngoài các dấu hiệu quy định tại các điều 27, 28, 29, 30, 31, 32, 33 và 33a của Luật này, đôi tượng báo cáo, các Bộ, ngành có liên quan thông báo cho Ngân hàng Nhà nước Việt Nam. 3. Căn cứ yêu cầu của công tác phòng, chống rửa tiền trong từng thời kỳ, Ngân hàng Nhà nước Việt Nam trình Chính phủ bồ sung dâu hiệu đáng ngờ theo các ngành, lĩnh vực ngoài các dâu hiệu quy định tại các điêu 27, 28, 29, 30, 31, 32, 33 và 33a của Luật này. 4. Thống đốc Ngân hàng Nhà nước Việt Nam quy định chế độ báo cáo về giao dịch đáng ngờ.”,"],["D2.K9","k","Bố sung Điều 33a vào sau Điều 33 như sau: “Điều 33a. Dấu hiệu đáng ngờ trong lĩnh vực tài sản mã hóa 1. Chia nhỏ giao dịch tài sản mã hóa thành nhiều khoản có giá trị thấp hơn mức quy định về nhận biết khách hàng hoặc về báo cáo theo quy, định hoặc thực hiện nhiều giao dịch tài sản mã hóa giá trị lớn trong thời gian ngăn mà không có mục đích kinh doanh rõ ràng. 2. Phát sinh một trong các trường hợp sau đây mà không phủ hợp với hỗ sơ và đặc điểm của khách hàng: nạp, giao địch và rút tài sản mã hóa liên tiếp trong thời gian rất ngắn ngay sau khi thiết lập quan hệ khách hàng, nạp lần đầu với giá trị lớn ngay sau khi mở tài khoản tài sản mã hóa hoặc tài khoản tài sản mã hóa không hoạt động trong thời gian dài phát sinh giao dịch có giá trị lớn hoặc tần suất bắt thường. 3. Chuyên ngay tài sản mã hóa tới nhiều tổ chức cung cấp dịch vụ tài sản mã hóa tại quôc g1a, vùng lãnh thổ nằm trong danh sách do Lực lượng đặc nhiệm tài chính công bố nhằm chống rửa tiền, tài trợ khủng bố, tài trợ phố biến vũ khí hủy diệt hàng loạt hoặc tại quôc gia, vùng lãnh thô chưa ban hành hoặc ban hành chưa đầy đủ khung pháp lý về phòng, chống rửa tiền, tài trợ khủng bố, tài trợ phổ biến vũ khí hủy diệt hàng loạt đỗi với tài sản mã hóa và tổ chức cung cấp dịch vụ tài sản mã hóa nằm trong danh sách đo Lực lượng đặc nhiệm tài chính công bố liên quan đến tài sản mã hóa trong khi không có môi liên hệ hợp lý với nơi cư trú hoặc địa điểm hoạt động của khách hàng. 8 h 4. Chuyển đổi tài sản mã hóa sang nhiều loại tài sản mã hóa khác nhau mà không có mục đích kinh doanh, đầu tư hợp lý hoặc chuyển đổi tài sản mã hóa sang tiền pháp định trong điều kiện bắt lợi về giá, chấp nhận thua lỗ hoặc chịu mức phí giao dịch cao bắt thường so với tình trạng mạng lưới chuỗi khối tại thời điểm giao dịch. 5. Nhiều tài khoản hoặc nhiều địa chỉ ví không có mối liên hệ rõ ràng cùng chuyển tài sản mã hóa về cùng một địa chỉ ví hoặc một tài khoản chuyển tài sản mã hóa tới nhiều địa chỉ ví khác nhau với giá trị tương đương nhau liên tiếp trong thời gian ngắn. 6. Thực hiện giao dịch tài sản mã hóa có tính năng tăng cường ẩn danh, dịch vụ trộn giao dịch hoặc thực hiện nhiều lần chuyển đổi từ tài sản mã hóa trên số cái phân tán công khai, minh bạch sang tài sản mã hóa có tính năng tăng cường ấn danh, làm gián đoạn khả năng truy vết giao địch. ' 7. Giao dịch tài sản mã hóa từ các địa chỉ ví hoặc các tổ chức cung cấp dịch vụ tài sản mã hóa đã được cơ quan có thâm quyền xác định hoặc cảnh báo có liên quan đến trang mạng ẩn danh giao dịch hàng hóa, dịch vụ bất hợp pháp, hoạt động tổng tiền, lừa đảo, cờ bạc trực tuyến bất hợp pháp, tài sản bị đánh cắp hoặc hoạt động phạm tội khác. ị 8. Khách hàng truy cập nền tảng của tổ chức cung cấp dịch vụ tài sản mã hóa qua công cụ cho phép ân danh danh tính hoặc ẩn danh địa chỉ giao thức Internet hoặc nhiều tài khoản tài sản mã hóa đứng tên các danh tính khác nhau nhưng có dấu hiệu được vận hành từ cùng một thiết bị hoặc địa chỉ giao thức Internet. 9. Khách hàng từ chối, trì hoãn cung cấp tài liệu nhận biết khách hàng hoặc thông tin về nguôn gốc tài sản; cung cập tài liệu có : dấu hiệu giả mạo hoặc thông tin không nhất quán hoặc không thể giải thích hợp lý về mục đích giao dịch, nguồn gốc tài sản và mối quan hệ với bên đối tác. 10. Địa chỉ ví tài sản mã hóa của khách hàng xuất hiện trên các nguồn thông tin công khai có liên quan đên hoạt động bât hợp pháp hoặc tài sản mã hóa nạp, rút có lịch sử qua các câu nôi liên chuôi được đánh giá có rủi ro cao. 11. Khách hàng có dấu hiệu đứng tên hộ, bị lợi đụng làm trung gian hoặc là nạn nhân của lừa đảo, bao gồm cả trường hợp khách hàng có hiểu biết hạn chế về tài sản mã hóa nhưng thực hiện giao dịch với tần suất và giá trị lớn không tương xứng với hồ sơ và đặc điểm của khách hàng hoặc thực hiện giao dịch theo chỉ dẫn của bên thứ ba. 12. Nguồn tài sản của khách bàng chủ yếu hình thành từ các đợt phát hành tài sản mã hóa lần đầu thiếu minh bạch hoặc có đấu hiệu gian lận hoặc tài sản mã hóa của khách hàng có nguồn gốc trực tiếp từ các dịch vụ trộn giao dịch hoặc từ các tổ chức cúng cấp dịch vụ tài sản mã hóa thiếu kiểm soát về phòng, chống rửa tiên. 9 13. Giao dịch với tổ chức cung cấp dịch vụ tài sản mã hóa không xác định được tư cách pháp lý hợp lệ, bao gồm trường hợp hoạt động tại quốc gia, vùng lãnh thổ chưa có khung pháp lý về tài sản mã hoá theo danh sách do Lực lượng đặc nhiệm tài chính công bề liên quan đến tài sản mã hóa hoặc không có trong danh sách được cấp phép của cơ quan quản lý có thẩm quyền nước sở tại hoặc đã bị cơ quan có thầm quyền cảnh báo, đình chỉ hoặc thu hồi giấy phép hoạt động. 14. Nội dung ghi chú kèm theo giao dịch tài sản mã hóa có dấu hiệu liên quan đến hoạt động bất hợp pháp hoặc khách hàng thường xuyên thay đổi các thông tin nhận dạng và xác thực quan trọng không phù hợp với hành vi sử dụng thông thường hoặc thực hiện giao dịch từ địa chỉ giao thức Internet không nhất quán với thông tin khách hàng đã cung cấp hoặc nhiều lần mở tài khoản tài sản mã hóa từ cùng một địa chỉ giao thức Internet. 15. Khách hàng thực hiện giao địch thông qua tổ chức cung cấp địch vụ tài sản mã hóa có trụ sở hoặc hoạt động tại quốc gia, vùng lãnh thỗ nằm trong danh sách do Lực lượng đặc nhiệm tài chính công bố nhằm chống rửa tiền, tài trợ khủng bố, tài trợ phổ biến vũ khí hủy điệt hàng loạt hoặc tại quốc gia, vùng lãnh thổ chưa ban hành hoặc ban hành chưa đầy đủ khung pháp lý về phòng, chống rửa tiền, tài trợ khủng bó, tài trợ phổ biến vũ khí hủy diệt hàng loạt đối với tài sản mã hóa và tô chức cung cấp dịch vụ tài sản mã hóa nằm trong danh sách do Lực lượng đặc nhiệm tài chính công bố liên quan đến tài sản mã hóa.”."],["D2.K10","k","Sửa đổi, bổ sung khoản 1 Điều 38 như sau: “1, Đối tượng báo cáo có trách nhiệm lưu trữ tất cả hồ sơ của khách hàng và tất cả các giao dịch dưới dạng bản giấy hoặc đữ liệu điện tử theo quy định của pháp luật, trong đó bao gồm: a) Thông tin, hồ sơ, tài liệu nhận biết khách hàng; b) Kết quả phân tích, đánh giá đối với khách hàng, giao địch phục vụ mục đích phòng, chống rửa tiền; c) Thông tin, hồ sơ, tài liệu khác liên quan đến khách hàng, giao dịch; đ) Báo cáo giao dịch quy định tại các điều 25, 26 và 34 của Luật này và thông tin, hồ sơ, tài liệu kèm theo giao dịch báo cáo.”."],["D2.K11","k","Bổ sung khoản 3 và khoản 4 vào sau khoản 2 Điều 39 như sau: “4, Đối tượng báo cáo, cơ quan, tổ chức, cá nhân thực hiện nghĩa vụ báo cáo cho cơ quan có thâm quyền theo quy định của Luật này một cách trung thực thì không phải chịu trách nhiệm về việc báo cáo. 4. Người báo cáo, tố cáo, cung cấp thông tin phục vụ công tác phòng, chống rửa tiên được áp dụng các biện pháp bảo vệ như bảo vệ người tô cáo theo quy định của pháp luật vê tô cáo.”. 10"],["D2.K12","k","Bố sung Điều 48a vào sau Điều 48 như sau: “Điều 48a. Trách nhiệm của Thanh tra Chính phủ 1. Thanh tra hoạt động phòng, chống rửa tiền của đối tượng bảo cáo thuộc lĩnh vực quản lý nhà nước của các Bộ không có thanh tra Bộ, trừ trách nhiệm thanh tra của Bộ Tài chính quy định tại khoản 2 Điều 51 của Luật này. Việc thanh tra hoạt động phòng, chống rửa tiền phải căn cứ vào kết quả đánh giá rủi ro quốc gia về rửa tiền, kết quả đánh giá rủi ro về rửa tiền của đối tượng báo cáo. 2. Phối hợp với Ngân hàng Nhà nước Việt Nam và các Bộ, ngành có liên quan định kỳ thực hiện đánh giá, cập nhật rủi ro về rửa tiền quy định tại khoản 1 và khoản 2 Điều 7 của Luật này.”"],["D2.K13","k","Sửa đôi, bỗ sung Điều 51 như sau: “Điều 51. Trách nhiệm của Bộ Tài chính 1. Chủ trì, phối hợp với các cơ quan có liên quan triển khai các biện pháp phòng, chống rửa tiền trong lĩnh vực kinh doanh bảo hiểm nhân thọ, chứng khoán, tài sản mã hóa, dịch vụ kế toán, trò chơi điện tử có thưởng, casino, xố sô, đặt cược và dịch vụ khác thuộc phạm vi quản lý nhà nước của Bộ Tải chính. 2. Thanh tra hoạt động phòng, chống rửa tiền đối với đối tượng báo cáo thuộc lĩnh vực tài sản mã hóa khi được Chính phủ giao, lĩnh vực chứng khoán. Kiểm tra, giám sát hoạt động phòng, chống rửa tiền đối với đối tượng báo cáo thuộc lĩnh vực quy định tại khoản 1 Điều này. Việc thanh tra, kiểm tra, giám sát hoạt động phòng, chống rửa tiền phải căn cứ vào kết quả đánh giá rủi ro quốc gia về rửa tiền, kết quả đánh giá rủi ro về rửa tiền của đối tượng báo cáo. 3. Phối hợp với Ngân hàng Nhà nước Việt Nam thực hiện đánh giá rủi ro quốc gia về rửa tiền quỹ ‹ định tại khoản 1 Điều 7 của Luật này; thực hiện đánh giá, cập nhật rủi ro về rửa tiền quy định tại khoản 2 Điều 7 của Luật này đối với lĩnh vực quy định tại khoản ¡ Điều này.”"],["D2.K14","k","Sửa đổi, bỗ sung Điều 52 như sau: “Điều 52. Trách nhiệm của Bộ Xây dựng 1. Chủ trì, phối hợp với các cơ quan có liên quan triển khai các biện pháp phòng, chống rửa tiền trong lĩnh vực kinh doanh bất động sản, trừ việc cho thuê, cho thuê lại bất động sản và dịch vụ tư vấn bất động sản. 2. Kiểm tra, giám sát hoạt động phòng, chống rửa tiền đối với đối tượng báo cáo thuộc lĩnh vực quy định tại khoản 1 Điều này, trong đó có căn cứ vào kết quả đánh giá rủi ro quôc gia về rửa tiền, kết quả đánh giá rủi ro về rửa tiền của đối tượng báo cáo đó. 3. Phối hợp với Ngân hàng Nhà nước Việt Nam thực hiện đánh giá rủi ro quốc gia về rửa tiền quy định tại khoản 1 Điều 7 của Luật này; thực hiện đánh giá, lại cập nhật rủi ro về rửa tiền quy định tại khoản 2 Điều 7 của Luật này đối với lĩnh vực quy định tại khoản 1 Điều này.”."],["D2.K15","k","Sửa đổi, bỗ sung Điều 53 như sau: “Điều 53. Trách nhiệm của Bộ Tư pháp 1. Chủ trì, phối hợp với các cơ quan có liên quan triển khai các biện pháp phòng, chồng rửa tiên trong lĩnh vực công chứng, hành nghê luật sư. 2. Phối hợp với Ngân hàng Nhà nước Việt Nam thực hiện phổ biến, giáo dục pháp luật về phòng, chông rửa tiên. 3. Kiểm tra, giám sát hoạt động phòng, chống rửa tiền đối với các đối tượng báo cáo thuộc lĩnh vực quy định tại khoản ] Điều này, trong đó có căn cứ vào kết quả đánh giá rủi ro quôc gia về rửa tiền, kết quả đánh giá rủi ro về rửa tiền của đối tượng báo cáo đó. l 4. Phối hợp với Ngân hàng Nhà nước Việt Nam thực hiện đánh giá rủi ro quốc gia về rửa tiên quy định tại khoản ] Điều 7 của Luật này; thực hiện đánh giá, cập nhật rủi ro về rửa tiền quy định đại khoản 2 Điều 7 của Luật này đối với lĩnh vực quy định tại khoản 1 Điều này.”."],["D2.K16","k","Sửa đổi, bổ sung Điều 54 như sau: “Điều 54. Trách nhiệm của Bộ Công Thương 1. Chủ trì, phối hợp với các cơ quan có liên quan triển khai các biện pháp phòng, chông rửa tiên trong lĩnh vực kinh doanh kim khí quý, đá quý, trừ hoạt động kinh doanh vàng miêng. 2. Kiểm tra, giám sát hoạt động phòng, chống rửa tiền đối với đối tượng báo cáo thuộc lĩnh vực kinh doanh quy định tại khoản 1 Điều này, trong đó Có căn Cứ vào kết quả đánh giá rủi ro quốc gia về rửa tiền, kết quả đánh giá rủi ro về rửa tiền của đối tượng báo cáo đó. 3. Phối hợp với Ngân hàng Nhà nước Việt Nam thực hiện đánh giá rủi ro quốc gia về rửa tiền quy định tại khoản 1 Điều 7 của Luật này; thực hiện đánh giá, cập nhật rủi ro về rửa tiền quy định đại khoản 2 Điều 7 của Luật này đối với lĩnh vực quy định tại khoản: D .Điều này.”"],["D2.K17","k","Sửa đải, bộ. sung Điệu 58 như sau: “Điề '88: “Trách nhiện) của Bộ Văn hóa, Thể thao và Du lịch l. Chủ trì, phối hợp” với Các cơ quan có liên quan triển khai các biện pháp phòng, chống rửa tiền \\ trồnG ] lĩñh vực kinh doanh trò chơi điện tử trên mạng."],["D2.K2~2","k","Kiểm tiaygiảm- sốt hoạt động phòng, chống rửa tiền đối với đối tượng báo cáo thuộc lĩnh vực quy định tại khoản 1 Điều này, trong đó có căn cứ vào kết quả đánh giá rủi ro quôc gia về rửa tiền, kết quả đánh giá rủi ro về rửa tiền của đối tượng báo cáo đó. 12"],["D2.K3~2","k","Phối hợp với Ngân hàng Nhà nước Việt Nam thực hiện đánh giá rủi ro quốc gia về rửa tiên quy định tại khoản I Điều 7 của Luật này; thực hiện đánh giá, cập nhật rủi ro về rửa tiền quy định đại khoản 2 Điều 7 của Luật này đối với lĩnh vực quy định tại khoản 1 Điều này.”"],["D2.K18","k","Sửa đôi, bố sung Điều 59 như sau: | “Điều 59. Trách nhiệm của các Bộ, ngành khác 1. Phối hợp với Ngân hàng Nhà nước Việt Nam thực hiện quản lý nhà nước về phòng, chống rửa tiền. 2. Kiểm tra, giám sát hoạt động phòng, chống rửa tiền đối với đối tượng báo cáo thuộc phạm vi quản lý nhà nước của mình, trong đó có Căn cứ vào kết quả đánh giá rủi ro quốc gia về rửa tiền, kết quả đánh giá rủi ro về rửa tiền của đối tượng báo cáo đó. ị 3. Phối hợp với Ngân hàng Nhà nước Việt Nam và các Bộ, ngành có liên quan định kỳ thực hiện đánh giá, cập nhật rủi ro vệ rửa tiền quy định tại khoản 1 và khoản 2 Điều 7 của Luật này.”."],["D2.K19","k","Bãi bỏ Điều 55 và khoản 1 Điều 64. |"]],"u":1159},{"n":"Điều 3","t":"Sửa đối, bỗ sung khoản 2 Điều 114 của Luật Các tổ chức tín dụng","p":[],"u":1183},{"n":"Điều 4","t":"Điều khoản thi hành","p":[["D4.K1","k","Luật này có hiệu lực thi hành từ ngày 01 tháng 12 năm 2026."],["D4.K2","k","Bãi bỏ Điều 22 và khoản 2 Điều 34 của Pháp lệnh Ngoại hối số 28/2005/PL-UBTVQHII của Ủy ban Thường vụ Quốc hội đã được sửa đổi, bổ sung một số điều theo Pháp lệnh số 06/2013/UBTVQHI13. Ƒ ⁄ Luật này được Quốc hội nước Cộng hòa xã hội chủ nga Việt Nam khóa XEI, Kỹ) họp không thường lệ thứ Nhất thông qua ngày 24 tháng 8 năm 2026. SH QUỐC HỘI Trần Thanh Mẫn"]],"u":1184}],"24/2026/QH16":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đổi, bổ sung một số điễu theo Nghị quyết số 203/2025/QH15; Quốc hội ban hành Luật sửa đổi, bổ Sung một số điều của Luật Đầu tư số 143/2025/QH15."]],"u":0},{"n":"Điều 1","t":"Sửa đỗi, bỗ sung một số điều của Luật Đầu tư","p":[["D1.K1","k","Bố sung một số điểm, khoản của Điều 6 như sau: “m) Kinh doanh khí NạO để sử dụng cho con người qua đường hô hấp, trừ mục đích y tế, công nghệ thực phẩm, kiểm nghiệm, nghiên cứu khoa học và mục đích khác theo quy định của Chính phủ.”; “2a. Chính phủ quy định chỉ tiết điểm m khoản 1 Điều này.”."],["D1.K1.Đa","d","Bồ sung điểm m vào sau điểm l khoản 1 như sau:"],["D1.K1.Đb","d","Bồ sung khoản 2a vào sau khoản 2 như sau:"],["D1.K2","k","Thay thế Phụ lục IV về Danh mục ngành, nghề đầu tư kinh doanh có điều kiện bằng Phụ lục ban hành kèm theo Luật này."]],"u":1187},{"n":"Điều 2","t":"Điều khoản thi hành","p":[["D2.K1","k","Luật này có hiệu lực thi hành từ ngày 01 tháng 3 năm 2027, trừ quy định tại khoản 2 Điều này."],["D2.K2","k","Khoản 1 Điều 1 và khoản 1 Điều 3 của Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2027."],["D2.K3","k","Bộ, cơ quan ngang bộ quy định giải pháp, phương án quản lý thay thế (trong trường hợp cần thiết) đối với ngành, nghề đầu tư kinh doanh có điều kiện tại Phụ lục IV của Luật Đầu tư số 143/2025/QH15 nhưng đã bị bãi bỏ theo quy định của Luật này trước ngày 01 tháng 3 năm 2027."],["D2.K4","k","Sửa đổi, bổ sung khoản 1 và khoản 2 Điều 88 của Luật Xây dựng số 135/2025/QHI5 như sau: #1. Cá nhân đảm nhận chức danh trong hoạt động xây dựng phải có chứng chỉ hành nghề hoạt động xây dựng tương ứng theo quy định của Luật này, bao gồm: chủ nhiệm, chủ trì lập quy hoạch đô thị và nông thôn; chủ nhiệm khảo sát xây dựng; chủ nhiệm, chủ trì thiết kế, thẩm tra thiết kế xây dựng; giám sát thi công xây dựng. Chứng chỉ hành nghề được phân thành hạng I, hạng II và hạng III."],["D2.K2~2","k","Cá nhân đảm nhận chức danh giám đốc quản lý dự án đầu tư xây dựng, chỉ huy trưởng công trường phải đáp ứng điều kiện năng lực, kinh nghiệm nghề nghiệp.”."],["D2.K5","k","Bãi bỏ khoản 6 Điều 29 của Luật Đường bộ số 35/2024/QH15 đã được sửa đổi, bỗ sung một số điều theo Luật số 118/2025/QH15."]],"u":1192},{"n":"Điều 3","t":"Điều khoản chuyển tiếp","p":[["D3.K1","k","Hợp đồng kinh doanh khí NạO để sử dụng cho con người qua đường hô hấp, trừ mục đích y tế, công nghệ thực phẩm, kiểm nghiệm, nghiên cứu khoa học và mục đích khác theo quy định của Chính phủ đã giao kết thì chấm dứt hiệu lực từ ngày 01 tháng 01 năm 2027. Trong thời hạn tối đa 45 ngày từ ngày 01 tháng 01 năm 2027, các bên tham gia hợp đồng thực hiện thanh lý hợp đồng theo quy định của pháp luật về dân sự và quy định khác của pháp luật có liên quan."],["D3.K2","k","Chính phủ quy định xử lý chuyển tiếp đối với hoạt động dịch vụ hỗ trợ cấp thị thực của cơ sở kinh doanh được uỷ quyền đã thực hiện trước ngày 01 tháng 3 năm 2027."],["D3.K3","k","Đối với các ngành, nghề đầu tư kinh doanh có điều kiện quy định tại Phụ lục IV của Luật Đầu tư số 143/2025/QHI15 nhưng đã bị bãi bỏ theo quy định của Luật này thì thực hiện như sau: nghề này mà không cần đáp ứng điều kiện đầu tư kinh doanh; giấy phép, giấy chứng nhận, chứng chỉ, văn bản xác nhận hoặc văn bản cho phép đầu tư kinh doanh khác đã được cơ quan nhà nước có thâm quyền cấp đến hết thời hạn của văn bản, giấy tờ đó mà không phải thực hiện thủ tục cấp, điều chỉnh, gia hạn; giấy chứng nhận, chứng chỉ, văn bản xác nhận hoặc văn bản cho phép đầu tư kinh doanh khác đã được cơ quan nhà nước có thẩm quyền tiếp nhận hợp lệ trước ngày Luật này có hiệu lực thi hành nhưng chưa trả kêt quả, cơ quan nhà nước có thầm quyền thông báo về việc ngừng giải quyết và trả hồ sơ cho cá nhân, tô chức đã nộp. Luật này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XƯI, Kỳ họp không thường lệ thứ Nhất thông qua ngày 24 tháng 8 năm 2026. CHỦ TỊCH QUÓC HỘI Trần ng số 02/2020/UBTVOHI4, được sửa đối, bô sung tại Pháp lệnh số 05/2026/UBTVOH16,"],["CC6","c","Căn cứ Nghị định số 131/2021/NĐ-CP của Chính phủ quy định chỉ tiết và biện pháp thi hành Pháp lệnh Uu đãi người có công với cách mạng;"],["CC7","c","Căn cứ Nghị định số 276/2026/NĐ-CP của Chính phủ quy định chức năng, nhiệm vụ, quyên hạn và cơ cấu tô chức của Bộ Nội vụ;"],["CC8","c","Căn cứ Nghị định số 69/2024/NĐ-CP của Chính phủ quy định chỉ tiết về định danh và xác thực điện tử, được sửa đối, bố sung tại Nghị định số 320/202ØNĐ-CP;"],["CC9","c","Căn cứ Nghị định số 13 7⁄2024NĐ-CP của Chính phủ quy định về giao dịch điện tử của cơ quan nhà nước và hệ thông thông tin phục vụ giao dịch điện tử;"],["CC10","c","Căn cứ Nghị định số 165/2025/NĐ-CP của Chính phủ quy định chỉ tiết một số điều và biện pháp thì hành Luật Dữ liệu;"],["CC11","c","Căn cứ Nghị định số 356/2025/NĐ-CP của Chính phủ quy định chỉ tiết một số điêu và biện pháp thi hành Luật Bảo vệ đữ liệu cá nhân; __."],["CC12","c","Căn cứ Nghị định số 194/2025/NĐ-CP của Chính phủ quy định chỉ tiết một SỐ điêu của Luật Giao dịch điện tử về cơ sở đữ liệu quốc gia, kêt nồi và chia sẻ đữ liệu, đữ liệu mở phục vụ giao dịch điện tử của cơ quan nhà nưóc;"],["CC13","c","Căn cứ Nghị định số 278/2025/NĐ-CP của Chính phủ quy định về kết nối, chia sẻ dữ liệu bắt buộc giữa các cơ quan thuộc hệ thống chính trị; Theo đề nghị của Cục trưởng Cục Người có công; Bộ trưởng Bộ Nội vụ ban hành Thông tư quy định vỀ fqo lập đữ liệu và quản lý, sử dụng cơ sở đữ liệu về người có công với cách mạng. `ây 2 Chương Ï QUY ĐỊNH CHUNG"]],"u":0},{"n":"Điều 1","t":"Phạm vi điều chỉnh","p":[],"u":1206},{"n":"Điều 2","t":"Đối tượng áp dụng","p":[],"u":1207},{"n":"Điều 3","t":"Giải thích từ ngữ","p":[["D3.K1","k","Dữ liệu về người có công với cách mạng là dữ liệu sô phản ánh thông tin về việc xác nhận, công nhận và thực hiện chê độ ưu đãi đôi với người có công với cách mạng và thân nhân của người có công với cách mạng theo quy định của Pháp lệnh Ưu đãi người có công với cách mạng và pháp luật chuyên ngành khác có liên quan."],["D3.K2","k","Cơ sở dữ liệu thành phần của cơ sở dữ liệu về người có công với cách mạng là các cơ sở dữ liệu được Bộ Nội vụ xây dựng theo kê hoạch đê phục vụ phát triên khoa học, công nghệ, đôi mới sáng tạo và chuyên đôi sô quôc gia."],["D3.K3","k","Dữ liệu dùng chung về người có công với cách mạng là dữ liệu cơ bản, côt lõi về người có công với cách mạng được tạo lập, chuân hóa, lưu trữ và quản lý thông nhất trên phạm vi toàn quôc."],["D3.K4","k","Dữ liệu gốc của cơ sở dữ liệu về người có công với cách mạng là dữ liệu được tạo lập trọng quá trình tiếp nhận, giải quyết hồ sơ, thực hiện chính sách ưu đãi người có công với cách mạng của cơ quan, tô chức có thâm quyền; hoặc được thu thập, tạo lập từ việc số hóa bản chính giấy tờ, tài liệu về người hưởng chính sách ưu đãi người có công với cách mạng."],["D3.K5","k","Dữ liệu chủ của cơ sở dữ liệu về người có công với cách mạng là dữ liệu chứa thông tin cơ bản, đặc trưng nhất để định danh và mô tả đối tượng quản lý của cơ sở dữ liệu."],["D3.K6","k","Dữ liệu tham chiếu của cơ sở dữ liệu về người có công với cách mạng là đữ liệu do cơ sở dữ liệu quốc gia, cơ sở đữ liệu chuyên ngành hoặc cơ sở đữ liệu khác tạo lập, quản lý, được kết nối, chia sẻ, đồng bộ để sử dụng, đối chiếu mà không phải nhập lại."],["D3.K7","k","Danh mục đữ liệu gốc, dữ liệu chủ, dữ liệu tham chiếu của cơ sở đữ liệu về người có công với cách mạng quy định tại Phụ lục 1, Phụ lục 2, Phụ lục 3 ban hành kèm theo Thông tư này. 3 sÀ ˆ ^ ˆ - Lư ` - - ~ LTAd `® Lá"]],"u":1208},{"n":"Điều 4","t":"Nguyên tắc tạo lập, quản lý và sử dụng cơ sở dữ liệu người có","p":[["D4.K1","k","Cơ sở dữ liệu về người có công với cách mạng được xây dựng phục vụ công tác quản lý nhà nước của Bộ Nội vụ và các Bộ, ngành có liên quan, phục vụ cơ quan, tô chức, cá nhân trong thực hiện chính sách ưu đãi người có công với cách mạng, nhằm đơn giản hóa thủ tục hành chính, cắt giảm thành phần hồ sơ, tạo thuận lợi trong quá trình giải quyết các dịch vụ công trực tuyến; việc tạo lập, quản lý, kết nối, chia sẻ, khai thác và sử dụng phải tuân thủ quy định của pháp luật; đữ liệu phải đồng bộ, thống nhất từ Trung ương đến địa phương, phù hợp tiêu chuẩn, quy chuẩn kỹ thuật về cấu trúc, định dạng, giao thức kết nối và yêu cầu liên thông dữ liệu."],["D4.K2","k","Dữ liệu về người có công với cách mạng được thu thập từ nguồn đữ liệu gốc, hạn chế tối đa việc thu thập trùng lặp; ưu tiên kết nối, chia sẻ, tái sử dụng đỡ liệu đã có trong các cơ sở đữ liệu quốc gia, cơ sở dữ liệu ngành Nội vụ và các cơ sở dữ liệu khác theo quy định của pháp luật. Siêu dữ liệu về người có công với cách mạng là dữ liệu mô tả cấu trúc, kiểu thông tin, kích thước, nguồn gốc và các thuộc tính của dữ liệu về người có công với cách mạng, phục vụ việc quản lý, tra cứu, kết nối, chia sẻ và bảo đảm khả năng tái sử dụng dữ liệu."],["D4.K3","k","Việc kết nối, chia sẻ dữ liệu trong nội bộ Bộ Nội vụ được thực biện thông qua Nền tảng tích hợp, chia sẻ, điều phối đữ liệu của Bộ Nội vụ; việc kết nối, chia sẻ dữ liệu với cơ sở dữ liệu quốc gia, cơ sở dữ liệu của các Bộ, ngành, địa phương được thực hiện theo quy định tại Thông tư số 19/2026/TT-BNV ngày 20 tháng 8 năm 2026 của Bộ trưởng Bộ Nội vụ quy định về quản lý, cập nhật, kết nối, chia sẻ, khai thác và sử dụng cơ sở dữ liệu ngành Nội vụ (Thông tư số 19/2026/TT-BNV) và quy định khác của pháp luật về kết nối, chia sẻ đữ liệu."],["D4.K4","k","Các cơ quan, tổ chức phải bảo đảm an toàn, bảo mật, bảo vệ đữ liệu cá nhân theo quy định; đối với dữ liệu lịch sử, đữ liệu hình thành từ hồ sơ giấy hoặc trường hợp thông tin có sự khác biệt giữa các nguồn đữ liệu phải thực hiện việc kiểm tra, đối chiếu, xác minh và chuẩn hóa theo quy định."],["D4.K5","k","Bảo đảm phân định rõ trách nhiệm của cơ quan quản lý dữ liệu, cơ quan khai thác dữ liệu và cá nhân được giao quản trị, sử dụng dữ liệu trong toàn bộ quá trình vận hành cơ sở đữ liệu; việc tạo lập, cập nhật, chỉnh sửa, khai thác và sử dụng dữ liệu phải bảo đảm lưu giữ đầy đủ hồ sơ, nhật ký xử lý đữ liệu và bằng chứng điện tử phát sinh theo quy định của pháp luật về lưu trữ."],["D4.K6","k","Bảo đảm phù hợp với Khung kiến trúc tổng thể quốc gia số, Khung kiến trúc đữ liệu quốc gia, Khung quán trị, quản lý dữ liệu quốc gia, Từ điển dữ liệu dùng chung; đáp ứng tiêu chuẩn, quy chuẩn kỹ thuật; bảo đảm khả năng kết nối, chia sẻ dữ liệu theo quy định của pháp luật. 4 Chương TẠO LẬP, QUẢN LÝ, SỬ ĐỤNG CƠ SỞ DỮ LIỆU VỀ NGƯỜI CÓ CÔNG VỚI CÁCH MẠNG"]],"u":1216},{"n":"Điều 5","t":"Cơ sở dữ liệu thành phần của cơ sở dữ liệu về người có công với cách mạng","p":[["D5.K1","k","Cơ sở dữ liệu người hưởng chính sách ưu đãi người có công là cơ sở dữ liệu phục vụ công tác quản lý nhà nước lĩnh vực ưu đãi người có công, bao gôm các nhóm đữ liệu sau: lệnh Ưu đãi người có công với cách mạng. có công và thân nhân người có công."],["D5.K1.Đa","d","Dữ liệu về nhân thân người có công."],["D5.K1.Đb","d","Dữ liệu về người hưởng các chính sách ưu đãi người có công theo Pháp"],["D5.K1.Đc","d","Dữ liệu về chỉ trả trợ cấp, phụ cấp."],["D5.K1.Đd","d","Dữ liệu về thực hiện các chính sách ưu đãi ngoài trợ cấp đối với người"],["D5.K2","k","Cơ sở dữ liệu về liệt sĩ, mộ liệt sĩ và nghĩa trang liệt sĩ là cơ sở dữ liệu phục vụ công tác quản lý nhà nước về liệt sĩ, mộ liệt sĩ và công trình ghi công liệt sĩ, bao gôm các nhóm đữ liệu sau: giây chứng nhận hy sinh. quản lý."],["D5.K2.Đa","d","Dữ liệu về liệt sĩ gồm các trường thông tin ghi trong giấy báo tử hoặc"],["D5.K2.Đb","d","Dữ liệu về thân nhân lHệt sĩ có tên trong hồ sơ công nhận liệt sĩ."],["D5.K2.Đc","d","Dữ liệu về mộ liệt sĩ tại các nghĩa trang liệt sĩ và mộ liệt sĩ do gia đình"],["D5.K2.Đd","d","Dữ liệu về nghĩa trang liệt sĩ."],["D5.K2.Đđ","d","Dữ liệu về công trình ghi công liệt sĩ."],["D5.K2.Đe","d","Dữ liệu về hài cốt liệt sĩ được tìm kiếm, quy tập về nghĩa trang liệt sĩ."],["D5.K3","k","Cơ sở dữ liệu ADN của liệt sĩ và thân nhân là cơ sở dữ liệu phục vụ công tác quản lý nhà nước vê xác định danh tính hài côt liệt sĩ, bao gỗm các nhóm đữ liệu sau: tìm kiêm hài côt liệt sĩ. ©) Dữ liệu về kết luận chuyên môn giám định ADN hài cốt liệt sĩ, thân nhân liệt sĩ và xác định danh tính hài cốt liệt sĩ (không lưu trữ dữ liệu trình tự gen). ____ đ) Dữ liệu về hồ sơ đề nghị giám định ADN liệt sĩ, ADN thân nhân liệt sĩ đề xác định danh tính hài côt liệt sĩ và hô sơ đề nghị xác định danh tính hài côt liệt sĩ băng phương pháp thực chứng. 5 hài cốt liệt sĩ."],["D5.K3.Đa","d","Dữ liệu khai thác từ dữ liệu tại khoản 1, khoản 2 Điều này.."],["D5.K3.Đb","d","Dữ liệu về lấy mẫu hài cốt liệt sĩ trong nghĩa trang liệt sĩ và quy tập,"],["D5.K3.Đđ","d","Dữ liệu về các đơn vị giám định tham gia thực hiện xác định danh tính"],["D5.K3.Đe","d","Dữ liệu về đơn vị lấy mẫu hài cốt liệt sĩ, lấy mẫu thân nhân liệt sĩ."],["D5.K4","k","Chỉ tiết các trường đữ liệu của từng cơ sở dữ liệu thành phần quy định tại khoản 1, khoản 2, khoản 3 Điều này được quy định cụ thể tại Phụ lục 1, Phụ lục 2, Phụ lục 3 ban hành kèm theo Thông tư này."]],"u":1223},{"n":"Điều 6","t":"Nội dung quản lý cơ sở dữ liệu về người có công với cách mạng","p":[["D6.K1","k","Thu thập, tạo lập, cập nhật dữ liệu để hình thành cơ sở dữ liệu."],["D6.K2","k","Cấp, quản lý tài khoản truy cập cơ sở dữ liệu."],["D6.K3","k","Duy trì, quản lý sự thay đối dữ liệu."],["D6.K4","k","Kết nối, chia sẻ đữ liệu và quản lý kết nối, chia sẻ dữ liệu."],["D6.K5","k","Khai thác, sử dụng đữ liệu."],["D6.K6","k","Lưu trữ dữ liệu."],["D6.K7","k","Xử lý sự cố."]],"u":1242},{"n":"Điều 7","t":"Thu thập, tạo lập, cập nhật dữ liệu để hình thành cơ sở dữ liệu về người có công với cách mạng","p":[["D7.K1","k","Nguồn tạo lập, cập nhật dữ liệu tạo lập từ kết quả giải quyết thủ tục hành chính của cơ quan có thâm quyền theo quy định tại Nghị định số 131/2021/NĐ-CP ngày 30 tháng 12 năm 2021 của Chính phủ quy định chi tiết và biện pháp thi hành Pháp lệnh Ưu đãi người có công với cách mạng. lập, cập nhật trên cơ sở hồ sơ, tài liệu lưu trữ theo kế hoạch của các địa phương, cơ quan, đơn vị theo quy định của pháp luật về lưu trữ, thống kê và pháp luật có liên quan. bộ từ các hệ thống thông tin, cơ sở đữ liệu quốc gia, cơ sở dữ liệu chuyên ngành khác theo quy định của pháp luật về đữ liệu và pháp luật có liên quan."],["D7.K1.Đa","d","Dữ liệu từ quy trình nghiệp vụ giải quyết các thủ tục hành chính được"],["D7.K1.Đb","d","Dữ liệu từ hoạt động thống kê, số hóa, chuẩn hóa thông tin được tạo"],["D7.K1.Đc","d","Dữ liệu được kết nối, chia sẻ sẽ hình thành tự động theo thời điểm đồng"],["D7.K2","k","Tần suất cập nhật đữ liệu theo thời gian quy định tại văn bản quy phạm pháp luật về lĩnh vực người có công với cách mạng. theo kế hoạch được phê duyệt của cơ quan, đơn vị quản lý hồ sơ, tài liệu và phải được kiểm tra, đối chiếu, xác thực, chuẩn hóa theo quy định về tiêu chuẩn dữ liệu, quy chuẩn kỹ thuật và danh mục dùng chung trước khi cập nhật vào cơ sở đữ liệu. đồng bộ từ các hệ thống thông tin, cơ sở dữ liệu quốc gia, cơ sở dữ liệu chuyên ngành."],["D7.K2.Đa","d","Dữ liệu được tạo lập, cập nhật quy định tại điểm a khoản 1 Điều này"],["D7.K2.Đb","d","Dữ liệu được tạo lập, cập nhật quy định tại điểm b khoản 1 Điều này"],["D7.K2.Đc","d","Dữ liệu quy định tại điểm c khoản 1 Điều này theo thời gian thực được"],["D7.K3","k","Phê duyệt dữ liệu duyệt dữ liệu băng chữ ký sô hoặc phương thức xác thực điện tử trên hệ thông cơ sở đữ liệu. thực hiện việc phê duyệt dữ liệu trong thời hạn quy định thì phải thực hiện việc ủy quyền băng văn bản hoặc ủy quyên điện tử hoặc phê duyệt thay thê theo quy định về quản lý hồ sơ nội bộ đề bảo đảm tính kịp thời. có trách nhiệm tạo lập, cập nhật dữ liệu lập biên bản, tiên hành kiêm tra, Xác minh và thực hiện điêu chỉnh, cập nhật dữ liệu theo đúng thâm quyên và quy định của pháp luật."],["D7.K3.Đa","d","Người có thâm quyền của cơ quan, đơn vị có trách nhiệm kiểm tra, phê"],["D7.K3.Đb","d","Trường hợp người có thâm quyền phê duyệt vắng mặt hoặc không thể"],["D7.K3.Đc","d","Khi phát hiện sai sót trong tạo lập, cập nhật dữ liệu, cơ quan, đơn vị"],["D7.K4","k","Các quy định khác về cập nhật dữ liệu thực hiện theo quy định tại Điều 7 Thông tư sô 19/2026/TT-BNV."]],"u":1250},{"n":"Điều 8","t":"Cấp và quản lý tài khoản truy cập cơ sở dữ liệu về người có công với cách mạng","p":[["D8.K1","k","Việc truy cập cơ sở đữ liệu về người có công với cách mạng được thực hiện thông qua tài khoản do Cục Người có công cấp cho cơ quan, tổ chức, cá nhân phù hợp với chức năng, nhiệm vụ và phạm vi khai thác, sử dụng dữ liệu và được định kỳ rà soát tài khoản truy cập."],["D8.K2","k","Cơ quan, tổ chức, cá nhân được cấp tài khoản chịu trách nhiệm bảo mật tài khoản, bảo mật dữ liệu và quản lý, sử dụng tài khoản theo quy định. Hệ thống quản lý phải sử dụng giải pháp xác thực nhiều lớp khi đăng nhập và lưu lịch sử cấp quyền theo thời gian lưu nhật ký hệ thống."],["D8.K3","k","Tài khoản được thu hồi, khóa truy cập ngay trong các trường hợp sau: quyên truy cập. hưu, thôi việc, chuyển công tác, điều động, luân chuyền sang đơn vị khác."],["D8.K3.Đa","d","Cơ quan, tô chức giải thể hoặc thay đổi chức năng không còn thâm"],["D8.K3.Đb","d","Cá nhân vi phạm pháp luật, bị kỷ luật liên quan đến cơ sở đữ liệu, nghỉ"]],"u":1264},{"n":"Điều 9","t":"Duy trì, quản lý sự thay đổi dữ liệu trong cơ sở dữ liệu về người có công với cách mạng","p":[["D9.K1","k","Dữ liệu về người có công với cách mạng phải được duy trì thường xuyên nhắm bảo đảm tính đây đủ, chính xác, thông nhât, toàn vẹn, kịp thời, phù hợp với yêu cầu quản lý nhà nước về ưu đãi người có công."],["D9.K2","k","Khi có sự thay đổi về thông tin, dữ liệu gốc, quy định của pháp luật, tiêu chuẩn dữ liệu, danh mục dùng chung hoặc yêu câu quản lý, cơ quan quản lý cơ sở dữ liệu có trách nhiệm cập nhật, hiệu chỉnh hoặc xử lý dữ liệu theo thấm quyền. Việc thay đổi, hiệu chỉnh đữ liệu phải bảo đảm khả năng truy xuất nguồn gốc, thời điểm thay đổi, chủ thê thực hiện và nội dung thay đổi; lịch sử thay đối đữ liệu được ghi nhận trên hệ thống theo quy định. « DU) 7"],["D9.K3","k","Dữ liệu được kiểm tra, đánh giá định kỳ về: tính đầy đủ; tính chính xác; tính thống nhất; tính kịp thời; khả năng sử dụng lại. Đối với các đữ liệu ít biến động (thông tin liệt sĩ, nghĩa trang liệt sĩ), việc đối soát được thực hiện định kỳ 06 tháng một lần; đối với dữ liệu có thể biến động thường xuyên (chế độ, trợ cấp), việc đối soát được thực hiện theo thời hạn quy định tại văn bản quy phạm pháp luật về lĩnh vực người có công."],["D9.K4","k","Khi phát hiện dữ liệu sai lệch giữa Cơ sở dữ liệu về người có công với cách mạng và Cơ sở đữ liệu quốc gia về dân cư hoặc cơ sở đữ liệu chuyên ngành có liên quan, cơ quan quản lý cơ sở dữ liệu chủ trì, phối hợp rà soát, lập biên bản xác minh và điều chỉnh, cập nhật dữ liệu theo thẩm quyên."],["D9.K5","k","Cơ quan quản lý cơ sở đữ liệu tô chức kiểm tra, đánh giá, làm sạch đữ liệu, xử lý dữ liệu trùng lặp; đối với dữ liệu không còn giá trị sử dụng theo quy định của pháp luật, tổ chức hủy bỏ theo quy trình an toàn, bảo đảm xóa bỏ hoàn toàn, không thể phục hồi theo quy định của pháp luật về lưu trữ, đữ liệu, bảo vệ dữ liệu cá nhân và pháp luật có liên quan."]],"u":1270},{"n":"Điều 10","t":"Kết nối, chia sẻ dữ liệu và quản lý kết nối, chia sẻ dữ liệu cơ sở dữ liệu về người có công với cách mạng","p":[["D10.K1","k","Việc kết nối, chia sẻ đữ liệu giữa Cơ sở đữ liệu về người có công với cách mạng với các cơ sở dữ liệu khác thuộc ngành Nội vụ được thực hiện thông qua Nền tảng tích hợp, chia sẻ, điều phối dữ liệu Bộ Nội vụ (LGSP/LDOP)."],["D10.K2","k","Việc kết nối, chia sẻ dữ liệu về người có công với cách mạng với các hệ thống thông tin, cơ sở đữ liệu quốc gia, cơ sở dữ liệu của Bộ, ngành, địa phương được thực hiện thông qua Nền tảng tích hợp, chia sẻ dữ liệu quốc gia (NDXP) và Nền táng chia sẻ, điều phối dữ liệu của Trung tâm đữ liệu quốc gia (NDOP)."],["D10.K3","k","Phương thức chia sẻ dữ liệu được thực hiện thông qua. giao diện lập trình Ứng dụng (API) trực tiếp hoặc đồng bộ theo tài liệu hướng dẫn kỹ thuật kết nối thống nhất do cơ quan quản lý cơ sở dữ liệu ban hành."],["D10.K4","k","Dữ liệu được chia sẻ phải đúng phạm vi, mục đích sử dụng, phương thức, thời hạn và định dạng theo quy định; bảo đảm tính đây đủ, chính xác, kịp thời, an toàn và bảo mật."],["D10.K5","k","Dữ liệu gốc, dữ liệu chủ, dữ liệu tham chiếu tại Phụ lục 1, Phụ lục 2, Phụ lục 3 ban hành kèm theo Thông tư này trước khi kết nối, chia sẻ phải được kiểm tra, đánh giá và việc đồng bộ dữ liệu chủ, đữ liệu tham chiếu được đồng bộ theo thời gian thực."],["D10.K6","k","Các hoạt động về quản lý đăng nhập, xác thực điện tử, ghi nhận nhật ký kết nối, thời điểm kết nối, hoạt động chia sẻ và các thông tin cần thiết phục vụ kiểm tra, truy vết tuân thủ quy định của pháp luật về dữ liệu, giao dịch điện tử, an toàn thông tin, an ninh mạng, bảo vệ bí mật nhà nước, bảo vệ dữ liệu cá nhân và quy định của Bộ Nội vụ. §"]],"u":1276},{"n":"Điều 11","t":"Khai thác và sử dụng từ dữ liệu cơ sở dữ liệu về người có công với cách mạng","p":[["D11.K1","k","Hình thức khai thác dữ liệu gồm: khai thác trực tuyến trên hệ thống: khai thác thông qua kết nôi, chia sẻ dữ liệu; khai thác thông qua dịch vụ dữ liệu; hình thức khác theo quy định của pháp luật."],["D11.K2","k","Quyền khai thác dữ liệu được xác lập theo chức năng, nhiệm vụ và phạm vi quản lý; chỉ được khai thác các trường thông tin cần thiết, phù hợp mục đích đã đăng ký; không sử dụng dữ liệu cho mục đích khác hoặc chia sẻ lại cho bên thứ ba khi chưa được phép. Đối với dữ liệu cá nhân, dữ liệu nhạy cảm, việc khai thác phải được phân quyền chặt chẽ, có cơ chế kiểm soát, ghi nhận lịch sử khai thác."],["D11.K3","k","Người có công, thân nhân người có công và người hưởng chính sách ưu đãi người có công được khai thác, sử dụng thông tin của mình thông qua tài khoản định danh điện tử trên Ứng dụng định danh quốc gia (VNeID), các phương thức khác theo quy định của pháp luật. Việc khai thác, sử dụng dữ liệu thông qua Ứng dụng định danh quốc gia (VN eID) được thực hiện trên cơ sở kết nối, chia sẻ dữ liệu giữa cơ sở đữ liệu về người có công với cách mạng với hệ thống định danh và xác thực điện tử, bảo đảm đúng quy định của pháp luật."],["D11.K4","k","Dữ liệu về người có công với cách mạng được sử dụng triên khai thực hiện quản lý nhà nước về người có công theo quy định. ° ~ ~ .^ x4 ~ .^ À `® Lá ^ ze«® L4"]],"u":1283},{"n":"Điều 12","t":"Lưu trữ dữ liệu cơ sở dữ liệu về người có công với cách mạng","p":[["D12.K1","k","Dữ liệu về người có công với cách mạng được lưu trữ tại Trung tâm dữ liệu Bộ Nội vụ hoặc Trung tâm dữ liệu quốc gia theo quy định của Thông tư số 12/2026/1T- BNV; được sao lưu định kỳ và bảo đảm khả năng phục hồi khi có sự CỐ."],["D12.K2","k","Dữ liệu, “hồ sơ, tài liệu về liệt sĩ, mộ liệt sĩ được bảo đảm khả năng sẵn sàng kết nối, nộp vào lưu trữ lịch sử theo quy định của pháp luật về lưu trữ khi đên hạn. .À b4 , Ẩ - ~ . ` `.® Lá ˆ^ z\"Ằ® Lá"]],"u":1288},{"n":"Điều 13","t":"Xử lý sự cô cơ sở dữ liệu về người có công với cách mạng","p":[["D13.K1","k","Khi phát hiện sự cố ảnh hưởng hoặc có nguy cơ ảnh hưởng đến tính đầy đủ, chính xác, toàn vẹn, sẵn sàng, bảo mật của cơ sở dữ liệu về người có công với cách mạng, cơ quan, tổ chức, cá nhân phải kịp thời thông báo cho cơ quan quản lý cơ sở dữ liệu để thực hiện các biện pháp cần thiết hạn chế phạm vị, mức độ ảnh hưởng."],["D13.K2","k","Căn cứ tính chất, mức độ của sự cố, cơ quan quản lý, vận hành cơ sở dữ liệu về người có công với cách mạng chủ trì, phối hợp với cơ quan, đơn vị có liên quan xác định nguyên nhân, phạm vi, mức độ ảnh hưởng để tô chức xử lý, khắc phục sự cố theo quy định. *% 9 Chương HH TỎ CHỨC THỰC HIỆN"]],"u":1291},{"n":"Điều 14","t":"Trách nhiệm thực hiện","p":[["D14.K1","k","Bộ Nội vụ có trách nhiệm: cách mạng phục vụ quản lý nhà nước và thực hiện chính sách ưu đãi người có công với cách mạng bảo đảm kịp thời, chính xác, an toàn, đúng quy định. Thường xuyên rà soát, cập nhật các trường dữ liệu chỉ tiết của các cơ sở dữ liệu thành phân của cơ sở dữ liệu về người có công với cách mạng bảo đảm đúng quy định của pháp luật. các sự cô kỹ thuật phát sinh trong quá trình tạo lập, cập nhật, khai thác, sử dụng và quản trị, vận hành cơ sở đữ liệu về : TEƯỜI có công với cách mạng. thống định danh và xác thực điện tử với cơ sở đữ liệu về người có công với cách mạng để phục vụ xác thực, đối soát thông tin công dân, tái sử dụng dỡ liệu và cung cấp các tiện ích cho người dân thông qua VNeID theo quy định của pháp luật. liệu và quản lý, sử dụng cơ sở dữ liệu về người có công với cách mạng. mạng để các cơ quan, tố chức, cá nhân tiếp cận, sử dụng, tái sử dụng, chia sẻ theo điều kiện sử dụng được công bó, trừ dữ liệu cá nhân, dữ liệu nhạy cảm, dữ liệu thuộc bí mật nhà nước và dữ liệu khác không được phép công khai theo quy định của pháp luật."],["D14.K1.Đa","d","Chỉ đạo, tổ chức xây dựng, quản lý cơ sở dữ liệu về nPƯỜI có công với"],["D14.K1.Đb","d","Chỉ đạo kiểm tra, đánh giá chất lượng, đối soát đữ liệu và khắc phục"],["D14.K1.Đc","d","Phối hợp với Bộ Công an kết nối Cơ sở dữ liệu quốc gia về dân cư, hệ"],["D14.K1.Đd","d","Chủ trì, đôn đốc, hướng dẫn các đơn vị liên quan trong việc tạo lập dữ"],["D14.K1.Đđ","d","Thực hiện công bố, cung cấp dữ liệu mở về người có công với cách"],["D14.K2","k","Cục Người có công tham mưu, giúp Bộ trưởng Bộ Nội vụ trong phạm vi chức năng, nhiệm vụ. và quyền hạn được giao, thực hiện quản lý cơ sở dữ liệu về người có công với cách mạng, thực hiện quản trị, vận hành, cập nhật, kết nối, chia sẻ, khai thác và sử dụng cơ sở đữ liệu."],["D14.K3","k","Các cơ quan, tổ chức, đơn vị có liên quan trong phạm vi chức năng, nhiệm vụ, quyền hạn được ø1ao có trách nhiệm: phạm vi quản lý theo quy định của pháp luật ưu đãi người có công với cách. mạng và pháp luật có liên quan; bảo đảm dữ liệu đầy đủ, chính xác, kịp thời, thống nhất và chịu trách nhiệm về nội dung đữ liệu cung cấp;"],["D14.K3.Đa","d","Thực hiện số hóa, tạo lập, cập nhật, chuẩn hóa, quản lý dữ liệu thuộc"],["D14.K3.Đb","d","Thực hiện kết nối, chia sẻ dữ liệu theo quy định."]],"u":1294},{"n":"Đ
