6A, Mẫu số 7, Mẫu số 8, Mẫu số 9, Mẫu số 10, Mẫu số I1, Mẫu số 12 tại Phụ lục ban hành kèm theo Nghị định này."],["D7.K4","k","Bỏ sưẾổ Mẫu Só,6B về kết quả xác nhận đối tượng là thanh niên xung phong cơ Sở ở miên Nam Ìại Phụ lục ban hành kèm theo Nghị định này."],["D7.K5","k","Bãi bỏ Mẫu số 10, Mẫu số 11B tại Phụ lục ban hành kèm theo Nghị định số 112/3017/NĐ-CP."]],"u":1763},{"n":"Điều 8","t":"Điều khoảnthi hành","p":[["D8.K1","k","Nghị định này có hiệu lực thi hành từ ngày 01 tháng 12 năm 2026."],["D8.K2","k","Kể từ ngày Nghị định này có hiệu lực thi hành, bãi bỏ quy định tại khoản 2 Điều 1 Nghị định số 344/2025/NĐ-CP ngày 29 tháng 12 năm 2025 của Chính phủ điều chỉnh mức trợ cấp hằng tháng đối với thanh niên xung phong đã hoàn thành nhiệm vụ trong kháng chiến và thanh niên xung phong cơ sở ở miền Nam tham gia kháng chiến giai đoạn 1965 - 1975."],["D8.K3","k","Điều 64, Điều 65 Chương VI; Mục ! Phụ lục I; Mẫu số 02, Mẫu số 03 Phụ lục II ban hành kèm theo Nghị định số 129/2025/NĐ- CP ngày lI tháng 6 năm 2025 của Chính phủ quy định về phân định thâm quyền của chính quyền địa phương 02 cấp trong lĩnh vực quản lý nhà nước của Bộ Nội vụ hết hiệu lực kể từ ngày Nghị định này có hiệu lực."]],"u":1769},{"n":"Điều 9","t":"Điều khoản chuyển tiếp, trách nhiệm thi hành","p":[["D9.K1","k","Các đối tượng đã nộp hồ sơ và được cơ quan có thẩm quyền tiếp nhận trước ngày Nghị định này có hiệu lực thi hành thì tiếp tục được giải quyết theo quy định tại Nghị định số 112/2017/NĐ-CP, Nghị định số 344/2025/NĐ-CP và các văn bản quy phạm pháp luật có liên quan."],["D9.K2","k","Thanh niên xung phong cơ sở ở miền Nam chết từ ngày 20 tháng 11 năm 2017 đến trước ngày Nghị định này có hiệu lực thi hành mà chưa được giải quyết chế độ trợ cấp một lần và không còn lưu giữ giấy tờ để giải quyết chế độ trợ cấp mai táng, quy định tại Nghị định số 112/2017/NĐ- CP thì thân nhân được lập hồ sơ đề nghị xem xét hưởng chế độ trợ cấp một lần bằng 3.600.000 đồng quy định tại khoản 3 Điều 4 Nghị định số 112/2017/NĐ-CP nếu đáp ứng đủ điều kiện theo quy định. ˆ"],["D9.K3","k","Các văn bản dẫn chiếu tại Nghị định này được sửa đổi, bổ sung hoặc thay thế bằng văn bản khác thì nội dung dẫn chiếu được thực hiện theo các văn bản mới."],["D9.K4","k","Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phô chịu trách nhiệm thi hành Nghị định này. sài ' NẾ : : TM. CHINH PHU ~ Ban Bí thư Trung ương Đảng; % ^ - Thủ tướng, các Phó Thủ tướng Chính phủ; KT, THỦ TƯƠNG - Các bộ, cơ quan ngang bộ; HO THU TƯỜNG - HĐND, UBND các tỉnh, thành phố; - Văn phòng Trung ương và các Ban của Đảng; - Văn phòng Tổng Bí thư; - Văn phòng Chủ tịch nước; - Hội đồng Dân tộc và các Ủy ban của Quốc hội; - Văn phòng Quốc hội; - Tòa án nhân dân tôi cao; ~ Viện kiểm sát nhân dân tối Cao; - Kiểm toán nhà nước; - Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam; - Cơ quan Trung ương của các tổ chức chính trị - xã hội; - Hội Cựu thanh niên xung phong Việt Nam; - VPCP: BTCN, các PCN, Trợ lý TTg, các Vụ, Cục, Công báo; - Lưu: VT, KGVX Ø2 $ X( ÁC MẪU BIÊU (Kèm theo Nghị định sẴŠ SẾ 24Ð⁄ P ngày 13 tháng 10 năm 2026 của Chính phủ) Mẫu sô 1A Iniên xung phong cơ sở ở miên Nam X. ĐÁ Bản khai cá nhân đề nghị hưởng chế độ trợ cấp một lần đối với thanh Mẫu sô 1B Iniên xung phong cơ sở ở miền Nam đã chết X. QÁ Bản xác nhận của người làm chứng về đối tượng tham gia thanh niên Mẫu sô 2 = phong cơ sở ở miễn Nam Mẫu số 3A. | Đơn đề nghị xác nhận thanh niên xung phong cơ sở ở miền Nam Mẫu số 3B | Biên bản xác nhận thanh niên xung phong cơ sở ở miền Nam X. Bản khai cá nhân đề nghị hưởng chế độ trợ cấp hằng tháng đối với |Mâu sô 4 hanh niên xung phong cơ sở ở miền Nam X. .Á Biên bản Hội nghị xét hưởng chế độ trợ cấp đối với thanh niên xung IMâu sô 5 phong cơ sở ở miễn Nam Ẩ.. -Á Kết quả xét duyệt hồ SƠ giải quyết chế độ trợ cấp đối với thanh niên âu sô 6A xung phong cơ sở ở miền Nam ấu số 6B Kết quả xác nhận đối tượng là thanh niên xung phong cơ sở ở miên Nam lMẫu số Công văn xác nhận và để nghị xét hưởng ng theo quy định tại các văn bản đó đề xử phạt."]],"u":1796},{"n":"Điều 2","t":"Đối tượng áp dụng","p":[["D2.K1","k","Cá nhân, tổ chức Việt Nam, cá nhân, tổ chức nước ngoài có hành vi vi phạm hành chính trong lĩnh vực kinh doanh xổ số quy định tại Nghị định này."],["D2.K2","k","Tổ chức là đối tượng bị xử phạt vi phạm hành chính trong lĩnh vực kinh doanh xổ số theo quy định của Nghị định này gồm:"],["D2.K2.Đa","d","Doanh nghiệp kinh doanh xổ số;"],["D2.K2.Đb","d","Đại lý xổ số là tô chức;"],["D2.K2.Đe","d","Tổ chức khác có liên quan."],["D2.K3","k","Người có thẩm quyền xử phạt vi phạm hành chính, người có thâm quyền lập biên bản vi phạm hành chính và các cá nhân, tổ chức khác có liên quan."]],"u":1799},{"n":"Điều 3","t":"Hình thức xử phạt, biện pháp khắc phục hậu quả, mức phạt tiền, việc thi hành hình thức xử phạt đình chỉ hoạt động kinh doanh xố số có thời hạn và xử phạt vi phạm hành chính trên môi trường điện tử","p":[["D3.K1","k","Hình thức xử phạt chính bao gồm:"],["D3.K1.Đa","d","Cảnh cáo;"],["D3.K1.Đb","d","Phạt tiền."],["D3.K2","k","Hình thức xử phạt bố sung bao gồm: phạm hành chính (sau đây gọi tắt là tang vật, phương tiện vi phạm hành chính)."],["D3.K2.Đa","d","Đình chỉ hoạt động kinh doanh xổ số có thời hạn;"],["D3.K2.Đb","d","Tịch thu tang vật vi phạm hành chính, phương tiện được sử dụng đễ vi"],["D3.K3","k","Biện pháp khắc phục hậu quả: chữa, tây xóa làm sai lệch nội dung cho cơ quan cấp Giấy chứng nhận đủ điều kiện kinh doanh xô số; so với biên bản xác nhận của Hội đồng giám sắt xổ số; lĩnh thưởng; chính xác; ø) Buộc trang bị các thiết bị quay số mở thưởng đáp ứng yêu cầu theo quy định của pháp luật; chính; ï) Buộc thực hiện đúng quy định pháp luật về phòng, chống rửa tiền, phòng, chống khủng bố, phòng, chống phổ biến vũ khí hủy diệt hàng loạt."],["D3.K3.Đa","d","Buộc nộp lại Giấy chứng nhận đủ điều kiện kinh doanh xổ số bị sửa"],["D3.K3.Đb","d","Buộc thực hiện kinh doanh xổ số theo đúng địa bàn;"],["D3.K3.Đc","d","Buộc hủy bỏ, đính chính kết quả trúng thưởng bị sai lệch, không đúng"],["D3.K3.Đd","d","Buộc tiêu hủy vé xổ số bị cạo sửa, tây xóa để tham gia dự thưởng và"],["D3.K3.Đđ","d","Buộc bổ sung, đính chính số liệu đã báo cáo không đầy đủ, không"],["D3.K3.Đe","d","Buộc tiêu hủy tài liệu bị sửa chữa, tây xóa hoặc giả mạo;"],["D3.K3.Đh","d","Buộc nộp lại số lợi bất hợp pháp có được do thực hiện vi phạm hành"],["D3.K4","k","Mức phạt tiền đối với cá nhân, tô chức: Nghị định này là mức phạt tiền đối với tổ chức, trừ trường hợp quy định tại khoản 4 và khoản 5 Điều 8, khoản 1 Điều 11, khoản 1 Điều 13, khoản 1 và khoản 2 Điều 18 Nghị định này áp dụng đối với cá nhân; chức cho cùng hành vi vi phạm; lĩnh vực kinh doanh xổ số tối đa là 100.000.000 đồng, đối với tổ chức tối đa là 200.000.000 đồng."],["D3.K4.Đa","d","Mức phạt tiền đối với các hành vi vi phạm hành chính quy định tại"],["D3.K4.Đb","d","Mức phạt tiền đối với cá nhân bằng 1/2 lần mức phạt tiền đối với tô"],["D3.K4.Đc","d","Mức phạt tiền đối với cá nhân có hành vi vi phạm hành chính trong"],["D3.K5","k","Thi hành hình thức xử phạt đình chỉ hoạt động kinh doanh xổ số có thời hạn: Khi áp dụng hình thức xử phạt bổ sung đình chỉ hoạt động kinh doanh xô số có thời hạn quy định tại điểm b khoản 6 Điều 8, khoản 2 Điều 14, khoản 4 Điều 18, điểm a khoản 3 Điều 19, khoản 4 Điều 21 Nghị định này, cơ quan, người có thẩm quyền xác định địa bàn xảy ra hành vi vi phạm để làm căn cứ áp dụng hình thức đình chỉ hoạt động kinh doanh xổ số. Việc đình chỉ hoạt động kinh doanh xổ số được áp dụng đối với địa bàn nơi xảy ra hành vi vi phạm. Trường hợp doanh nghiệp kinh doanh xổ số hoạt động trên nhiều địa bàn thì chỉ đình chỉ hoạt động kinh doanh xổ số trên địa bàn xảy ra hành vi vi phạm."],["D3.K6","k","Việc xử lý vi phạm hành chính trong lĩnh vực kinh doanh xổ số trên môi trường điện tử được thực hiện theo quy định tại Điều 18a Luật Xử lý vi phạm hành chính, Điều 28a và Điều 28b Nghị định số 118/2021/NĐ-CP ngày 23 tháng 12 năm 2021 của Chính phủ quy định chỉ tiết một số điều và biện pháp thi hành Luật Xử lý vi phạm hành chính, được sửa đổi, bỗ sung bởi Nghị định số 68/2025/NĐ-CP ngày 18 tháng 3 năm 2025 của Chính phủ, Nghị định số 190/2025/NĐ-CP ngày 01 tháng 7 năm 2025 của Chính phủ và các văn bản sửa đổi, bổ sung (nếu có)."]],"u":1806},{"n":"Điều 4","t":"Thời hiệu xử phạt vi phạm hành chính đối với lĩnh vực kinh doanh xổ số","p":[["D4.K1","k","Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực kinh doanh xổ số thực hiện theo. quy định tại Điều 6 Luật Xử lý vi phạm hành chính và các văn bản sửa đổi, bổ sung (nếu có)."],["D4.K2","k","Thời điểm chấm dứt hành vi vi phạm để tính thời hiệu xử phạt đối với một số hành vi vi phạm tại Chương II Nghị định này được quy định như sau: sơ cấp Giấy chứng nhận đủ điều kiện kinh doanh xổ số, sửa chữa, tẩy xóa làm sai lệch nội dung Giấy chứng nhận đủ điều kiện kinh doanh xổ số, sửa chữa, tây xóa hoặc giả mạo các tài liệu trong hồ sơ làm đại lý xổ số quy định tại khoản 1 Điều 6, khoản 1 Điều 7 và khoản 1 Điều 13 Nghị định này nếu không xác định được ngày sửa chữa, tây xóa hoặc giả mạo các tài liệu trong hồ sơ cấp Giấy chứng nhận đủ điều kiện kinh doanh xổ số, sửa chữa, tây xóa Giấy chứng nhận đủ điều kiện kinh doanh xổ số, sửa chữa, tây xóa hoặc giả mạo các tài liệu trong hồ sơ làm đại lý xổ số thì thời điểm chấm dứt hành vi vi phạm là ngày phát hiện các tài liệu trong hồ sơ cấp Giấy chứng nhận đủ điều kiện kinh doanh xổ số, các tài liệu trong hồ sơ được làm đại lý xổ số bị sửa chữa, tây xóa làm sai lệch nội dung; chức thu hồi vé xổ số không tiêu thụ hết, không xây dựng và công bố công khai thể lệ quay số mở thưởng, không ban hành Quy chế quản lý, khai thác dữ liệu máy chủ kinh doanh xổ số điện toán quy định tại điểm a khoản 1 Điều 12, điểm c khoản 1 Điều 16 và khoản 1 Điều 21 Nghị định này, thời điểm chấm dứt hành vi vi phạm là ngày thực hiện ban hành Quy chế quy định chỉ tiết quy trình tổ chức thu hồi vé xổ số không tiêu thụ hết, công bố công khai thể lệ quay số mở thưởng, ban hành Quy chế quản lý, khai thác dữ liệu máy chủ kinh doanh xô số điện toán; Nghị định này, thời điểm chấm dứt hành vi vi phạm là ngày thực hiện báo cáo."],["D4.K2.Đa","d","Đối với hành vi sửa chữa, tẩy xóa hoặc giả mạo các tài liệu trong hồ"],["D4.K2.Đb","d","Đối với hành vi không ban hành quy chế quy định chỉ tiết quy trình tổ"],["D4.K2.Đc","d","Đối với hành vi vi phạm quy định về chế độ báo cáo quy định tại Điều 23"]],"u":1827},{"n":"Điều 5","t":"Chuyển hồ sơ vụ vi phạm có dấu hiệu tội phạm để truy cứu trách nhiệm hình sự","p":[["D5.K1","k","Khi phát hiện hành vi vi phạm quy định tại khoản 1 Điều 6, khoản 1, khoản 3 Điều 7, khoản 1 Điều 13, khoản 1 Điều 14, khoản 3 Điều 16, khoản 1 Điều 18, điểm b khoản 3 Điều 24 Nghị định này, nếu xét thấy hành vi vi phạm có dấu hiệu tội phạm, người có thâm quyền đang thụ lý vụ việc phải chuyển ngay hồ sơ vụ vi phạm đến cơ quan tiến hành tổ tụng hình sự để truy cứu trách nhiệm hình sự theo quy định tại Điều 62 Luật Xử lý vi phạm hành chính."],["D5.K2","k","Trường hợp cơ quan tiến hành tố tụng hình sự không truy cứu trách nhiệm hình sự thì chuyên hồ sơ vụ vi phạm đến người có thâm quyền xử phạt vi phạm hành chính theo quy định tại khoản 3 Điều 62 và Điều 63 Luật Xử lý vi phạm hành chính đề xử phạt vi phạm hành chính theo quy định tại Nghị định này."]],"u":1833},{"n":"Điều 6","t":"Hành vi vi phạm quy định về hồ sơ cấp Giấy chứng nhận đủ điều kiện kinh doanh xố số","p":[["D6.K1","k","Phạt tiền từ 40.000.000 đồng đến 60.000. 000 đồng đối với hành vi sửa chữa, tây xóa hoặc giả mạo các tài liệu trong hồ sơ cấp Giấy chứng nhận đủ điều kiện kinh doanh xổ số nhưng chưa đến mức bị truy cứu trách nhiệm hình sự."],["D6.K2","k","Biện pháp khắc phục hậu quả: hành vi vi phạm hành chính quy định tại khoản l Điều này; phạm hành chính quy định tại khoản 1 Điều này."],["D6.K2.Đa","d","Buộc tiêu hủy tài liệu đã bị sửa chữa, tây xóa hoặc giả mạo đối với"],["D6.K2.Đb","d","Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi"]],"u":1836},{"n":"Điều 7","t":"Hành vi vi phạm về cấp, quản lý, sử dụng Giấy chứng nhận đủ điều kiện kinh doanh xố số","p":[["D7.K1","k","Phạt tiền từ 80.000.000 đồng đến 120.000.000 đồng đối với hành vi tẩy xóa, sửa chữa làm sai lệch nội dung Giấy chứng nhận đủ điều kiện kinh doanh xổ số nhưng chưa đến mức bị truy cứu trách nhiệm hình sự."],["D7.K2","k","Phạt tiền từ 120.000.000 đồng đến 160.000.000 đồng đối với hành vi cho mượn, cho thuê hoặc chuyển nhượng Giấy chứng nhận đủ điều kiện kinh doanh xổ số."],["D7.K3","k","Phạt tiền từ 160.000.000 đồng đến 200.000.000 đồng đối với hành vi kinh doanh xổ số không có Giấy chứng nhận đủ điều kiện kinh doanh xô số do cơ quan nhà nước có thâm quyên cấp nhưng chưa đến mức bị truy cứu trách nhiệm hình sự."],["D7.K4","k","Biện pháp khắc phục hậu quả: sửa chữa làm Sai lệch nội dung cho cơ quan cấp Giấy chứng nhận đủ điều kiện kinh doanh xô số đối với hành vi vi phạm hành chính quy định tại khoản 1 Điều này; phạm hành chính quy định tại Điều này."],["D7.K4.Đa","d","Buộc nộp lại Giấy chứng nhận đủ điều kiện kinh doanh xô số bị tây xóa,"],["D7.K4.Đb","d","Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi"]],"u":1841},{"n":"Điều 8","t":"Hành vi vi phạm quy định về in vé xô số, phát hành vé xổ số","p":[["D8.K1","k","Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với hành vi vi phạm sau:"],["D8.K1.Đa","d","In vé xổ số không có đủ nội dung theo quy định của pháp luật;"],["D8.K1.Đb","d","Ký hợp đồng in vé xổ số với cơ sở in không đủ điều kiện in vé xổ số."],["D8.K2","k","Phạt tiền từ 20.000.000 đồng đến 40.000.000 đồng đối với hành vi vi phạm sau: pháp luật; pháp luật; pháp luật."],["D8.K2.Đa","d","Phát hành mệnh giá vé xổ số không đúng theo quy định của pháp luật;"],["D8.K2.Đb","d","Phát hành số lượng vé xổ số vượt quá hạn mức theo quy định của"],["D8.K2.Đc","d","Phát hành vé xổ số không đúng lịch mở thưởng theo quy định của"],["D8.K2.Đd","d","Phát hành vé xổ số điện toán không đúng thời gian theo quy định của"],["D8.K3","k","Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với hành vi in số lượng vé xổ số không đủ theo từng loại ký hiệu vé xổ số và cơ cấu giải thưởng đã thông báo phát hành."],["D8.K4","k","Phạt tiền từ 60.000.000 đồng đến 100.000.000 đồng đối với hành vi cạo sửa, tây xóa vé xô sô dưới mọi hình thức đê tham gia dự thưởng và lĩnh thưởng."],["D8.K5","k","Phạt tiền từ 80.000.000 đồng đến 100.000.000 đồng đối với hành vi làm giả vé xô sô dưới mọi hình thức đê tham gia dự thưởng và lĩnh thưởng."],["D8.K6","k","Hình thức xử phạt bổ sung: khoản 2, khoản 4 và khoản 5 Điều này; hành vi vi phạm hành chính quy định tại khoản 2, khoản 3 Điều này."],["D8.K6.Đa","d","Tịch thu toàn bộ số lượng vé xổ số vi phạm hành chính quy định tại"],["D8.K6.Đb","d","Đình chỉ hoạt động kinh doanh xổ số từ 01 tháng đến 02 tháng đối với"],["D8.K7","k","Biện pháp khắc phục hậu quả: gia dự thưởng và lĩnh thưởng quy định tại khoản 4 Điều này; phạm hành chính quy định tại khoản 2, khoản 3, khoản 4, khoản 5 Điều này."],["D8.K7.Đa","d","Buộc tiêu hủy vé xổ số bị cạo sửa, tẩy xóa dưới mọi hình thức để tham"],["D8.K7.Đb","d","Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi"]],"u":1848},{"n":"Điều 9","t":"Hành vi vi phạm quy định về phân phối vé xổ số","p":[["D9.K1","k","Phạt cảnh cáo đối với hành vi bán vé xô số không đúng mệnh giá quy định ghi trên tờ vé xổ số."],["D9.K2","k","Phạt tiền từ 20.000.000 đồng đến 30.000.000 đồng đối với hành vi bán vé xô sô cho các cá nhân thuộc đôi tượng không đủ điêu kiện tham gia dự thưởng xô sô theo quy định của pháp luật."],["D9.K3","k","Phạt tiền từ 20. 000.000 đồng đến 40.000.000 đồng đối với hành vi thực hiện phân phối vé xổ số không đúng phương thức được phép phân phối."],["D9.K4","k","Biện pháp khắc phục hậu quả: Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi phạm hành chính quy định tại khoản 3 Điêu này."]],"u":1866},{"n":"Điều 10","t":"Hành vi vi phạm quy định về địa bàn kinh doanh xổ số","p":[["D10.K1","k","Phạt tiền từ 20.000.000 đồng đến 40.000.000 đồng đối với hành vi thực hiện kinh doanh xô sô không đúng địa bàn."],["D10.K2","k","Hình thức xử phạt bố sung: Tịch thu toàn bộ số lượng vé xổ số kinh doanh không đúng địa bàn."],["D10.K3","k","Biện pháp khắc phục hậu quả: luật đôi với hành vi vi phạm hành chính tại Điêu này; phạm hành chính quy định tại Điêu này."],["D10.K3.Đa","d","Buộc thực hiện kinh doanh xổ số theo đúng địa bàn quy định của pháp"],["D10.K3.Đb","d","Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi"]],"u":1871},{"n":"Điều 11","t":"Hành vi vi phạm quy định về tham gia dự thưởng xố số","p":[["D11.K1","k","Phạt cảnh cáo hoặc phạt tiền từ 10.000.000 đồng đến 15.000.000 đồng theo quy định của pháp luật về xử lý vi phạm hành chính đôi với cá nhân không đủ điêu kiện tham gia dự thưởng xô sô mua vé xô sô đê dự thưởng."],["D11.K2","k","Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với hành vi sử dụng vốn và tài sản của nhà nước đề tham gia mua vé xổ số."],["D11.K3","k","Biện pháp khắc phục hậu quả: Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi phạm hành chính tại Điêu này."]],"u":1877},{"n":"Điều 12","t":"Hành vi vì phạm quy định về thu hồi, lưu trữ, tiêu hủy vé xố số không tiêu thụ hết","p":[["D12.K1","k","Phạt cảnh cáo đối với một trong các hành vi vi phạm sau: .a) Không ban hành quy chế quy định chỉ tiết quy trình tổ chức thu hồi vé xổ số không tiêu thụ hết; vé xô số không tiêu thụ hết mà không có văn bản ủ ủy quyền."],["D12.K1.Đb","d","Ủy quyền cho doanh nghiệp kinh doanh xổ số khác thực hiện thu hồi"],["D12.K2","k","Phạt tiền từ 20.000.000 đồng đến 40.000.000 đồng đối với một trong các hành vi vi phạm sau:"],["D12.K8","k","Tổ chức tiêu hủy đối với các loại vé xô số không tiêu thụ hết, cuống vé xô sô hoặc phân lưu vé xô sô lô tô đã thu hôi nhưng lưu trữ chưa đủ thời gian quy định; đồng nhưng không có đủ sô thành viên theo quy định của pháp luật;"],["D12.K8.Đb","d","Không thành lập Hội đồng tiêu hủy vé xổ số hoặc có thành lập Hội"],["D12.K8.Đc","d","Không lập biên bản sau khi tiêu hủy vé xổ số không tiêu thụ hết."]],"u":1881},{"n":"Điều 13","t":"Hành vi vi phạm quy định về đại lý xổ số","p":[["D13.K1","k","Phạt tiền từ 20.000.000 đồng đến 40.000.000 đồng đối với hành vi sửa chữa, tây xóa hoặc giả mạo các tài liệu trong hỗ sơ làm đại lý xô sô nhưng chưa đên mức bị truy cứu trách nhiệm hình sự."],["D13.K2","k","Phạt tiền từ 20.000.000 đồng đến 60.000.000 đồng đối với một trong các hành vi vi phạm sau: đại lý xô sô theo quy định của pháp luật; của đại lý xô số theo quy định của pháp luật; bán vé xô sô theo quy định của pháp luật."],["D13.K2.Đa","d","Ký hợp đồng đại lý với các cá nhân, tổ chức không đủ điều kiện làm"],["D13.K2.Đb","d","Không bảo đảm tỷ lệ tối thiểu về mức bảo đảm nghĩa vụ thanh toán"],["D13.K2.Đc","d","Cho. đại lý xổ số nợ quá kỳ hạn nợ hoặc quá thời gian thanh toán tiền"],["D13.K3","k","Biện pháp khắc phục hậu quả: hành vi vi phạm hành chính quy định tại khoản l Điêu này; phạm hành chính quy định tại khoản I Điêu này; phạm quy định tại khoản 2 Điêu này."],["D13.K3.Đa","d","Buộc tiêu hủy tài liệu đã bị sửa chữa, tây xóa hoặc giả mạo đối với"],["D13.K3.Đb","d","Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi"],["D13.K3.Đc","d","Buộc thực hiện đúng quy định của pháp luật đối với trường hợp vi"]],"u":1888},{"n":"Điều 14","t":"Hành vi vi phạm quy định về loại hình sản phẩm kinh doanh","p":[["D14.K1","k","Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với hành vi kinh doanh loại hình sản phẩm không được phép kinh doanh nhưng chưa đến mức bị truy cứu trách nhiệm hình sự."],["D14.K2","k","Hình thức xử phạt bổ sung Đình chỉ hoạt động kinh doanh xô số từ 01 tháng đến 02 tháng đối với hành vi vi phạm hành chính quy định tại khoản 1 Điêu này."],["D14.K3","k","Biện pháp khắc phục hậu quả Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi phạm hành chính quy định tại khoản 1 Điêu này."]],"u":1898},{"n":"Điều 15","t":"Hành vi vi phạm quy định về tỷ lệ trả thưởng, cơ cấu giải thưởng và thể lệ tham gia dự thưởng","p":[["D15.K1","k","Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với một trong các hành vi vi phạm sau: định tôi đa đôi với từng loại hình xô sô; quy định của pháp luật."],["D15.K1.Đa","d","Xây dựng tỷ lệ trả thưởng cho mỗi đợt phát hành vượt quá tỷ lệ quy"],["D15.K1.Đb","d","Xây dựng cơ cấu giải thưởng đối với từng loại hình xổ số không đúng"],["D15.K2","k","Phạt tiền từ 20.000.000 đồng đến 40.000.000 đồng đối với hành vi không xây dựng thê lệ tham gia dự thưởng hoặc thực hiện công bô thê lệ tham gia dự thưởng cho khách hàng theo quy định của pháp luật."],["D15.K3","k","Biện pháp khắc phục hậu quả Buộc nộp lại số lợi bất hợp pháp thu được đối với hành vi vi phạm hành chính quy định tại khoản I Điêu này."]],"u":1902},{"n":"Điều 16","t":"Hành vi vi phạm quy định về tô chức mở thưởng xô số","p":[["D16.K1","k","Phạt tiền từ 20.000.000 đồng đến 40.000.000 đồng đối với một trong các hành vi vi phạm sau:"],["D16.K1.Đa","d","Tổ chức mở thưởng xổ số không đúng lịch mở thưởng;"],["D16.K1.Đb","d","Tổ chức mở thưởng xổ số không đúng địa điểm quy định;"],["D16.K1.Đc","d","Không xây dựng và công bố công khai thể lệ quay số mở thưởng."],["D16.K2","k","Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với một trong các hành vi vi phạm sau: định của pháp luật; luật; 10"],["D16.K2.Đa","d","Lựa chọn người quay số mở thưởng không có đủ điều kiện theo quy"],["D16.K2.Đb","d","Không có đủ số người quay số mở thưởng theo quy định của pháp"],["D16.K2.Đc","d","Thời gian quay số mở thưởng không đúng quy định của pháp luật;"],["D16.K2.Đd","d","Tổ chức thực hiện quay số mở thưởng không đúng quy trình."],["D16.K3","k","Phạt tiền từ 60.000.000 đồng đến 100.000.000 đồng đối với hành vi làm sai lệch kết quả trúng thưởng nhưng chưa đến mức bị truy cứu trách nhiệm hình sự."],["D16.K4","k","Biện pháp khắc phục hậu quả: phạm hành chính quy định tại khoản 3 Điều này; vi phạm hành chính quy định tại khoản 3 Điêu này."],["D16.K4.Đa","d","Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi"],["D16.K4.Đb","d","Buộc hủy bỏ, đính chính kết quả trúng thưởng sai lệch đối với hành vi"]],"u":1908},{"n":"Điều 17","t":"Hành vi vi phạm về thiết bị quay số mở thưởng","p":[["D17.K1","k","Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với một trong các hành vi vi phạm sau: của pháp luật; định của pháp luật; theo quy định của pháp luật; quay số không bảo đảm yêu cầu quản lý theo quy định của pháp luật; giám sát được toàn bộ quá trình quay số mở thưởng theo quy định; dõi qua camera."],["D17.K1.Đa","d","Không trang bị đầy đủ các thiết bị quay số mở thưởng theo quy định"],["D17.K1.Đb","d","Sử dụng lồng cầu quay số không bảo đảm yêu cầu quản lý theo quy"],["D17.K1.Đc","d","Bóng sử dụng để quay số mở thưởng không bảo đảm yêu cầu quản lý"],["D17.K1.Đd","d","Sử dụng cân điện tử, thiết bị kiểm tra kích thước của bóng dùng để"],["D17.K1.Đđ","d","Hệ thống camera, màn hình bố trí ở những vị trí không bảo đảm đề"],["D17.K1.Đe","d","Không lưu trữ đủ thời gian quy định tối thiểu đối với hình ảnh theo"],["D17.K2","k","Biện pháp khắc phục hậu quả Buộc trang bị các thiết bị quay số mở thưởng đáp ứng yêu cầu theo quy định của pháp luật đối với hành vi vi phạm quy định tại khoản 1 Điều này."]],"u":1922},{"n":"Điều 18","t":"Hành vi vi phạm quy định về sử dụng kết quả xổ số và thông tin kết quả trúng thưởng","p":[["D18.K1","k","Phạt tiền từ 60.000.000 đồng đến 100.000.000 đồng đối với hành vi sử dụng kết quả xổ số của doanh nghiệp kinh doanh xổ số để tô chức các chương trình dự thưởng không đúng quy định của pháp luật nhưng chưa đến mức bị truy cứu trách nhiệm hình sự."],["D18.K2","k","Phạt tiền từ 80.000.000 đồng đến 100.000.000 đồng đối với hành vi cung cấp thông tin dự đoán trước kết quả xổ só. 11"],["D18.K3","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với hành vi thông tin kết quả trúng thưởng sai lệch, không đúng so với biên bản xác nhận của Hội đông giám sát xô sô."],["D18.K4","k","Hình thức xử phạt bố sung Đình chỉ hoạt động kinh doanh xổ số từ 01 tháng đến 03 tháng đối với hành vi vi phạm hành chính quy định tại khoản 3 Điêu này."],["D18.K5","k","Biện pháp khắc phục hậu quả: xác nhận của Hội đồng giám sát xô sô đôi với hành vi vi phạm hành chính tại khoản 3 Điêu này; phạm hành chính quy định tại Điêu này."],["D18.K5.Đa","d","Buộc hủy bỏ, đính chính kết quả sai lệch, không đúng so với biên bản"],["D18.K5.Đb","d","Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi"]],"u":1931},{"n":"Điều 19","t":"Hành vi vi phạm quy định về khuyến mại trong lĩnh vực kinh doanh xỗ số","p":[["D19.K1","k","Phạt tiền từ 20.000.000 đồng đến 40.000.000 đồng đối với hành vi khuyên mại trong hoạt động kinh doanh xô sô."],["D19.K2","k","Phạt tiền từ 40.000.000 đồng đến 80.000.000 đồng đối với hành vi lợi dụng hình thức khuyên mại mang tính may rủi đề kinh doanh xô sô trái phép với mục tiêu kiêm lợi nhuận thông qua việc thu tiên của khách hàng."],["D19.K3","k","Hình thức xử phạt bố sung: hành vi vi phạm hành chính quy định tại khoản 1, khoản 2 Điêu này; định tại khoản 1, khoản 2 Điêu này."],["D19.K3.Đa","d","Đình chỉ hoạt động kinh doanh xổ số từ 01 tháng đến 02 tháng đối với"],["D19.K3.Đb","d","Tịch thu toàn bộ phương tiện, tang vật sử dụng để khuyến mại quy"],["D19.K4","k","Biện pháp khắc phục hậu quả Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi phạm hành chính quy định tại khoản 1, khoản 2 Điêu này."]],"u":1939},{"n":"Điều 20","t":"Hành vi vi phạm quy định về trả thưởng","p":[["D20.K1","k","Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với hành vi trả thưởng cho những vé xô sô không đáp ứng đủ điều kiện trả thưởng theo quy định của pháp luật."],["D20.K2","k","Phạt tiền từ 20.000.000 đồng đến 40.000.000 đồng đối với một trong các hành vi vi phạm sau: 12 chưa đủ thời gian quy định."],["D20.K2.Đa","d","Cố tình kéo dài thời gian trả thưởng cho khách hàng trúng thưởng;"],["D20.K2.Đb","d","Tổ chức tiêu hủy vé xổ số trúng thưởng đã trả thưởng nhưng lưu trữ"],["D20.K3","k","Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với hành vi vi phạm bí mật thông tin trả thưởng của khách hàng trúng thưởng."],["D20.K4","k","Phạt tiền từ 60.000.000 đồng đến 100.000.000 đồng đối với hành vi Ủy quyền trả thưởng cho đại lý vượt quá giá trị giải thưởng được phép ủy quyền."],["D20.K5","k","Biện pháp khắc phục hậu quả Buộc nộp lại số lợi bất hợp pháp thu được đối với hành vi vi phạm hành chính tại khoản 1, khoản 4 Điều này."]],"u":1946},{"n":"Điều 21","t":"Hành vi vi phạm quy định về điều kiện kinh doanh đối với hệ thống xổ số điện toán","p":[["D21.K1","k","Phạt tiền từ 40.000.000 đồng đến 80.000.000 đồng đối với hành vi kinh doanh loại hình xổ số điện toán nhưng không ban hành Quy chế quản lý, khai thác dữ liệu máy chủ, không lưu trữ dữ liệu kinh doanh xô số điện toán theo đúng thời gian quy định."],["D21.K2","k","Phạt tiền từ 80. 000.000 đồng đến 120.000.000 đồng đối với hành vì kinh doanh loại hình xổ số điện toán nhưng không đáp ứng đủ điều kiện về thiết bị máy chủ, máy bán vé xổ số theo quy định của pháp luật."],["D21.K3","k","Phạt tiền từ 120.000.000 đồng đến 160.000.000 đồng đối với hành vi kinh doanh loại hình xổ số điện toán nhưng không đáp ứng đủ điều kiện về phần mềm theo quy định của pháp luật."],["D21.K4","k","Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh xổ số từ 01 tháng đến 03 tháng đối với hành vi vi phạm hành chính tại Điêu này."],["D21.K5","k","Biện pháp khắc phục hậu quả Buộc nộp lại số lợi bất hợp. pháp thu được từ việc thực hiện hành vi vi phạm hành chính quy định tại Điêu này."]],"u":1954},{"n":"Điều 22","t":"Hành vi vi phạm hành chính về hoa hồng đại lý, trích lập","p":[["D22.K1","k","Phạt tiền từ 60. 000.000 đồng đến 100.000.000 đồng đối với hành vi trả hoa hồng cho đại lý xổ số cao hơn tỷ lệ quy định của pháp luật. 13"],["D22.K2","k","Phạt tiền từ 100.000.000 đồng đến 140.000.000 đồng đối với hành vi trích lập, sử dụng Quỹ dự phòng rủi ro trả thưởng, các Quỹ được trích lập không đúng quy định của pháp luật."],["D22.K3","k","Biện pháp khắc phục hậu quả Buộc nộp lại số lợi bất hợp pháp thu được từ việc thực hiện hành vi vi phạm hành chính quy định tại khoản 2 Điêu này."]],"u":1960},{"n":"Điều 23","t":"Hành vi vi phạm hành chính về chế độ báo cáo trong lĩnh vực kinh doanh xố số","p":[["D23.K1","k","Phạt cảnh cáo đối với doanh nghiệp kinh doanh xổ số thực hiện một trong các hành vi vi phạm sau: _a) Không gửi hoặc gửi không đủ báo cáo cho cơ quan nhà nước có thẩm quyên theo quy định của pháp luật; hạn theo quy định của pháp luật."],["D23.K1.Đb","d","Gửi báo cáo cho cơ quan nhà nước có thẩm quyền không đúng thời"],["D23.K2","k","Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với hành vi thông tin, số liệu không đầy đủ, không chính xác trong báo cáo gửi cho cơ quan nhà nước có thẩm quyên."],["D23.K3","k","Biện pháp khắc phục hậu quả Buộc doanh nghiệp kinh doanh xổ số bổ sung, đính chính số liệu báo cáo đối với hành vi vi phạm hành chính quy định tại khoản 2 Điều này."]],"u":1964},{"n":"Điều 24","t":"Hành vi vi phạm quy định về phòng, chống rửa tiền; phòng, chống tài trợ khủng bố; phòng, chống tài trợ phỗ biến vũ khí hủy diệt hàng loạt trong lĩnh vực kinh doanh xô số","p":[["D24.K1","k","Doanh nghiệp kinh doanh xổ số thực hiện hành vi vi phạm quy định về nhận biết khách hàng, thu thập, cập nhật, xác minh thông tin nhận biết khách hàng; về trách nhiệm xây dựng quy định nội bộ và báo cáo, cung cấp, lưu trữ thông tin, hồ sơ thì bị xử phạt như sau: không nhận biết khách hàng, không cập nhật, không xác minh, không cập nhật danh sách đen; nhận biết, cập nhật, xác minh thông tin khách hàng không đúng quy định của pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ vũ khí hủy diệt hàng loạt; 14 không giám sát một số giao dịch đặc biệt theo quy định của pháp luật về phòng, chống rửa tiền; không thực hiện đúng quy định về lưu trữ, bảo mật thông tin, hồ sơ, tài liệu, báo cáo về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí hủy diệt hàng loạt theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bồ, phòng, chống tài trợ, phô biến vũ khí hủy diệt hàng loạt; không áp dụng hoặc áp dụng không đúng quy định nội bộ trong việc thực hiện kiểm soát, kiêm toán nội bộ theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chông tài trợ phô biến vũ khí huỷ diệt hàng loạt; không áp dụng quy định nội bộ về phân công hoặc không đăng ký phân công cán bộ, bộ phận chịu trách nhiệm vê phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt; không áp dụng hoặc áp dụng không đúng quy định nội bộ vê đào tạo, bồi dưỡng, tuyên dụng theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí huỷ diệt hàng loạt; không ban hành hoặc ban hành không đúng quy định nội bộ về phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí hủy diệt hàng loạt; không thực hiện đánh giá rủi ro về rửa tiền, tài trợ khủng bó, tài trợ phổ biến vũ khí hủy diệt hàng loạt; không cập nhật kết quả đánh giá rủi ro hàng năm, không nộp hoặc nộp báo cáo kết quả đánh giá, cập nhật rủi ro không đúng thời hạn, không phố biến kết quả đánh giá, cập nhật rủi ro trong toàn hệ thống của đối tượng báo cáo theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống khủng bố và phòng, chống phổ biến vũ khí hủy diệt hàng loạt; ø) Phạt tiền từ 120.000.000 đồng đến 180.000.000 đồng đối với hành vi không xây dựng quy định về phân loại khách hàng: không phân loại khách hàng theo mức độ rủi ro; không xây dựng và ban hành quy trình quản lý rủi ro về rửa tiền, tài trợ khủng bố, tài trợ phô biến vũ khí hủy diệt hàng loạt theo quy định của pháp luật về phòng, chồng rửa tiền, phòng, chống tài trợ khủng bố, phòng, chồng tài trợ, phổ biến vũ khí hủy diệt hàng loạt; không ban hành chính sách, quy trình để nhận diện và đánh giá mức độ rủi ro về rửa tiền trước khi cung cấp sản phẩm, dịch vụ mới; sản phâm, dịch vụ hiện có áp dụng công nghệ đổi mới theo quy định của pháp luật về phòng, chống rửa tiền; 15 ¡) Phạt tiền từ 160.000.000 đồng đến 200.000.000 đồng đối với hành vi vi phạm quy định về trách nhiệm liên quan đến cá nhân nước ngoài có ảnh hưởng chính trị theo quy định của pháp luật về phòng, chống rửa tiên."],["D24.K1.Đa","d","Phạt tiền từ 40.000.000 đồng đến 80.000.000 đồng đối với hành vi"],["D24.K1.Đb","d","Phạt tiền từ 60. .000.000 đồng đến 120.000.000 đồng đối với hành vì"],["D24.K1.Đc","d","Phạt tiền từ 60.000.000 đồng đến 120.000.000 đồng đối với hành vi"],["D24.K1.Đd","d","Phạt tiền từ 80.000.000 đồng đến 100.000.000 đồng đối với hành vi"],["D24.K1.Đđ","d","Phạt tiền từ 100.000.000 đồng đến 120.000.000 đồng đối với hành vi"],["D24.K1.Đe","d","Phạt tiền từ 120.000.000 đồng đến 180.000.000 đồng đối với hành vi"],["D24.K1.Đh","d","Phạt tiền từ 120.000.000 đồng. đến 180.000.000 đồng đối với hành vi"],["D24.K2","k","Doanh nghiệp kinh doanh xổ số thực hiện hành vi vi phạm quy định về cung cấp thông tin về phòng, chống rửa tiền, báo cáo giao dịch có giá trị lớn, báo cáo giao dịch đáng ngờ thì bị xử phạt như sau: không thực hiện đúng quy định về báo cáo giao dịch có giá trị lớn, báo cáo giao dịch đáng ngờ theo quy định của pháp luật vệ phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ, phổ biến vũ khí hủy diệt hàng loạt; không báo cáo, cung cấp thông tin, hồ sơ, tài liệu, báo cáo phục vụ công tác phòng, chống rửa tiền, phòng, chống. tài trợ khủng bố, phòng, chống, phô biến vũ khí hủy diệt hàng loạt theo yêu câu của cơ quan nhà nước có thâm quyền theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chống khủng bố và phòng, chống phổ biến vũ khí hủy diệt hàng loạt."],["D24.K2.Đa","d","Phạt tiền từ 60.000.000 đồng đến 100.000.000 đồng đối với hành vi"],["D24.K2.Đb","d","Phạt tiền từ 100.000.000 đồng đến 180.000.000 đồng đối với hành vi"],["D24.K3","k","Doanh nghiệp kinh doanh xổ số thực hiện hành vi bị cắm trong phòng, chống rửa tiền, phòng, chống tài trợ khủng bố thì bị xử phạt như sau: thiết lập hoặc duy trì tài khoản vô danh hoặc tài khoản sử dụng tên giả; cung cấp trái phép dịch vụ nhận tiền mặt, séc, công cụ tiền tệ khác và thực hiện thanh toán cho người thụ hưởng; tổ chức, tham gia hoặc tạo điều kiện thực hiện hành vi rửa tiền; cản trở việc cung cấp thông tin phục vụ công tác phòng, chống rửa tiền, phòng, chống tài trợ khủng bố nhưng chưa đến mức bị truy cứu trách nhiệm hình sự; không tố giác hành vi tài trợ khủng bố mà chưa đến mức bị truy cứu trách nhiệm hình sự; trực tiếp hoặc gián tiếp cung cấp tiền, tài sản, nguồn tài chính, nguồn lực kinh tế, dịch vụ tài chính hoặc dịch vụ khác cho tổ chức, cá nhân liên quan đến khủng bố, tài trợ khủng bố mà chưa đến mức bị truy cứu trách nhiệm hình SỰ; không á áp dụng biện pháp trì hoãn giao dịch, không báo cáo cơ quan nhà nước có thâm quyên theo quy định của pháp luật vê phòng, chống rửa tiền, phòng, chống tài trợ khủng bố, phòng, chống tài trợ phỏ biến vũ khí hủy diệt hàng loạt; không thực hiện phong tỏa tiền, tài khoản, niêm phong hoặc tạm giữ tài sản theo quy định của pháp luật về phòng, chống rửa tiền, phòng, chỗng tài trợ khủng bố, phòng, chống tài trợ phổ biến vũ khí hủy diệt hàng loạt."],["D24.K3.Đa","d","Phạt tiền từ 130.000.000 đồng đến 150.000.000 đồng đối với hành vi"],["D24.K3.Đb","d","Phạt tiền từ 160.000.000 đồng đến 200.000.000 đồng đối với hành vi"],["D24.K3.Đc","d","Phạt tiền từ 160.000.000 đồng đến 200.000.000 đồng đối với hành vi"],["D24.K4","k","Doanh nghiệp kinh doanh xô số thực hiện hành vi vi phạm quy định về phòng, chống tài trợ khủng bó, phòng, chống phổ biến vũ khí hủy diệt hàng loạt thì bị xử phạt như sau: 16 không báo cáo cho lực lượng chống khủng bế khi phát hiện dấu hiệu, hành vi tài trợ khủng bố theo quy định của pháp luật về phòng, chống khủng bố; không báo cáo giao dịch đáng ngờ về tài trợ khủng bố; không áp dụng các biện pháp tạm thời hoặc không báo cáo việc áp dụng các biện pháp tạm thời khi có nghi ngờ khách hàng hoặc giao dịch của khách hàng liên quan đến tài trợ khủng bố hoặc khách hàng nằm trong Danh sách đen phòng, chống khủng bố; không thông báo cho cơ quan có thâm quyền khi phát hiện có hành vi phô biến và tài trợ cho hoạt động phô biến hoặc hành vi vi phạm pháp luật khác về phòng, chống phô biến vũ khí hủy diệt hàng loạt theo quy định của pháp luật về phòng, chống phổ biến vũ khí hủy diệt hàng loạt."],["D24.K4.Đa","d","Phạt tiền từ 160.000.000 đồng đến 200.000.000 đồng đối với hành vi"],["D24.K4.Đb","d","Phạt tiền từ 160.000.000 đồng đến 200.000.000 đồng đối với hành vi"],["D24.K4.Đe","d","Phạt tiền từ 160.000.000 đồng đến 200.000.000 đồng đối với hành vi"],["D24.K5","k","Biện pháp khắc phục hậu quả Buộc thực hiện đúng quy định pháp luật đối với trường hợp vi phạm quy định tại khoản 1, khoản 2, khoản 3, khoản 4 Điêu này. Chương IH THẢM QUYÈN LẬP BIÊN BẢN VI PHẠM HÀNH CHÍNH; THẦM QUYÈN XỬ PHẠT VI PHẠM HÀNH CHÍNH; NGUYÊN TÁC XÁC ĐỊNH VÀ PHÂN ĐỊNH THÁM QUYÈN XỬ PHẠT VI PHẠM HÀNH CHÍNH TRONG LĨNH VỰC KINH DOANH XỎ SÓ"]],"u":1969},{"n":"Điều 25","t":"Thâm quyền của Giám đốc Sở Tài chính, Trưởng đoàn kiểm tra do Bộ trưởng Bộ Tài chính thành lập, Thủ trưởng tô chức thuộc","p":[["D25.K1","k","Giám đốc Sở Tài chính có quyền: 3 Nghị định này."],["D25.K1.Đa","d","Phạt cảnh cáo;"],["D25.K1.Đb","d","Phạt tiền đến 160.000.000 đồng:"],["D25.K1.Đc","d","Đình chỉ hoạt động kinh doanh xổ số có thời hạn;"],["D25.K1.Đd","d","Tịch thu tang vật, phương tiện vi phạm hành chính;"],["D25.K1.Đđ","d","Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều"],["D25.K2","k","Trưởng đoàn kiểm tra do Bộ trưởng Bộ Tài chính thành lập có quyền: 17 Nghị định này."],["D25.K2.Đa","d","Phạt cảnh cáo;"],["D25.K2.Đb","d","Phạt tiền đến 200.000.000 đồng:"],["D25.K2.Đc","d","Đình chỉ hoạt động kinh doanh xổ số có thời hạn;"],["D25.K2.Đđ","d","Tịch thu tang vật, phương tiện vi phạm hành chính;"],["D25.K2.Đđ~2","d","Áp dụng biện pháp khắc phục hậu quả quy định tại khoản 3 Điều 3"],["D25.K3","k","Thủ trưởng tổ chức thuộc Bộ Tài chính được giao thực hiện nhiệm vụ kiểm tra trong phạm vi quản lý nhà nước về hoạt động kinh doanh xổ số có quyền: đd) Tịch thu tang vật, phương tiện vi phạm hành chính; 3 Nghị định này."],["D25.K3.Đa","d","Phạt cảnh cáo;"],["D25.K3.Đb","d","Phạt tiền đến 200.000.000 đồng:"],["D25.K3.Đc","d","Đình chỉ hoạt động kinh doanh xổ số có thời hạn;"],["D25.K3.Đđ","d","Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều"]],"u":1990},{"n":"Điều 26","t":"Thẫm quyền của Chủ tịch Ủy ban nhân dân","p":[["D26.K1","k","Chủ tịch Ủy ban nhân dân cấp xã có quyền: 3 Nghị định này."],["D26.K1.Đa","d","Phạt cảnh cáo;"],["D26.K1.Đb","d","Phạt tiền đến 100.000.000 đồng;"],["D26.K1.Đc","d","Đình chỉ hoạt động kinh doanh xô số có thời hạn;"],["D26.K1.Đd","d","Tịch thu tang vật, phương tiện vi phạm hành chính;"],["D26.K1.Đđ","d","Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều"],["D26.K2","k","Chủ tịch Ủy ban nhân dân cấp tỉnh có quyền: 3 Nghị định này."],["D26.K2.Đa","d","Phạt cảnh cáo;"],["D26.K2.Đb","d","Phạt tiền đến 200.000.000 đồng;"],["D26.K2.Đc","d","Đình chỉ hoạt động kinh doanh xổ số có thời hạn;"],["D26.K2.Đđ","d","Tịch thu tang vật, phương tiện vi phạm hành chính;"],["D26.K2.Đđ~2","d","Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều"]],"u":2008},{"n":"Điều 27","t":"Thẫm quyền của Công an nhân dân","p":[["D27.K1","k","Chiến sĩ Công an nhân dân đang thi hành công vụ có quyền: ©) Tịch thu tang vật, phương tiện vi phạm hành chính có giá trị không vượt quá 02 lần mức tiền phạt được quy định tại điểm b khoản này. 18"],["D27.K1.Đa","d","Phạt cảnh cáo;"],["D27.K1.Đb","d","Phạt tiền đến 20.000.000 đồng:"],["D27.K2","k","Trưởng Công an cấp xã có quyền: 3 Nghị định này."],["D27.K2.Đa","d","Phạt cảnh cáo;"],["D27.K2.Đb","d","Phạt tiền đến 100.000.000 đồng;"],["D27.K2.Đc","d","Đình chỉ hoạt động kinh doanh xổ số có thời hạn;"],["D27.K2.Đđ","d","Tịch thu tang vật, phương tiện vi phạm hành chính;"],["D27.K2.Đđ~2","d","Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều"],["D27.K3","k","Trưởng phòng An nỉnh tài chính, đầu tư thuộc Cục An nỉnh kinh tế; Trưởng phòng hướng dẫn, quản lý các ngành, nghề đầu tư kinh doanh có điều kiện về an ninh, trật tự và con dấu thuộc Cục Cảnh sát quản lý hành chính về trật tự xã hội; Trưởng phòng Phòng, chống tội phạm sử dụng không gian mạng xâm phạm trật tự xã hội thuộc Cục Cảnh sát điều tra tội phạm về tham nhũng, kinh tế, buôn lậu; Trưởng phòng Công an cấp tỉnh gồm: Trưởng phòng Cảnh sát quản lý hành chính về trật tự xã hội, Trưởng phòng An ninh mạng và phòng, chống tội phạm sử dụng công nghệ cao, Trưởng phòng An ninh kinh tế, Trưởng phòng Cảnh sát điều tra tội phạm về tham nhũng, kinh tế, buôn lậu, môi trường; Chánh Văn phòng Cơ quan Cảnh sát điều tra Công an cấp tỉnh có quyền: 3 Nghị định này."],["D27.K3.Đa","d","Phạt cảnh cáo;"],["D27.K3.Đb","d","Phạt tiền đến 160.000.000 đồng:"],["D27.K3.Đe","d","Đình chỉ hoạt động kinh doanh xổ số có thời hạn;"],["D27.K3.Đd","d","Tịch thu tang vật, phương tiện vi phạm hành chính;"],["D27.K3.Đđ","d","Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều"],["D27.K4","k","Giám đốc Công an cấp tỉnh có quyền: 3 Nghị định này."],["D27.K4.Đa","d","Phạt cảnh cáo;"],["D27.K4.Đb","d","Phạt tiền đến 200.000.000 đồng;"],["D27.K4.Đc","d","Đình chỉ hoạt động kinh doanh xổ số có thời hạn;"],["D27.K4.Đđ","d","Tịch thu tang vật, phương tiện vi phạm hành chính;"],["D27.K4.Đđ~2","d","Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều"],["D27.K5","k","Cục trưởng Cục An ninh kinh tế, Cục trưởng Cục Cảnh sát quản lý hành chính về trật tự xã hội, Cục trưởng Cục An ninh mạng và phòng chống tội phạm sử dụng công nghệ cao, Cục trưởng Cục Cảnh sát điều tra tội phạm về tham nhũng, kinh , buôn lậu; Chánh Văn phòng Cơ quan Cảnh sát điều tra Bộ Công an có quyền: 3 Nghị định này."],["D27.K5.Đa","d","Phạt cảnh cáo;"],["D27.K5.Đb","d","Phạt tiền đến 200.000.000 đồng:"],["D27.K5.Đc","d","Đình chỉ hoạt động kinh doanh xổ số có thời hạn;"],["D27.K5.Đđ","d","Tịch thu tang vật, phương tiện vi phạm hành chính;"],["D27.K5.Đđ~2","d","Áp dụng các biện pháp khắc phục hậu quả quy định tại khoản 3 Điều"]],"u":2021},{"n":"Điều 28","t":"Thẫm quyền lập biên bản vi phạm hành chính trong lĩnh vực kinh doanh xố số","p":[["D28.K1","k","Công chức, viên chức, người thuộc lực lượng công an nhân dân đang thi hành công vụ, nhiệm vụ, thanh tra, kiểm tra về hoạt động kinh doanh xô sô có thẩm quyền lập biên bản vi phạm hành chính đối với các hành vi vi phạm quy định tại Nghị định này."],["D28.K2","k","Các chức danh quy định tại Điều 25, Điều 26, Điều 27 Nghị định này có thâm quyền lập biên bản đối với hành vi vi phạm hành chính thuộc phạm vi quản lý nhà nước thuộc lĩnh vực, ngành mình quản lý trong quá trình thi hành công vụ, thanh tra, kiểm tra."],["D28.K3","k","Trường hợp hành vi vi phạm vượt quá thâm quyền xử phạt vi phạm hành chính hoặc thuộc thâm quyên xử phạt của chức danh khác thì người lập biên bản vi phạm hành chính phải chuyên hô sơ đên người có thâm quyên xử phạt vi phạm hành chính theo quy định của pháp luật vê xử lý vi phạm hành chính."]],"u":2049},{"n":"Điều 29","t":"Nguyên tắc xác định và phân định thâm quyền xử phạt vi phạm hành chính và áp dụng biện pháp khắc phục hậu quả trong lĩnh vực kinh doanh xỗ số","p":[["D29.K1","k","Nguyên tắc xác định và phân định thẩm quyền xử phạt vi phạm hành chính và áp dụng biện pháp khắc phục hậu quả thực hiện theo quy định tại Điều 52 Luật Xử lý vi phạm hành chính và các văn bản sửa đổi, bỗ sung (nếu có)."],["D29.K2","k","Chức danh quy định tại khoản I Điều 25 Nghị định này có quyền xử phạt vi phạm hành chính đối với hành vi vi phạm quy định tại Điều 6, Điều 7, các khoản 1, 4, 5, 6 và 7 Điều 8, Điều 9, Điều 10, Điều 11, Điều 12, Điều 13, Điều 15, Điều 16, Điều 17, các khoản 1, 2, 4 và 5 Điều 18, Điều 20, Điều 22 và Điều 23 Nghị định này theo thẩm quyền."],["D29.K3","k","Các chức danh quy định tại khoản 1 Điều 26 và Điều 27 Nghị định này có quyền xử phạt vi phạm hành chính đối với hành vi vi phạm quy định tại Điều 6, Điều 7, các khoản 1, 4, 5, 6 và 7 Điều 8, Điều 9, Điều 10, Điều 11, Điều 12, Điều 13, Điều 15, Điều 16, Điều 17, các khoản 1, 2, 4 và 5 Điều 18, Điều 20, Điều 22, Điều 24 Nghị định này theo thâm quyền. 20"],["D29.K4","k","Chức danh quy định tại khoản 2 Điều 25 Nghị định này có quyền xử phạt vi phạm hành chính đối với hành vi vi phạm quy định tại Nghị định này theo thâm quyền."],["D29.K5","k","Chức danh quy định tại khoản 2 Điều 26 Nghị định này có quyền xử phạt vi phạm hành chính đối với hành vi vi phạm quy định tại Điều 6, Điều 7, Điều 8, Điều 9, Điều 10, Điều 11, Điều 12, Điều 13, Điều 14, Điều 15, Điều 16, Điều 17, Điều 18, Điều 19, Điều 20, Điều 22, Điều 23, Điều 24 Nghị định này theo thâm quyền."],["D29.K6","k","Chức danh quy định tại khoản 3 Điều 25 Nghị định này có quyền xử phạt vi phạm hành chính đối với hành vi vi phạm quy định tại Nghị định này theo thâm quyên."]],"u":2053},{"n":"Điều 30","t":"Hiệu lực thi hành","p":[["D30.K1","k","Nghị định này có hiệu lực thi hành từ ngày 30 tháng 11 năm 2026."],["D30.K2","k","Nghị định này bãi bỏ nội dung quy định về xử phạt vi phạm hành chính trong lĩnh vực kinh doanh xổ số tại: phủ quy định xử phạt vi phạm hành chính trong lĩnh vực kinh doanh bảo hiểm, kinh doanh xổ só; 2018 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 98/2013/NĐ-CP ngày 28 tháng 8 năm 2013 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực kinh doanh bảo hiểm, kinh doanh xổ số; 11 năm 2019 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 73/2016/NĐ-CP ngày 01 tháng 7 năm 2016 của Chính phủ quy định chỉ tiết thi hành Luật Kinh doanh bảo hiểm và Luật sửa đôi, bổ sung một số điều của Luật kinh doanh bảo hiêm; Nghị định số 98/2013/NĐ-CP ngày 28 tháng 8 năm 2013 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực kinh doanh bảo hiểm, kinh doanh xổ số; Chính phủ sửa đôi, bổ sung một số điều của các Nghị định về xử phạt vi phạm hành chính trong lĩnh vực thuế, hóa đơn; hải quan; kinh doanh bảo hiểm, kinh doanh xổ số; quản lý, sử dụng tài sản công; thực hành tiết kiệm, chống lãng phí; dự trữ quôc gia; kho bạc nhà nước; kế toán, kiểm toán độc lập. 21"],["D30.K2.Đa","d","Nghị định số 98/2013/NĐ-CP ngày 28 tháng 8 năm 2013 của Chính"],["D30.K2.Đb","d","Khoản 1 Điều 1 Nghị định số 48/2018/NĐ-CP ngày 21 tháng 3 năm"],["D30.K2.Đc","d","Khoản 1, khoản 2 Điều 2 Nghị định số 80/2019/NĐ-CP ngày 01 tháng"],["D30.K2.Đd","d","Điều 3 Nghị định số 102/2021/NĐ-CP ngày 16 tháng 11 năm 2021 của"]],"u":2060},{"n":"Điều 31","t":"Điều khoản chuyền tiếp","p":[],"u":2067},{"n":"Điều 32","t":"Tổ chức thực hiện","p":[["D32.K1","k","Bộ trưởng Bộ Tài chính chịu trách nhiệm hướng dẫn, tổ chức thi hành Nghị định này."],["D32.K2","k","Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố chịu trách nhiệm thi hành Nghị định này. Nơi nhận: TM. CHINH PHU - Ban Bí thư Trung ương Đảng; § ^ - Thủ tướng, các Phó Thủ tướng Chính phủ; - Các bộ, cơ quan ngang bộ; - HĐND, UBND các tỉnh, thành phố; - Văn phòng Trung ương và các Ban của Đảng; - Văn phòng Tổng Bí thư; - Văn phòng Chủ tịch nước; - Hội đồng Dân tộc và các Ủy ban của Quốc hội; - Văn phòng Quốc hội; - Tòa án nhân dân tối cao; - Viện kiểm sát nhân dân tối cao; - Kiểm toán nhà nước; - Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam; - Cơ quan trung ương của các tổ chức chính trị - xã hội; - VPCP: BTCN, các PCN, Trợ lý TTg, các Vụ, Cục, Công báo; - Lưu: VT, KTTH (2b). z"]],"u":2068}],"390/2026/NĐ-CP":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Luật Tổ chức Chính phú số 63/2025/QH15;"],["CC1","c","Căn cứ Luật Ngân hàng Nhà nước Việt Nam số 46/2010/QH12;"],["CC2","c","Căn cứ Luật Các tổ chúc tín dụng số 32/2024/QH15 được sửa đổi, bổ sung bởi Luật số 96/2025/QH15;"],["CC3","c","Căn cứ Luật Quản lý ngoại thương số 05/2017/QH14;"],["CC4","c","Căn cứ Luật Thương mại số 36/2005/0H11;"],["CC5","c","Căn cứ Luật Doanh nghiệp số 59/2020/QH14 được sửa đối, bồ sung bởi Luật số 76/2025/0H15,;"],["CC6","c","Căn cứ Luật Tiêu chuẩn và quy chuẩn kỹ thuật số 68/2006/QH11 được sửa đổi, bồ sung bởi Luật số 35/2018/QH14 và Luật số 70/2025/QH15;"],["CC7","c","Căn cứ Luật Chất lượng sản phẩm, hàng hóa số 05/2007/QH12 được sửa đổi, bổ sung bởi Luật số 35/2018/QH14 và Luật số 78/2025/QH15;"],["CC8","c","Căn cứ Luật Đo lường số 04/2011/QH13;"],["CC9","c","Căn cứ Luật Đâu tư số 143/2025/QH15; Theo đề nghị của Thống đốc Ngân hàng Nhà nước Việt Nam; Chính phủ ban hành Nghị định sửa đổi, bổ Sung một số điễu của Nghị định số 24/2012/NĐ-CP ngày 03 tháng 4 năm 2012 của Chính phủ về quản lý hoạt động kinh doanh vàng được sửa đổi, bồ sung bởi Nghị định số 232/2025/NĐ-CP."]],"u":0},{"n":"Điều 1","t":"Sửa đổi, bổ sung một số khoản của Điều 4","p":[["D1.K1","k","Sửa đổi, bố sung khoản 4 Điều 4 như sau: “4. Quản lý hoạt động kinh doanh vàng nhằm phát triển ồn định và bền vững thị trường vàng.”"],["D1.K2","k","Sửa đổi, bồ sung khoản 6 Điều 4 như sau: “6. Hoạt động sản xuất vàng miếng, kinh doanh mua, bán vàng miếng là hoạt động kinh doanh có điều kiện và phải được Ngân hàng Nhà nước cập Giấy phép sản xuất vàng miếng, Giấy phép kinh doanh mua, bán vàng miếng. Hoạt động mua, bán vàng nguyên liệu của doanh nghiệp, ngân hàng thương mại sản xuất vàng miếng được thực hiện theo quy định tại Nghị định này.”"],["D1.K3","k","Sửa đổi, bổ sung khoản 7 Điều 4 như sau: “7, Hoạt động sản xuất, gia công, kinh doanh mua, bán vàng trang sức, mỹ nghệ không phải là ngành, nghề đầu tư kinh doanh có điều kiện. Tổ chức, cá nhân thực hiện hoạt động sản xuất, gia công, kinh doanh mua, bán vàng trang sức, mỹ nghệ có trách nhiệm tuân thủ quy định của pháp luật về chất lượng sản phẩm, hàng hóa, tiêu chuẩn, đo lường, nhãn hàng hóa, niêm yết giá, hóa đơn, chứng từ, thuế, phòng cháy, chữa cháy, bảo vệ môi trường, bảo vệ quyền lợi người tiêu dùng, phòng, chống rửa tiền và pháp luật khác có liên quan.\""],["D1.K4","k","Sửa đổi, bổ sung khoản 10 Điều 4 như sau: “10. Việc thanh toán mua, bán vàng có giá trị từ 05 triệu đồng trong ngày trở lên của một khách hàng phải được thực hiện bằng phương tiện thanh toán không HÙNG tiền mặt theo quy định của pháp luật về thanh toán không dùng tiền mặt.”"]],"u":2071},{"n":"Điều 2","t":"Sửa đổi, bỗ sung một số điểm, khoản của Điều 14","p":[["D2.K1","k","Sửa đổi, bổ sung khoản 4 Điều 14 như sau: “4. Doanh nghiệp có đăng ký hoạt động sản xuất, gia công vàng trang, sức, mỹ nghệ, có hợp đồng gia công vàng trang sức, mỹ nghệ với nước ngoài được Ngân hàng Nhà nước xem xét câp Giấy phép nhập khẩu vàng nguyên liệu để thực hiện hợp đồng gia công và xuất khẩu sản phẩm gia công khi nhu cầu nhập khẩu vàng nguyên liệu phù hợp với hợp đồng gia công vàng trang sức, mỹ nghệ với nước ngoài.”"],["D2.K2","k","Sửa đổi, bổ sung khoản 5 Điều 14 như sau: “5, Hằng năm, Ngân hàng Nhà nước xem xét cấp Giấy phép nhập khẩu vàng nguyên liệu cho doanh nghiệp có vốn đầu tư nước ngoài căn cứ vào năng lực sản xuất, tình hình thực hiện hợp đồng gia công hoặc hợp đồng xuất khẩu vàng trang sức, mỹ nghệ và báo cáo tình hình xuất khẩu vàng trang sức, mỹ nghệ của năm trước, nêu có, khi đáp ứng các điều kiện sau: a) Là doanh nghiệp được thành lập theo quy định của pháp luật Việt Nam, có đăng ký hoạt động sản xuât, gia công vàng trang sức, mỹ nghệ; b) Nhu cầu nhập khẩu vàng nguyên liệu phù hợp với hợp đồng gia công hoặc hợp đồng xuất khâu vàng trang sức, mỹ nghệ.”"],["D2.K3","k","Sửa đổi, bổ sung khoản 8 Điều 14 như sau: “8, Việc xuất khẩu, nhập khẩu các loại vàng sau đây được thực hiện theo Giấy chứng nhận đăng ký doanh nghiệp, pháp luật về hải quan và các quy định pháp luật chuyên ngành có liên quan: a) Vàng nguyên liệu dưới dạng bột, dung dịch, vấy hàn, muối vàng, dây, ống và các loại vàng trang sức dưới dạng bán thành phẩm; b) Vàng sử dụng làm nguyên liệu để sản xuất linh kiện điện tử, thiết bị điện tử, thiết bị V tế, dụng cụ y tế.”"],["D2.K4","k","Sửa đổi, bỗ sung điểm đ.4 khoản 10 Điều 14 như sau: “đ.4) Bán cho doanh nghiệp có đăng ký hoạt động sản xuất vàng trang sức, mỹ nghệ.” 5, Sửa đổi, bổ sung điểm e khoản 10 Điều 14 như sau: “e) Xây dựng hệ thống thông tin để xử lý, lưu trữ đầy đủ, chính xác dữ liệu về xuất khẩu, nhập khẩu, mua, bán, sử dụng, tồn kho vàng nguyên liệu nhập khẩu; dữ liệu giao dịch mua, bán vàng nguyên liệu; thực hiện kết nối, cung cấp thông tin cho Ngân hàng Nhà nước theo quy định của Thống đốc Ngân hàng Nhà nước.”"]],"u":2076},{"n":"Điều 3","t":"Sửa đổi, bố sung khoản 5 Điều 16","p":[],"u":2081},{"n":"Điều 4","t":"Sửa đổi, bổ sung khoản 3 Điều 17","p":[],"u":2082},{"n":"Điều 5","t":"Sửa đổi, bỗ sung Điều 20","p":[],"u":2083},{"n":"Điều 6","t":"Bãi bỏ Điều Ñ, Điều 6, Điều 7, Điều 8, Điều 9, điểm a khoản 3","p":[],"u":2084},{"n":"Điều 7","t":"Hiệu lực và trách nhiệm thi hành","p":[["D7.K1","k","Nghị định này có hiệu lực thi hành từ ngày 16 tháng 10 năm 2026."],["D7.K2","k","Giấy chứng nhận đủ điều kiện sản xuất vàng trang sức, mỹ nghệ do Ngân hàng Nhà nước cấp trước ngày Nghị định này có hiệu lực thi hành không còn là điều kiện để tổ chức, cá nhân thực hiện hoạt động sản xuất vàng trang sức, mỹ nghệ."],["D7.K3","k","Hồ sơ đề nghị cấp, sửa đổi, bổ sung Giấy chứng nhận đủ điều kiện sản xuất vàng trang sức, mỹ nghệ đã nộp trước ngày Nghị định này có hiệu lực thi hành mà đến ngày Nghị định này có hiệu lực thi hành chưa được giải quyết thì Ngân hàng Nhà nước chấm dứt việc ,piải quyết và thông báo cho tổ chức, cá nhân nộp hồ sơ. Phí, lệ phí đã nộp, nếu có, được xử lý theo quy định của pháp luật vê phí, lệ phí."],["D7.K4","k","Giấy phép xuất khâu, nhập khẩu vàng; Giấy phép tạm nhập vàng nguyên liệu để tái xuất sản phẩm; hạn mức xuất khâu, nhập khẩu vàng nguyên liệu đã được Ngân hàng Nhà nước cấp hoặc xác định trước ngày Nghị định này có hiệu lực thi hành được tiếp tục thực hiện theo nội dung, thời hạn ghi tại giây phép, hạn mức, trừ trường hợp bị điều chỉnh, thu hồi theo quy định của pháp luật. Việc cấp mới, sửa đổi, bổ sung, gia hạn sau ngày Nghị định này có hiệu lực thi hành thực hiện theo quy định tại Nghị định này."],["D7.K5","k","Thống đốc Ngân hàng Nhà nước có trách nhiệm hướng dẫn và tổ chức thực hiện Nghị định này."],["D7.K6","k","Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố và các tổ chức, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này. Nơi nhận: TM. CHÍNH PHỦ - Bạn Bí thư Trung ương Đảng : KT. THỦ TƯỚNG - Thủ tướng, các Phó Thủ tướng Chính phủ; | PHÓ THỦ TƯỚNG - Các bộ, cơ quan ngang bộ; - HĐND, UBND các tỉnh, thành phó; - Văn phòng Trung ương và các Ban của Đảng; - Văn phòng Tổng Bí thư; - Văn phòng Chủ tịch nước; - Hội đồng Dân tộc và các Ủy ban của Quốc hội; - Văn phòng, Quốc hội; - Tòa án nhân dân tối cao; - Viện kiểm sát nhân dân tối cao; - Kiểm toán nhà nước; - Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam; - Cơ quan trung ương của các tÔ chức chính trị - xã hội: - VPCP: BTCN, các PCN, Trợ lý TTg, các Vụ, Cục, Công báo; - Lưu: VT, KTTTH (2b).4w Lệ ấấyên Văn Thắng"]],"u":2085}],"391/2026/NĐ-CP":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Luật Tổ chức Chính phủ số 63/2025/QH15;"],["CC1","c","Căn cứ Luật Tổ chức chính quyên địa phương số 72/2025/QH15;"],["CC2","c","Căn cứ Luật Xử lý vi phạm hành chính số 15/2012/QH13, được sửa đổi, bỏ sung bởi Luật số 54/2014/QH13, Luật số 18/2017/QH14, Luật số 67/2020/QH14, Luật số 09/2022/QH15, Luật số 11⁄2022/QHI15, Luật số 56/2024/QH15, Luật số 88/2025/QH15, Luật số 116/2025/QH15 và Luật số 120/2025/QH15;"],["CC3","c","Căn cứ Luật Phòng, chống rửa tiền số 14/2022/QH15, được sửa đổi, bổ sung bởi Luật số 23/2026/QH16,"],["CC4","c","Căn cứ Luật Phòng, chống khủng bó số 28/2013/QH13, được sửa đổi, bồ sung bởi Luật số 14/2022/QH15, Theo đê nghị của Bộ trưởng Bộ Tài chính; Chính phủ ban hành Nghị định quy định xử phạt vi phạm hành chính trong lĩnh vực kinh doanh đặt cược và trò chơi có thưởng."]],"u":0},{"n":"Điều 1","t":"Phạm vi điều chỉnh","p":[],"u":2092},{"n":"Điều 2","t":"Đối tượng áp dụng","p":[["D2.K1","k","Nghị định này áp dụng đối với: cược và trò chơi có thưởng; chính, cơ quan quản lý nhà nước có liên quan đến việc kiểm tra và xử phạt vi phạm hành chính trong lĩnh vực đặt cược và trò chơi có thưởng."],["D2.K1.Đa","d","Tổ chức, cá nhân có hành vi vi phạm hành chính trong lĩnh vực đặt"],["D2.K1.Đb","d","Người có thẩm quyền lập biên bản, thâm quyền xử phạt vi phạm hành"],["D2.K2","k","Tổ chức quy định tại điểm a khoản 1 Điều này gồm: cược bóng đá quốc tế; nước ngoài; chơi có thưởng."],["D2.K2.Đa","d","Doanh nghiệp kinh doanh đặt cược đua ngựa, đặt cược đua chó và đặt"],["D2.K2.Đb","d","Doanh nghiệp kinh doanh casino;"],["D2.K2.Đc","d","Doanh nghiệp kinh doanh trò chơi điện tử có thưởng dành cho người"],["D2.K2.Đd","d","Các tổ chức khác có hành vi vi phạm trong lĩnh vực đặt cược và trò"]],"u":2093},{"n":"Điều 3","t":"Hình thức xử phạt vi phạm hành chính, biện pháp khắc phục hậu quả","p":[["D3.K1","k","Các hình thức xử phạt chính:"],["D3.K1.Đa","d","Cảnh cáo;"],["D3.K1.Đb","d","Phạt tiền."],["D3.K2","k","Các hình thức xử phạt bổ sung: thưởng có thời hạn; phạm hành chính."],["D3.K2.Đa","d","Đình chỉ hoạt động kinh doanh đặt cược, casino, trò chơi điện tử có"],["D3.K2.Đb","d","Tịch thu tang vật vi phạm hành chính, phương tiện được sử dụng để vi"],["D3.K3","k","Các biện pháp khắc phục hậu quả Ngoài các biện pháp khắc phục hậu quả quy định tại các điểm d, e và i khoản 1 Điều 28 của Luật Xử lý vi phạm hành chính, tổ chức, cá nhân có hành vi vi phạm hành chính quy định tại Nghị định này bị áp dụng các biện pháp khắc phục hậu quả sau: chứng nhận đủ điều kiện kinh doanh casino, Giấy chứng nhận đủ điều kiện kinh doanh trò chơi điện tử có thưởng dành cho người nước ngoài (sau đây gọi tắt là Giây chứng nhận đủ điều kiện kinh doanh) đã bị tẩy xóa, sửa chữa; 3 thưởng, đồng tiền quy ước vượt quá số lượng, không đúng chúng loại, loại hình trò chơi có thưởng, không đúng quy định của pháp luật; điện tử có thưởng (sau đây gọi tắt là Điểm kinh doanh) đáp ứng đầy đủ các điều kiện và theo đúng địa điêm được cơ quan quản lý nhà nước câp phép kinh doanh; đôi tượng ra, vào Điềm kinh doanh; ø) Buộc thành lập bộ phận kiểm soát nội bộ và bố trí người quản lý, điều hành Điêm kinh doanh đáp ứng đây đủ điêu kiện theo đúng quy định; Thê lệ trò chơi, Thê lệ đặt cược;"],["D3.K3.Đa","d","Buộc nộp lại Giấy chứng nhận đủ điều kiện kinh doanh đặt cược, Giấy"],["D3.K3.Đb","d","Buộc nộp lại vé đặt cược đã bị sửa chữa, tây xóa, bị giả mạo;"],["D3.K3.Đc","d","Buộc tiêu hủy các vé đặt cược không đúng quy định;"],["D3.K3.Đd","d","Buộc tiêu hủy các máy trò chơi, bàn trò chơi, thiết bị trò chơi có"],["D3.K3.Đđ","d","Buộc khôi phục Điểm kinh doanh casino, Điểm kinh doanh trò chơi"],["D3.K3.Đe","d","Buộc mở số theo dõi hoặc cấp thẻ điện tử để theo dõi, quản lý đầy đủ"],["D3.K3.Đh","d","Buộc thực hiện việc trả thưởng cho người chơi theo đúng quy định của"],["D3.K1~2","k","Buộc thu hồi giấy xác nhận tiền trúng thưởng không đúng đối tượng trúng thưởng hoặc không đúng với giá trị trúng thưởng thực tê; pháp luật; đủ điêu kiện làm đại lý bán vé đặt cược theo quy định của pháp luật."],["D3.K1~2.Đk","d","Buộc tháo dỡ nội dung và hình thức quảng cáo không đúng quy định"],["D3.K1~2.Đl","d","Buộc thanh lý hợp đồng đã ký với các cá nhân, tổ chức không đáp ứng"]],"u":2102},{"n":"Điều 4","t":"Mức phạt tiền, thẫm quyền phạt tiền, nguyên tắc áp dụng hình thức xử phạt vi phạm hành chính, xử phạt vi phạm hành chính trên môi trường điện tử","p":[["D4.K1","k","Mức phạt tiền tối đa đối với hành vi vi phạm hành chính trong lĩnh vực đặt cược và trò chơi có thưởng đối với tổ chức là 200.000.000 đồng và đối với cá nhân là 100.000.000 đông."],["D4.K2","k","Mức phạt tiền, thẩm quyền phạt tiền và thẫm quyển tịch thu tang vật, phương tiện vi phạm hành chính của từng chức danh đối với các hành vi vi phạm hành chính quy định tại Nghị định này áp dụng đối với tổ chức, trừ các hành vi quy định tại Điều 13, Điều 32 và Điều si Nghị định này \\ chỉ áp dụng đối với cá nhân. Mức phạt tiền, thẩm quyền phạt tiền và thẩm quyền tịch thu tang vật, phương tiện vi phạm hành chính của từng chức danh đối với cá nhân bằng 1⁄2 lần đối với tổ chức có cùng một hành vi vi phạm hành chính quy định tại Nghị định này."],["D4.K3","k","Tổ chức, cá nhân vi phạm hành chính nhiều lần thì bị xử phạt về từng hành vi vi phạm. 4"],["D4.K4","k","Việc xử lý vi phạm hành chính trong lĩnh vực đặt cược và trò chơi có thưởng trên môi trường điện tử được thực hiện theo quy định tại Điều 18a Luật Xử lý vi phạm hành chính, Điều 28a và Điều 28b Nghị định số 118/2021/NĐ- CP ngày 23 tháng 12 năm 2021 của Chính phủ quy định chỉ tiết một số điều và biện pháp thi hành Luật Xử lý vi phạm hành chính được sửa đổi, bổ sung bởi Nghị định số 68/2025/NĐ-CP ngày 18 tháng 3 năm 2025 và Nghị định số 190/2025/NĐ-CP ngày 01 tháng 7 năm 2025."]],"u":2120},{"n":"Điều 5","t":"Thời hiệu xử phạt vỉ phạm hành chính trong lĩnh vực đặt cược và trò chơi có thưởng","p":[["D5.K1","k","Thời hiệu xử phạt vi phạm hành chính trong lĩnh vực đặt cược và trò chơi có thưởng là 01 năm."],["D5.K2","k","Thời điểm tính thời hiệu xử phạt vi phạm hành chính trong lĩnh vực đặt cược và trò chơi có thưởng được quy định như sau: được tính từ thời điểm người có thâm quyền thi hành công vụ phát hiện hành vi vi phạm; từ thời điểm chấm dứt hành vi vi phạm."],["D5.K2.Đa","d","Đối với hành vi vi phạm hành chính đang được thực hiện thì thời hiệu"],["D5.K2.Đb","d","Đối với hành vi vi phạm hành chính đã kết thúc thì thời hiệu được tính"],["D5.K3","k","Thời điểm chấm dứt hành vi vi phạm để tính thời hiệu xử phạt đối với một số hành vi vi phạm tại Chương II Nghị định này được quy định như sau: điều kiện kinh doanh quy định tại Điều 8, Điều 25 và Điều 40 Nghị định này, thời điểm chấm dứt hành vi vi phạm để tính thời hiệu xử phạt là ngày nộp hồ sơ đến Bộ Tài chính; nhận đủ điều kiện kinh doanh quy định tại khoản 1 Điều 9, khoản 1 Điều 26 và khoản 1 Điều 41 Nghị định này, thời điểm chấm dứt hành vi vi phạm là thời điểm thực hiện hành vi sửa chữa, tây xóa; trường hợp không xác định được ngày sửa chữa, tây xoá làm thay đổi nội dung Giấy chứng nhận đủ điều kiện kinh doanh thì thời điểm chấm dứt hành vi vi phạm là ngày phát hiện Giấy chứng nhận đủ điều kiện kinh doanh bị sửa chữa, tây xóa làm thay đổi nội dung; lý nhà nước, gửi Điều lệ đua đến Hội đồng giám sát cuộc đua không đúng thời hạn theo quy định của pháp luật quy định tại khoản 1 Điều 14, khoản 1 Điều 30 và khoản 1 Điều 45 Nghị định này, thời điểm chấm dứt hành vi vi phạm là ngày gửi 5 Thể lệ trò chơi, Thể lệ đặt cược đến cơ quan quản lý nhà nước, gửi Điều lệ đua đến Hội đồng giám sát cuộc đua; người quản lý, điều hành Điểm kinh doanh không đúng thời hạn theo quy định của pháp luật quy định tại điểm b khoản 1 Điều 35 và điểm b khoản 1 Điều 50 Nghị định này, thời điểm chấm dứt hành vi vi phạm là ngày thực hiện thông báo thay đổi người quản lý, điều hành Điểm kinh doanh đến cơ quan quản lý nhà nước; định tại Điều 22, Điều 38 và Điều 53 Nghị định này, thời điểm chấm dứt hành vi vi phạm là ngày gửi văn bản công bố, cung cấp thông tỉn; Điều 23, khoản 3 Điều 37 và khoản 3 Điều 52 Nghị định này, thời điểm chấm dứt hành vi vi phạm là ngày tháo dỡ nội dung và hình thức quảng cáo không đúng quy định của pháp luật; Điều 39 và Điều 54 Nghị định này, thời điểm chấm dứt hành vi vi phạm là ngày gửi báo cáo, cung cấp thông tin, số liệu đầy đủ, chính xác cho cơ quan quản lý nhà nước theo đúng quy định của pháp luật."],["D5.K3.Đa","d","Đối với hành vi vi phạm quy định về hồ sơ cấp Giấy chứng nhận đủ"],["D5.K3.Đb","d","Đối với hành vi sửa chữa, tây xoá làm thay đổi nội dung Giấy chứng"],["D5.K3.Đc","d","Đối với hành vi gửi Thể lệ trò chơi, Thể lệ đặt cược đến cơ quan quản"],["D5.K3.Đd","d","Đối với hành vi thông báo đến cơ quan quản lý nhà nước khi thay đổi"],["D5.K3.Đđ","d","Đối với hành vi vi phạm quy định về công bố, cung cấp thông tỉn quy"],["D5.K3.Đe","d","Đối với hành vi vi phạm quy định về quảng cáo quy định tại khoản 3"],["D5.K3.Đg","d","Đối với hành vi vi phạm quy định về chế độ báo cáo quy định tại Điều 24,"],["D5.K4","k","Đối với các hành vi vi phạm hành chính ngoài các hành vi quy định tại khoản 3 Điều này, thời điểm chấm dứt hành vi vi phạm được thực hiện theo quy định tại Nghị định số 118/2021/NĐ-CP ngày 23 tháng 12 năm 2021 của Chính phủ quy định chỉ tiết một số điều và biện pháp thi hành Luật Xử lý vi phạm hành chính được sửa đổi, bổ sung bởi Nghị định số 68/2025/NĐ-CP ngày 18 tháng 3 năm 2025 và Nghị định số 190/2025/NĐ-CP ngày 01 tháng 7 năm 2025."]],"u":2125},{"n":"Điều 6","t":"Thi hành biện pháp khắc phục hậu quả và xác định số lợi bất hợp pháp có được do thực hiện hành vi vi phạm hành chính","p":[["D6.K1","k","Đối với biện pháp khắc phục hậu quả buộc tái xuất, buộc tiêu hủy các máy trò chơi, bàn trò chơi, thiết bị trò chơi có thưởng, đồng tiền quy ước vượt quá số lượng, không đúng chủng loại, loại hình trò chơi có thưởng, không đúng quy định của pháp luật được thực hiện như sau: phạt mà biện pháp khắc phục hậu quả buộc tái xuất các máy trò chơi, bàn trò chơi, thiết bị trò chơi có thưởng, đồng tiền quy ước ghỉ trong quyết định xử phạt vi phạm hành chính chưa được thực hiện thì bị áp dụng biện pháp khắc phục hậu 6 quả buộc tiêu hủy tang vật vi phạm hành chính là các máy trò chơi, bàn trò chơi, thiết bị trò chơi có thưởng, đồng tiền quy ước vi phạm; chức, cá nhân vi phạm có văn bản đề nghị cơ quan có thâm quyền áp dụng biện pháp khắc phục hậu quả buộc tiêu hủy các máy trò chơi, bàn trò chơi, thiết bị trò chơi có thưởng, đồng tiền quy ước vi phạm do không thực hiện được biện pháp khắc phục hậu quả tái xuất thì người đã ban hành quyết định xử phạt xem xét quyết định."],["D6.K1.Đa","d","Quá thời hạn 30 ngày, kể từ ngày hết thời hạn thi hành quyết định xử"],["D6.K1.Đb","d","Trường hợp chưa hết thời hạn quy định tại điểm a khoản này mà tổ"],["D6.K2","k","Đối với các hành vi vi phạm hành chính bị áp dụng biện pháp khắc - phục hậu quả buộc nộp lại Giấy chứng nhận đủ điều kiện kinh doanh bị tây xóa, sửa chữa làm thay đổi nội dung Giấy chứng nhận đủ điều kiện kinh doanh thì thực hiện như sau: áp dụng biện pháp khắc phục hậu quả buộc nộp lại Giấy chứng nhận đủ điều kiện kinh doanh đã bị tây xóa, sửa chữa mà giấy phép này vẫn đang bị người có thẩm quyền tạm giữ theo quy định tại các điểm a và b khoản 1 Điều 125 Luật Xử lý vi phạm hành chính, thì trong thời hạn 02 ngày làm việc, kể từ ngày ra quyết định xử phạt vi phạm hành chính, người có thẩm quyền đã ra quyết định xử phạt phải gửi văn bản đề nghị kèm theo quyết định xử phạt, Giấy chứng nhận đủ điều kiện kinh doanh đã bị tây xóa, sửa chữa cho cơ quan, người có thâm quyền đã cấp giấy phép đó; cá nhân, tổ chức vi phạm phải nộp lại Giấy chứng nhận đủ điều kiện kinh doanh đã bị tẩy xóa, sửa chữa cho cơ quan, người có thẩm quyền đã cấp giấy phép trong thời hạn được ghi trong quyết định xử phạt vi phạm hành chính và chịu mọi chi phí cho việc thực hiện biện pháp khắc phục hậu quả."],["D6.K2.Đa","d","Nếu tại thời điểm ban hành quyết định xử phạt vi phạm hành chính có"],["D6.K2.Đb","d","Nếu vụ việc không thuộc trường hợp quy định tại điểm a khoản này thì"],["D6.K3","k","Số lợi bất hợp pháp có được do thực hiện hành vi vi phạm hành chính theo quy định tại Nghị định này là vật, tiền, giấy tờ có giá hoặc tài sản khác có được từ vi phạm hành chính mà tổ chức, cá nhân đó đã thực hiện và được xác định như sau: nhân thu được từ hành vi vi phạm hành chính và được tính bằng toàn bộ số tiền cá nhân, tổ chức thu được từ việc chuyển nhượng, cung cấp dịch vụ; giá mà tổ chức, cá nhân vi phạm thu được từ hành vi vi phạm hành chính; 7 Trường hợp giấy tờ có giá đã được chuyền nhượng thì số lợi bất hợp pháp được xác định bằng số tiền thực tế thu được tại thời điểm chuyển nhượng; trường hợp giấy tờ có giá đã bị tâu tán, tiêu hủy thì số lợi bất hợp pháp được xác định theo giá trị số sách của tổ chức phát hành giấy tờ có giá tại thời điểm tấu tán, tiêu hủy; được từ hành vi vi phạm hành chính là các vật, tài sản khác theo quy định của Bộ luật Dân sự. Trường hợp vật, tài sản khác không phải hàng cấm, hàng giả, hàng hóa nhập lậu đã được chuyên nhượng, tiêu thụ hoặc tiêu hủy thì số lợi bất hợp pháp được xác định bằng số tiền tương đương giá trị thị trường của tài sản cùng loại hoặc xác định theo giá trị số sách của tài sản (nếu không có giá trị thị trường) hoặc xác định bằng giá trị tiền của tài sản ghi trên tờ khai xuất khẩu, tờ khai nhập khâu (nếu là hàng hóa xuất khâu, nhập khẩu) của tổ chức, cá nhân vi phạm sau khi trừ chỉ phí trực tiếp cấu thành hàng hóa căn cứ vào hồ sơ, chứng từ chứng minh tính hợp pháp, hợp lệ của các chi phí đó. Trường hợp vật, tài sản khác là hàng cấm, hàng giả, hàng hóa nhập lậu đã được chuyển nhượng, tiêu thụ thì số lợi bất hợp pháp được xác định là tổng số tiền mà tổ chức, cá nhân nhận được khi thực hiện chuyển nhượng, tiêu thụ."],["D6.K3.Đa","d","Số lợi bất hợp pháp thu được bằng tiền là toàn bộ số tiền tổ chức, cá"],["D6.K3.Đb","d","Số lợi bất hợp pháp thu được bằng giấy tờ có giá là toàn bộ giấy tờ có"],["D6.K3.Đc","d","Số lợi bất hợp pháp là vật, tài sản khác mà tổ chức, cá nhân vi phạm thu"]],"u":2139},{"n":"Điều 7","t":"Chuyển hồ sơ vụ vi phạm","p":[["D7.K1","k","Khi phát hiện hành vi vi phạm quy định tại khoản 1 và khoản 2 Điều 8, khoản 1 và khoản 3 Điều 9, khoản 2 Điều 10, khoản 1 Điều I1, khoản 1 và khoản 2 Điều 25, khoản 1, điểm a và b khoản 3 Điều 26, điểm b khoản 1 Điều 27, khoản 1 và khoản 2 Điều 40, khoản 1, điểm a và điểm b khoản 3 Điều 41, điểm b khoản 1 Điều 42, điểm b khoản 1 và khoản 2 Điều 58 Nghị định này nếu xét thấy hành vi có dấu hiệu tội phạm, người có thẩm quyền đang thụ lý vụ việc phải chuyển hồ sơ liên quan đến hành vi vi phạm cho cơ quan có thâm quyền tiến hành tố tụng hình sự."],["D7.K2","k","Trường hợp cơ quan tiến hành tố tụng hình sự không truy cứu trách nhiệm hình sự thì chuyền hỗ sơ vụ vi phạm đến người có thẩm quyền xử phạt vi phạm hành chính theo quy định tại khoản 3 Điều 62 Luật Xử lý vi phạm vi hành chính để xử phạt vi phạm hành chính theo quy định tại Nghị định này. §"]],"u":2150},{"n":"Điều 8","t":"Hành vi vi phạm quy định về hồ sơ cấp Giấy chứng nhận đủ điều kiện kinh doanh đặt cược","p":[["D8.K1","k","Phạt tiền từ 40.000.000 đồng đến 60.000.000 đồng đối với hành vi tự ý sửa chữa, tẩy xóa các tài liệu trong hồ sơ đề nghị cấp, cấp lại, điều chỉnh và gia hạn Giấy chứng nhận đủ điều kiện kinh doanh đặt cược mà chưa đến mức bị truy cứu trách nhiệm hình sự."],["D8.K2","k","Phạt tiền từ 80.000.000 đồng đến 100.000.000 đồng đối với hành vi lập, xác nhận hồ sơ, tài liệu giả mạo hoặc có thông tin sai lệch, sai sự thật hoặc che giấu sự thật trong hồ sơ đề nghị cấp, cấp lại, điều chỉnh và gia hạn Giấy chứng nhận đủ điều kiện kinh doanh đặt cược mà không bị truy cứu trách nhiệm hình sự."],["D8.K3","k","Hình thức xử phạt bô sung: Tịch thu tang vật, phương tiện vi phạm hành chính là tài liệu bị sửa chữa, tây xóa, giả mạo hoặc có thông tin sai lệch, sai sự thật hoặc che giấu sự thật đối với hành vi vi phạm hành chính quy định tại Điều này."],["D8.K4","k","Biện pháp khắc phục hậu quả: Buộc nộp lại số lợi bất hợp pháp có được do thực hiện vi phạm hành chính quy định tại Điều này."]],"u":2153},{"n":"Điều 9","t":"Hành vi vi phạm quy định về quản lý, sử dụng Giấy chứng nhận đủ điều kiện kinh doanh đặt cược","p":[["D9.K1","k","Phạt tiền từ 90.000.000 đồng đến 100.000.000 đồng đối với hành vi sửa chữa, tây xóa làm thay đổi nội dung Giấy chứng nhận đủ điều kiện kinh doanh đặt cược mà chưa đến mức bị truy cứu trách nhiệm hình sự."],["D9.K2","k","Phạt tiền từ 160.000.000 đồng đến 180.000.000 đồng đối với hành vi cho thuê, cho mượn, chuyên nhượng Giấy chứng nhận đủ điều kiện kinh doanh đặt cược. 9"],["D9.K3","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi vi phạm sau: kinh doanh đặt cược mà chưa đến mức bị truy cứu trách nhiệm hình sự; động kinh doanh đặt cược mà chưa đến mức bị truy cứu trách nhiệm hình sự."],["D9.K3.Đa","d","Kinh doanh đặt cược khi chưa được cấp Giấy chứng nhận đủ điều kiện"],["D9.K3.Đb","d","Kinh doanh đặt cược trong thời gian bị thu hồi hoặc bị đình chỉ hoạt"],["D9.K4","k","Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh đặt cược từ 06 tháng đến 12 tháng đối với hành vi vi phạm hành chính quy định tại khoản 2 Điều này."],["D9.K5","k","Biện pháp khắc phục hậu quả: xóa, sửa chữa đối với hành vi vi phạm hành chính quy định tại khoản 1 Điều này; chính quy định tại khoản 2 và khoản 3 Điều này."],["D9.K5.Đa","d","Buộc nộp lại Giấy chứng nhận đủ điều kiện kinh doanh đặt cược đã bị tây"],["D9.K5.Đb","d","Buộc nộp lại số lợi bất hợp pháp có được do thực hiện vi phạm hành"]],"u":2158},{"n":"Điều 10","t":"Hành vi vi phạm quy định về phạm vi được phép kinh doanh","p":[["D10.K1","k","Phạt tiền từ 160.000.000 đồng đến 180.000.000 đồng đối với một trong các hành vi vi phạm sau: đặt cược đồng ý hoặc ủy quyền."],["D10.K1.Đa","d","Liên kết với các đối tượng đặt cược bất hợp pháp để san sẻ rủi ro;"],["D10.K1.Đb","d","Cung cấp thông tin tỷ lệ cược mà không được doanh nghiệp kinh doanh"],["D10.K2","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi vi phạm sau: cơ quan quản lý nhà nước có thâm quyền cấp phép kinh doanh đặt cược theo quy định của pháp luật mà chưa đến mức bị truy cứu trách nhiệm hình sự; kinh doanh đặt cược trái phép mà chưa đến mức bị truy cứu trách nhiệm hình sự."],["D10.K2.Đa","d","Kinh doanh đặt cược vượt quá phạm vi được phép kinh doanh đã được"],["D10.K2.Đb","d","Lợi dụng kết quả sự kiện đặt cược để tham gia đặt cược hoặc tổ chức"],["D10.K3","k","Hình thức xử phạt bổ sung: hành vi vi phạm hành chính quy định tại điểm a khoản 1 và khoản 2 Điều này nếu vi phạm lần đầu; 10 hành vi vi phạm hành chính quy định tại điểm a khoản 1 và khoản 2 Điều này nếu vi phạm từ lần thứ hai trở lên."],["D10.K3.Đa","d","Đình chỉ hoạt động kinh doanh đặt cược từ 06 tháng đến 12 tháng đối với"],["D10.K3.Đb","d","Đình chỉ hoạt động kinh doanh đặt cược từ 12 tháng đến 24 tháng đối với"],["D10.K4","k","Biện pháp khắc phục hậu quả: Buộc nộp lại số lợi bất hợp pháp có được do thực hiện vi phạm hành chính quy định tại Điều này."]],"u":2168},{"n":"Điều 11","t":"Hành vi vi phạm quy định về loại hình đặt cược và sản phẩm đặt cược","p":[["D11.K1","k","Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi vi phạm sau: doanh đặt cược mà chưa đến mức bị truy cứu trách nhiệm hình sự; doanh đặt cược mà chưa đến mức bị truy cứu trách nhiệm hình sự."],["D11.K1.Đa","d","Kinh doanh loại hình đặt cược trái với quy định của pháp luật về kinh"],["D11.K1.Đb","d","Kinh doanh sản phẩm đặt cược trái với quy định của pháp luật về kinh"],["D11.K2","k","Hình thức xử phạt bổ sung: Đình chỉ hoạt động kinh doanh đặt cược từ 06 tháng đến 12 tháng đối với hành vi vi phạm hành chính quy định tại Điều này."],["D11.K3","k","Biện pháp khắc phục hậu quả: Buộc nộp lại số lợi bất hợp pháp có được do thực hiện vi phạm hành chính quy định tại Điều này."]],"u":2179},{"n":"Điều 12","t":"Hành vi vi phạm quy định về quản lý người chơi","p":[["D12.K1","k","Phạt tiền từ 130.000.000 đồng đến 150.000.000 đồng đối với hành vi bán vé đặt cược cho các đối tượng không được phép tham gia đặt cược."],["D12.K2","k","Phạt tiền từ 160.000.000 đồng đến 180.000.000 đồng đối với hành vi cho người chơi vay tiền để tham gia đặt cược."],["D12.K3","k","Hình thức xử phạt bố sung: vi phạm lần đầu; từ 12 tháng đến 24 tháng nếu vi phạm từ lần thứ hai trở lên đối với hành vi vi phạm hành chính quy định tại khoản 1 Điều này; hành vi vi phạm hành chính quy định tại khoản 2 Điều này."],["D12.K3.Đa","d","Đình chỉ hoạt động kinh doanh đặt cược từ 06 tháng đến 12 tháng nếu"],["D12.K3.Đb","d","Đình chỉ hoạt động kinh doanh đặt cược từ 06 tháng đến 12 tháng đối với"],["D12.K4","k","Biện pháp khắc phục hậu quả: lại Buộc nộp lại số lợi bất hợp pháp có được do thực hiện vi phạm hành chính quy định tại Điều này."]],"u":2185},{"n":"Điều 13","t":"Hành vi vi p
