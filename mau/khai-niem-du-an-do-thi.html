u 2 Luật An toàn, vệ sinh lao động, trừ đối tượng là người lao động Việt Nam đi làm việc tại nước ngoài theo hợp đồng."]],"u":1319},{"n":"Điều 2","t":"Tổ chức thực hiện","p":[["D2.K1","k","Ủy ban nhân dân cấp tỉnh có trách nhiệm chỉ đạo tuyên truyền, phổ biến và tổ chức thực hiện Thông tư này trên địa bàn địa phương."],["D2.K2","k","Cục Việc làm có trách nhiệm tổ chức thông tin, tuyên truyền, hướng dẫn, theo dõi, tổng hợp, đánh giá, báo cáo việc thực hiện Thông tư này."],["D2.K3","k","Người sử dụng lao động có trách nhiệm xác định các công việc có yêu cầu nghiêm ngặt tại cơ quan, tổ chức, đơn vị để thực hiện việc huấn luyện an toàn, vệ sinh lao động cho người làm công việc có yêu cầu nghiêm ngặt an toàn, vệ sinh lao động theo đúng quy định của pháp luật."]],"u":1322},{"n":"Điều 3","t":"Hiệu lực thi hành","p":[["D3.K1","k","Thông tư này có hiệu lực kể từ ngày 01 tháng 01 năm 2027."],["D3.K2","k","Thông tư số 06/2020/TT-BLĐTBXH ngày 20 tháng 8 năm 2020 của Bộ trưởng Bộ Lao động - Thương binh và Xã hội ban hành Danh mục công việc có yêu cầu nghiêm ngặt về an toàn, vệ sinh lao động hết hiệu lực kể từ ngày Thông tư này có hiệu lực. 2"],["D3.K3","k","Trong quá trình thực hiện Thông tư nếu có vướng mắc đề nghị phản ánh về Bộ Nội vụ để nghiên cứu, giải quyết./."]],"u":1326}],"384/2026/NĐ-CP":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Luật Tổ chức Chính phủ số 63/2025/QH15;"],["CC1","c","Căn cứ Luật Tổ chức chính quyên địa phương số 72/2025/QH15;"],["CC2","c","Căn cứ Luật Bảo vệ quyên lợi người tiêu dùng số 1 9/2023/QH15;"],["CC3","c","Căn cứ Luật Chất lượng sản phẩm, hàng hóa số 05/2007/QH12 được sửa đổi, bồ sung bởi Luật số 78/2025/QH15;"],["CC4","c","Căn cứ Luật Thương mại, số 36/2005/QH11 được sửa đổi, bồ sung bởi Luật số 05/2017/QH14, Luật số 44/2019/QH14 và Luật số 75/2025/QH15,"],["CC5","c","Căn cứ Nghị quyết số 1 09/2023/QH15 của Ủy ban Thường vụ Quốc hội về việc tiếp tục thực hiện một số nghị quyết của Quốc hội khóa XIV và fừ đâu nhiệm kỳ khóa XV đến hết Kỳ họp thứ 4 về giám sát chuyên đê, chất vấn; Theo đề nghị của Bộ trưởng Bộ Công Thương; Chính phủ ban hành Nghị định quy định xác định xuất xứ Việt Nam đối với hàng hóa sản xuát và lưu thông trong nước."]],"u":0},{"n":"Điều 1","t":"Phạm vi điều chỉnh","p":[["D1.K1","k","Nghị định này quy định xác định xuất xứ Việt Nam đối với hàng hóa sản xuất và lưu thông trong nước, bao gồm: hàng hóa có xuất xứ, hàng hóa có xuất xứ thuần túy, hàng hóa có xuất xứ không thuần túy, công đoạn gia công, chế biến đơn giản; yêu tố không được xem xét khi xác định xuất xứ; trách nhiệm của cơ quan, tô chức, cá nhân có liên quan."],["D1.K2","k","Nghị định này không điều chỉnh đối với các nội dung sau: xứ hàng hóa đối với hàng hóa xuất khẩu, hàng hóa nhập khẩu; dung bắt buộc khác trên nhãn hàng hóa;"],["D1.K2.Đa","d","Việc xác định xuất xứ hàng hóa để áp dụng biện pháp chứng nhận xuất"],["D1.K2.Đb","d","Quy định về cách ghi nhãn hàng hóa và cách thức trình bày các nội"],["D1.K2.Đe","d","Hoạt động truy xuất nguồn gốc sản phẩm, hàng hóa."]],"u":1330},{"n":"Điều 2","t":"Đối tượng áp dụng","p":[["D2.K1","k","Thương nhân tham gia hoạt động sản xuất và thương mại hàng hóa lưu thông trong nước."],["D2.K2","k","Cơ quan quản lý nhà nước, tô chức, cá nhân trong nước có liên quan."]],"u":1336},{"n":"Điều 3","t":"Giải thích từ ngữ","p":[["D3.K1","k","“Nguyên liệu” là bắt cứ vật liệu hay chất liệu nào được sử dụng hoặc tiêu tốn trong quá trình sản xuất ra hàng hóa hoặc kết hợp tự nhiên thành một hàng hóa khác hoặc tham gia vào quy trình sản xuất ra một hàng hóa khác."],["D3.K2","k","“Chuyên đổi mã số hàng hóa” là sự thay đổi về mã số HS ở cấp độ 04 số (theo Hệ thống hài hòa về mô tả và mã hóa hàng hóa của Tổ chức Hải quan Thế giới) từ nguyên liệu không có xuất xứ để sản xuất ra hàng hóa tại Việt Nam."],["D3.K3","k","“Hàm lượng giá trị Việt Nam - Viet Nam Value Content” (sau đây gọi là hàm lượng VVC) là phần giá trị gia tăng của Việt Nam, được tính trên tông giá trị của hàng hóa."],["D3.K4","k","“Giá xuất xưởng” là: xuất hoặc gia công cuối cùng, với điều kiện giá đó bao gồm trị giá của nguyên liệu được sử dụng và các chỉ phí khác phát sinh trong quá trình sản xuất, trừ các loại thuế, phí sẽ hoặc có thê được hoàn lại khi bán sản phẩm cuối cùng ra thị trường nội địa; trong quá trình sản xuất thực tế tại Việt Nam, giá xuất xưởng là tổng ch phí trừ đi các loại thuế, phí sẽ hoặc có thể được hoàn lại khi hàng hóa cuôi cùng được đưa vào hoạt động thương mại trên thị trường nội địa; nhân ký hợp đồng phụ thuê một nhà sản xuất khác gia công, sản xuất, thuật ngữ “nhà sản xuất” tại khoản này được hiểu là thương nhân đi thuê gia công hoặc sản xuất."],["D3.K4.Đa","d","Giá hàng hóa được trả cho nhà sản xuất đã tham gia vào quá trình sản"],["D3.K4.Đb","d","Trường hợp giá xuất xưởng không phản ánh đầy đủ chỉ phí phát sinh"],["D3.K4.Đe","d","Trường hợp công đoạn gia công hoặc sản xuất cuối cùng được thương"],["D3.K5","k","“IrỊ giá nguyên liệu” là trị giá hải quan tại thời điểm nhập khẩu hoặc giá thu mua tại Việt Nam, đã bao gôm chi phí mua nguyên liệu, chi phí vận tải và các chỉ phí khác có liên quan cho đến khi nguyên liệu được sử dụng để sản xuất hàng hóa lưu thông trong nước."]],"u":1339},{"n":"Điều 4","t":"Hàng hóa có xuất xứ Việt Nam","p":[["D4.K1","k","Hàng hóa có xuất xứ Việt Nam khi thuộc một trong các trường hợp sau: định này; Nghị định này."],["D4.K1.Đa","d","Hàng hóa có xuất xứ thuần túy Việt Nam theo quy định tại Điều 5 Nghị"],["D4.K1.Đb","d","Hàng hóa có xuất xứ không thuần túy Việt Nam theo quy định tại Điều 6"],["D4.K2","k","Trong trường hợp cần thiết, bộ, cơ quan ngang bộ xây dựng quy định riêng về hàng hóa có xuât xứ Việt Nam đôi với mặt hàng có tính chât đặc thù thuộc phạm vi quản lý, đảm bảo phù hợp quy định tại Nghị định này."]],"u":1348},{"n":"Điều 5","t":"Hàng hóa có xuất xứ thuần túy Việt Nam","p":[["D5.K1","k","Cây trồng và các sản phẩm từ cây trồng được trồng và thu hoạch tại Việt Nam."],["D5.K2","k","Động vật được sinh ra hoặc nuôi dưỡng tại Việt Nam."],["D5.K3","k","Sản phẩm từ động vật nêu tại khoản 2 Điều này."],["D5.K4","k","Sản phâm thu được từ săn bắn, đặt bẫy, đánh bắt, nuôi trồng, thu lượm hoặc săn băt tại Việt Nam."],["D5.K5","k","Khoáng sản và chất sản sinh tự nhiên được chiết xuất hoặc lấy ra từ đất, nước, đáy biên hoặc dưới đáy biên của Việt Nam."],["D5.K6","k","Sản phẩm lấy. từ nước, đáy biên hoặc dưới đáy biển bên ngoài lãnh hải của Việt Nam, với điều kiện Việt Nam có quyền khai thác đối với vùng nước, đáy biển và dưới đáy biển theo luật pháp quốc tế."],["D5.K7","k","Sản phẩm đánh bắt và hải sản khác đánh bắt từ vùng biển cả bằng tàu được đăng ký ở Việt Nam và được phép treo cờ của Việt Nam."],["D5.K8","k","Sản phâm được chế biến hoặc được sản xuất ngay trên tàu từ sản phẩm nêu tại khoản 7 Điêu này được đăng ký ở Việt Nam và được phép treo cờ của Việt Nam."],["D5.K9","k","Vật phẩm thu được trong quá trình sản xuất hoặc tiêu dùng ở Việt Nam hiện không còn thực hiện được chức năng ban đầu, không thể sửa chữa hay khôi phục được và chỉ có thê vứt bỏ hoặc dùng làm các nguyên liệu, vật liệu thô, hoặc sử dụng vào mục đích tái chế."],["D5.K10","k","Hàng hóa thu được hoặc được sản xuất từ sản phẩm theo quy định từ khoản 1 đến khoản 9 Điều này."]],"u":1353},{"n":"Điều 6","t":"Hàng hóa có xuất xứ không thuần túy Việt Nam","p":[["D6.K1","k","Chuyển đổi mã số hàng hóa."],["D6.K2","k","Có hàm lượng VVC tối thiểu 30% được xác định theo một trong hai công thức sau: Trị giá nguyên liệu có xuât xứ VVC = TH x 100% Giá xuât xưởng Giá xuất _ Trị giá nguyên liệu không có VVC= xưởng xuât xứ x 100% Giá xuât xưởng"],["D6.K2.Đa","d","Công thức trực tiếp:"],["D6.K2.Đb","d","Công thức gián tiếp:"],["D6.K3","k","Trị giá của vật liệu đóng gói và bao bì chứa đựng hàng hóa là một phần cầu thành nên hàng hóa và được tính vào hàm lượng VVC."],["D6.K4","k","Đối với hàng hóa thuộc lĩnh vực công nghệ thông tin và công nghệ số, các công đoạn tạo ra giá trị sản phẩm thực hiện tại Việt Nam được tính vào hàm lượng VVC, bao gồm: chỉ phí nghiên cứu, phát triển; chỉ phí thiết kế, lập trình, số hóa, tự động hóa; chi phí thử nghiệm kỹ thuật và kiểm thử phần mềm gắn liền với quy trình tạo ra sản phâm. Công đoạn gia công, chế biến đơn giản quy định tại khoản 2 Điều 7 Nghị định này và yếu tố không được xem xét khi xác định xuất xứ quy định tại Điều 8 Nghị định này không áp dụng đối với khoản này."],["D6.K5","k","Thương nhân lựa chọn công thức trực tiếp hoặc công thức gián tiếp, áp dụng trong năm tài chính."]],"u":1364},{"n":"Điều 7","t":"Công đoạn gia công, chế biến đơn giản","p":[["D7.K1","k","Công đoạn gia công, chế biến đơn giản là công đoạn không sử dụng kỹ năng đặc biệt, máy móc, dây chuyền hoặc thiết bị chuyên dụng và không được xét khi xác định xuất xứ hàng hóa Việt Nam theo quy định tại Điều 4, Điều 5 và Điêu 6 Nghị định này."],["D7.K2","k","Các công đoạn sau đây khi được thực hiện riêng rẽ hoặc kết hợp với nhau được xem là gia công, chê biên đơn giản: (thông gió, trải ra, sấy khô, làm lạnh, ngâm trong muối, xông lưu huỳnh hoặc thêm các phụ gia khác, loại bỏ các bộ phận bị hư hỏng và các công đoạn tương tự); các chât phủ bê mặt khác; chai, lọ, đóng gói, bao, hộp và các công việc đóng gói bao bì đơn giản khác; tương tự lên sản phâm hoặc bao bì của sản phâm; (bao gôm cả việc trộn các sản phâm khác loại) mà không làm thay đôi bản chât của hàng hóa; phận của sản phẩm để tạo nên một sản phẩm hoàn chỉnh hoặc tháo rời sản phẩm thành từng phần;"],["D7.K2.Đa","d","Công đoạn bảo quản hàng hóa trong quá trình vận chuyền và lưu kho"],["D7.K2.Đb","d","Công đoạn như lau chùi, bụi bặm, tây ri, tây dầu mỡ, tây sơn hoặc tây"],["D7.K2.Đe","d","Thay đổi bao bì đóng gói và tháo dỡ hay lắp ghép các lô hàng; đóng"],["D7.K2.Đđ","d","Dán hoặc ịn nhãn hiệu, nhãn, mác, lô-pô và các dâu hiệu phân biệt"],["D7.K2.Đđ~2","d","Giần, sàng, lựa chọn, phân loại, xếp loại, xếp nhóm hoặc trộn đơn giản"],["D7.K2.Đe~2","d","Chia tách hoặc lắp ráp đơn giản các lô hàng; lắp ráp đơn giản các bộ"],["D7.K8","k","Xay xát, bóc vỏ, tây trắng một phần hoặc toàn bộ, đánh bóng và làm láng ngũ cốc và gạo; nhuộm màu đường hoặc tạo đường miếng: rạch vỏ, trích hạt hoặc tróc hạt một cách đơn giản; ¡) Kiểm tra hoặc thử nghiệm một cách đơn giản;"],["D7.K8.Đh","d","Mài sắc, mài giữa đơn giản hoặc cắt đơn giản; là hoặc ép thắng vải;"],["D7.K8.Đk","d","Giết, mỗ động vật."],["D7.K3","k","Trong trường hợp cần thiết, bộ, cơ quan ngang bộ xây dựng quy định riêng về công đoạn gia công, chế biến đơn giản đối với mặt hàng có tính chất đặc thù thuộc phạm vi quản lý, đảm bảo phù hợp quy định tại Nghị định này."]],"u":1372},{"n":"Điều 8","t":"Yếu tố không được xem xét khi xác định xuất xứ Việt Nam","p":[["D8.K1","k","Nhiên liệu và năng lượng."],["D8.K2","k","Dụng cụ, khuôn rập và khuôn đúc."],["D8.K3","k","Phụ tùng, vật liệu dùng để bảo dưỡng thiết bị và nhà xưởng."],["D8.K4","k","Dầu nhờn, chất bôi trơn, hợp chất và các nguyên liệu khác dùng trong sản xuât hoặc dùng đề vận hành thiệt bị và nhà xưởng."],["D8.K5","k","Găng tay, kính, giày dép, quần áo và các thiết bị an toàn."],["D8.K6","k","Thiết bị, dụng cụ và máy móc dùng để kiểm tra hoặc thử nghiệm hàng hóa."],["D8.K7","k","Chất xúc tác và dung môi."],["D8.K8","k","Bất kỳ nguyên liệu nào khác không cấu thành hàng hóa nhưng việc sử dụng nguyên liệu phải được chứng minh là cân thiết trong quá trình sản xuât ra hàng hóa."]],"u":1385},{"n":"Điều 9","t":"Trách nhiệm của thương nhân, tổ chức, cá nhân thể hiện xuất xứ Việt Nam","p":[["D9.K1","k","Thương nhân, tổ chức, cá nhân thê hiện xuất xứ Việt Nam trên nhãn hàng hóa hoặc trên tài liệu, vật phẩm chứa đựng thông tin liên quan đến hàng hóa có trách nhiệm tuân thủ quy định tại Nghị định này. Đối với hàng hóa được thương nhân, tổ chức, cá nhân xác định xuất xứ Việt Nam, thương nhân, tô chức, cá nhân có trách nhiệm tuân thủ quy định pháp luật về ghi nhãn hàng hóa, bảo vệ quyền lợi người tiêu dùng, chất lượng sản phẩm, hàng hóa và quy định pháp luật khác liên quan."],["D9.K2","k","Thương nhân, tổ chức, cá nhân thể hiện xuất xứ Việt Nam chịu trách nhiệm trước pháp luật về tính chính xác, trung thực của thông tin đã công bố; thực hiện lưu trữ hồ sơ, chứng từ chứng minh xuất xứ hàng hóa (bao gồm hóa đơn đầu vào, bảng kê nguyên vật liệu, mô tả quy trình sản xuất và các tài liệu khác có liên quan) để phục vụ công tác thanh tra, kiểm tra của cơ quan có thầm quyền. Việc lưu trữ dưới dạng dữ liệu điện tử và văn bản thực hiện theo quy định của pháp luật về kế toán và pháp luật về lưu trữ."],["D9.K3","k","Thương nhân, tổ chức, cá nhân chịu trách nhiệm chứng minh hàng hóa có xuất xứ Việt Nam theo quy định tại Nghị định này khi cơ quan có thẩm quyền yêu cầu."],["D9.K4","k","Thương nhân, tổ chức, cá nhân có trách nhiệm tuân thủ pháp luật Việt Nam về xuất xứ hàng hóa xuất khẩu và quy định của nước nhập khâu đối với hàng hóa sản xuất, lưu thông trong nước sau đó được xuất khẩu."]],"u":1394},{"n":"Điều 10","t":"Trách nhiệm của cơ quan quản lý nhà nước","p":[["D10.K1","k","Bộ Công Thương có trách nhiệm: quan tô chức thi hành Nghị định này; hóa sản xuât và lưu thông trong nước; khung kỹ thuật và tiêu chí chung tại Nghị định này; tham gia ý kiến đối với văn bản quy định xác định xuất xứ riêng do bộ, cơ quan ngang bộ chủ trì; tổng hợp văn bản hướng dẫn quy định xác định xuất xứ Việt Nam đối với hàng hóa thuộc lĩnh vực quản lý chuyên ngành của bộ, cơ quan ngang bộ ban hành theo quy định tại khoản 2 Điều 4 và khoản 3 Điều 7 Nghị định này và đăng tải công khai tại Công thông tin điện tử Bộ Công Thương; hóa sản xuât và lưu thông trong nước theo thâm quyên đề phục vụ yêu câu quản lý của Bộ Công Thương; định xuất xứ.Việ am đối với hàng hóa sản xuất và lưu thông trong nước thuộc phạm vự đuản lý hề nước của bộ, cơ quan ngang bộ đề phục vụ yêu cầu quản lý của bộ, cơ quan nghg bộ; ©) Phối hợp với bộ ( cơ quan ngang bộ thực hiện kết nối, chia sẻ cơ sở dữ liệu Vệ ` xuất xứ hàng hội sản xuât và lưu thông trong nước."],["D10.K1.Đa","d","Chủ trì, phối hợp với các bộ, cơ quan ngang bộ, cơ quan, tổ chức liên"],["D10.K1.Đb","d","Là cơ quan đầu mối giúp Chính phủ quản lý nhà nước về xuất xứ hàng"],["D10.K1.Đc","d","Tham mưu, tổng hợp, trình Chính phủ ban hành quy định yêu cầu,"],["D10.K1.Đđ","d","Xây dựng, ban hành quy định xác định xuất. xứ Việt Nam đối với hàng"],["D10.K1.Đđ~2","d","Phối hợp với bộ, cơ quan ngang bộ triển khai thực hiện quy định xác"],["D10.K2","k","Bộ, cơ qúâiTieang bộ có trách nhiệm: ___8) Xây dựng, ban hành quy định xác định hàng hóa có xuất xứ Việt Nam đôi với mặt hàng có tính chât đặc thù thuộc phạm vi được sản xuât và lưu thông trong nước trong trường hợp cân thiệt; công tác kiêm tra, thực hiện quy định vê xuât xứ hàng hóa sản xuât và lưu thông trong nước thuộc phạm vi quản lý; ©) Định kỳ báo cáo tình hình thực hiện quy định tại Nghị định này về Bộ Công Thương đê kịp thời báo cáo Chính phủ."],["D10.K2.Đb","d","Chủ trì, phối hợp với Bộ Công Thương và cơ quan có thầm quyền trong"],["D10.K3","k","Ủy ban nhân dân tỉnh, thành phố có trách nhiệm: định về xuât xứ hàng hóa sản xuât và lưu thông tại địa phương; Nam đôi với hàng hóa sản xuât và lưu thông tại địa phương."],["D10.K3.Đa","d","Quản lý, kiểm tra và phối hợp với bộ, cơ quan ngang bộ thực hiện quy"],["D10.K3.Đb","d","Tổng hợp, báo cáo cơ quan đầu mối về tình hình xác định xuất xứ Việt"]],"u":1399},{"n":"Điều 11","t":"Điều khoản thi hành","p":[["D11.K1","k","Nghị định này có hiệu lực thí hành từ ngày 01 tháng 01 năm 2027."],["D11.K2","k","Trường hợp văn bản quy phạm pháp luật dẫn chiếu trong Nghị định này được thay thế hoặc sửa đồi, bổ sung, Nghị định này áp dụng theo văn bản quy phạm pháp luật được thay thế hoặc sửa đổi, bổ sung."],["D11.K3","k","Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân tỉnh, thành phô trong phạm vi chức năng, nhiệm vụ của mình chịu trách nhiệm hướng dân và thi hành Nghị định này."]],"u":1411},{"n":"Điều 12","t":"Điều khoản chuyển tiếp","p":[],"u":1415}],"385/2026/NĐ-CP":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Luật Tổ chức Chính phủ số 63/2025/QH15;"],["CC1","c","Căn cứ Luật Tổ chức chính quyền địa phương số 72/2025/QH15;"],["CC2","c","Căn cứ Luật Ban hành văn bản quy phạm pháp luật số 64/2025/QH15 được sửa đổi, bổ sung bởi Luật số 87/2025/QH15; Theo đề nghị của Bộ trưởng Bộ Tư pháp; Chính phủ ban hành Nghị định về kiểm soát thủ tục hành chính."]],"u":0},{"n":"Điều 1","t":"Phạm vi điều chỉnh","p":[["D1.K1","k","Nghị định này quy định về kiểm soát việc quy định, thực hiện, rà soát, đánh giá thủ tục hành chính và quản lý Cơ sở dữ liệu quốc gia về thủ tục hành chính."],["D1.K2","k","Nghị định này không điều chỉnh: hành chính nhà nước và do cơ quan đó quy định; thanh tra, kiểm tra; thủ tục hành chính có nội dung bí mật nhà nước."],["D1.K2.Đa","d","Thủ tục hành chính để giải quyết công việc nội bộ trong một cơ quan"],["D1.K2.Đb","d","Thủ tục xử lý vi phạm hành chính; trình tự, thủ tục tiến hành hoạt động"],["D1.K3","k","Khuyến khích các cơ quan khác không thuộc hệ thống cơ quan hành chính nhà nước áp dụng các quy định của Nghị định này trong việc quy định, thực hiện, rà soát, đánh giá, công bố thủ tục hành chính và quản lý cơ sở dữ liệu về thủ tục hành chính thuộc phạm vi quản lý của mình, phù hợp với chức năng, nhiệm vụ, quyền hạn và quy định của pháp luật."]],"u":1416},{"n":"Điều 2","t":"Đối tượng áp dụng","p":[],"u":1422},{"n":"Điều 3","t":"Giải thích từ ngữ","p":[["D3.K1","k","“Thủ tục hành chính” là trình tự, cách thức thực hiện, hồ sơ và yêu cầu, điều kiện do cơ quan nhà nước, người có thẩm quyền quy định để giải quyết một công việc cụ thể liên quan đến cá nhân, tổ chức hoặc giữa các cơ quan nhà nước với nhau. Thủ tục hành chính bao gồm: Nhà nước ủy nhiệm thực hiện và cá nhân, tổ chức là trình tự, cách thức thực hiện, hồ sơ và yêu cầu, điều kiện do cơ quan nhà nước hoặc người có thẩm quyền quy định để giải quyết một công việc cụ thể liên quan đến cá nhân, tổ chức; cầu, điều kiện do cơ quan hành chính nhà nước, người có thẩm quyền ban hành để giải quyết công việc liên quan từ hai cơ quan hành chính nhà nước trở lên hoặc được ban hành để áp dụng chung cho các cơ quan hành chính nhà nước."],["D3.K1.Đa","d","Thủ tục hành chính giữa cơ quan nhà nước hoặc tổ chức, cá nhân do"],["D3.K1.Đb","d","Thủ tục hành chính nội bộ là trình tự, cách thức thực hiện, hồ sơ và yêu"],["D3.K2","k","“Trình tự thực hiện” là thứ tự các bước tiến hành của đối tượng và cơ quan thực hiện thủ tục hành chính trong giải quyết một công việc cụ thể cho cá nhân, tổ chức; giữa các cơ quan nhà nước với nhau."],["D3.K3","k","“Hồ sơ” là những loại giấy tờ mà đối tượng thực hiện thủ tục hành chính cần phải nộp hoặc xuất trình cho cơ quan, tổ chức có thẩm quyền giải quyết thủ tục hành chính hoặc cơ quan hành chính có trách nhiệm khai thác trên cơ sở dữ liệu quốc gia, cơ sở dữ liệu chuyên ngành để giải quyết một công việc cụ thể cho cá nhân, tổ chức."],["D3.K4","k","“Yêu cầu, điều kiện” là những đòi hỏi mà đối tượng thực hiện thủ tục hành chính phải đáp ứng hoặc phải làm khi thực hiện một thủ tục hành chính cụ thể."],["D3.K5","k","“Kiểm soát thủ tục hành chính” là việc xem xét, đánh giá, theo dõi nhằm bảo đảm tính hợp hiến, hợp pháp, khả thi của quy định về thủ tục hành chính, đáp ứng yêu cầu công khai, minh bạch trong quá trình ban hành, tổ chức thực hiện thủ tục hành chính."],["D3.K6","k","“Cơ sở dữ liệu quốc gia về thủ tục hành chính” là tập hợp thông tin về thủ tục hành chính và các văn bản quy phạm pháp luật có quy định về thủ tục hành chính được xây dựng, cập nhật và duy trì trên Cổng Dịch vụ công quốc gia nhằm đáp ứng yêu cầu công khai, minh bạch trong quản lý hành chính nhà nước, tạo thuận lợi cho cá nhân, tổ chức truy nhập và sử dụng thông tin chính thức về thủ tục hành chính. 3"],["D3.K7","k","“Đánh giá tác động thủ tục hành chính bảo đảm nguyên tắc cạnh tranh” là việc xem xét, đánh giá các quy định về thủ tục hành chính nhằm bảo đảm các quy định không tạo ra rào cản gia nhập thị trường, không phân biệt đối xử giữa các chủ thể kinh tế và không làm hạn chế quyền tự do kinh doanh; xây dựng môi trường đầu tư, kinh doanh bình đẳng, minh bạch và hiệu quả."],["D3.K8","k","“Đánh giá tác động thủ tục hành chính theo quản lý rủi ro” là việc xem xét, đánh giá các quy định về thủ tục hành chính để nhận diện và đánh giá bản chất, nguyên nhân, xác suất xảy ra, mức độ tác động, hậu quả và khả năng kiểm soát của rủi ro đối với lợi ích công, mục tiêu quản lý nhà nước, từ đó lựa chọn biện pháp quản lý phù hợp."]],"u":1423},{"n":"Điều 4","t":"Nguyên tắc kiểm soát thủ tục hành chính","p":[["D4.K1","k","Kiểm soát thủ tục hành chính phải bảo đảm thực hiện có hiệu quả mục tiêu cải cách thủ tục hành chính, cải cách hành chính; bảo đảm sự tham gia của cá nhân, tổ chức và các bên có liên quan trong quá trình xây dựng, thực hiện và đánh giá thủ tục hành chính."],["D4.K2","k","Kịp thời phát hiện để bãi bỏ hoặc sửa đổi, bổ sung thủ tục hành chính không phù hợp, phức tạp, phiền hà; bảo đảm các thủ tục hành chính được ban hành đúng quy định, đơn giản, dễ hiểu, dễ thực hiện, tiết kiệm thời gian, chi phí, công sức của đối tượng thực hiện và cơ quan thực hiện thủ tục hành chính."],["D4.K3","k","Kiểm soát thủ tục hành chính được thực hiện ngay từ khi đề xuất chính sách, soạn thảo văn bản quy phạm pháp luật và được tiến hành thường xuyên, liên tục trong quá trình tổ chức thực hiện thủ tục hành chính."],["D4.K4","k","Kiểm soát thủ tục hành chính phải gắn với chuyển đổi số và quản trị dữ liệu, bảo đảm khai thác, kết nối, chia sẻ và tái sử dụng dữ liệu trong toàn bộ quá trình giải quyết thủ tục hành chính."]],"u":1434},{"n":"Điều 5","t":"Cơ quan, đơn vị kiểm soát thủ tục hành chính","p":[["D5.K1","k","Bộ Tư pháp giúp Chính phủ thống nhất quản lý nhà nước về công tác kiểm soát thủ tục hành chính. Cục Kiểm soát thủ tục hành chính thuộc Bộ Tư pháp có chức năng tham mưu, giúp Bộ trưởng Bộ Tư pháp thực hiện quản lý nhà nước về công tác kiểm soát thủ tục hành chính."],["D5.K2","k","Tổ chức pháp chế hoặc Văn phòng của bộ, cơ quan ngang bộ có chức năng tham mưu, giúp Bộ trưởng, Thủ trưởng cơ quan ngang bộ thực hiện quản lý nhà nước về công tác kiểm soát thủ tục hành chính trong phạm vi ngành, lĩnh vực quản lý. 4"],["D5.K3","k","Văn phòng Ủy ban nhân dân tỉnh, thành phố (sau đây gọi là cấp tỉnh) có chức năng tham mưu, giúp Ủy ban nhân dân cấp tỉnh thực hiện công tác kiểm soát thủ tục hành chính tại địa phương."],["D5.K4","k","Trung tâm Phục vụ hành chính công thuộc Ủy ban nhân dân xã, phường, đặc khu (sau đây gọi là cấp xã) có chức năng tham mưu, giúp Ủy ban nhân dân cấp xã, Chủ tịch Ủy ban nhân dân cấp xã tổ chức thực hiện công tác kiểm soát thủ tục hành chính tại địa bàn xã. Trường hợp địa phương tổ chức theo mô hình Trung tâm Phục vụ hành chính công một cấp thì Văn phòng Hội đồng nhân dân, Ủy ban nhân dân có chức năng tham mưu giúp Ủy ban nhân dân cấp xã, Chủ tịch Ủy ban nhân dân cấp xã tổ chức thực hiện công tác kiểm soát thủ tục hành chính tại địa bàn xã."]],"u":1439},{"n":"Điều 6","t":"Quy định thủ tục hành chính trong văn bản quy phạm pháp luật","p":[["D6.K1","k","Thủ tục hành chính quy định trong văn bản quy phạm pháp luật phải tuân thủ các nguyên tắc sau đây: không trái với điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên; hiện phân công, phân cấp rõ ràng, minh bạch, hợp lý; hành chính theo quy định tại khoản 2 Điều 7 Nghị định này; danh điện tử, chỉ cung cấp thông tin một lần trong giải quyết thủ tục hành chính."],["D6.K1.Đa","d","Bảo đảm tính hợp hiến, hợp pháp, thống nhất, đồng bộ, hiệu quả,"],["D6.K1.Đb","d","Minh bạch, đơn giản, dễ hiểu và dễ thực hiện;"],["D6.K1.Đc","d","Tiết kiệm thời gian và chi phí của cơ quan, tổ chức và cá nhân;"],["D6.K1.Đd","d","Bảo đảm quyền bình đẳng của các đối tượng thực hiện thủ tục hành chính;"],["D6.K1.Đđ","d","Bảo đảm tính liên thông giữa các thủ tục hành chính liên quan, thực"],["D6.K1.Đe","d","Bảo đảm quy định đầy đủ, cụ thể các bộ phận cấu thành của thủ tục"],["D6.K1.Đg","d","Bảo đảm nguyên tắc số hóa, sử dụng, kết nối liên thông dữ liệu, định"],["D6.K2","k","Cơ quan lập đề xuất chính sách, cơ quan chủ trì soạn thảo có trách nhiệm đánh giá tác động thủ tục hành chính nếu giải pháp thực hiện chính sách, dự án, dự thảo văn bản quy phạm pháp luật có quy định thủ tục hành chính."],["D6.K3","k","Quy định thủ tục hành chính làm hạn chế quyền tự do kinh doanh, cạnh tranh bình đẳng của cá nhân, tổ chức, ảnh hưởng đến quốc phòng, an ninh, trật tự, an toàn xã hội, sức khỏe cộng đồng, môi trường, thì các quy định về yêu cầu, điều kiện của thủ tục hành chính phải được quy định tại văn bản quy phạm pháp 5 luật thuộc thẩm quyền ban hành của Quốc hội, Ủy ban Thường vụ Quốc hội, Chính phủ."]],"u":1444},{"n":"Điều 7","t":"Yêu cầu của việc quy định thủ tục hành chính","p":[["D7.K1","k","Thủ tục hành chính theo quy định của Nghị định này phải được quy định trong văn bản quy phạm pháp luật theo đúng thẩm quyền, hình thức, trình tự, thủ tục quy định của pháp luật về văn bản quy phạm pháp luật và phải đáp ứng các quy định tại khoản 2, khoản 3 Điều này."],["D7.K2","k","Việc quy định một thủ tục hành chính phải bảo đảm đầy đủ các bộ phận cấu thành cơ bản sau đây: chính; kết quả thực hiện thủ tục hành chính; yêu cầu, điều kiện; phí, lệ phí thì mẫu đơn, mẫu tờ khai hành chính; kết quả thực hiện thủ tục hành chính; yêu cầu, điều kiện; phí, lệ phí là bộ phận cấu thành của thủ tục hành chính."],["D7.K2.Đa","d","Tên thủ tục hành chính;"],["D7.K2.Đb","d","Trình tự thực hiện;"],["D7.K2.Đc","d","Cách thức thực hiện;"],["D7.K2.Đd","d","Thành phần, số lượng hồ sơ;"],["D7.K2.Đđ","d","Thời hạn giải quyết;"],["D7.K2.Đe","d","Đối tượng thực hiện thủ tục hành chính;"],["D7.K2.Đg","d","Cơ quan giải quyết thủ tục hành chính;"],["D7.K2.Đh","d","Trường hợp thủ tục hành chính phải có mẫu đơn, mẫu tờ khai hành"],["D7.K3","k","Trường hợp không quy định đầy đủ, cụ thể các bộ phận cấu thành thủ tục hành chính trong một văn bản thì phải giao cơ quan, người có thẩm quyền quy định để bảo đảm đầy đủ, cụ thể các bộ phận cấu thành của thủ tục hành chính và bảo đảm có hiệu lực cùng thời điểm có hiệu lực của văn bản giao quy định thủ tục hành chính hoặc thời điểm có hiệu lực của quy định thủ tục hành chính. | 4. | | Quy | | đị | nh | | t | hủ tục hành chính phải bảo đảm quyền lựa chọn cách thức thực hiện của cá nhân, tổ chức, trong đó, ưu tiên thực hiện được trên môi trường điện tử, thực hiện không phụ thuộc vào địa giới hành chính."]],"u":1455},{"n":"Điều 8","t":"Thẩm quyền quy định thủ tục hành chính","p":[["D8.K1","k","Bộ, cơ quan ngang bộ ban hành theo thẩm quyền hoặc trình cấp có thẩm quyền ban hành thủ tục hành chính trong các trường hợp: quốc; chỉ đề xuất phân quyền, phân cấp quy định thủ tục hành chính trong trường hợp cần thiết, gắn với đặc thù điều kiện kinh tế - xã hội của địa phương. 6 định này;"],["D8.K1.Đa","d","Thủ tục hành chính có tính chất chung và được thực hiện trên phạm vi toàn"],["D8.K1.Đb","d","Thủ tục hành chính nội bộ quy định tại điểm b khoản 1 Điều 3 Nghị"],["D8.K1.Đc","d","Các thủ tục hành chính quy định tại khoản 3 Điều 6 Nghị định này."],["D8.K2","k","Chính quyền địa phương quy định thủ tục hành chính trong các trường hợp: do văn bản quy phạm pháp luật cấp trên giao; pháp khác có tính chất đặc thù phù hợp với điều kiện kinh tế - xã hội của địa phương. định này."],["D8.K2.Đa","d","Để thực hiện nội dung được phân quyền, phân cấp; quy định nội dung"],["D8.K2.Đb","d","Thực hiện thí điểm các chính sách theo quy định của pháp luật; biện"],["D8.K2.Đc","d","Thủ tục hành chính nội bộ quy định tại điểm b khoản 1 Điều 3 Nghị"],["D8.K3","k","Thủ tục hành chính liên thông giữa các ngành phải được quy định tại văn bản quy phạm pháp luật thuộc thẩm quyền ban hành của Quốc hội, Ủy ban Thường vụ Quốc hội, Chính phủ, Thủ tướng Chính phủ."]],"u":1467},{"n":"Điều 9","t":"Thông báo dự kiến ban hành thủ tục hành chính mới","p":[["D9.K1","k","Thông báo tới Bộ Tư pháp trên Nền tảng số về kiểm soát thủ tục hành chính. Nội dung thông báo gồm tên của thủ tục hành chính mới; phạm vi điều chỉnh, đối tượng thực hiện; vấn đề thực tiễn cần giải quyết và mục tiêu của thủ tục hành chính; chi phí tuân thủ thủ tục hành chính (nếu có) và thời gian dự kiến trình hoặc ban hành."],["D9.K2","k","Đăng tải thủ tục hành chính mới dự kiến ban hành theo quy định tại khoản 1 Điều này trên Nền tảng số về kiểm soát thủ tục hành chính để lấy ý kiến cơ quan, cá nhân, tổ chức có liên quan. Việc lấy ý kiến về thủ tục hành chính quy định tại khoản này thực hiện cùng với việc lấy ý kiến theo quy định của pháp luật về ban hành văn bản quy phạm pháp luật."]],"u":1477},{"n":"Điều 10","t":"Trường hợp không phải thực hiện việc thông báo trước khi ban hành thủ tục hành chính","p":[["D10.K1","k","Cần kịp thời ban hành thủ tục hành chính để xử lý tình huống khẩn cấp, thiên tai, dịch bệnh, quốc phòng, an ninh, trật tự, an toàn xã hội. 7"],["D10.K2","k","Thủ tục hành chính dự kiến ban hành không làm phát sinh hoặc giảm chi phí tuân thủ, đơn giản hóa trình tự, cách thức thực hiện, thành phần hồ sơ, yêu cầu, điều kiện hoặc tạo thuận lợi hơn cho cá nhân, tổ chức."],["D10.K3","k","Thủ tục hành chính quy định trong các văn bản quy phạm pháp luật được xây dựng, ban hành theo trình tự, thủ tục rút gọn và trong trường hợp đặc biệt."],["D10.K4","k","Thủ tục hành chính nội bộ theo quy định tại điểm b khoản 1 Điều 3 Nghị định này."]],"u":1480},{"n":"Điều 11","t":"Lấy ý kiến trong quá trình xây dựng văn bản quy phạm pháp luật có quy định thủ tục hành chính","p":[["D11.K1","k","Việc lấy ý kiến về thủ tục hành chính trong đề xuất chính sách, dự án, dự thảo văn bản quy phạm pháp luật được thực hiện cùng với việc lấy ý kiến đối với đề xuất chính sách, dự án, dự thảo văn bản quy phạm pháp luật. Cơ quan đề xuất chính sách, cơ quan chủ trì soạn thảo văn bản quy phạm pháp luật có trách nhiệm lấy ý kiến cơ quan, đơn vị kiểm soát thủ tục hành chính, đối tượng chịu sự tác động, cơ quan, hiệp hội nghề nghiệp, tổ chức có liên quan, chuyên gia, nhà khoa học đối với các quy định về thủ tục hành chính trong đề xuất chính sách và dự án, dự thảo văn bản quy phạm pháp luật."],["D11.K2","k","Việc lấy ý kiến cơ quan, đơn vị kiểm soát thủ tục hành chính đối với quy định về thủ tục hành chính được thực hiện như sau: chính sách, dự án, dự thảo văn bản quy phạm pháp luật do Chính phủ trình Quốc hội, Ủy ban Thường vụ Quốc hội, văn bản quy phạm pháp luật thuộc thẩm quyền ban hành của Chính phủ, Thủ tướng Chính phủ; hành chính của các bộ, cơ quan ngang bộ có ý kiến về thủ tục hành chính quy định trong văn bản quy phạm pháp luật thuộc thẩm quyền ban hành của Bộ trưởng, Thủ trưởng cơ quan ngang bộ; tham gia ý kiến đối với đề xuất chính sách, dự án, dự thảo văn bản quy phạm pháp luật khác có quy định thủ tục hành chính khi nhận được đề nghị; trong văn bản quy phạm pháp luật thuộc thẩm quyền ban hành của Hội đồng nhân dân, Ủy ban nhân dân, Chủ tịch Ủy ban nhân dân cấp tỉnh; tại khoản 4 Điều 5 Nghị định này có ý kiến về thủ tục hành chính trong văn bản quy phạm pháp luật thuộc thẩm quyền ban hành của Hội đồng nhân dân, Ủy ban nhân dân cấp xã. 8"],["D11.K2.Đa","d","Bộ Tư pháp có ý kiến về thủ tục hành chính quy định trong đề xuất"],["D11.K2.Đb","d","Đơn vị được giao nhiệm vụ tham mưu về công tác kiểm soát thủ tục"],["D11.K2.Đc","d","Văn phòng Ủy ban nhân dân cấp tỉnh có ý kiến về thủ tục hành chính"],["D11.K2.Đd","d","Đơn vị có chức năng thực hiện kiểm soát thủ tục hành chính quy định"],["D11.K3","k","Hồ sơ dự thảo văn bản gửi lấy ý kiến và thời hạn để cơ quan, đơn vị kiểm soát thủ tục hành chính tham gia ý kiến thực hiện theo quy định về lấy ý kiến của pháp luật về xây dựng, ban hành văn bản quy phạm pháp luật."],["D11.K4","k","Việc cho ý kiến về quy định thủ tục hành chính theo các nội dung quy định tại các Điều 6, 7, 8, 9, 12, 13 của Nghị định này."],["D11.K5","k","Cơ quan đề xuất chính sách, cơ quan chủ trì soạn thảo có trách nhiệm nghiên cứu, tiếp thu, giải trình đầy đủ ý kiến góp ý của cơ quan, đơn vị kiểm soát thủ tục hành chính và các cơ quan, cá nhân, tổ chức có liên quan theo quy định của pháp luật về văn bản quy phạm pháp luật."]],"u":1485},{"n":"Điều 12","t":"Đánh giá tác động thủ tục hành chính","p":[["D12.K1","k","Việc quy định thủ tục hành chính trong đề xuất chính sách, dự án, dự thảo văn bản quy phạm pháp luật phải bảo đảm nguyên tắc hài hoà giữa yêu cầu quản lý nhà nước và quyền, lợi ích hợp pháp của cá nhân, tổ chức."],["D12.K2","k","Nội dung đánh giá tác động được thực hiện theo các tiêu chí sau đây:"],["D12.K2.Đa","d","Sự cần thiết của thủ tục hành chính;"],["D12.K2.Đb","d","Tính hợp lý của thủ tục hành chính;"],["D12.K2.Đc","d","Tính hợp hiến, hợp pháp của thủ tục hành chính;"],["D12.K2.Đd","d","Chi phí tuân thủ thủ tục hành chính."],["D12.K3","k","Trách nhiệm đánh giá tác động của cơ quan đề xuất chính sách, cơ quan chủ trì soạn thảo. nhiệm đánh giá sự cần thiết của thủ tục hành chính; cơ quan chủ trì soạn thảo đánh giá theo các nội dung quy định tại các điểm b, c, d khoản 2 Điều này. Đối với văn bản không thực hiện quy trình chính sách, cơ quan chủ trì soạn thảo đánh giá theo các nội dung quy định tại các điểm a, b, c, d khoản 2 Điều này."],["D12.K3.Đa","d","Tại giai đoạn đề xuất chính sách, cơ quan đề xuất chính sách có trách"],["D12.K3.Đb","d","Tại giai đoạn soạn thảo, đối với văn bản thực hiện quy trình chính sách,"],["D12.K4","k","Khi thực hiện việc đánh giá tác động thủ tục hành chính quy định tại khoản 2 Điều này phải bao gồm đánh giá mức độ ứng dụng công nghệ thông tin và khả năng thực hiện trên môi trường điện tử. Thủ tục hành chính quy định tại Điều 13 Nghị định này phải đánh giá tác động về quản lý rủi ro và bảo đảm cạnh tranh. 9"],["D12.K5","k","Thủ tục hành chính chỉ được quy định sau khi đã đánh giá tác động và không thể thay thế bằng một trong các biện pháp sau đây: quản lý hành chính khác có hiệu quả tương đương và chi phí tuân thủ thấp hơn; pháp luật; điều kiện thực hiện theo quy định của pháp luật;"],["D12.K5.Đa","d","Cơ chế hậu kiểm, quản lý trên cơ sở rủi ro, tự công bố hoặc biện pháp"],["D12.K5.Đb","d","Cá nhân, tổ chức tự thực hiện và tự chịu trách nhiệm theo quy định của"],["D12.K5.Đc","d","Xã hội hoá cho các tổ chức xã hội - nghề nghiệp hoặc tổ chức có đủ"],["D12.K5.Đd","d","Khai thác, sử dụng dữ liệu."],["D12.K6","k","Đối với thủ tục hành chính nội bộ, thực hiện việc đánh giá tác động theo quy định tại các điểm a, b, c khoản 2 Điều này."],["D12.K7","k","Bộ trưởng Bộ Tư pháp hướng dẫn việc đánh giá tác động thủ tục hành chính."]],"u":1495},{"n":"Điều 13","t":"Thủ tục hành chính thực hiện đánh giá tác động về bảo đảm cạnh tranh và quản lý rủi ro","p":[["D13.K1","k","Thủ tục hành chính phải thực hiện đánh giá tác động về bảo đảm cạnh tranh trong các trường hợp sau đây: doanh mới."],["D13.K1.Đa","d","Có khả năng tạo ra rào cản gia nhập thị trường;"],["D13.K1.Đb","d","Hạn chế số lượng chủ thể tham gia thị trường;"],["D13.K1.Đc","d","Tạo lợi thế cạnh tranh không bình đẳng giữa các cá nhân, tổ chức;"],["D13.K1.Đd","d","Hạn chế đổi mới sáng tạo, phát triển công nghệ hoặc mô hình kinh"],["D13.K2","k","Thủ tục hành chính phải thực hiện đánh giá tác động về quản lý rủi ro trong các trường hợp sau đây: trường, đạo đức xã hội; tự, an toàn xã hội;"],["D13.K2.Đa","d","Có khả năng gây ảnh hưởng tiêu cực đến sức khỏe cộng đồng, môi"],["D13.K2.Đb","d","Có khả năng ảnh hưởng tiêu cực đến quốc phòng, an ninh quốc gia, trật"],["D13.K2.Đc","d","Có nguy cơ gây thiệt hại, ảnh hưởng lớn đến lợi ích công cộng."]],"u":1513},{"n":"Điều 14","t":"Thẩm định quy định về thủ tục hành chính","p":[["D14.K1","k","Việc thẩm định quy định về thủ tục hành chính được thực hiện cùng với việc thẩm định nội dung đề xuất chính sách, dự án, dự thảo văn bản quy phạm pháp luật."],["D14.K2","k","Đối với đề xuất chính sách, dự án, dự thảo văn bản quy phạm pháp luật có quy định thủ tục hành chính được tổ chức theo Hội đồng thẩm định, cuộc 10 họp thẩm định hoặc lấy ý kiến bằng văn bản thì phải có sự tham gia của cơ quan, đơn vị kiểm soát thủ tục hành chính trong quá trình thẩm định."],["D14.K3","k","Khi thẩm định thủ tục hành chính, cơ quan kiểm soát thủ tục hành chính có ý kiến đối với các nội dung quy định tại các Điều 6, 7, 8, 9, 12, 13 của Nghị định này."]],"u":1523},{"n":"Điều 15","t":"Nguyên tắc thực hiện thủ tục hành chính","p":[["D15.K1","k","Bảo đảm công khai, minh bạch các thủ tục hành chính đang được thực hiện."],["D15.K2","k","Bảo đảm khách quan, công bằng trong thực hiện thủ tục hành chính."],["D15.K3","k","Bảo đảm tính liên thông, kịp thời, chính xác, không gây phiền hà trong thực hiện thủ tục hành chính."],["D15.K4","k","Cá nhân, tổ chức có quyền từ chối thực hiện thủ tục hành chính không đúng quy định pháp luật hoặc không đúng nội dung đã được cơ quan có thẩm quyền công bố, công khai thủ tục hành chính theo quy định."],["D15.K5","k","Bảo đảm nguyên tắc cung cấp thông tin một lần, liên thông điện tử, ưu tiên sử dụng dữ liệu và dịch vụ số."],["D15.K6","k","Đề cao vai trò, trách nhiệm của cán bộ, công chức trong giải quyết công việc cho cá nhân, tổ chức."],["D15.K7","k","Kết quả giải quyết thủ tục hành chính được cung cấp bằng hình thức điện tử, trường hợp cá nhân, tổ chức có yêu cầu hoặc pháp luật có quy định thì trả bằng bản giấy."],["D15.K8","k","Bảo đảm quyền được phản ánh, kiến nghị của các cá nhân, tổ chức và trách nhiệm giải trình của cơ quan nhà nước trong thực hiện thủ tục hành chính."]],"u":1527},{"n":"Điều 16","t":"Thẩm quyền, phạm vi công bố thủ tục hành chính","p":[["D16.K1","k","Việc công bố thủ tục hành chính thuộc phạm vi quản lý như sau: được quy định trong văn bản quy phạm pháp luật về ngành, lĩnh vực thuộc phạm vi chức năng quản lý của bộ, cơ quan ngang bộ, bao gồm cả thủ tục hành chính liên thông. 11 Trường hợp một lĩnh vực quản lý có nhiều đối tượng thuộc trách nhiệm quản lý của nhiều bộ, cơ quan ngang bộ thì bộ, cơ quan ngang bộ có trách nhiệm công bố thủ tục hành chính đối với đối tượng thuộc phạm vi quản lý. quy định tại văn bản quy phạm pháp luật thuộc thẩm quyền ban hành của Hội đồng nhân dân cấp tỉnh, Ủy ban nhân dân cấp tỉnh, Chủ tịch Ủy ban nhân dân cấp tỉnh. Trường hợp quy định thủ tục hành chính để thực hiện việc phân quyền, phân cấp, ủy quyền hoặc giao quy định chi tiết thì trên cơ sở quyết định công bố của Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân cấp tỉnh có trách nhiệm công bố và cấu hình để thực hiện tiếp nhận, giải quyết thủ tục hành chính trên Hệ thống thông tin giải quyết thủ tục hành chính, Cổng Dịch vụ công quốc gia. định tại văn bản quy phạm pháp luật thuộc thẩm quyền ban hành của Hội đồng nhân dân cấp xã, Ủy ban nhân dân cấp xã theo quy định tại điểm a, b, c khoản 2 Điều 8 Nghị định này. nhiệm vụ hoặc ủy quyền ban hành văn bản hướng dẫn thực hiện thủ tục giải quyết công việc cho cá nhân, tổ chức có trách nhiệm công bố thủ tục thuộc thẩm quyền giải quyết của cơ quan, đơn vị. | 2. | Phạ | m | vi | công | bố | thủ | tục | | hành | c | hính Tất cả các thủ tục hành chính sau khi ban hành, sửa đổi, bổ sung, bãi bỏ phải được công bố. Nội dung công bố thủ tục hành chính được thể hiện trong quyết định công bố thủ tục hành chính và gồm các nội dung sau: các bộ phận cấu thành thủ tục hành chính quy định tại khoản 2 Điều 7 của Nghị định này; văn bản quy phạm pháp luật quy định về thủ tục hành chính; chứa đựng thông tin quy định tại điểm a khoản này, nội dung phải xác định rõ bộ phận nào của thủ tục hành chính được sửa đổi, bổ sung; văn bản quy phạm pháp luật có quy định việc sửa đổi, bổ sung thủ tục hành chính; hành chính bãi bỏ; trường hợp thủ tục hành chính đã được công bố trên Cơ sở dữ liệu quốc gia về thủ tục hành chính, phải ghi rõ mã số thủ tục hành chính; văn bản quy phạm pháp luật quy định việc bãi bỏ thủ tục hành chính; 12 thực hiện, Bộ trưởng, Thủ trưởng cơ quan ngang bộ công bố thủ tục hành chính để các đơn vị ở địa phương thực hiện."],["D16.K1.Đa","d","Bộ trưởng, Thủ trưởng cơ quan ngang bộ công bố thủ tục hành chính"],["D16.K1.Đb","d","Chủ tịch Ủy ban nhân dân cấp tỉnh công bố thủ tục hành chính được"],["D16.K1.Đc","d","Chủ tịch Ủy ban nhân dân cấp xã công bố thủ tục hành chính được quy"],["D16.K1.Đd","d","Người đứng đầu cơ quan, đơn vị được cơ quan nhà nước cấp trên giao"],["D16.K1.Đa~2","d","Đối với công bố thủ tục hành chính mới ban hành, nội dung bao gồm"],["D16.K1.Đb~2","d","Đối với công bố thủ tục hành chính được sửa đổi, bổ sung, ngoài việc"],["D16.K1.Đc~2","d","Đối với công bố thủ tục hành chính bãi bỏ, phải xác định rõ tên thủ tục"],["D16.K1.Đd~2","d","Đối với các thủ tục hành chính do cơ quan trung ương đóng trên địa bàn"],["D16.K3","k","Bộ trưởng Bộ Tư pháp hướng dẫn khoản 1 Điều này."]],"u":1536},{"n":"Điều 17","t":"Thời hạn công bố, công khai thủ tục hành chính","p":[["D17.K1","k","Thời hạn công bố thủ tục hành chính định tại điểm a khoản 1 Điều 16 của Nghị định này phải được ban hành chậm nhất trước 20 ngày tính đến ngày văn bản quy phạm pháp luật có quy định về thủ tục hành chính có hiệu lực thi hành; định tại điểm b, c, d khoản 1 Điều 16 của Nghị định này phải được ban hành chậm nhất trước 10 ngày tính đến ngày văn bản quy phạm pháp luật có quy định về thủ tục hành chính có hiệu lực thi hành; thủ tục rút gọn hoặc được ban hành trong trường hợp đặc biệt có hiệu lực kể từ ngày thông qua hoặc ký ban hành, quyết định công bố thủ tục hành chính phải được ban hành chậm nhất là sau 03 ngày làm việc kể từ ngày công bố hoặc ký ban hành văn bản quy phạm pháp luật có quy định về thủ tục hành chính."],["D17.K1.Đa","d","Quyết định công bố thủ tục hành chính của người có thẩm quyền quy"],["D17.K1.Đb","d","Quyết định công bố thủ tục hành chính của người có thẩm quyền quy"],["D17.K1.Đc","d","Trường hợp văn bản quy phạm pháp luật được ban hành theo trình tự,"],["D17.K2","k","Công khai thủ tục hành chính Thủ tục hành chính đã được người có thẩm quyền công bố phải được công khai đầy đủ, chính xác, kịp thời theo các hình thức sau: tục hành chính thông qua việc niêm yết hoặc sử dụng các hình thức điện tử phù hợp với điều kiện cơ sở vật chất, kỹ thuật trên cơ sở quyết định công bố thủ tục hành chính hoặc kết xuất, kết nối, tích hợp dữ liệu thủ tục hành chính trên Cơ sở dữ liệu quốc gia về thủ tục hành chính; điện tử của bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh trên cơ sở kết nối, tích hợp với Cơ sở dữ liệu quốc gia về thủ tục hành chính; công khai thủ tục hành chính có thể thực hiện theo các hình thức khác phù hợp với điều kiện thực tế của cơ quan, đơn vị và đối tượng thực hiện thủ tục hành chính. 13"],["D17.K2.Đa","d","Công khai trên Cơ sở dữ liệu quốc gia về thủ tục hành chính;"],["D17.K2.Đb","d","Công khai tại trụ sở cơ quan, đơn vị trực tiếp tiếp nhận, giải quyết thủ"],["D17.K2.Đc","d","Công khai trên Cổng thông tin điện tử của Chính phủ, Cổng thông tin"],["D17.K2.Đd","d","Ngoài hình thức công khai quy định tại các điểm a, b, c khoản này, việc"],["D17.K3","k","Thông tin về thủ tục hành chính đã được người có thẩm quyền công bố theo quy định tại khoản 1 Điều 16 của Nghị định này phải được cập nhật đầy đủ, chính xác, kịp thời vào Cơ sở dữ liệu quốc gia về thủ tục hành chính. Đối với thủ tục hành chính nội bộ, khuyến khích áp dụng hình thức công khai tại các điểm b, c, d khoản 2 Điều này phù hợp với điều kiện thực tế của bộ, cơ quan ngang bộ, Ủy ban nhân dân các cấp."],["D17.K4","k","Cơ sở dữ liệu quốc gia về thủ tục hành chính là nguồn thông tin chính thức, có giá trị pháp lý để làm căn cứ công khai và áp dụng thống nhất thủ tục hành chính trên phạm vi toàn quốc."],["D17.K5","k","Trường hợp có sự khác nhau về nội dung giữa các hình thức công khai, thì quy định về thủ tục hành chính tại văn bản quy phạm pháp luật là căn cứ để rà soát, chỉnh lý quyết định công bố, công khai thủ tục hành chính."]],"u":1547},{"n":"Điều 18","t":"Trách nhiệm của cơ quan thực hiện thủ tục hành chính","p":[["D18.K1","k","Sử dụng, bố trí cán bộ, công chức có phẩm chất đạo đức tốt, văn hóa giao tiếp chuẩn mực, đủ trình độ về chuyên môn, nghiệp vụ và năng lực phù hợp để thực hiện thủ tục hành chính."],["D18.K2","k","Hướng dẫn, giải thích, cung cấp thông tin chính xác, đầy đủ, kịp thời về thủ tục hành chính cho cá nhân, tổ chức có liên quan."],["D18.K3","k","Bảo quản và giữ bí mật về hồ sơ tài liệu và các thông tin liên quan đến bí mật cá nhân trong quá trình giải quyết theo quy định của pháp luật, trừ trường hợp phải thu thập, công bố thông tin, tư liệu theo quyết định của cơ quan, tổ chức, người có thẩm quyền."],["D18.K4","k","Nêu rõ lý do bằng văn bản trong trường hợp từ chối thực hiện hoặc có yêu cầu bổ sung giấy tờ trong thời hạn giải quyết theo quy định."],["D18.K5","k","Không tự đặt ra thủ tục hành chính, hồ sơ, giấy tờ ngoài quy định của pháp luật."],["D18.K6","k","Phối hợp và chia sẻ thông tin trong quá trình giải quyết công việc của cá nhân, tổ chức."],["D18.K7","k","Hỗ trợ người có công, người cao tuổi, người khuyết tật, người nghèo, phụ nữ mang thai, trẻ mồ côi và người thuộc diện bảo trợ xã hội khác trong thực hiện thủ tục hành chính."],["D18.K8","k","Thực hiện thủ tục hành chính theo cơ chế một cửa, một cửa liên thông tại Bộ phận Một cửa và Cổng Dịch vụ công quốc gia. 14"],["D18.K9","k","Tiếp nhận, xử lý các phản ánh, kiến nghị của cá nhân, tổ chức trong thực hiện thủ tục hành chính."],["D18.K10","k","Ứng dụng công nghệ thông tin và các tiến bộ khoa học kỹ thuật trong thực hiện thủ tục hành chính."],["D18.K11","k","Thực hiện quy định khác của pháp luật."]],"u":1560},{"n":"Điều 19","t":"Trách nhiệm người đứng đầu bộ, cơ quan ngang bộ, Ủy ban nhân dân các cấp","p":[["D19.K1","k","Chịu trách nhiệm công bố, công khai, tổ chức nhập dữ liệu về thủ tục hành chính đã công bố trên Cơ sở dữ liệu quốc gia về thủ tục hành chính; tổ chức thực hiện các thủ tục hành chính đã công bố, công khai trên Cơ sở dữ liệu quốc gia về thủ tục hành chính."],["D19.K2","k","Kiểm tra, đôn đốc công chức, viên chức thuộc thẩm quyền quản lý trong việc thực hiện thủ tục hành chính."],["D19.K3","k","Đào tạo, bồi dưỡng nghiệp vụ về thực hiện và kiểm soát thủ tục hành chính cho đội ngũ công chức, viên chức thuộc thẩm quyền quản lý."],["D19.K4","k","Khen thưởng công chức, viên chức có thành tích trong thực hiện thủ tục hành chính, kiểm soát thủ tục hành chính hoặc có sáng kiến cải cách thủ tục hành chính."],["D19.K5","k","Xử lý nghiêm minh, kịp thời công chức, viên chức khi có vi phạm trong thực hiện và kiểm soát thủ tục hành chính theo quy định của pháp luật."],["D19.K6","k","Cải tiến cách thức, phương pháp thực hiện thủ tục hành chính; kịp thời kiến nghị với cơ quan cấp trên các biện pháp cải cách thủ tục hành chính."],["D19.K7","k","Thực hiện quy định khác của pháp luật."]],"u":1572},{"n":"Điều 20","t":"Trách nhiệm của công chức, viên chức được phân công thực hiện thủ tục hành chính","p":[["D20.K1","k","Thực hiện nghiêm túc, đầy đủ nhiệm vụ được giao trong quá trình thực hiện thủ tục hành chính."],["D20.K2","k","Tạo thuận lợi cho đối tượng thực hiện thủ tục hành chính; có tác phong, thái độ lịch sự, nghiêm túc, khiêm tốn; ngôn ngữ giao tiếp phải chuẩn mực, rõ ràng, mạch lạc trong thực hiện thủ tục hành chính."],["D20.K3","k","Tiếp nhận, cấp giấy biên nhận hồ sơ, tài liệu và giải quyết hồ sơ của cá nhân, tổ chức theo đúng quy định. 15"],["D20.K4","k","Hướng dẫn cá nhân, tổ chức thực hiện trình tự, hồ sơ hành chính đầy đủ, rõ ràng, chính xác, phải có thông báo nêu rõ nội dung, lý do và hướng dẫn cụ thể, đầy đủ trong một lần để tổ chức, cá nhân bổ sung hồ sơ."],["D20.K5","k","Chấp hành nghiêm túc các quy định của cấp có thẩm quyền về thủ tục hành chính đã được người đứng đầu bộ, cơ quan ngang bộ, Ủy ban nhân dân các cấp công bố."],["D20.K6","k","Chủ động tham mưu, đề xuất, sáng kiến cải tiến việc thực hiện thủ tục hành chính; kịp thời phát hiện, kiến nghị với cơ quan, người có thẩm quyền để sửa đổi, bổ sung hoặc bãi bỏ các quy định về thủ tục hành chính không phù hợp, thiếu khả thi."],["D20.K7","k","Phối hợp với các cơ quan, tổ chức có liên quan trong việc thực hiện thủ tục hành chính."],["D20.K8","k","Thực hiện quy định khác của pháp luật."]],"u":1580},{"n":"Điều 21","t":"Quyền và nghĩa vụ của đối tượng thực hiện thủ tục hành chính","p":[["D21.K1","k","Thực hiện đầy đủ các quy định về thủ tục hành chính."],["D21.K2","k","Từ chối thực hiện những yêu cầu không được quy định trong thủ tục hành chính hoặc chưa được công khai theo quy định."],["D21.K3","k","Chịu trách nhiệm về tính hợp pháp, chính xác của các giấy tờ có trong hồ sơ và cung cấp đầy đủ thông tin có liên quan."],["D21.K4","k","Không cản trở hoạt động giải quyết thủ tục hành chính của cơ quan nhà nước, người có thẩm quyền."],["D21.K5","k","Không hối lộ hoặc dùng các thủ đoạn khác để lừa dối cơ quan nhà nước, người có thẩm quyền trong thực hiện thủ tục hành chính."],["D21.K6","k","Giám sát việc thực hiện thủ tục hành chính; phản ánh, kiến nghị với cơ quan nhà nước, người có thẩm quyền về những bất hợp lý của thủ tục hành chính và các hành vi vi phạm của công chức, viên chức trong thực hiện thủ tục hành chính."],["D21.K7","k","Khiếu nại, tố cáo, khởi kiện các quyết định hành chính và hành vi hành chính theo quy định của pháp luật."],["D21.K8","k","Trực tiếp hoặc ủy quyền cho người đại diện hợp pháp của mình tham gia thực hiện thủ tục hành chính theo quy định của pháp luật."],["D21.K9","k","Thực hiện quy định khác của pháp luật. 16"]],"u":1589},{"n":"Điều 22","t":"Phản ánh, kiến nghị về thủ tục hành chính trong quá trình thực hiện","p":[["D22.K1","k","Mọi cá nhân, tổ chức có quyền phản ánh, kiến nghị về quy định thủ tục hành chính và việc thực hiện thủ tục hành chính."],["D22.K2","k","Việc tiếp nhận, xử lý phản ánh, kiến nghị về thủ tục hành chính được thực hiện theo quy định của pháp luật về tiếp nhận, xử lý phản ánh, kiến nghị của cá nhân, tổ chức về quy định hành chính."],["D22.K3","k","Bộ Tư pháp có trách nhiệm giúp Chính phủ tổ chức triển khai việc tiếp nhận, xử lý phản ánh, kiến nghị về quy định, thủ tục hành chính; tiếp nhận, xử lý kịp thời các phản ánh, kiến nghị của tổ chức, cá nhân về quy định hành chính thuộc phạm vi quản lý của Chính phủ, Thủ tướng Chính phủ và các cơ quan hành chính nhà nước theo quy định của pháp luật."]],"u":1599},{"n":"Điều 23","t":"Nền tảng số về kiểm soát thủ tục hành chính","p":[["D23.K1","k","Nền tảng số về kiểm soát thủ tục hành chính là hệ thống thông tin dùng chung, được xây dựng để hỗ trợ thực hiện công tác kiểm soát thủ tục hành chính trên môi trường số, giúp hướng dẫn, kiểm tra, đánh giá, đôn đốc và theo dõi việc quy định và thực hiện thủ tục hành chính."],["D23.K2","k","Bộ Tư pháp xây dựng, quản lý, duy trì, vận hành, nâng cấp Nền tảng số về kiểm soát thủ tục hành chính; hướng dẫn bộ, ngành, địa phương quản lý tài khoản, khai thác, sử dụng; kết nối, chia sẻ dữ liệu và bảo đảm an ninh mạng theo quy định."]],"u":1603},{"n":"Điều 24","t":"Cơ sở dữ liệu quốc gia về thủ tục hành chính","p":[["D24.K1","k","Cơ sở dữ liệu quốc gia về thủ tục hành chính phải bảo đảm dễ dàng, tiện lợi cho người sử dụng trong việc tìm kiếm, tra cứu, khai thác. Cơ sở dữ liệu quốc gia về thủ tục hành chính bao gồm các nội dung cơ bản sau đây: hoặc trên địa bàn của tỉnh, thành phố; bản quy định có liên quan đến thủ tục hành chính; 17"],["D24.K1.Đa","d","Thủ tục hành chính hiện đang được thực hiện trên phạm vi toàn quốc"],["D24.K1.Đb","d","Thủ tục hành chính đã bãi bỏ;"],["D24.K1.Đc","d","Văn bản quy phạm pháp luật quy định về thủ tục hành chính và các văn"],["D24.K1.Đd","d","Nội dung khác theo quy định của Thủ tướng Chính phủ."],["D24.K2","k","Điều kiện đăng tải thủ tục hành chính trên Cơ sở dữ liệu quốc gia về thủ tục hành chính tục hành chính được Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân các cấp, người đứng đầu cơ quan, đơn vị được cơ quan nhà nư ớc cấp trên giao nhiệm vụ hoặc ủy quyền công bố theo quy định tại các Điều 16 và 17 của Nghị định này; các cấp có trách nhiệm công bố và công khai đầy đủ, kịp thời thủ tục hành chính nội bộ thuộc phạm vi quản lý vào Cơ sở dữ liệu quốc gia về thủ tục hành chính theo quy định tại Điều 17 Nghị định này; địa phương có trách nhiệm kiểm soát việc công bố, công khai thủ tục hành chính, thủ tục hành chính nội bộ trên Cơ sở dữ liệu quốc gia về thủ tục hành chính; bảo đảm tính đầy đủ, chính xác, thống nhất của thông tin, dữ liệu và tổ chức thực hiện theo quy định."],["D24.K2.Đa","d","Thủ tục hành chính được đăng tải trên Cơ sở dữ liệu quốc gia là các thủ"],["D24.K2.Đb","d","Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân"],["D24.K2.Đc","d","Đơn vị thực hiện nhiệm vụ kiểm soát thủ tục hành chính tại bộ, cơ quan,"]],"u":1606},{"n":"Điều 25","t":"Nhập, đăng tải, công khai thủ tục hành chính vào Cơ sở dữ liệu quốc gia về thủ tục hành chính","p":[["D25.K1","k","Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân các cấp, người đứng đầu cơ quan, đơn vị được cơ quan nhà nước cấp trên giao nhiệm vụ hoặc ủy quyền chịu trách nhiệm tổ chức việc nhập, đăng tải, công khai các thủ tục hành chính và văn bản quy định về thủ tục hành chính đã được công bố vào Cơ sở dữ liệu quốc gia về thủ tục hành chính; đồng thời chịu trách nhiệm về tính chính xác của thủ tục hành chính trên Cơ sở dữ liệu quốc gia về thủ tục hành chính."],["D25.K2","k","Thời hạn nhập, đăng tải, công khai thủ tục hành chính đã công bố vào Cơ sở dữ liệu quốc gia về thủ tục hành chính chậm nhất là 05 ngày làm việc kể từ ngày ký quyết định công bố của Bộ trưởng, Thủ trưởng cơ quan ngang bộ; 03 ngày làm việc kể từ ngày ký quyết định công bố của Chủ tịch Ủy ban nhân dân các cấp; 02 ngày làm việc kể từ ngày ký quyết định công bố thủ tục hành chính trong văn bản quy phạm pháp luật được ban hành theo trình tự, thủ tục rút gọn hoặc được ban hành trong trường hợp đặc biệt có hiệu lực kể từ ngày thông qua hoặc ký ban hành."],["D25.K3","k","Sau khi thủ tục hành chính đã được công bố, công khai trên Cơ sở dữ liệu quốc gia về thủ tục hành chính, nếu phát hiện ra lỗi hoặc thiếu sót trong thông tin đã đăng tải, Bộ Tư pháp thông báo cho bộ, cơ quan ngang bộ, địa phương. Trong thời hạn không quá 05 ngày làm việc bộ, cơ quan ngang bộ, địa phương sửa chữa theo thông báo của Bộ Tư pháp. 18"]],"u":1616},{"n":"Điều 26","t":"Giá trị của thủ tục hành chính và văn bản quy phạm pháp luật có quy định về thủ tục hành chính trên Cơ sở dữ liệu quốc gia về thủ tục hành chính","p":[["D26.K1","k","Thủ tục hành chính và các văn bản quy định về thủ tục hành chính hoặc văn bản có liên quan về thủ tục hành chính được đăng tải trên Cơ sở dữ liệu quốc gia về thủ tục hành chính có giá trị thi hành và được bảo đảm thi hành."],["D26.K2","k","Mẫu đơn, mẫu tờ khai hành chính đăng tải kèm theo thủ tục hành chính trên Cơ sở dữ liệu quốc gia về thủ tục hành chính có giá trị ngang bằng với mẫu đơn, mẫu tờ khai hành chính do cơ quan thực hiện thủ tục hành chính cung cấp trực tiếp."],["D26.K3","k","Đối với thủ tục hành chính chưa được công khai trên Cơ sở dữ liệu quốc gia về thủ tục hành chính, khi tổ chức, cá nhân có yêu cầu giải quyết, cơ quan nhà nước có thẩm quyền có trách nhiệm giải quyết theo yêu cầu. Cơ quan, tổ chức, đơn vị, cá nhân có thẩm quyền giải quyết thủ tục hành chính không được tự ý đặt thêm, bổ sung, sửa đổi hoặc áp dụng khác với nội dung đã được quy định tại văn bản quy phạm pháp luật, công khai trên Cơ sở dữ liệu quốc gia về thủ tục hành chính."]],"u":1620},{"n":"Điều 27","t":"Trách nhiệm quản lý Cơ sở dữ liệu quốc gia về thủ tục hành chính","p":[["D27.K1","k","Bộ Tư pháp có trách nhiệm quản lý, hướng dẫn khai thác Cơ sở dữ liệu quốc gia về thủ tục hành chính; hướng dẫn, rà soát, đánh giá, kiểm tra việc nhập, đăng tải công khai, khai thác và quản lý dữ liệu thủ tục hành chính trên Cơ sở dữ liệu quốc gia về thủ tục hành chính; kiểm tra chất lượng nội dung thủ tục hành chính trên cơ sở dữ liệu quốc gia về thủ tục hành chính."],["D27.K2","k","Bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh, Ủy ban nhân dân cấp xã có trách nhiệm quản lý tài khoản đăng nhập, nhập dữ liệu, tự rà soát dữ liệu thủ tục hành chính trên Cơ sở dữ liệu quốc gia về thủ tục hành chính; kết nối, chia sẻ dữ liệu với Cơ sở dữ liệu quốc gia về thủ tục hành chính; bảo đảm tính thống nhất, đồng bộ giữa thủ tục hành chính được đăng tải trên Cơ sở dữ liệu quốc gia, thủ tục hành chính được đăng tải trên Cổng thông tin điện tử của bộ, ngành, địa phương và thủ tục hành chính được công khai tại nơi tiếp nhận, giải quyết thủ tục hành chính."]],"u":1624},{"n":"Điều 28","t":"Kế hoạch rà soát, đánh giá","p":[["D28.K1","k","Kế hoạch rà soát, đánh giá thủ tục hành chính được xây dựng dựa trên một trong các căn cứ sau: 19 tục hành chính của bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh."],["D28.K1.Đa","d","Chỉ đạo của Chính phủ, Thủ tướng Chính phủ;"],["D28.K1.Đb","d","Phản ánh, kiến nghị của cá nhân, tổ chức về thủ tục hành chính;"],["D28.K1.Đc","d","Theo yêu cầu quản lý nhà nước hoặc thực tiễn quy định, thực hiện thủ"],["D28.K2","k","Nội dung kế hoạch phải xác định rõ thủ tục hành chính cần rà soát, đánh giá, cơ quan thực hiện, thời gian thực hiện, căn cứ lựa chọn và dự kiến sản phẩm."],["D28.K3","k","Bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh chủ động xây dựng nội dung về rà soát, đánh giá thủ tục hành chính thuộc phạm vi chức năng quản lý trong kế hoạch kiểm soát, cải cách thủ tục hành chính và gửi Bộ Tư pháp trước ngày 31 tháng 01 của năm kế hoạch."],["D28.K4","k","Trên cơ sở chỉ đạo của Chính phủ, Thủ tướng Chính phủ và yêu cầu cải cách thủ tục hành chính, Bộ Tư pháp xây dựng kế hoạch rà soát trọng tâm, trình Thủ tướng Chính phủ phê duyệt."]],"u":1627},{"n":"Điều 29","t":"Mục đích rà soát, đánh giá thủ tục hành chính","p":[["D29.K1","k","Rà soát, đánh giá thủ tục hành chính là hoạt động của cơ quan có thẩm quyền nhằm xem xét, đánh giá toàn diện việc thực hiện thủ tục hành chính sau khi được ban hành và tổ chức thực hiện trên thực tế để xác định mức độ đáp ứng mục tiêu quản lý nhà nước; tính cần thiết, tính hợp lý, tính hợp pháp, tính khả thi và tính hiệu quả của thủ tục hành chính; mức độ phù hợp của phương thức quản lý; chi phí tuân thủ phát sinh đối với cá nhân, tổ chức và tác động của thủ tục hành chính đối với phát triển kinh tế - xã hội."],["D29.K2","k","Việc rà soát, đánh giá thủ tục hành chính được thực hiện nhằm: mâu thuẫn hoặc các quy định không còn phù hợp với thực tiễn trong quá trình tổ chức thực hiện thủ tục hành chính; dân, doanh nghiệp, hoạt động đầu tư, sản xuất, kinh doanh, môi trường cạnh tranh và hiệu lực, hiệu quả quản lý nhà nước; các chi phí xã hội không cần thiết đối với cá nhân, tổ chức; hóa, tích hợp, liên thông hoặc bãi bỏ thủ tục hành chính và các quy định có liên quan không còn phù hợp; khai, minh bạch; tăng cường ứng dụng công nghệ số, quản trị dữ liệu, quản lý theo mức độ rủi ro; đẩy mạnh chuyển đổi từ tiền kiểm sang hậu kiểm đối với đối tượng có mức độ rủi ro thấp; 20 mức độ cung cấp dịch vụ công trực tuyến, tự động hóa quy trình xử lý và chất lượng phục vụ người dân, doanh nghiệp; không cần thiết; giảm chi phí tuân thủ và nâng cao khả năng tiếp cận, khả năng tuân thủ thủ tục hành chính của cá nhân, tổ chức; quả, đẩy mạnh phân quyền, phân cấp, lấy người dân, doanh nghiệp làm trung tâm phục vụ và đáp ứng yêu cầu phát triển kinh tế - xã hội, cải cách hành chính và chuyển đổi số quốc gia."],["D29.K2.Đa","d","Phát hiện, nhận diện các khó khăn, vướng mắc, bất cập, chồng chéo,"],["D29.K2.Đb","d","Đánh giá mức độ tác động thực tế của thủ tục hành chính đối với người"],["D29.K2.Đc","d","Đánh giá mức độ phát sinh chi phí tuân thủ, gánh nặng hành chính và"],["D29.K2.Đd","d","Làm cơ sở đề xuất phương án sửa đổi, bổ sung, đơn giản hóa, điện tử"],["D29.K2.Đđ","d","Hoàn thiện phương thức quản lý nhà nước theo hướng hiện đại, công"],["D29.K2.Đe","d","Thúc đẩy chia sẻ, kết nối, khai thác và tái sử dụng dữ liệu; nâng cao"],["D29.K2.Đg","d","Cắt giảm thời gian giải quyết, thành phần hồ sơ, yêu cầu, điều kiện"],["D29.K2.Đh","d","Bảo đảm thủ tục hành chính được tổ chức thực hiện thống nhất, hiệu"]],"u":1635},{"n":"Điều 30","t":"Nguyên tắc rà soát, đánh giá thủ tục hành chính sau ban hành","p":[["D30.K1","k","Việc rà soát, đánh giá thủ tục hành chính phải được thực hiện trên cơ sở thông tin, dữ liệu, bằng chứng và kết quả thực tiễn thi hành; bảo đảm phản ánh đầy đủ hiệu quả quản lý nhà nước, mức độ đáp ứng yêu cầu phục vụ người dân, doanh nghiệp và chi phí tuân thủ phát sinh trong quá trình thực hiện."],["D30.K2","k","Việc rà soát, đánh giá thủ tục hành chính phải bảo đảm các nguyên tắc sau đây: trong việc xem xét, đánh giá thủ tục hành chính; năng tiếp cận, mức độ thuận lợi và chi phí tuân thủ của cá nhân, tổ chức làm một trong những căn cứ quan trọng để đánh giá hiệu quả của thủ tục hành chính; chuyên gia, hiệp hội nghề nghiệp và các chủ thể có liên quan trong quá trình rà soát, đánh giá thủ tục hành chính; hành chính với đánh giá hiệu quả tổ chức thực hiện, mức độ ứng dụng công nghệ số, chia sẻ dữ liệu và khả năng điện tử hóa trong giải quyết thủ tục hành chính; số quốc gia, phát triển Chính phủ số, kinh tế số, xã hội số và đổi mới phương thức quản lý nhà nước theo hướng quản trị hiện đại, quản lý theo mức độ rủi ro; tâm, trọng điểm. 21"],["D30.K2.Đa","d","Khách quan, toàn diện, công khai, minh bạch, bảo đảm tính độc lập"],["D30.K2.Đb","d","Lấy người dân, doanh nghiệp làm trung tâm; lấy mức độ hài lòng, khả"],["D30.K2.Đc","d","Bảo đảm sự tham gia của đối tượng chịu tác động, cơ quan, tổ chức,"],["D30.K2.Đd","d","Kết hợp đánh giá tính cần thiết, tính hợp lý, tính hợp pháp của thủ tục"],["D30.K2.Đđ","d","Bảo đảm phù hợp với yêu cầu cải cách thủ tục hành chính, chuyển đổi"],["D30.K2.Đe","d","Bảo đảm việc rà soát, đánh giá được thực hiện thường xuyên, có trọng"],["D30.K3","k","Ưu tiên rà soát, đánh giá đối với thủ tục hành chính thuộc một trong các trường hợp sau đây: nhiều khâu trung gian; cạnh tranh, đổi mới sáng tạo và đời sống của người dân; mắc trong quá trình thực hiện; chéo hoặc phát sinh yêu cầu ngoài quy định; quản lý theo mức độ rủi ro; điều kiện phát triển kinh tế - xã hội làm ảnh hưởng đến tính phù hợp của thủ tục hành chính;"],["D30.K3.Đa","d","Có số lượng hồ sơ phát sinh lớn hoặc tần suất thực hiện cao;"],["D30.K3.Đb","d","Có chi phí tuân thủ lớn, thời gian giải quyết kéo dài hoặc phát sinh"],["D30.K3.Đc","d","Có tác động lớn đến hoạt động đầu tư, sản xuất, kinh doanh, môi trường"],["D30.K3.Đd","d","Có nhiều phản ánh, kiến nghị, khiếu nại hoặc phát sinh khó khăn, vướng"],["D30.K3.Đđ","d","Có thành phần hồ sơ, yêu cầu, điều kiện, quy trình xử lý phức tạp, chồng"],["D30.K3.Đe","d","Có khả năng tích hợp, liên thông, điện tử hóa hoặc áp dụng phương thức"],["D30.K3.Đg","d","Có sự thay đổi về yêu cầu quản lý nhà nước, công nghệ, dữ liệu hoặc"],["D30.K3.Đh","d","Không phát sinh hồ sơ trong 03 năm liên tiếp."],["D30.K4","k","Kết quả rà soát, đánh giá thủ tục hành chính là căn cứ để: tục hành chính; liên quan đến thủ tục hành chính; hướng đơn giản, thuận tiện, số hóa và lấy người dân, doanh nghiệp làm trung tâm; tiền kiểm đối với đối tượng có mức độ tuân thủ cao; chia sẻ, tái sử dụng dữ liệu và tự động hóa trong giải quyết thủ tục hành chính; chức thực hiện thủ tục hành chính. 22"],["D30.K4.Đa","d","Xây dựng, phê duyệt và tổ chức thực hiện phương án đơn giản hóa thủ"],["D30.K4.Đb","d","Sửa đổi, bổ sung, thay thế, bãi bỏ thủ tục hành chính hoặc quy định có"],["D30.K4.Đc","d","Điều chỉnh quy trình, phương thức giải quyết thủ tục hành chính theo"],["D30.K4.Đd","d","Hoàn thiện cơ chế quản lý theo mức độ rủi ro, tăng cường hậu kiểm, giảm"],["D30.K4.Đđ","d","Nâng cao chất lượng cung cấp dịch vụ công trực tuyến, thúc đẩy kết nối,"],["D30.K4.Đe","d","Theo dõi, đánh giá trách nhiệm của cơ quan, tổ chức, cá nhân trong tổ"]],"u":1646},{"n":"Điều 31","t":"Nội dung rà soát, đánh giá thủ tục hành chính","p":[["D31.K1","k","Nội dung rà soát, đánh giá tình hình thực hiện thủ tục hành chính bao gồm: đã được xác định khi ban hành; mức độ đáp ứng yêu cầu phát triển kinh tế - xã hội, đổi mới sáng tạo, chuyển đổi số, phát triển khoa học, công nghệ và yêu cầu quản lý nhà nước trong từng thời kỳ; pháp hướng dẫn; hành chính; mức độ hợp lý của thành phần hồ sơ, yêu cầu, điều kiện, trình tự, cách thức thực hiện và thời hạn giải quyết thủ tục hành chính; cắt giảm các thủ tục hành chính có kết quả giải quyết là thành phần hồ sơ của thủ tục hành chính; chính giữa các cơ quan, đơn vị; việc phát sinh yêu cầu ngoài quy định; tình trạng áp dụng pháp luật không thống nhất hoặc gây khó khăn, phiền hà cho cá nhân, tổ chức trong quá trình giải quyết thủ tục hành chính; kiến nghị, khó khăn, vướng mắc phát sinh trong quá trình thực hiện thủ tục hành chính; kinh doanh, môi trường cạnh tranh, năng lực đổi mới sáng tạo, hoạt động của doanh nghiệp nhỏ và vừa, việc thực hiện chuyển đổi số và các nhóm đối tượng chịu tác động khác."],["D31.K1.Đa","d","Mức độ phù hợp của thủ tục hành chính với mục tiêu quản lý nhà nước"],["D31.K1.Đb","d","Hiệu quả tổ chức thực hiện thủ tục hành chính theo các tiêu chí do Bộ Tư"],["D31.K1.Đc","d","Mức độ đơn giản, minh bạch, rõ ràng, khả thi và dễ tiếp cận của thủ tục"],["D31.K1.Đd","d","Khả năng cắt giảm, đơn giản hoá thủ tục hành chính dựa trên dữ liệu;"],["D31.K1.Đđ","d","Tính thống nhất, đồng bộ trong quá trình tổ chức thực hiện thủ tục hành"],["D31.K1.Đe","d","Mức độ hài lòng, khả năng tuân thủ của cá nhân, tổ chức; các phản ánh,"],["D31.K1.Đg","d","Tác động của thủ tục hành chính đối với hoạt động đầu tư, sản xuất,"],["D31.K2","k","Rà soát, đánh giá thủ tục hành chính nội bộ bao gồm các nội dung sau đây:"],["D31.K2.Đa","d","Bảo đảm quy định đầy đủ bộ phận cấu thành của thủ tục hành chính;"],["D31.K2.Đb","d","Sự cần thiết, tính hợp lý, đáp ứng yêu cầu quản lý nhà nước;"],["D31.K2.Đc","d","Mức độ liên thông, kết nối, chia sẻ dữ liệu theo quy định của pháp luật."],["D31.K3","k","Rà soát, đánh giá việc áp dụng phương thức quản lý theo mức độ rủi ro trong thực hiện thủ tục hành chính bao gồm các nội dung sau đây: ro trong tổ chức thực hiện thủ tục hành chính; và giám sát tuân thủ trên cơ sở quản lý rủi ro; 23 quyết hoặc áp dụng thủ tục đơn giản hơn đối với đối tượng có mức độ rủi ro thấp hoặc có lịch sử tuân thủ tốt."],["D31.K3.Đa","d","Mức độ phù hợp của việc phân loại đối tượng quản lý theo mức độ rủi"],["D31.K3.Đb","d","Khả năng áp dụng các biện pháp giảm tiền kiểm, tăng cường hậu kiểm"],["D31.K3.Đc","d","Khả năng miễn, giảm yêu cầu hồ sơ, tần suất kiểm tra, thời hạn giải"],["D31.K4","k","Rà soát, đánh giá việc bảo đảm nguyên tắc cạnh tranh trong thực hiện thủ tục hành chính bao gồm các nội dung sau đây: trường của cá nhân, tổ chức; tham gia thị trường; nghệ, lựa chọn của người tiêu dùng và sự phát triển của thị trường."],["D31.K4.Đa","d","Mức độ hạn chế quyền gia nhập, mở rộng, duy trì hoặc rút khỏi thị"],["D31.K4.Đb","d","Mức độ tạo ra lợi thế hoặc bất lợi cạnh tranh giữa các cá nhân, tổ chức"],["D31.K4.Đc","d","Mức độ hạn chế khả năng cạnh tranh, đổi mới sáng tạo, ứng dụng công"],["D31.K5","k","Rà soát, đánh giá việc ứng dụng công nghệ thông tin và chuyển đổi số trong thực hiện thủ tục hành chính bao gồm các nội dung sau đây: quá trình giải quyết thủ tục hành chính; cung cấp dịch vụ công trực tuyến toàn trình, một phần hoặc chủ động; quả giải quyết thủ tục hành chính; vụ công theo nhóm thủ tục hành chính có liên quan; thanh toán điện tử và các nền tảng số phục vụ giải quyết thủ tục hành chính."],["D31.K5.Đa","d","Mức độ liên thông, tích hợp, kết nối, chia sẻ và tái sử dụng dữ liệu trong"],["D31.K5.Đb","d","Khả năng thực hiện thủ tục hành chính trên môi trường điện tử; mức độ"],["D31.K5.Đc","d","Mức độ tự động hóa trong tiếp nhận, xử lý, theo dõi, giám sát và trả kết"],["D31.K5.Đd","d","Mức độ hợp lý, hiệu quả của việc tích hợp, liên thông, cung cấp dịch"],["D31.K5.Đđ","d","Khả năng khai thác, sử dụng dữ liệu số, định danh điện tử, chữ ký số,"],["D31.K6","k","Rà soát, đánh giá nhóm thủ tục hành chính liên thông hành chính liên thông; thủ tục hành chính giữa các thủ tục hành chính liên thông; tục hành chính liên thông; thủ tục hành chính trong nhóm thủ tục hành chính liên thông. 24"],["D31.K6.Đa","d","Sự cần thiết của thủ tục hành chính trong mối quan hệ của nhóm thủ tục"],["D31.K6.Đb","d","Sự trùng lặp về thành phần hồ sơ, khả năng kế thừa kết quả giải quyết"],["D31.K6.Đc","d","Tính hợp lý của các thủ tục hành chính trong mối quan hệ của nhóm thủ"],["D31.K6.Đd","d","Các nội dung quy định tại các khoản 1, 3, 4, 5 Điều này đối với từng"],["D31.K7","k","Bộ trưởng Bộ Tư pháp hướng dẫn việc rà soát, đánh giá thủ tục hành chính."]],"u":1671},{"n":"Điều 32","t":"Trách nhiệm rà soát, đánh giá","p":[["D32.K1","k","Bộ, cơ quan ngang bộ chịu trách nhiệm rà soát, đánh giá thủ tục hành chính thuộc phạm vi chức năng quản lý ngành, lĩnh vực được quy định trong các văn bản quy phạm pháp luật của Quốc hội, Ủy ban Thường vụ Quốc hội, Chính phủ, Thủ tướng Chính phủ, Bộ trưởng, Thủ trưởng cơ quan ngang bộ."],["D32.K2","k","Ủy ban nhân dân cấp tỉnh chịu trách nhiệm rà soát, đánh giá thủ tục hành chính thuộc thẩm quyền giải quyết của các cấp chính quyền trên địa bàn."],["D32.K3","k","Bộ Tư pháp chịu trách nhiệm rà soát, đánh giá độc lập thủ tục hành chính trong các trường hợp sau đây: thủ tục hành chính này là tiền đề để thực hiện thủ tục hành chính tiếp theo; tắc quản lý rủi ro, cạnh tranh bình đẳng, gây cản trở hoạt động sản xuất, kinh doanh và đời sống của nhân dân theo phản ánh, kiến nghị của cá nhân, tổ chức."],["D32.K3.Đa","d","Theo chỉ đạo của Chính phủ, Thủ tướng Chính phủ;"],["D32.K3.Đb","d","Thủ tục hành chính có liên quan chặt chẽ với nhau, kết quả thực hiện"],["D32.K3.Đc","d","Thủ tục hành chính còn rườm rà, khó thực hiện, không bảo đảm nguyên"]],"u":1704},{"n":"Điều 33","t":"Cách thức rà soát, đánh giá","p":[["D33.K1","k","Việc rà soát, đánh giá phải được tiến hành trên cơ sở thống kê, tập hợp đầy đủ các thủ tục hành chính, các quy định có liên quan đến thủ tục hành chính cần rà soát, đánh giá để xem xét theo những nội dung quy định tại các Điều 29, 30, 31 của Nghị định này."],["D33.K2","k","Đối với các thủ tục hành chính quy định tại điểm b khoản 3 Điều 32 của Nghị định này, thì việc rà soát, đánh giá cần tiến hành theo nhóm các quy định của thủ tục hành chính và nhóm các quy định có liên quan đến thủ tục hành chính được rà soát, đánh giá."],["D33.K3","k","Bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh rà soát, đánh giá thủ tục hành chính theo kế hoạch hoặc theo sự chỉ đạo của Chính phủ, Thủ tướng Chính phủ. Kết quả rà soát, đánh giá thủ tục hành chính của các cơ quan này là cơ sở để thực hiện cắt giảm, đơn giản hoá thủ tục hành chính."],["D33.K4","k","Huy động sự tham gia rà soát của các đối tượng chịu sự tác động trực tiếp của thủ tục hành chính."]],"u":1711},{"n":"Điều 34","t":"Xử lý kết quả rà soát, đánh giá","p":[["D34.K1","k","Trên cơ sở kết quả rà soát, đánh giá thủ tục hành chính, Ủy ban nhân dân cấp tỉnh sửa đổi, bổ sung, bãi bỏ thủ tục hành chính theo thẩm quyền hoặc đề nghị các bộ, cơ quan ngang bộ xem xét, xử lý kết quả rà soát, đánh giá thủ tục hành chính thuộc phạm vi, chức năng quản lý của bộ, cơ quan ngang bộ."],["D34.K2","k","Trên cơ sở kết quả rà soát, đánh giá thủ tục hành chính của bộ, cơ quan ngang bộ và đề nghị của Ủy ban nhân dân cấp tỉnh, Bộ trưởng, Thủ trưởng cơ quan ngang bộ sửa đổi, bổ sung, bãi bỏ thủ tục hành chính theo thẩm quyền. Đối với thủ tục hành chính được quy định trong văn bản quy phạm pháp luật thuộc thẩm quyền ban hành của Quốc hội, Ủy ban Thường vụ Quốc hội, Chính phủ, Thủ tướng Chính phủ, bộ, cơ quan ngang bộ gửi lấy ý kiến Bộ Tư pháp. Hồ sơ gửi lấy ý kiến Bộ Tư pháp gồm: hành chính;"],["D34.K2.Đa","d","Dự thảo tờ trình;"],["D34.K2.Đb","d","Dự thảo quyết định phê duyệt phương án cắt giảm, đơn giản hóa thủ tục"],["D34.K2.Đc","d","Báo cáo kết quả rà soát của bộ, cơ quan ngang bộ;"],["D34.K2.Đd","d","Tài liệu khác có liên quan (nếu có)."],["D34.K3","k","Bộ, cơ quan ngang bộ có trách nhiệm nghiên cứu, tiếp thu, giải trình ý kiến góp ý của Bộ Tư pháp; hoàn thiện hồ sơ trình Chính phủ, Thủ tướng Chính phủ."],["D34.K4","k","Khi rà soát, phát hiện các quy định về thủ tục hành chính trái pháp luật trong văn bản quy phạm pháp luật, việc xử lý các quy định về thủ tục hành chính trái pháp luật đó thực hiện theo quy định của pháp luật về kiểm tra, xử lý văn bản quy phạm pháp luật."],["D34.K5","k","Bộ Tư pháp chịu trách nhiệm theo dõi, đôn đốc, kiểm tra các bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh thực hiện quyết định phê duyệt phương án cắt giảm, đơn giản hóa thủ tục hành chính."]],"u":1716},{"n":"Điều 35","t":"Điều kiện bảo đảm về kinh phí thực hiện kiểm soát thủ tục hành chính","p":[["D35.K1","k","Kinh phí thực hiện hoạt động kiểm soát thủ tục hành chính quy định tại Nghị định này do ngân sách nhà nước bảo đảm và các nguồn kinh phí hợp pháp khác theo quy định của pháp luật. Đối với nguồn ngân sách nhà nước được bố trí trong dự toán chi ngân sách nhà nước hằng năm của các bộ, cơ quan trung ương, địa phương theo phân cấp ngân sách nhà nước. 26"],["D35.K2","k","Việc quản lý, sử dụng kinh phí từ nguồn ngân sách nhà nước cho hoạt động kiểm soát thủ tục hành chính thực hiện theo quy định của pháp luật về ngân sách nhà nước, pháp luật về khoa học công nghệ, đổi mới sáng tạo và chuyển đổi số, pháp luật khác có liên quan và hướng dẫn của Bộ Tài chính."],["D35.K3","k","Bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh có trách nhiệm bố trí kinh phí cho hoạt động kiểm soát thủ tục hành chính trong dự toán ngân sách của cấp mình theo quy định của Luật Ngân sách nhà nước và văn bản hướng dẫn thi hành."]],"u":1726},{"n":"Điều 36","t":"Chế độ thông tin, báo cáo","p":[["D36.K1","k","Các bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh định kỳ hằng tháng, quý, 06 tháng, năm báo cáo Bộ Tư pháp về tình hình và kết quả thực hiện hoạt động kiểm soát thủ tục hành chính của bộ, ngành, địa phương hoặc báo cáo đột xuất theo yêu cầu."],["D36.K2","k","Bộ Tư pháp có trách nhiệm tổng hợp báo cáo Chính phủ, Thủ tướng Chính phủ về tình hình, kết quả thực hiện hoạt động kiểm soát thủ tục hành chính của các bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh theo định kỳ hoặc báo cáo đột xuất khi có yêu cầu của Chính phủ, Thủ tướng Chính phủ."],["D36.K3","k","Công tác báo cáo thực hiện theo chế độ báo cáo điện tử, thông qua chức năng của Nền tảng số về kiểm soát thủ tục hành chính."],["D36.K4","k","Chế độ báo cáo thực hiện theo quy định của Bộ trưởng Bộ Tư pháp."]],"u":1730},{"n":"Điều 37","t":"Kiểm tra việc thực hiện hoạt động kiểm soát thủ tục hành chính","p":[["D37.K1","k","Kiểm tra việc thực hiện hoạt động kiểm soát thủ tục hành chính được thực hiện theo định kỳ hằng năm hoặc đột xuất trong phạm vi trách nhiệm sau đây: chính tại các bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh; tục hành chính tại các đơn vị trực thuộc; thủ tục hành chính tại các sở, ban, ngành, Ủy ban nhân dân cấp xã."],["D37.K1.Đa","d","Bộ Tư pháp kiểm tra việc thực hiện hoạt động kiểm soát thủ tục hành"],["D37.K1.Đb","d","Bộ, cơ quan ngang bộ kiểm tra việc thực hiện hoạt động kiểm soát thủ"],["D37.K1.Đc","d","Ủy ban nhân dân cấp tỉnh kiểm tra việc thực hiện hoạt động kiểm soát"],["D37.K2","k","Nội dung kiểm tra, gồm: thủ tục hành chính; thảo văn bản quy phạm pháp luật; 27 quy định hành chính;"],["D37.K2.Đa","d","Công tác chỉ đạo, điều hành và tổ chức thực hiện hoạt động kiểm soát"],["D37.K2.Đb","d","Công tác kiểm soát quy định về thủ tục hành chính tại các dự án, dự"],["D37.K2.Đc","d","Công tác kiểm soát việc thực hiện thủ tục hành chính;"],["D37.K2.Đd","d","Công tác rà soát, đánh giá thủ tục hành chính;"],["D37.K2.Đđ","d","Công tác tiếp nhận, xử lý phản ánh, kiến nghị của cá nhân, tổ chức về"],["D37.K2.Đe","d","Nội dung khác theo đề nghị của Bộ Tư pháp."]],"u":1735},{"n":"Điều 38","t":"Trách nhiệm thi hành","p":[["D38.K1","k","Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Chủ tịch Ủy ban nhân dân cấp tỉnh và các cơ quan liên quan chịu trách nhiệm thi hành Nghị định này."],["D38.K2","k","Bộ Tư pháp có trách nhiệm hướng dẫn, theo dõi, đôn đốc, kiểm tra việc thực hiện Nghị định này."]],"u":1747},{"n":"Điều 39","t":"Hiệu lực thi hành","p":[["D39.K1","k","Nghị định này có hiệu lực thi hành từ ngày 10 tháng 10 năm 2026."],["D39.K2","k","Sửa đổi Điều 5 Nghị định số 78/2025/NĐ-CP quy định chi tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Ban hành văn bản quy phạm pháp luật như sau: “Điều 5. Thủ tục hành chính trong văn bản quy phạm pháp luật Việc quy định thủ tục hành chính trong văn bản quy phạm pháp luật được thực hiện theo quy định của pháp luật về kiểm soát thủ tục hành chính”."],["D39.K3","k","Các thủ tục hành chính được ban hành trước ngày Nghị định này có hiệu lực nhưng chưa được công bố, công khai thì đối với trường hợp một lĩnh vực quản lý có nhiều đối tượng thuộc trách nhiệm quản lý của nhiều bộ, cơ quan ngang bộ thì bộ, cơ quan ngang bộ có trách nhiệm công bố thủ tục hành chính đối với đối tượng thuộc phạm vi quản lý."],["D39.K4","k","Thủ tục hành chính nội bộ quy định tại các văn bản đã được cơ quan nhà nước có thẩm quyền ban hành trước khi Nghị định này có hiệu lực thi hành thì vẫn tiếp tục có hiệu lực thi hành cho đến khi được sửa đổi, bổ sung, bãi bỏ."],["D39.K5","k","Trong thời gian các chức năng của Nền tảng số về kiểm soát thủ tục hành chính chưa đưa vào vận hành đầy đủ, việc thông báo dự kiến ban hành thủ tục hành chính mới theo quy định tại Điều 9 Nghị định này được thực hiện bằng hình thức văn bản điện tử thông qua Trục liên thông văn bản quốc gia hoặc các phương thức khác theo quy định pháp luật. Việc đăng tải lấy ý kiến đối với thủ tục hành chính dự kiến ban hành mới quy định tại khoản 2 Điều 9 thực hiện theo pháp luật về văn bản quy phạm pháp luật."],["D39.K6","k","Đối với các đề xuất chính sách, dự án, dự thảo văn bản quy phạm pháp luật đang thực hiện trước ngày Nghị định có hiệu lực thì việc đánh giá tác động thủ tục hành chính thực hiện theo quy định của pháp luật hiện hành tại thời điểm đề xuất chính sách, soạn thảo dự án, dự thảo. 28 | 7. Nghị định số 63/2010/NĐ-CP về kiểm soát thủ tục hành chính; | | | | | | | | | | | | | | | | | | | | | | | | | | | | | Nghị | | | định số 48/2 | | 013/NĐ-CP | sửa đổi | , bổ | | sung | | một | | | | số | điều | | | | | của | | các | | | nghị | | | định | | | | liên | | quan đến ki | | ểm soát thủ t | ục hành | chính; | | | Nghị | | | định | | | số | | 92/2017/NĐ-CP | | | | | | | | | | | | sửa | | | đổi, | | bổ | sung mộ | t số điều của | các ng | hị | định | | liên | | | quan | | | đến | | | | k
