","t":"Phát triển khu công nghệ cao","p":[],"u":515,"cut":1},{"n":"Điều 33","t":"Quản lý, sử dụng tài chính, ngân sách","p":[],"u":522,"cut":1},{"n":"Điều 34","t":"Thẩm quyền về đầu tư","p":[],"u":553,"cut":1},{"n":"Điều 35","t":"Sự tham gia của khu vực kinh tế tư nhân trong quản lý, sử dụng, vận hành, khai thác tài sản.","p":[],"u":577,"cut":1},{"n":"Điều 36","t":"Thu hút nhà đầu tư chiến lược","p":[],"u":584,"cut":1},{"n":"Điều 37","t":"Quản lý, sử dụng, bảo vệ tài nguyên","p":[],"u":633,"cut":1},{"n":"Điều 38","t":"Thu hút, trọng dụng và phát triển nguồn nhân lực","p":[],"u":655,"cut":1},{"n":"Điều 39","t":"Thu hút đầu tư, ưu đãi, hỗ trợ đầu tư, phát triển doanh nghiệp","p":[],"u":667,"cut":1},{"n":"Điều 40","t":"Mục tiêu, nguyên tắc liên kết, phát triển vùng","p":[],"u":700,"cut":1},{"n":"Điều 41","t":"Đầu tư, quản lý dự án liên kết, phát triển vòng","p":[],"u":710,"cut":1},{"n":"Điều 42","t":"Bảo vệ môi trường, ứng phó với biến đỗi khí hậu vùng đô thị đặc biệt","p":[],"u":732,"cut":1},{"n":"Điều 43","t":"Công nhận khu kinh tế đặc biệt","p":[],"u":744,"cut":1},{"n":"Điều 44","t":"Nhiệm vụ, quyền hạn về tổ chức bộ máy ở khu kinh tế đặc biệt","p":[],"u":751,"cut":1},{"n":"Điều 45","t":"Quy hoạch ở khu kinh tế đặc biệt","p":[],"u":765,"cut":1},{"n":"Điều 46","t":"Bảo đảm trật tự, an toàn khu kinh tế đặc biệt","p":[],"u":771,"cut":1},{"n":"Điều 47","t":"Quản lý, sử dụng tài chính, ngân sách ở khu kinh tế đặc biệt","p":[],"u":774,"cut":1},{"n":"Điều 48","t":"Thu hút nhà đầu tư chiến lược ở khu kinh tế đặc biệt","p":[],"u":784,"cut":1},{"n":"Điều 49","t":"Quản lý đầu tư ở khu kinh tế đặc biệt","p":[],"u":814,"cut":1},{"n":"Điều 50","t":"Quản lý, sử dụng tài nguyên, bảo vệ môi trường ở khu kinh tế đặc biệt :","p":[],"u":827,"cut":1},{"n":"Điều 51","t":"Thu hút và phát triển nguồn nhân lực ở khu kinh tế đặc biệt","p":[],"u":838,"cut":1},{"n":"Điều 52","t":"Phát triển kinh tế biển thuộc phạm vi khu kinh tế đặc biệt","p":[],"u":847,"cut":1},{"n":"Điều 53","t":"Thắm quyền thành lập, cơ chế, chính sách đối với khu phi thuế quan trong khu kinh tế đặc biệt l","p":[],"u":853,"cut":1},{"n":"Điều 54","t":"Thành lập và kinh doanh cửa hàng miễn thuế trong khu kinh tế đặc biệt","p":[],"u":860,"cut":1},{"n":"Điều 55","t":"Trách nhiệm của Quốc hội, các cơ quan của Quốc hội, Đoàn đại biểu Quốc hội và đại biểu Quốc hội","p":[],"u":866,"cut":1},{"n":"Điều 56","t":"Trách nhiệm của Chính phủ, Thủ tướng Chính phủ, các Bộ, cơ quan ngang Bộ","p":[],"u":877,"cut":1},{"n":"Điều 57","t":"Trách nhiệm của chính quyền Thành phố","p":[],"u":885,"cut":1},{"n":"Điều 58","t":"Trách nhiệm của chính quyền thành phố không là đô thị đặc biệt","p":[],"u":909,"cut":1},{"n":"Điều 59","t":"Trách nhiệm của chính quyền cấp tỉnh nơi có khu kinh tế đặc biệt","p":[],"u":918,"cut":1},{"n":"Điều 64","t":"Điều khoản chuyển tiếp về cơ chế, chính sách đối với Thành phố Hồ Chí Minh","p":[],"u":929,"cut":1},{"n":"Điều 65","t":"Điều khoản chuyên tiếp về cơ chế, chính sách đối với thành phố không là đô thị đặc biệt","p":[],"u":937,"cut":1},{"n":"Điều 66","t":"tất Hộấ tuyên tiếp về cơ chế, chính sách đối với khu kinh pm mm\"","p":[],"u":938,"cut":1}],"19/2026/QH16":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đổi, bồ sung một sô điêu theo Nghị quyêt số 203/2025/QH159; Quốc hội ban hành Luật sửa đổi, bỗ Sung một số điều của rhuật Kiến trúc số 40/2019/QH14."]],"u":0},{"n":"Đoạn","t":"","p":[["p1.para1","o","f8? ban gái 27,g Công báo QUÓC HỘI CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM Luật số: 19/2026/QH16 Độc tập - Tự do- Hạnh phúc lập - Tự do - Hạnh phúc LUẬT SỬA ĐỎI, BỎ SUNG MỘT SÓ ĐIỀU CỦA LUẬT KIÉN TRÚC - Căn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đổi, bồ sung một sô điêu theo Nghị quyêt số 203/2025/QH159; Quốc hội ban hành Luật sửa đổi, bỗ Sung một số điều của rhuật Kiến trúc số 40/2019/QH14."]],"u":944},{"n":"Điều 1","t":"Sửa đỗi, bỗ sung một số điều của Luật Kiến trúc","p":[["D1.K1","k","Sửa đôi, bổ sung Điều 5 như sau: - ' “Điều 5. Bản sắc văn hóa dân tộc trong kiến trúc 1. Bản sắc văn hóa dân tộc trong kiến trúc là các đặc trưng về tô chức không gian, hình thức kiên trúc, kỹ thuật xây dựng, cảnh quan, phản ánh trị thức văn hóa, lịch sử, tập quán sinh hoạt và điều kiện tự nhiên của cộng đồng dân cư, được hình thành trong xã hội hoặc tại một khu vực xác định. - 2. Bản sắc văn hóa dân tộc trong kiến trúc phải dựa trên cơ sở khoa học, điêu tra, khảo sát thực tê có sự tham gia của chuyên gia, cộng đông và được xác định, nhận diện thông qua các yêu tô sau đây: a) Khu vực, tuyến phố, điểm dân cư, công trình kiến trúc có giá trị cần bảo tồn, kế thừa; ca \" dựng, vật liệu, màu sắc, hình thức kiến trúc tông thể và tại từng khu vực; điều kiện phát triển đô thị và à nông thôn."],["D1.K1.Đb","d","Các đặc trưng chủ yếu về tô chức không gian, chiều cao, mật độ xây"],["D1.K1.Đc","d","Yêu cầu về kế thừa, phát huy giá trị kiến trúc truyền thống phù hợp với"],["D1.K3","k","Ủy ban nhân dân có thẩm quyền lập, ban hành quy chế quản lý kiến trúc chịu trách nhiệm xác định và cụ thể hóa bản sắc văn hóa dân tộc trong kiên trúc của địa phương tại quy chê quản lý kiên trúc. Cơ quan, tô chức, cá nhân có trách nhiệm bảo vệ, giữ gìn và phát huy giá trị bản sắc văn hóa dân tộc trong kiên trúc.”."],["D1.K2","k","Sửa đổi, bỗ sung một số điểm, khoản của Điều 11 như sau: “a) Kết hợp, kế thừa bản sắc văn hóa dân tộc trong kiến trúc và phát triển phong cách, hình thức kiến trúc hiện đại, tiên tiến, hài hòa với không gian, kiến trúc cảnh quan chung của khu vực xây dựng công trình kiến trúc; gắn kết kiến trúc khu hiện hữu, khu phát triển mới, khu bảo tồn, khu vực giáp ranh đô thị và nông thôn, phù hợp với cảnh quan thiên nhiên; tạo lập các giá trị đặc trưng của khu vực xây dựng công trình kiến trúc;”; “a) Bảo đảm kế thừa giá trị kiến trúc truyền thống, bản sắc văn hóa dân tộc; kết hợp hài hòa giữa truyền thống và hiện đại; ưu tiên sử dụng vật liệu xây dựng địa phương và giải pháp kỹ thuật xây dựng tiên tiến; hài hòa với không gian, kiến trúc cảnh quan chung của khu vực xây dựng công trình kiến trúc; phù hợp với cảnh quan thiên nhiên; khuyến khích kiến trúc xanh, tiết kiệm năng lượng; tạo lập các giá trị đặc trưng của nông thôn;”; “c) Đối với khu vực có nguy cơ chịu ảnh hưởng của rủi ro thiên tai, khuyến khích áp dụng mẫu thiệt kê kiên trúc cho công trình công cộng, nhà ở nông thôn và bảo đảm yêu câu về thích ứng với biên đôi khí hậu và phòng, chông thiên tai.”."],["D1.K2.Đa","d","Sửa đôi, bỗ sung điểm a khoản 1 nhử sau:"],["D1.K2.Đb","d","Sửa đổi, bổ sung điểm a khoản 2 như sau:"],["D1.K2.Đc","d","Sửa đổi, bổ sung điểm c khoản 2 như sau:"],["D1.K3~2","k","Sửa đổi, bổ sung các khoản 1, 2, 3, 4 và bổ sung khoản 4a của Điều 12 như sau: “1. Thiết kế kiến trúc phải xác định giải pháp tổ chức không gian, hình thức kiến trúc trong thiết kế xây dựng, phù hợp ` với quy hoạch theo pháp luật về quy hoạch đô thị và nông thôn, đáp ứng yêu cầu về công năng, kỹ thuật, mỹ thuật, đồng thời bảo đảm thể hiện bản sắc văn hóa dân tộc trong kiến trúc. Nhiệm vụ thiết kế xây dựng phải xác định yêu cầu về kiến trúc theo quy định của pháp luật về kiến trúc và các yêu cầu kỹ thuật, phòng, chống cháy, nỗ, môi trường và sử dụng năng lượng theo quy định của pháp luật về xây dựng và quy định khác của pháp luật có liên quan. 2. Thiết kế kiến trúc phải do cá nhân thuộc tổ chức hoặc cá nhân hành nghề độc lập đáp ứng tiêu chuẩn năng lực hành nghề kiến trúc thực hiện theo quy định của Luật này. 3. Thiết kế kiến trúc phải xem xét toàn diện các yêu cầu về kinh tế - xã hội, công năng, kỹ thuật, phòng, chống cháy, nỗ, môi trường, sử dụng năng lượng tiết kiệm và hiệu quả, bản sắc văn hóa dân tộc và các yêu câu khác đối với công trình; bảo đảm bình đẳng giới trong hoạt động kiến trúc và tiếp cận bình đẳng cho mọi đối tượng sử dụng công trình. 4. Hồ sơ thiết kế kiến trúc là một thành phần trong hồ sơ thiết kế xây dựng và làm cơ sở thực hiện các bước thiết kế theo quy định của pháp luật về xây dựng. 4a. Khi thiết kế kiến trúc, lập hồ sơ thiết kế kiến trúc phải ứng dụng công nghệ số, áp dụng mô hình thông tin công trình (BIM) theo quy định của pháp luật về xây dựng.”. 3"],["D1.K4","k","Sửa đổi, bổ sung khoản I và khoản 5 Điều 13 như sau: “1, Công trình kiến trúc có giá trị đã được xếp hạng di tích lịch sử - văn hóa, công trình thuộc danh mục kiểm kê đi tích được quản lý theo quy định của pháp luật về đi sản văn hóa.”; “5. Chính phủ quy định chỉ tiết tiêu chí đánh giá, phân loại công trình kiến trúc có giá trị; trình tự, thủ tục lập, thâm định, phê duyệt, điều chỉnh danh mục công trình kiến trúc có giá trị và các cơ chế, chính sách bảo tồn, phát huy giá trị công trình kiến trúc có giá trị.”"],["D1.K4.Đa","d","Sửa đổi, bỗ sung khoản 1 như sau:"],["D1.K4.Đb","d","Sửa đôi, bổ sung khoản 5 như sau:"],["D1.K5","k","Sửa đỗi, bổ sung một sô số điểm, khoản của Điều 14 như sau: “1. Quy chế quản lý kiến trúc được lập cho đô thị và nông thôn như sau: a) Quy chế quản lý kiến trúc đô thị được lập cho đô thị, đô thị mới và xã, đặc khu được định hướng phát triển đô thị; : b) Quy chế quản lý kiến trúc nông thôn được lập cho xã và đặc khu, trừ trường hợp xã, đặc khu được định hướng phát triển đô thị. Ủy ban nhân dân câp tỉnh quyết định lập và ban hành riêng quy chế quản lý kiến trúc nông thôn hoặc tích hợp trong nội dung quy hoạch chung xã và ban hành đồng thời với việc phê duyệt quy hoạch chung xã; e) Đối với khu vực của đô thị hoặc xã, đặc khu có yêu cầu riêng về quản lý không gian, kiến trúc cảnh quan, việc lập quy chế quản lý kiến trúc đối với khu vực đó do Ủy ban nhân dân cấp tỉnh quyết định.”; “b) Phù hợp với quy hoạch đã được phê duyệt theo quy định của pháp luật về quy hoạch đô thị và nông thôn và tiêu chuẩn áp dụng, quy chuẩn kỹ thuật quốc gia;”; “b) Xác định các tiêu chí, yêu cầu về bản sắc văn hóa dân tộc trong kiến trúc của địa phương trên cơ sở quy định tại khoản 2 Điêu 5 của Luật này;”; “4. Ủy ban nhân dân cấp tỉnh tổ chức lập, thẩm định và phê duyệt, ban hành quy chế quản lý kiến trúc trên địa bàn tỉnh. Ủy ban nhân dân cấp tỉnh quyết định phân cấp hoặc ủy quyền cho Ủy ban nhân dân cấp xã tô chức lập, thẩm định và phê duyệt, ban hành quy chế quản lý kiến trúc có phạm vi trong 01 đơn vị hành chính cấp xã khi đáp ứng đủ điều kiện về tổ chức bộ máy, cán bộ và năng lực chuyên môn. Trường hợp quy chế quản lý kiến trúc nông thôn được tích hợp trong 4 nội dung quy hoạch chung xã thì cơ quan có thẩm quyền phê duyệt quy hoạch chung xã ban hành đồng thời quy chế quản lý kiến trúc nông thôn. Ủy ban nhân dân cấp tỉnh có trách nhiệm chuyển giao dữ liệu, bố trí nguồn lực, hướng dẫn chuyên môn, hỗ trợ kỹ thuật và kiểm tra thực hiện việc phân cấp; quyết định phạm vi và thời gian khi thực hiện ủy quyền cho Ủy ban nhân dân cấp xã.”."],["D1.K5.Đa","d","Sửa đổi, bỗ sung khoản 1 như sau:"],["D1.K5.Đb","d","Sửa đổi, bỗ sung điểm b khoản 2 như sau:"],["D1.K5.Đc","d","Sửa đổi, bỗ sung điểm b khoản 3 như sau: ."],["D1.K5.Đd","d","Sửa đổi, bổ sung khoản 4 như sau:"],["D1.K6","k","Sửa đổi, bể sung một số điểm, khoản của Điều 15 như sau: “1. Ủy ban nhân dân cấp tỉnh, cấp xã có trách nhiệm tổ chức rà soát, đánh giá quá trình thực hiện quy chế quản lý kiến trúc định kỳ 05 năm hoặc đột xuất đẻ xem xét điều chỉnh quy chế quản lý kiến trúc. Nội dung rà soát, đánh giá quá trình thực hiện quy chế quản lý kiến trúc được thực hiện theo quy định của Chính phủ.”; “a) Có sự điều chỉnh về quy hoạch theo quy định của pháp luật về quy hoạch đô thị và nông thôn hoặc có sự điều chỉnh về địa giới đơn vị hành chính làm ảnh hưởng đến tính chất, chức năng, quy mô khu vực lập quy chế quản lý kiến trúc;”; “4. Ủy ban nhân dân cấp tỉnh tô chức lập điều chỉnh, thâm định và phê duyệt, ban hành quy chế quản lý kiến trúc trên địa bàn tỉnh. Ủy ban nhân dân cấp tỉnh quyết định phân cấp hoặc ủy quyền cho Ủy ban nhân dân cấp xã tổ chức lập điều chỉnh, thâm định và phê duyệt, ban hành quy chế quản lý kiến trúc có phạm vi trong 01 đơn vị hành chính cấp xã khi đáp ứng đủ điều kiện về tổ chức bộ máy, cán bộ và năng lực chuyên môn. Trường hợp quy chế quản lý kiến trúc nông thôn được tích hợp trong nội dung quy hoạch chung xã thì cơ quan có thâm quyền phê duyệt quy hoạch chung xã đồng thời ban hành quy chế quản lý kiến trúc nông thôn. 5. Ủy ban nhân dân cấp tỉnh quyết định điều chỉnh một số nội dung của quy chế khi cần thiết theo đề xuất của cơ quan lập quy chế quản lý kiến trúc hoặc Ủy ban nhân dân cấp xã và trên cơ sở kết quả rà soát, đánh giá quá trình thực hiện quy chế quản lý kiến trúc. Trường hợp Ủy ban nhân dân cấp xã được Ủy ban nhân dân cấp tỉnh phân cấp hoặc ủy quyền theo quy định tại khoản 4 Điều 14 và khoản 4 Điều này thì Ủy ban nhân dân cấp xã quyết định điều chỉnh quy chế.”"],["D1.K6.Đa","d","Sửa đôi, bỗ sung khoản 1 như sau:"],["D1.K6.Đb","d","Sửa đôi, bỗ sung điểm a khoản 2 như sau:"],["D1.K6.Đc","d","Sửa đổi, bỗ sung khoản 4 và bổ sung khoản 5 như sau:"],["D1.K7","k","Sửa đổi, bổ sung Điều 17 như sau: “Điều 17. Thi tuyến, tuyến chọn kiến trúc 1. Thi tuyển kiến trúc là việc tổ chức cuộc thi để chọn phương án kiến trúc hoặc ý tưởng kiên trúc tôi ưu, đáp ứng yêu câu về quy hoạch, kiên trúc, văn hóa, hiệu quả kinh tê - xã hội, quôc phòng, an ninh và bảo vệ môi trường. b 2. Tuyên chọn kiến trúc là việc chọn phương án kiến trúc tối ưu, đáp ứng yêu câu về quy hoạch, kiến trúc, văn hóa, hiệu quả kinh tê - xã hội, quốc phòng, an ninh và bảo vệ môi trường từ các phương án do tổ chức, cá nhân hành nghề kiến trúc có đủ năng lực, kinh nghiệm đề xuất. 3. Trừ công trình có yêu cầu bảo vệ bí mật, công trình xây dựng khẩn cấp, cấp bách, công trình được thực hiện theo thủ tục đầu tư đặc biệt không bắt buộc phái thi tuyển kiến trúc, công trình thi tuyển kiến trúc bao gồm: a) Công trình công cộng cấp đặc biệt; nhà ga hàng không (nhà ga chính) quy mô cấp đặc biệt, cấp l; b) Công trình là biểu tượng về truyền thống, văn hóa, lịch sử của địa phương và công. trình công cộng cấp I, công trình quan trọng, điểm nhấn trong đô thị, trên các tuyến đường chính được xác định trên cơ sở quy hoạch theo quy định của pháp luật về quy hoạch đô thị và nông thôn hoặc trong quy chế quản lý kiến trúc đã được cấp có thâm quyền phê duyệt; c) Công trình kiến trúc khác do cấp có thẩm quyền quyết định đầu tư quyết định, bảo đảm yêu câu quản lý không gian, kiên trúc cảnh quan. 4. Việc quyết định thi tuyển, tuyển chọn kiến trúc được xác định trong đề xuất chủ trương đầu tư hoặc báo cáo nghiên cứu tiền khả thị. 5. Trừ trường hợp quy định tại điểm a khoản 3 Điều này, cấp có thâm quyền quyêt định đầu tư quyết - định hình thức thi tuyển hoặc tuyển chọn kiến trúc và công tác tô chức thi tuyển, tuyển chọn kiến trúc bảo đảm phù hợp với quy chế quản lý kiến trúc. 6. Chi phí cho công tác tổ chức thi tuyển hoặc tuyển chọn kiến trúc, chỉ phí giải thưởng được xác định khi tổ chức thi tuyển, tuyển chọn kiến trúc và được tính trong tổng mức đầu tư của dự án. 7. Thông qua hình thức thi tuyển hoặc tuyển chọn kiến trúc, tổ chức, cá nhân có phương án hoặc ý tưởng kiến trúc trúng tuyên được thực hiện các bước tiếp theo của dự án khi đủ điều kiện theo quy định của pháp luật về xây dựng, đấu thầu. 8. Thông tin về thi tuyển, tuyển chọn kiến trúc; hội đồng thi tuyển, tuyển chọn kiến trúc và kết quả thi tuyển, tuyển chọn phải được công bố công khai. 9. Chính phủ quy định chỉ tiết Điều này.”. §. Sửa đổi, bổ sung Điều 19 như sau: “Điều 19. Hành nghề kiến trúc 1. Hành nghề kiến trúc là hoạt động nghề nghiệp của tổ chức, cá nhân về kiến trúc. Hoạt động hành nghề kiến trúc được thực hiện trong quá trình thiết kế xây dựng và lập quy hoạch đô thị và nông thôn, bao gồm: a) Thiết kế kiến trúc công trình; ị b) Thiết kế kiến trúc trong quy hoạch theo quy định của pháp luật về quy hoạch đô thị và nông thôn; c) Thiết kế kiến trúc cảnh quan; d) Thiết kế nội thất; đ) Chỉ dẫn kỹ thuật về kiến trúc; e) Đánh giá kiến trúc công trình; ø) Thâm tra thiết kế kiến trúc. : 2. Hoạt động hành nghề kiến trúc của cá nhân được quán lý trên cơ sở tiêu chuân năng lực hành nghề kiên trúc.”."],["D1.K9","k","Sửa đổi, bố sung Điều 21 như sau: “Điều 21. Tiêu chuẩn năng lực hành nghề kiến trúc 1. Tiêu chuẩn năng lực hành nghề kiến trúc được xác định đối với cá nhân, phù hợp với phạm vi và trách nhiệm hành nghệ; là căn cứ để quản lý, kiềm tra, đánh giá hoạt động hành nghê kiên trúc. 2. Tiêu chuẩn năng lực hành nghề kiến trúc được cơ quan chuyên môn về quản lý kiên trúc thuộc Ủy ban nhân dân cập tỉnh đăng tải, cập nhật trên Hệ thông thông tin, Cơ sở dữ liệu quôc gia về hoạt động xây dựng, bao gôm: , a) Tiêu chuẩn năng lực hành nghề tối thiểu của cá nhân là có trình độ đào tạo về chuyên ngành kiên trúc, xây dựng tại các cơ sở đào tạo được thành lập theo quy định của pháp luật về giáo dục, phù hợp với công việc đảm nhận; b) Tiêu chuẩn năng lực hành nghề đối với cá nhân đảm nhận chức danh chủ trì thiết kế kiến trúc đối với các hoạt động hành nghề kiến trúc quy định tại điểm a và điểm b khoản 1 Điều 19 của Luật này, kiến trúc sư đảm nhận chức danh chủ nhiệm thiết kế xây dựng và kiến trúc sư hành nghề độc lập là có chứng chỉ hành nghề kiến trúc. Cơ quan có thâm quyền quy định tại khoản 1 Điều 27 của Luật này có trách nhiệm cấp chứng chỉ hành nghề kiến trúc đối với cá nhân khi đáp ứng yêu cầu về trình độ đào tạo từ đại học trở lên thuộc lĩnh vực kiến trúc, kinh nghiệm tham gia hành nghề kiến trúc và phát triển nghề nghiệp liên tục. 3. Kiến trúc sư đã được cấp chứng chỉ thừa nhận lẫn nhau về hành nghề kiến trúc theo thỏa thuận quốc tế đã ký kết hoặc điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên được xác định đủ tiêu chuẩn năng lực hành nghề tương đương cá nhân có chứng chỉ hành nghề kiến trúc theo quy định của Luật này. 7 4. Tiêu chuẩn năng lực hành nghề kiến trúc đã đăng tải trên Hệ thống thông tin, Cơ sở dữ liệu quốc gia về hoạt động xây dựng được bảo đảm tính pháp lý để quản lý hành nghề kiến trúc và là căn cứ, cơ sở khi thực hiện các công việc liên quan. 5. Chính phủ quy định chỉ tiết Điều này.”"],["D1.K10","k","Sửa đổi, bỗ sung Điều 24 như sau: “Điều 24. Cơ sở dữ liệu hành nghề kiến trúc 1. Cơ sở đữ liệu hành nghề kiến trúc được tích hợp trong Hệ thống thông tin, Cơ sở dữ liệu quốc gia về hoạt động xây dựng theo quy định của pháp luật về xây dựng, bao gồm: a) Thông tin về năng lực hành nghề kiến trúc của cá nhân; b) Thông tin về tổ chức hành nghề kiến trúc. 2. Cơ sở dữ liệu hành nghề kiến trúc được thu thập, cập nhật trong quá trình cơ quan nhà nước thực hiện cấp chứng chỉ hành nghề kiến trúc, thẩm định thiết kế xây dựng và được cơ quan chuyên môn về quản lý kiến trúc thuộc Ủy ban nhân dân cấp tỉnh đăng tải, cập nhật theo quy định của Chính phủ về Hệ thống thông tin, Cơ sở đữ liệu quốc gia về hoạt động xây dựng.\"."],["D1.K11","k","Sửa đôi, bỗ sung Điều 25 như sau: “Điều 25. Kiến trúc sư hành nghề độc lập . 1. Kiến trúc sư hành nghề độc lập là kiến trúc sư có chứng chỉ hành nghề hoặc kiên trúc sư được xác định đủ tiêu chuẩn năng lực hành nghề tương đương theo quy định tại khoản 3 Điều 21 của Luật này, không thuộc tổ chức hành nghề kiến trúc. l . 2. Kiến trúc sư hành nghề độc lập được trực tiếp hành nghề kiến trúc theo hợp đông đã giao kết với tô chức, cá nhân theo quy định của Luật này và quy định khác của pháp luật có liên quan.”."],["D1.K12","k","Sửa đổi, bổ sung Điều 27 như sau: “Điều 27. Thâm quyền cấp, thu hồi, cấp lại chứng chỉ hành nghề kiến trúc 1. Cơ quan chuyên môn về quản lý kiến trúc thuộc Ủy ban nhân dân cấp tỉnh có thẩm quyền cấp, thu hồi, cấp lại chứng chỉ hành nghề kiến trúc. 2. Chứng chỉ hành nghề kiến trúc có giá trị sử dụng trong phạm vi cả nước. 3. Chính phủ quy định chỉ tiết Điều này.”."],["D1.K13","k","Sửa đối, bỗ sung Điều 31 như sau: “Điều 31. Hành nghề kiến trúc của người nước ngoài tại Việt Nam § 1. Người nước ngoài đảm nhận chức danh quy định tại điểm b khoản 2 Điều 21 của Luật này được hành nghề kiên trúc tại Việt Nam khi đáp ứng các điêu kiện sau đây: a) Có chứng chỉ hành nghề kiến trúc được cấp tại Việt Nam hoặc chứng chỉ quy định tại khoản 3 Điều 21 của Luật này hoặc có chứng chỉ hành nghề kiến trúc đang có hiệu lực do cơ quan, tô chức có thâm quyền của nước ngoài cấp và được Việt Nam chuyển đổi; b) Tuân thủ pháp luật Việt Nam và Quy tắc ứng xử nghề nghiệp của kiến trúc sư hành nghê của Việt Nam. 2. Việc chuyển đổi chứng chỉ hành nghề kiến trúc đối với người nước ngoài được quy định như sau: a) Người nước ngoài đã có chứng chỉ hành nghề kiến trúc đang có hiệu lực do cơ quan, tô chức có thẩm quyền của nước ngoài cấp, tham gia hành nghề kiến trúc ở Việt Nam thực hiện thủ tục chuyên đôi chứng chỉ hành nghề kiến trúc tại cơ quan chuyên môn về quản lý kiên trúc thuộc Ủy ban nhân dân cập tỉnh; b) Việc chuyển đổi chứng chỉ hành nghề kiến trúc giữa Việt Nam với các quốc gia, vùng lãnh thô được thực hiện theo quy định của thỏa thuận quôc tê đã ký kêt hoặc điêu ước quôc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên. 3. Chính phủ quy định chỉ tiết cách xác định thời gian tham gia hành nghề kiến trúc tại Việt Nam; quy định hồ sơ, trình tự, thủ tục chuyên đôi chứng chỉ hành nghệ kiến trúc của người nước ngoài hành nghề kiến trúc ở Việt Nam.”."],["D1.K14","k","Sửa đổi, bổ sung Điều 32 như sau: “Điều 32. Quyền và nghĩa vụ của kiến trúc sư có chứng chỉ hành nghề kiến trúc 1. Kiến trúc sư có chứng chỉ hành nghề kiến trúc có quyền sau đây: a) Thực hiện các hoạt động hành nghề kiến trúc; b) Được bảo hộ quyên sở hữu trí tuệ theo quy định của pháp luật về sở hữu trí tuệ; c) Yêu cầu chủ đầu tư cung cấp thông tin, tài liệu liên quan đến công việc thiết kế kiến trúc được giao; đ) Yêu cầu chủ đầu tư, nhà thầu thi công xây dựng thực hiện đúng thiết kế kiên trúc được duyệt; đ) Từ chối thực hiện yêu cầu trái pháp luật của chủ đầu tư; e) Từ chối nghiệm thu công trình, hạng mục công trình không đúng thiết kế kiên trúc được duyệt, không đúng tiêu chuân, quy chuân kỹ thuật; 9 g) Yêu cầu chủ đầu tư thực hiện đúng hợp đồng. 2. Kiến trúc sư có chứng chỉ hành nghè kiến trúc có nghĩa vụ sau đây: a) Tuân thủ Quy tắc ứng xử nghề nghiệp của kiến trúc sư hành nghề; b) Bảo đảm phát triển nghề nghiệp liên tục; c) Giám sát tác giả trong quá trình thi công xây dựng công trình; d) Thực hiện đúng cam kết với chủ đầu tư theo hợp đồng.”."],["D1.K15","k","Bãi bỏ một số khoản, điều và thay thế, bỏ một số cụm từ như sau: ©) Bỏ cụm từ “, gia hạn” tại điểm a, điểm b khoản 1 Điều 30 và khoản 4 Điều 36; từ “kiên trúc sư hành nghê độc lập” tại khoản 1 Điều 35; cụm từ “quy định tại Điều 28 của Luật này” tại điểm a khoản 1 Điều 30; Luật này” tại&ồán 3\" Điều: Ki ø) Bỏu đây \"Ủy bản nhận dân cấp huyện,” tại khoản 2 Điều 38."],["D1.K15.Đa","d","Bãi bỏ khoản 6 Điều 3, các điều 26, 28, 29 và 39;"],["D1.K15.Đb","d","Bỏ cụm từ “sát hạch,” tại khoản 8 Điều 9;"],["D1.K15.Đd","d","Thay thế cụm từ “kiến trúc sư hành nghề với tư cách cá nhân” bằng cụm"],["D1.K15.Đđ","d","Thay thế cụm từ “đủ điều kiện” bằng cụm từ “đáp ứng tiêu chuẩn” và bỏ"],["D1.K15.Đe","d","Bỏ cụnt, ấu #khi bảo đ sđảm các điều kiện quy định tại khoản 1 Điều 28 của"]],"u":945},{"n":"Điều 2","t":"Điệu hoạn, thành","p":[["D2.K1","k","Luật vhyo: có biểu LIMế “thị hành từ ngày 01 tháng 3 năm 2027."],["D2.K2","k","Sửa đổi, bộ sung khoản 4 Điều 40 của Luật Quy hoạch đô thị và nông thôn số 47/2024/QH15 đã được sửa đổi, bỗổ sung một số điều theo Luật số 71/2025/QH15 và Luật sô 144/2025/QHI5 như sau: “4. Thời gian thẩm định nhiệm vụ quy hoạch không quá 15 ngày, thời gian thâm định quy hoạch không quá 20 ngày kế từ ngày cơ quan thẩm định nhận được đầy đủ hồ sơ.”"]],"u":980},{"n":"Điều 3","t":"Điều khoản chuyển tiếp","p":[["D3.K1","k","Quy chế quản lý kiến trúc, Danh mục công trình kiến trúc có giá trị đã được cập có thâm quyên ban hành trước ngày Luật này có hiệu lực thi hành thì tiếp tục là căn cứ, cơ sở để quản lý kiến trúc cho đến khi được điều chỉnh theo quy định của Luật này."],["D3.K2","k","Quy chế quản lý kiến trúc, Danh mục công trình kiến trúc có giá trị đang được trình, thâm định, phê duyệt đề ban hành trước ngày Luật này có hiệu lực thi hành thì tiệp tục thực hiện theo quy định của Luật số 40/2019/QH14. 10"],["D3.K3","k","Chứng chỉ hành nghề kiến trúc đã được cấp cho cá nhân theo quy định tại Luật số 40/2019/QH14 có giá trị đến khi hết thời hạn sử dụng, trừ trường hợp bị thu hồi theo quy định của Luật này; trường hợp bị mắt hoặc hư hỏng thì thực hiện đề nghị cấp lại theo quy định của Luật này."],["D3.K4","k","Hồ sơ thiết kế kiến trúc trong thiết kế xây dựng đang thực hiện thâm định trước ngày Luật này có hiệu lực thi hành, nếu thuộc trường hợp quy định tại điểm b khoản 3 Điều 1 của Luật này thì được tiếp tục thực hiện theo quy định của Luật số 40/2019/QH14."],["D3.K5","k","Cá nhân đảm nhiệm chức danh chủ nhiệm thiết kế xây dựng, chủ trì thiết kế kiến trúc thuộc trường hợp không bắt buộc cấp chứng chỉ hành nghề kiến trúc theo quy định tại Nghị quyết sô 66. 18/2026/NQ-CP ngày 18 tháng 5 năm 2026 của Chính phủ về phân quyên, cắt giảm, đơn giản hóa thủ tục hành chính, điều kiện kinh doanh được tiếp tục thực hiện trách nhiệm trong hợp đồng thiết kế kiến trúc đến khi kết thúc hợp đồng. Luật này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XE], Kỳ họp không thường lệ thứ Nhát thông qua ngày 24 tháng ồ năm 2826 ⁄ (94900 gu, Đ\", JN QUỐC HỘI"]],"u":983}],"21/2026/QH16":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đối, bố sung một số điều theo Nghị quyết số 203/2025/QH15, Quốc hội ban hành Luật sửa đổi, bổ Sung một số điều của 10 luật liên quan đến thủ tục hành chính, điều kiện kinh doanh trong lĩnh vực nông nghiệp và môi trường gồm Luật Trồng trọt số 31/2018/QH14 đã được sửa đổi, bổ sung một số điều theo Luật số 146/2025/QH15; Luật Bảo vệ"]],"u":0},{"n":"Đoạn","t":"","p":[["p1.para1","o","8n 6£ góỗ đtzng Công lao QUỐC HỘI CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM - \" Độc lập - Tự do - Hạnh phúc Luật số: 21/2026/QH16 —. LUẬT SỬA ĐÔI, BỘ SUNG MỘT SÓ ĐIỀU CỦA 10 LUẬT LIÊN QUAN ĐÉN THỦ TỤC HÀNH CHÍNH, ĐIỀU KIỆN KINH DOANH TRONG LĨNH VỰC NÔNG NGHIỆP VÀ MÔI TRƯỜNG Căn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đối, bố sung một số điều theo Nghị quyết số 203/2025/QH15, Quốc hội ban hành Luật sửa đổi, bổ Sung một số điều của 10 luật liên quan đến thủ tục hành chính, điều kiện kinh doanh trong lĩnh vực nông nghiệp và môi trường gồm Luật Trồng trọt số 31/2018/QH14 đã được sửa đổi, bổ sung một số điều theo Luật số 146/2025/QH15; Luật Bảo vệ và kiểm dịch thực vật số 41/2013/QH13 đã được sửa đổi, bổ sung một số điều theo Luật số 35/2018/QH14 và Luật số 146/2025/QH15; Luật Chăn nuôi số 32/2018/QH14 đã được sửa đổi, bổ sung một số điều theo Luật số 146/2025/QH15; Luật Thú y số 79/2015/QH13 đã được sửa đổi, bổ sung một số điều theo Luật số 21/201 7/QH14 và Luật số 146/2025/QH15; Luật Thủy sản số 18/2017/QH14 đã được sửa đổi, bỏ sung một số điều theo Luật số 31/2024/QH15, Luật số 43/2024/QHI5 và Luật số 146/2025/QH15; Luật Địa chất và khoáng sản số 54/2024/QH15 đã được sửa đổi, bổ sung một số điều theo Luật số 147/2025/QH15; Luật Tài nguyên nước số 28/2023/QH15 đã được sửa đổi, bổ sung một số điều theo Luật số 84/2025/QH15, Luật số 116/2025/QH15 và Luật số 146/2025/QH15; Luật Thủy lợi số 08/2017/QH14 đã được sửa đổi, bổ sung một số điều theo Luật số 35/2018/QH14, Luật số 59/2020/QH14, Luật số 72/2020/QH14, Luật số 16/2023/QH15, Luật số 28/2023/QH15, Luật số 54/2024/QH15 và Luật số 146/2025/QH15; Luật Khí tượng thủy văn số 90/2015/QH13 đã được sửa đổi, bổ sung một số điễu theo Luật số 35/2018/QH14, Luật số 64/2020/QH14 và Luật số 146/2025/QH15; Luật Đê điều số 79/2006/QH11 đã được sửa đổi, bỗ sung một số điều theo Luật số 15/2008/QH12, Luật số 35/2018/QH14, Luật số 60/2020/QH14, Luật số 18/2023/QHI5, Luật số 47/2024/01113, Luật số 84/2025/QH15 và Luật số 146/2023/QH15."]],"u":989},{"n":"Điều 1","t":"Sửa đối, bỗ sung một số điều của Luật Trồng trọ","p":[["D1.K1","k","Sửa đổi, bỗ sung khoản 3 Điều 9 như sau: - ..... ? %. h Ệ “3. Sản xuất giống cây trồng không đáp ứng điều kiện sản xuất; sản xuất phân bón không đáp ứng điều kiện sản xuất hoặc chưa được cấp giấy chứng nhận đủ điều kiện sản xuất phân bón.”."],["D1.K2","k","Sửa đổi, bễ sung Điều 17 như sau: “Điều 17. Tự công bố lưu bành giống cây trồng 1. Tổ chức, cá nhân tự công bố lưu hành giống cây trồng và chịu trách nhiệm về tính đầy đủ, chính xác của thông tin đã tự công bố. 2. Bộ trưởng Bộ Nông nghiệp và Môi trường quy định chỉ tiết việc tự công bố lưu hành giống cây trồng.”."],["D1.K3","k","Bỗ sung khoản 8 và khoản 9 vào sau khoản 7 Điều 19 như sau: “8. Khảo nghiệm giá trị canh tác, giá trị sử dụng thực hiện theo tiêu chuẩn quốc gia; trường hợp chưa có tiêu chuẩn quốc gia thì thực hiện theo tiêu chuẩn cơ sở. 9. Khảo nghiệm tính khác biệt, tính đồng nhất và tính ổn định thực hiện theo tiêu chuẩn quốc gia; trường hợp chưa có tiêu chuẩn quốc gia thì thực hiện theo tài liệu hướng dẫn do Hiệp hội quốc tế về bảo hộ giống cây trồng mới hoặc nước thành viên của Hiệp hội quốc ' tế về bảo hộ giống cây trồng mới hoặc nước hợp tác với Việt Nam về bảo hộ giống cây trồng công bố hoặc do cơ quan quản lý nhà nước về bảo hộ giống cây trồng ban hành.”."],["D1.K4","k","Sửa đổi, bỗ sung điểm a khoản 2 Điều 34 như sau: “a) Thực hiện theo đúng quy định về khảo nghiệm giá trị canh tác, giá trị sử dụng; quy định về khảo nghiệm tính khác biệt, tính đồng nhất và tính ôn định của giống cây trồng:”."],["D1.K5","k","Sửa đổi, bỗ sung khoản 2 Điều 36 như sau: “2. Quyết định công nhận phân bón lưu hành tại Việt Nam có thời hạn 10 năm và được gia hạn mỗi lần 10 năm.”."],["D1.K6","k","Thay thế cụm từ “được công nhận đủ điều kiện” bằng cụm từ “có chức năng khảo nghiệm giống cây trồng hoặc có đăng ký hoạt động trong lĩnh vực khảo nghiệm giống cây trồng” tại khoản 5 Điều 13."],["D1.K7","k","Bãi bỏ một số điều, khoản, điểm và bỏ một số cụm từ sau đây: 37; Điêu 42; Điêu 46; điệm a khoản 2 Điều 51; 3"],["D1.K7.Đa","d","Bãi bỏ Điều 21; khoản 2 Điều 22; khoản 1 Điều 31; điểm b khoản 2 Điều"],["D1.K7.Đb","d","Bỏ cụm từ “, buôn bán” tại tên Điều 22 và khoản 1 Điều 35;"],["D1.K7.Đc","d","Bỏ cụm từ “và buôn bán” tại tên Mục 4 Chương II và tên Mục 2 Chương II."]],"u":990},{"n":"Điều 2","t":"Sửa đỗi, bố sung một số điều của Luật Bảo vệ và kiểm dịch thực vật","p":[["D2.K1","k","Sửa đôi, bỗ sung khoản 3 Điều 51 như sau: “3, Giấy chứng nhận đăng ký thuốc bảo vệ thực vật có thời hạn 10 năm và được gia hạn nhiều lần.”."],["D2.K2","k","Sửa đổi, bỗ sung khoản 4 Điều 52 như sau: “4. Giấy chứng nhận đăng ký thuốc bảo vệ thực vật được gia hạn có thời hạn 10 năm.”."],["D2.K3","k","Sửa đổi, bỗ sung Điều 66 như sau: “Điều 66. Thời hạn hiệu lực của Giấy chứng nhận đủ điều kiện sản xuất thuốc bảo vệ thực vật, Giấy chứng nhận đú điều kiện buôn bán thuốc bảo vệ thực vật Giấy chứng nhận đủ điều kiện sản xuất thuốc bảo vệ thực vật có thời hạn 05 năm, Giấy chứng nhận đủ điều kiện buôn bán thuốc bảo vệ thực vật không có thời hạn.”."],["D2.K4","k","Sửa đối, bỗ sung khoản 3 Điều 67 như sau: “3, Thuốc bảo vệ thực vật nhập khẩu quy định tại khoản 1 và điểm b khoản 2 Điều này do Chủ tịch Ủy ban nhân dân cấp tỉnh tổ chức thực hiện kiểm tra nhà nước về chất lượng theo quy định của pháp luật về chất lượng sản phẩm, hàng hóa. Trường hợp thuốc bảo vệ thực vật là thuốc xông hơi khử trùng thì Giấy chứng nhận chất lượng của nhà sản xuất tương đương Giấy chứng nhận hợp quy.”."],["D2.K5","k","Bãi bỏ một số điều, điểm và bỏ cụm từ sau đây:"],["D2.K5.Đa","d","Bãi bỏ Điều 23 và điểm a khoản 2 Điều 24;"],["D2.K5.Đb","d","Bỏ cụm từ “cấp lại,” tại khoản 2 Điều 63."]],"u":1001},{"n":"Điều 3","t":"Sửa đôi, bố sung một số điều của Luật Chăn nuôi","p":[["D3.K1","k","Sửa đối, bố sung khoản 2 Điều 15 như sau: “2. Việc trao đôi quốc tế nguồn gen giống vật nuôi có trong Danh mục giống vật nuôi cắm xuất khẩu để phục vụ nghiên cứu khoa học, triển lãm, quảng cáo và việc trao đôi nguồn gen giống vật nuôi quý, hiếm của Việt Nam cho bên thứ ba phải được Chủ tịch Ủy ban nhân dân cắp tỉnh nơi lưu giữ nguồn gen chấp thuận.”."],["D3.K2","k","Sửa đổi, bổ sung khoản 4 Điều 20 như sau: “4. Tổ chức, cá nhân nhập khẩu đực giống, tinh, phôi giống gia súc thực hiện như sau: a) Công bố tiêu chuẩn áp dụng theo quy định của pháp luật về chăn nuôi trước khi đưa ra sản xuất, kinh doanh; chịu trách nhiệm về nguồn gốc, xuất xứ, lý 4 lịch, hệ phả, tính xác thực của thông tin về các chỉ tiêu năng suất, chất lượng của dòng, giống nhập khâu đã được công bố; b) Đối với đực giống gia súc là dòng, giống vật nuôi mới phải thực hiện khảo nghiệm theo quy định tại Điều 26 của Luật này trước khi đưa ra sản xuất, kinh doanh.”."],["D3.K3","k","Sửa đổi, bố sung khoản 3 Điều 26 như sau: “3. Tổ chức, cá nhân có nhu cầu công nhận dòng, giống vật nuôi mới phải thực hiện khảo nghiệm theo quy định về khảo nghiệm dòng, giống vật nuôi.”."],["D3.K4","k","Sửa đôi, bỗ sung Điều 33 như sau: “Điều 33. Công bố, thay đỗi thông tin sản phẩm thức ăn chăn nuôi 1. Trừ sản phẩm thức ăn chăn nuôi quy định tại Điều 36 của Luật này, sản phẩm thức ăn chăn nuôi do tổ chức, cá nhân sản xuất, kinh doanh tự công bố, tự thay đổi thông tin trên Công thông tin điện tử của Bộ Nông nghiệp và Môi trường. Tổ chức, cá nhân sản xuất, kinh doanh chịu trách nhiệm về chất lượng và an toàn của sản phẩm thức ăn chăn nuôi đã công bó. 2. Chính phủ quy định chỉ tiết Điều này.”."],["D3.K5","k","Sửa đổi, bổ sung Điều 39 như sau: “Điều 39. Cấp, thu hồi Giấy chứng nhận đủ điều kiện sản xuất thức ăn chăn nuôi 1. Chủ tịch Ủy ban nhân dân cấp tỉnh cấp, thu hồi Giấy chứng nhận đủ điều kiện sản xuất thức ăn chăn nuôi đối với các cơ sở sản xuất thức ăn chăn nuôi trên địa bàn quản lý. Trường hợp nước nhập khẩu có yêu cầu khác, thâm quyền cấp, thu hồi Giấy chứng nhận đủ điều kiện sản xuất thức ăn chăn nuôi đối với các cơ sở sản xuất thức ăn chăn nuôi thực hiện theo quy định của Chính phủ. 2. Giấy chứng nhận đủ điều kiện sản xuất thức ăn chăn nuôi bị thu hồi trong trường hợp sau đây: a) Bị tẩy, xóa, sửa chữa nội dung trong Giấy chứng nhận đủ điều kiện sản xuất thức ăn chăn nuôi; b) Cơ sở không còn đủ điều kiện quy định tại khoản 1 Điều 38 của Luật này; ©) Cơ sở có hành vi vi phạm khác mà pháp luật quy định phải thu hồi Giấy chứng nhận đủ điều kiện sản xuất thức ăn chăn nuôi; đ) Cơ sở sản xuất thức ăn chăn nuôi không thực hiện yêu cầu về giám sát duy trì điều kiện sản xuất của cơ quan có thẩm quyển cấp Giấy chứng nhận đủ điều kiện sản xuất thức ăn chăn nuôi; đ) Theo đề nghị của tổ chức, cá nhân được cấp Giấy chứng nhận đủ điều kiện sản xuất thức ăn chăn nuôi. 3 3. Chính phủ quy định hồ sơ, trình tự, thủ tục cấp, thu hồi Giấy chứng nhận đủ điêu kiện sản xuất thức ăn chăn nuôi; thay đỗi thông tin của tô chức, cá nhân trong Giây chứng nhận đủ điêu kiện sản xuât thức ăn chăn nuôi.”."],["D3.K6","k","Sửa đổi, bỗ sung Điều 58 như sau: “Điều 58. Cấp, thu hồi Giấy chứng nhận đủ điều kiện chăn nuôi đối với chăn nuôi trang trại quy mô lớn ' 1. Chủ tịch Ủy ban nhân dân cấp tỉnh cấp, thu hồi Giấy chứng nhận đủ điêu kiện chăn nuôi. 2. Giấy chứng nhận đủ điều kiện chăn nuôi bị thu hồi trong trường hợp sau đây: a) Bị tẩy, xóa, sửa chữa nội dung trong Giấy chứng nhận đủ điều kiện chăn nuôi; b) Cơ sở chăn nuôi trang trại không còn đủ điều kiện quy định tại Điều 55 của Luật này; c) Cơ sở chăn nuôi trang trại có hành vi vị phạm khác mà pháp luật quy định phải thu hồi Giây chứng nhận đủ điêu kiện chăn nuôi; d) Cơ sở chăn nuôi trang trại không thực hiện yêu cầu về giám sát duy trì điều kiện chăn nuôi của cơ quan có thầm quyền cấp Giấy chứng nhận đủ điều kiện chăn nuôi; đ) Theo đề nghị của tổ chức, cá nhân được cấp Giấy chứng nhận đủ điều kiện chăn nuôi. 3. Chính phủ quy định hỗ sơ, trình tự, thủ tục cấp, thu hồi Giấy chứng nhận đủ điều kiện chăn nuôi; thay đổi thông tin trong Giây chứng nhận đủ điêu kiện chăn nuôi.”. :"],["D3.K7","k","Bãi bỏ một số điều, khoản, điểm và bỏ một số từ, cụm từ sau đây: khoản 2 Điêu 41; điêm a khoản 2 Điều 49; điểm a khoản 2 Điều 51;"],["D3.K7.Đa","d","Bãi bỏ Điều 27; điểm a khoản 2 Điều 31; khoản 3 Điều 37; Điều 40;"],["D3.K7.Đb","d","Bỏ từ “điều kiện” tại điểm đ khoản 2 Điều 49;"],["D3.K7.Đc","d","Bỏ cụm từ “cấp lại,” tại điểm g khoản 1 Điều 80."]],"u":1009},{"n":"Điều 4","t":"Sửa đội, bỗ sung một số điều của Luật Thú y","p":[["D4.K1","k","Sửa đôi, bổ sung khoản 2 Điều 41 như sau: “2. Trách nhiệm thực hiện kiểm dịch được quy định như sau: a) Bộ Nông nghiệp và Môi trường thực hiện kiểm dịch và cấp Giấy chứng nhận kiểm dịch theo quy định của pháp luật Việt Nam và yêu câu của nước nhập khâu hoặc của chủ hàng, trừ trường hợp quy định tại điềm b khoản này; b) Chủ tịch Ủy ban nhân dân cấp tỉnh thực hiện kiểm dịch và cấp Giấy chứng nhận kiểm dịch đôi với động vật trên cạn đã nhập khẩu đề tham gia hội chợ, triển lãm, thi đâu thê thao, biêu diên nghệ thuật; sản phầm động vật trên cạn 6 đã nhập khâu đề tham gia hội chợ, triển lãm theo quy định của pháp luật Việt Nam và yêu cầu của nước nhập khâu hoặc của chủ hàng.”."],["D4.K2","k","Sửa đổi, bổ sung các khoản 1, 2 và 3 Điều 46 như sau: “1, Đăng ký kiểm dịch được thực hiện như sau: a) Tổ chức, cá nhân đăng ký kiểm dịch với Bộ Nông nghiệp và Môi trường khi nhập khẩu động vật, sản phẩm động vật có trong Danh mục động vật, sản phâm động vật trên cạn thuộc diện phải kiểm dịch; b) Trường hợp nhập khẩu động vật trên cạn đề tham gia hội chợ, triển lãm, thi đấu thể thao, biểu diễn nghệ thuật; sản phẩm động vật trên cạn nhập khẩu để tham gia hội chợ, triển lãm, tổ chức, cá nhân đăng ký kiểm dịch với Chủ tịch ._ Ủy ban nhân dân cấp tỉnh. 2. Sau khi tiếp nhận đăng ký kiểm dịch của tổ chức, cá nhân, căn cứ tình hình dịch bệnh, hệ thống quản lý giám sát dịch bệnh, giám sát vệ sinh thú y của nước xuất khẩu, cơ quan có thẩm quyền thực hiện như sau: a) Bộ Nông nghiệp và Môi trường có văn bản hướng dẫn tổ chức, cá nhân có liên quan thực hiện kiểm dịch động vật, sản phẩm động vật nhập khẩu. : Trường hợp động vật, sản phẩm động vật từ quốc gia, vùng lãnh thô lần đầu tiên đăng ký nhập khẩu vào Việt Nam hoặc từ quốc gia, vùng lãnh thổ có nguy cơ cao về dịch bệnh phải được Bộ Nông nghiệp và Môi trường tiến hành phân tích nguy cơ theo quy định tại Điều 43 của Luật này; b) Chủ tịch Ủy ban nhân dân cấp tỉnh có văn bản hướng dẫn tổ chức, cá nhân có liên quan thực hiện kiểm dịch đối với động vật trên cạn để tham gia hội chợ, triển lãm, thi đấu thể thao, biểu diễn nghệ thuật; sản phẩm động vật trên cạn nhập khẩu đề tham gia hội chợ, triển lãm. 3. Khai báo kiểm dịch được thực hiện như sau: a) Trước khi động vật, sản phẩm động vật đến cửa khẩu nhập, tổ chức, cá nhân phải khai báo kiểm dịch với cơ quan quản lý chuyên ngành thú y trung ương; b) Trường hợp nhập khâu động vật trên cạn để tham gia hội chợ, triển lãm, thi đấu thể thao, biểu diễn nghệ thuật; sản phẩm động vật trên cạn nhập khâu để tham gia hội chợ, triển lãm phải khai báo kiểm dịch với cơ quan quản lý chuyên ngành thú y cấp tỉnh.”."],["D4.K3","k","Sửa đổi, bổ sung khoản 1 và khoản 2 Điều 47nhưsau: “1, Đối với động vật nhập khẩu, cơ quan thực hiện kiểm dịch theo quy định tại khoản 3 Điều 46 của Luật này thực hiện kiểm dịch như sau: a) Kiểm tra hồ sơ khai báo kiểm dịch, tình trạng sức khỏe của động vật; nếu hồ sơ kiểm dịch hợp lệ, động vật không có dấu hiệu mắc bệnh nguy hiểm thì 7 xác nhận để làm thủ tục và chuyên động vật đến khu cách ly kiểm dịch hoặc đến địa điểm cách ly kiểm dịch; b) Giám sát động vật tại khu cách ly kiểm dịch hoặc tại địa điểm cách ly kiểm dịch; thời gian theo dõi cách ly kiểm dịch phù hợp với từng loài động vật, từng bệnh được kiểm tra nhưng không quá 45 ngày, kể từ ngày bắt đầu cách ly kiểm dịch; c) Lấy mẫu kiểm tra bệnh động vật, áp dụng các biện pháp phòng bệnh bắt buộc cho động vật theo quy định; đ) Cấp Giấy chứng nhận kiểm dịch nhập khẩu đối với động vật đạt yêu cầu vệ sinh thú y và thông báo cho cơ quan quản lý chuyên ngành thú y nơi đến; đ) Hướng dẫn chủ hàng thực hiện các biện pháp vệ sinh, khử trùng, tiêu độc. 2. Đối với sản phẩm động vật nhập khẩu, cơ quan thực hiện kiểm dịch quy định tại khoản 3 Điều 46 của Luật này thực hiện kiêm dịch như sau: a) Kiểm tra hồ sơ khai báo kiểm dịch, thực trạng hàng hóa, nếu đạt yêu cầu thì lầy mẫu kiểm tra các chỉ tiêu vệ sinh thú y theo quy định; b) Cấp Giấy chứng nhận kiểm địch nhập khẩu đối với sản phẩm động vật đạt yêu cầu vệ sinh thú y và thông báo cho cơ quan quản lý chuyên ngành thú y nơi đến; : c) Hướng dẫn chủ hàng thực hiện các biện pháp vệ sinh, khử trùng, tiêu độc.”."],["D4.K4","k","Bồ sung khoản 1a vào sau khoản 1 Điều 56 như sau: “1a. Trách nhiệm thực hiện kiểm dịch được quy định như sau: a) Bộ Nông nghiệp và Môi trường thực hiện kiểm dịch và cấp Giấy chứng nhận kiểm dịch đối với động vật, sản phẩm động vật thủy sản xuất khẩu không dùng làm thực phẩm, trừ trường hợp quy định tại điểm b khoản này; b) Chủ tịch Ủy ban nhân dân cấp tỉnh thực hiện việc kiểm dịch và cấp Giấy chứng nhận kiểm dịch đối với động vật, sản phẩm động vật thủy sản xuất khâu không dùng làm thực phâm mang theo người, gửi qua đường bưu điện.”."],["D4.K5","k","Sửa đổi, bổ sung Điều 58 như sau: “Điều 58. Kiểm dịch động vật, sản phẩm động vật thủy sản nhập khẩu, tạm nhập tái xuất, tạm xuất tái nhập, chuyển cửa khẩu, kho ngoại quan, quá cảnh lãnh thổ Việt Nam; động vật thủy sản tham gia hội chợ, triển lãm, thi đấu thể thao, biểu diễn nghệ thuật; sản phẩm động vật thủy sản tham gia hội chợ, triển lãm; vận chuyển mẫu bệnh phẩm thủy sản 1. Kiểm dịch động vật, sản phẩm động vật thủy sản nhập khẩu được thực hiện theo quy định tại Điều 44, điểm a khoản 1, điểm a khoản 2 và điểm a khoản 3 Điều 46, Điều 47 của Luật này. § 2. Kiểm dịch động vật, sản phẩm động vật thủy sản tạm nhập tái xuất, tạm xuất tái nhập, chuyển cửa khẩu, kho ngoại quan, quá cảnh lãnh thổ Việt Nam, động vật thủy sản tham gia hội chợ, triển lãm, thi đấu thể thao, biểu diễn nghệ thuật; sản phẩm động vật thủy sản tham gia hội chợ, triển lãm được thực hiện theo quy định tại các điều 49, 50 và 51 của Luật này. 3. Tổ chức, cá nhân có nhu cầu đưa vào Việt Nam, gửi ra nước ngoài mẫu bệnh phẩm thủy sản đăng ký và gửi hồ sơ đến Chủ tịch Ủy ban nhân dân cấp tỉnh để được phép vận chuyển. Việc vận chuyển mẫu bệnh phẩm thủy sản được thực hiện theo quy định tại khoản 2 và khoản 3 Điều 52 của Luật này.”."],["D4.K6","k","Sửa đổi, bổ sung Điều 96 như sau: :_ “Điều 96. Cấp, cấp lại, gia hạn, thu hồi Giấy chứng nhận đủ điều kiện .sản xuất thuốc thú y"],["D4.K1~2","k","Chủ tịch Ủy ban nhân dân cấp tỉnh cấp, cấp lại, gia hạn, thu hồi Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y, trừ trường hợp quy định tại khoản 2 Điều này."],["D4.K2~2","k","Bộ Nông nghiệp và Môi trường cấp, cấp lại, gia hạn, thu hồi Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y trong trường hợp nước nhập khẩu hoặc doanh nghiệp nhập khẩu yêu cầu phải cung cấp Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y do cơ quan có thâm quyển trung ương cấp để được xuất khẩu. Giấy chứng nhận này có giá trị đối với cơ sở sản xuất thuốc thú y tiêu thụ trong nước và xuât khâu. Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y của cơ sở sản xuất thuốc thú y do Chủ tịch Ủy ban nhân dân cấp tỉnh cấp hết hiệu lực trong trường hợp được Bộ Nông nghiệp và Môi trường cấp Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y cho cơ sở đó theo yêu cầu của nước nhập khẩu hoặc doanh nghiệp nhập khẩu."],["D4.K3~2","k","Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y bị thu hồi trong trường hợp sau đây: nội dung; nhận đủ điều kiện sản xuất thuốc thú y; sản xuất thuốc thú y."],["D4.K3~2.Đa","d","Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y bị tẩy xóa, sửa chữa"],["D4.K3~2.Đb","d","Cơ sở không còn hoạt động sản xuất thuốc thú y;"],["D4.K3~2.Đc","d","Có hành vi vi phạm khác mà pháp luật quy định phải thu hồi Giấy chứng"],["D4.K3~2.Đd","d","Theo đề nghị của tô chức, cá nhân được cấp Giấy chứng nhận đủ điều kiện"],["D4.K4~2","k","Chính phủ quy định việc cấp, cấp lại, gia hạn, thu hồi Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y.”. 9"],["D4.K7","k","Sửa đổi, bỗ sung khoản 1 Điều 101 như sau: “1, Thuốc thú y phải được kiểm nghiệm đạt chất lượng trước khi đăng ký lưu hành tại Việt Nam và được thực hiện tại cơ sở kiểm nghiệm thuốc thú y được công nhận hoặc chỉ định.”"]],"u":1020},{"n":"Điều 5","t":"Bãi bỏ một số số điều, khoản và bỏ một số cạm từ của Luật Thủy sản","p":[["D5.K1","k","Bãi bỏ khoản 2 Điều 28; Điều 33; khoản 2 Điều 35; Điều 63 và Điều 64."],["D5.K2","k","Bỏ cụm từ “chỉ tiết khoản 2 Điều này và” tại khoản 4 Điều 28."],["D5.K3","k","Bỏ cụm từ “, mua bán, nhập khâu” tại điểm d khoản 2 Điều 31."],["D5.K4","k","Bỏ cụm từ “chỉ tiết điều kiện cơ sở mua bán, nhập khẩu thức ăn thủy sản, sản phẩm xử lý môi trường nuôi trồng thủy sản;” tại khoản 5 Điều 34."],["D5.K5","k","Bỏ cụm từ “khoản 2 và” tại khoản 6 Điều 35.."]],"u":1036},{"n":"Điều 6","t":"Sửa đỗi, bỗ sung một số điều của Luật Địa chất và khoáng sản","p":[["D6.K1","k","Sửa đổi, bổ sung khoản 3 Điều 26 như sau: “3. Trường hợp cần thăm dò, khai thác khoáng sản tại khu vực cắm hoạt động khoáng sản, khu vực tạm thời cấm hoạt động khoáng sản, bao gồm cả khoáng sản thuộc thâm quyền cấp giấy phép thăm dò khoáng sản, giấy phép khai thác khoáng sản của Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản quy định tại khoản 1 Điều 108 của Luật này thì Chủ tịch Ủy ban nhân dân cấp tỉnh xem xét, chấp thuận trước khi lập hồ. sơ đề nghị cấp giấy phép thăm dò khoáng sản, giấy phép khai thác khoáng sản. Trường hợp khu vực đề nghị chấp thuận thăm dò, khai thác khoáng sản tại khu vực cấm hoạt động khoáng sản, khu vực tạm thời cắm hoạt động khoáng sản thuộc khu vực biển nằm ngoài ranh giới quản lý hành chính trên biển của các tỉnh, thành phố; khu vực biển chưa xác định ranh giới quản lý hành chính trên biển của các tỉnh, thành phó thì thầm quyền giải quyết thực hiện theo quy định của Chính phủ.”"],["D6.K2","k","Sửa đổi, bổ sung khoản 4 Điều 33 như sau: “4. Chủ tịch Ủy ban nhân dân cấp tỉnh nơi có dự án đầu tư xem xét, chấp thuận nội dụng đánh giá mức độ ảnh hưởng đến khoáng sản thuộc đối tượng dự trữ quy định tại khoản 3 Điều này.” -"],["D6.K3","k","Sửa đổi, bỗ sung điểm c khoản 4 Điều 44 như sau: “c) Trường hợp tổ chức, cá nhân đã thực hiện đầy đủ khối lượng công tác thăm dò theo đề án thăm dò khoáng sản mà giấy phép thăm dò khoáng sản đã hết thời hạn nhưng phải bổ sung khối lượng công tác thăm dò theo yêu cầu của cơ quan nhà nước có thẩm quyền, bao gồm cả giấy phép do cơ quan, người có thấm quyền khác cấp trước ngày Luật này có hiệu lực thi hành và giấy phép 10 thuộc thâm quyền của Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản quy định tại khoản 1 Điều 108 của Luật này thì tổ chức, cá nhân phải báo cáo Chủ tịch Ủy ban nhân dân cấp tỉnh chấp thuận trước khi thực hiện. Đối với giấy phép thăm dò khoáng sản nằm trên địa bàn từ 02 đơn vị hành chính cấp tỉnh trở lên thì thâm quyền giải quyết thuộc Chủ tịch Ủy ban nhân dân cấp tỉnh nơi có diện tích khu vực thăm dò khoáng sản theo giấy phép thăm dò khoáng sản chiếm tỷ lệ diện tích lớn nhất. Chủ tịch Ủy ban nhân dân cấp tỉnh nơi giải quyết thủ tục hành chính có trách nhiệm lấy ý kiến của Chủ tịch Ủy ban nhân dân cấp tỉnh nơi có diện tích khu vực thăm đò khoáng sản theo giấy phép thăm dò khoáng sản. Đối với giấy phép thăm dò khoáng sản thuộc khu vực biên nằm ngoài ranh giới quản lý hành chính trên biển của các tỉnh, thành phố; khu vực biển chưa xác định ranh giới quản lý hành chính trên biển của các tỉnh, thành phố thì thâm quyền giải quyết thực hiện theo quy định của Chính phủ;”."],["D6.K4","k","Sửa đôi, bổ sung điểm b khoản 2 Điều 47 như sau: “b) Thực hiện các nội dung trong giấy phép thăm dò khoáng sản. Trường hợp thăm dò vượt quá mức sâu thăm đò theo quy định của Chính phủ, bổ sung mẫu công nghệ, bỗ sung moong khai thác thử, điều chỉnh phương pháp hoặc giảm khối lượng công tác thăm dò, bao gồm cả giấy phép do cơ quan, người có thầm quyền khác cấp trước ngày Luật này có hiệu lực thi hành và giấy phép thuộc thẩm quyền của Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản quy định tại khoản 1 Điều 108 của Luật này thì tổ chức, cá nhân phải báo cáo và được Chủ tịch Ủy ban nhân dân cấp tỉnh có thâm quyền theo quy định tại điểm c khoản 4 Điều 44 của Luật này chấp thuận bằng văn bản trước khi thực hiện. Trường hợp thăm dò khoáng sản thuộc khu vực biển nằm ngoài ranh giới quản lý hành chính trên biển của các tỉnh, thành phố hoặc khu vực biển chưa xác định ranh giới quản lý hành chính trên biển của các tỉnh, thành phố thì báo cáo cơ quan, người có thẩm quyền giải quyết theo quy định của Chính phủ;”."],["D6.K5","k","Sửa đối, bỗ sung khoản 1 và khoản 2 Điều 51 như sau: “1. Hội đồng đánh giá trữ lượng khoáng sản quốc gia công nhận kết quả thăm dò khoáng sản, thăm dò bỗ sung đối với các trường hợp sau đây: a) Khoáng sản nhóm Ï, trừ trường hợp quy định tại điểm a khoản 2 Điều này; b) Khoáng sản tại khu vực biển nằm ngoài ranh giới quản lý hành chính trên biển của các tỉnh, thành phó; khu vực biển chưa xác định ranh giới quản lý hành chính trên biển của các tỉnh, thành phố. II 2. Chủ tịch Ủy ban nhân dân cấp tỉnh công nhận kết quả thăm dò khoáng sản, thăm dò bổ sung đối với các trường hợp sau đây: a) Khoáng sản nhóm I tại khu vực có khoáng sản phân tán, nhỏ lẻ đã được cơ quan, người có thẩm quyền khoanh định và công bố; b) Khoáng sản nhóm II; nhóm IH, trừ trường hợp quy định tại điểm b khoản 1 Điều này.”"],["D6.K6","k","Sửa đổi, bỗ sung điểm e khoản 2 Điều 59 như sau: “e) Trường hợp thăm dò bổ sung để nâng cấp tài nguyên, trữ lượng khoáng sản chính hoặc xác định trữ lượng khoáng sản đi kèm (nếu có), bao gồm cả giây phép do cơ quan, người có thẩm quyên khác cấp trước ngày Luật này có hiệu lực thi hành và giây phép thuộc thẩm quyền của Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản quy định tại khoản 1 Điều 108 của Luật này thì tổ chức, cá nhân phải lập đề án thăm dò bể sung, gửi Chủ tịch Ủy ban nhân dân cắp tỉnh để xem xét, chấp thuận bằng văn bản trước khi thực hiện và báo cáo cơ quan, người có thẩm quyền. để được công nhận kết quả thăm dò bỗ sung. Đối với giấy phép khai thác khoáng sản nằm trên địa bàn từ 02 đơn vị hành chính cấp tỉnh trở lên thì thẩm quyền giải quyết thuộc Chủ tịch Ủy ban nhân dân cấp tỉnh nơi có diện tích khu vực khai thác khoáng sản theo giấy phép khai thác khoáng sản chiếm tỷ lệ diện tích lớn nhất. l Trường hợp khai thác khoáng sản thuộc khu vực biển nằm ngoài ranh giới quản lý hành chính trên biển của các tỉnh, thành phố hoặc khu vực biển chưa xác định ranh giới quản lý hành chính trên biển của các tỉnh, thành phố thì báo cáo cơ quan, người có thâm quyên giải quyết theo quy định của Chính phủ;”."],["D6.K7","k","Sửa đổi, bổ sung một số khoản của Điều 83 như sau: “1, Tổ chức, cá nhân khái thác khoáng sản thuộc đối tượng quy định tại khoản 1 Điều 82 của Luật này phải lập hồ sơ đề nghị thâm định, phê duyệt đề án đóng cửa mỏ khoáng sản, bao gồm cả mỏ khoáng sản do cơ quan, người có thấm quyền khác cấp giấy phép khai thác trước ngày Luật này có hiệu lực thi hành hoặc mỏ khoáng sản thuộc thâm quyền cấp giấy phép khai thác của Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản quy định tại khoản 1 Điều 108 của Luật này, gửi cơ quan tiếp nhận hồ sơ giải quyết thủ tục hành chính của Ủy ban nhân dân cấp tỉnh để được thâm định, phê duyệt trước khi thực hiện hoạt động đóng cửa mỏ khoáng sản. 2. Trên cơ sở kết quả thẩm định hồ sơ quy định tại khoản 1 Điều nảy, Chủ tịch Ủy ban nhân dân cấp tỉnh phê > đề án đóng cửa mỏ khoáng sản, điều chỉnh để án đóng cửa mỏ khoáng sản.” 12 sau khoản 6 như sau: “6, Đối với trường hợp quy định tại khoản 2 Điều 82 của Luật này, tổ chức, cá nhân có trách nhiệm lập phương án đóng cửa mỏ khoáng sản, bao gồm cả mỏ khoáng sản do cơ quan, người có thấm quyền khác cấp giấy phép trước ngày Luật này có hiệu lực thi hành hoặc mỏ khoáng sản thuộc thâm quyền cấp giấy phép của Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản quy định tại khoản 1 Điều 108 của Luật này, gửi Chủ tịch Ủy ban nhân dân cấp tỉnh để được xem xét, chấp thuận bằng văn bản trước khi thực hiện đóng cửa mỏ khoáng sản. 6a. Đối với giấy phép khai thác khoáng sản nằm trên địa bàn từ 02 đơn vị hành chính cấp tỉnh trở lên, bao gồm cả giấy phép do cơ quan, người có thâm quyền khác cấp trước ngày Luật này có hiệu lực thi hành và giấy phép thuộc thâm quyền của Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản quy định tại khoản I Điều 108 của Luật này thì thẩm quyền phê duyệt đề án đóng cửa mỏ khoáng sản, điều chỉnh nội dung đề án đóng cửa mỏ khoáng sản đã được phê duyệt, chấp thuận phương án đóng cửa mỏ khoáng sản thuộc Chủ tịch Ủy ban nhân dân cấp tỉnh nơi có điện tích khu vực khai thác khoáng sản theo giấy phép khai thác khoáng sản chiếm tỷ lệ diện tích lớn nhất. Chủ tịch Ủy ban nhân dân cấp tỉnh nơi giải quyết thủ tục hành chính có trách nhiệm lấy ý kiến của Chủ tịch Ủy ban nhân dân cấp tỉnh nơi có diện tích khu vực đề nghị phê duyệt đề án đóng cửa mỏ khoáng sản, điều chỉnh nội dung đề án đóng cửa mỏ khoáng sản đã được phê duyệt, chấp thuận phương án đóng cửa mỏ khoáng sản. 6b. Đối với giấy phép khai thác khoáng sản thuộc khu vực biển nằm ngoài ranh giới quản lý hành chính trên biển của các tỉnh, thành phố; khu vực biển chưa xác định ranh giới quản lý hành chính trên biển của các tỉnh, thành phố, bao gồm cả giấy phép do cơ quan, người có thầm quyền khác cấp trước ngày Luật này có hiệu lực thi hành và giấy phép thuộc thâm quyền của Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản quy định tại khoản 1 Điều 108 của Luật này thì thâm quyên giải quyết thực hiện theo quy định của Chính phủ. 7. Chính phủ quy định chỉ tiết các khoản 1, 2, 3, 5, 6, 6a và 6b Điều này; quy định hồ sơ, trình tự, thủ tục thâm định, phê duyệt, điều chỉnh đề án đóng cửa mỏ khoáng sản, chấp thuận phương án đóng cửa mỏ khoáng sản.”. §. Sửa đổi, bỗ sung khoản 1 và khoản 2 Điều 84 như sau: “1. Tổ chức, cá nhân khai thác khoáng sản thuộc đối tượng quy định tại khoản 1 và khoản 2 Điều 82 của Luật này phải thực hiện đóng cửa mỏ khoáng sản 13 sau khi được cơ quan, người có thẩm quyền phê duyệt đề án đóng cửa mỏ khoáng sản hoặc chấp thuận phương án đóng cửa mỏ khoáng sản. Đối với trường hợp khai thác khoáng sản nhóm IV, tổ chức, cá nhân khai thác khoáng sản thực hiện đóng cửa mỏ khoáng sản và báo cáo Chủ tịch Ủy ban nhân dân cấp tỉnh kết quả thực hiện. 2. Trường hợp giấy phép chấm đứt hiệu lực theo quy định tại điểm d khoản 2 Điều 66, điểm d khoản 2 Điều 71 của Luật này hoặc trường hợp tô chức, cá nhân khai thác khoáng sản không có khả năng thực hiện đóng cửa mỏ khoáng sản thì cơ quan, người có thảm quyền phê duyệt đề án đóng cửa mỏ khoáng sản, chấp thuận phương án đóng cửa mỏ khoáng sản quy định tại Điều 83 của Luật này lựa chọn đơn vị có đủ năng lực để lập, tổ chức thực hiện đóng cửa mỏ khoáng sản theo quy định của pháp luật về đầu thầu và pháp luật khác có liên quan.”."],["D6.K7.Đa","d","Sửa đổi, bỗ sung khoản 1 và khoản 2 như sau:"],["D6.K7.Đb","d","Sửa đổi, bổ sung khoản 6 và khoản 7; bỗ sung khoản 6a và khoản 6b vào"],["D6.K9","k","Sửa đổi, bổ sung một số khoản, điểm của Điều 108 như sau: “a) Giấy phép thăm dò khoáng sẵn, giấy phép khai thác khoáng sản nhóm I, không bao gồm khoáng sản nhóm I tại khu vực có khoáng sản phân tán, nhỏ lẻ đã được Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản khoanh định và công bố;”; “3. Trừ trường hợp quy định tại điểm b khoản 2 Điều 111 của Luật này mà tổ chức, cá nhân lựa chọn thực hiện trình tự, thủ tục, thâm quyền theo quy định của pháp . luật tại thời điểm tiếp nhận hồ sơ và quy định tại khoản 4 Điều này thì thầm quyền cấp lại, gia hạn, điều chỉnh, thu hồi, chấp thuận trả lại, cấp đôi giấy phép và chấp thuận chuyên nhượng quyền. thăm dò, khai thác khoáng sản, bao gồm cả giấy phép do cơ quan, người có thâm quyền khác cấp trước ngày Luật này có hiệu lực thi hành, như sau: sua a) Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản cấp lại, gia hạn, điều chỉnh, thu hồi, chấp thuận trả lại, cấp đổi giấy phép khai thác khoáng sản và chấp thuận chuyên nhượng quyền khai thác khoáng sản đối với các trường hợp quy định tại khoản 1 Điều này. Trường hợp chuyền nhượng quyền khai thác khoáng sản đất hiếm, Bộ trưởng Bộ được giao làm đầu mỗi giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản quyết định sau khi có ý kiến của Thủ tướng Chính phủ; b) Chủ tịch Ủy ban nhân dân cấp tỉnh cấp lại, gia hạn, điều chỉnh, thu hồi, chấp thuận trả lại, cấp đổi giấy phép khai thác khoáng sản và chấp thuận chuyên nhượng quyền khai thác khoáng sản đối với khoáng sản nhóm II, khoáng sản nhóm III, khoáng sản nhóm I tại khu vực có khoáng sản phân tán, nhỏ lẻ đã được 14 Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản khoanh định và công bố quy định tại khoản 2 Điều này; gia hạn, điều chỉnh, thu hồi, chấp thuận trả lại giấy phép khai thác khoáng sản nhóm IV; gia hạn, điều chỉnh, thu hồi, chấp thuận trả lại và chấp thuận chuyển nhượng quyền khai thác khoáng sản đối với giấy phép khai thác tận thu khoáng sản; ©) Bộ trưởng Bộ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản thu hồi giấy phép thăm dò khoáng sản đối với các trường hợp quy định tại khoản 1 Điều này. Chủ tịch Ủy ban nhân dân cấp tỉnh thu hồi giấy phép thăm dò khoáng sản đối với các trường hợp quy định tại khoản 2 Điều này, thu hồi giấy phép thăm dò khoáng sản nằm trên địa bàn từ 02 đơn vị hành chính cấp tỉnh trở lên thuộc thẩm quyền cấp phép của mình; d) Chủ tịch Ủy ban nhân dân cấp tỉnh cấp lại, gia hạn, điều chỉnh, chấp thuận trả lại giấy phép thăm dò khoáng sản và chấp thuận chuyển nhượng quyền thăm dò khoáng sản đối với các trường hợp quy định tại khoản 1 và khoản 2 Điều này. Trường hợp chuyên nhượng quyền thăm dò khoáng sản đất hiểm, Chủ tịch Ủy ban nhân dân cắp tỉnh quyết định sau khi có ý kiến của Thủ tướng Chính phủ; đ) Trường hợp khu vực đề nghị cấp lại, gia hạn, điều chỉnh, chấp thuận trả lại giấy phép thăm dò, khai thác khoáng sản, chấp thuận chuyển nhượng quyền thăm dò khoáng sản, quyền khai thác khoáng sản quy định tại điểm b và điểm d khoản này nằm trên địa bàn từ 02 đơn vị hành chính cấp tỉnh trở lên thì thẩm quyền giải quyết thuộc Chủ tịch Ủy ban nhân dân cấp tỉnh nơi có diện tích khu vực thăm đò, khai thác khoáng sản chiếm tỷ lệ diện tích lớn nhất. Chủ tịch Ủy ban nhân dân cấp tỉnh nơi giải quyết thủ tục hành chính có trách nhiệm lấy ý kiến của Chủ tịch Ủy ban nhân dân các tỉnh, thành phố nơi có diện tích khu vực thăm đò, khai thác khoáng sản theo giấy phép thăm dò, khai thác khoáng sản; e) Trường hợp khu vực đề nghị cấp lại, gia bạn, điều chỉnh, chấp thuận trả lại giấy phép thăm dò khoáng sản, chấp thuận chuyển nhượng quyền thăm dò khoáng sản quy định tại điểm d khoản này thuộc khu vực biển nằm ngoài ranh giới quản lý hành chính trên biển của các tỉnh, thành phó; khu vực biển chưa xác định ranh giới quản lý hành chính trên biển của các tỉnh, thành phố thì thẩm quyền giải quyết thực hiện theo quy định của Chính phủ.”."],["D6.K9.Đa","d","Sửa đổi, bỗ sung điểm a khoản 1 như sau:"],["D6.K9.Đb","d","Sửa đôi, bỗ sung khoản 3 như sau:"],["D6.K10","k","Thay thế một số cụm từ tại các khoản, điểm như sau: từ “các khoản 1, la và 2 Điều 53 của Luật này” tại khoản 1a Điều 55; ^ được giao làm đầu mối giúp Chính phủ quản lý nhà nước về địa chất và khoáng sản” tại khoản 4 Điều 10; điểm c khoản 2 và khoản 3 Điều 14; điểm c, điểm d khoản 2 và khoản 3 Điều 20; khoản 1 Điều 29; khoản 2 Điều 31; điểm b khoản 1, 15 khoản 5, khoản 6 và khoản 7 Điều 33; khoản 1 và khoản 2 Điều 34; điểm d khoản I Điều 41; khoản 4 Điều 42; điểm b khoản 1 Điều 43; khoản 6 Điều 44; khoản 3 Điều 45; khoản 6 Điều 47; khoản 2 Điều 49; khoản 6 Điều 50; điểm b khoản I Điều 55; khoản 3 Điều 57; khoản 4 Điều 59; khoản 2 Điều 63; khoản 6 Điều 64; khoản 3 Điều 69; điểm g khoản 2 và khoản 4 Điều 70; khoản 6 Điều 73; khoản 3 Điều 74; điểm c khoản 2 Điều 76; khoản 5 Điều 82; khoản 2 Điều 85b; các khoản 1, 2 và 3 Điều 85d; điểm b khoản 2 Điều 88; khoản 4 Điều 89; khoản 5 Điều 90; khoản 2 Điều 93; điểm a khoản I và khoản 5 Điều 96; khoản 3 Điều 100; khoản 2 Điều 101; khoản I Điều 106; khoản 2 và khoản 3 Điều 107; khoản 1, điểm b khoản 2 và khoản 4 Điều 108."],["D6.K10.Đa","d","Thay thế cụm từ “khoản 1 và khoản 2 Điều 53 của Luật này” bằng cụm"],["D6.K10.Đb","d","Thay thế cụm từ “Bộ Nông nghiệp và Môi trường” bằng cụm từ “Bộ"]],"u":1042},{"n":"Điều 7","t":"Sửa đổi, bỗ sung một số điều của Luật Tài nguyên nước","p":[["D7.K1","k","Sửa đổi, bổ sung Điều 37 như Sau: “Điều 37. Chuyển nước lưu vực sông 1. Dự án có hoạt động chuyển nước ảnh hưởng lớn đến hoạt động phát triển kinh tế - xã hội, môi trường và đời sống của Nhân dân phải được thông báo đến Bộ Nông nghiệp và Môi trường; Ủy ban nhân dân cấp tỉnh có liên quan trước khi cơ quan nhà nước có thâm quyền chấp thuận chủ trương đầu tư dự án hoặc quyết định đầu tư dự án và bảo đảm các nội dung sau đây: a) Phù hợp với quy hoạch về tài nguyên nước, quy Ì hoạch tỉnh và quy hoạch khác có liên quan; phù hợp với kế hoạch phát triển kinh tế - xã hội của địa phương và các ngành liên quan đến khai thác, sử dụng tài nguyên nước trên các lưu vực sông; phù hợp với khả năng đáp ứng của nguồn nước bị chuyền nước, nhu cầu sử dụng nước của lưu vực sông bị chuyên nước và lưu vực nhận nước; b) Phải có biện pháp giảm thiểu tác động của việc chuyển nước đến việc khai thác, sử dụng nước, duy trì dòng chảy, phòng, chống lõ, xói lở lòng, bờ, bãi sông, xâm nhập mặn và tác động đến kinh tế - xã hội, môi trường, đặc biệt trong mùa khô của đoạn sông, suối bị chuyển nước, nhận nước phía hạ lưu công trình chuyên. nước; trường hợp gây thiệt hại thì phải bồi thường và chịu trách nhiệm theo quy định của pháp luật. 2. Chính phủ quy định chi tiết Điều này.”"],["D7.K2","k","Sửa đổi, bỗ sung một số khoản, điểm của Điều 38 như Sau: “a) Bộ Nông nghiệp và Môi trường chủ trì, phối hợp ' với Bộ, Cơ quan ngang Bộ, Ủy ban nhân dân cấp tỉnh và tổ chức có liên quan tổ chức xây dựng, điều chỉnh quy trình vận hành liên hồ chứa trên các lưu vực sông, trình Thủ tướng Chính phủ phê duyệt, trừ trường p hợp quy định tại khoản 9a Điều này. l2 Trường hợp Bộ, cơ quan ngang Bộ, Ửy ban nhân dân cấp tỉnh, tổ chức quản lý, vận hành đập, hồ chứa đề xuất điều chỉnh quy trình vận hành liên hồ chứa thì phải xây dựng phương án điêu chỉnh gửi Bộ Nông nghiệp và Môi trường để xem xét, tổng hợp, lấy ý kiến Bộ Công Thương, Bộ Xây dựng, Bộ, cơ quan ngang Bộ, Ủy ban nhân dân cấp tỉnh và tô chức có liên quan trước khi trình Thủ tướng Chính phủ phê duyệt, trừ trường hợp quy định tại khoản 9a Điêu này;”; “a) Bộ Nông nghiệp và Môi trường tô chức xây dựng quy trình hoặc điều chỉnh quy trình vận hành liên hỗ chứa theo thời gian thực, trình Thủ tướng Chính phủ phê duyệt, trừ trường hợp quy định tại khoản 9a Điều này. Trường hợp Bộ, cơ quan ngang Bộ, Ủy ban nhân dân cấp tỉnh, tổ chức quản lý, vận hành đập, hô chứa đề xuât điêu chỉnh quy trình vận hành liên hồ chứa theo thời gian thực thì xây dựng phương án điêu chỉnh gửi Bộ Nông nghiệp và Môi trường để xem xét, tông hợp, lây ý kiên Bộ Công Thương, Bộ Xây dựng, Bộ, cơ quan ngang Bộ, Uy ban nhân dân cập tỉnh và tô chức có liên quan trước khi trình Thủ tướng Chính phủ phê duyệt, trừ trường hợp quy định tại khoản 9a Điều này;”; “9a. Trường hợp điều chỉnh cục bộ quy trình vận hành liên hồ chứa mà không làm thay đôi cơ bản các nguyên tặc vận hành của quy trình này, Bộ Nông nghiệp và Môi trường quyết định phê duyệt điều chỉnh sau khi lấy ý kiến Bộ Công Thương, Bộ Xây dựng, Bộ, cơ quan ngang Bộ, Ủy ban nhân dân cấp tỉnh và tổ chức có liên quan và báo cáo Thủ tướng Chính phủ kết quả thực hiện.”."],["D7.K2.Đa","d","Sửa đôi, bỗ sung điểm a khoản 7 như sau:"],["D7.K2.Đb","d","Sửa đổi, bổ sung điểm a khoản 8 như sau:"],["D7.K2.Đc","d","Sửa đổi, bỗ sung khoản 9a như sau:"],["D7.K3","k","Bãi bỏ một số khoản, điểm và bỏ một số cụm từ sau đây:"],["D7.K3.Đa","d","Bãi bỏ điểm e khoản 1 Điều 42; khoản 2 Điều 70;"],["D7.K3.Đb","d","Bỏ cụm từ “, cấp lại” tại khoản 6 Điều 31; khoản 1 và khoản 2 Điều 53;"],["D7.K3.Đc","d","Bỏ cụm từ “có đủ điều kiện, năng lực” tại khoản 7 Điều 50;"],["D7.K3.Đd","d","Bỏ cụm từ “, tạm đừng” tại khoản 1 và khoản 2 Điều 53."]],"u":1058},{"n":"Điều 8","t":"Bỏ cụm từ tại một số điều của Luật Thủy lợi","p":[],"u":1069},{"n":"Điều 9","t":"Sửa đối, bỗ sung một số điều của Luật Khí tượng thủy văn","p":[["D9.K1","k","Sửa đổi, bỗ sung khoản 10 Điều 8 như sau: “10. Tác động vào thời tiết mà không thông báo kế hoạch hoặc trái với kế hoạch đã thông báo đên cơ quan quản lý nhà nước có thâm quyên.”."],["D9.K2","k","Sửa đổi, bỗ sung khoản 4 Điều 41 như sau: “4, Tác động vào thời tiết chỉ được thực hiện theo kế hoạch đã thông báo đến cơ quan quản lý nhà nước có thẩm quyền và được công khai cho cộng đồng dân cư khu vực chịu ảnh hưởng trực tiêp trước khi thực hiện. Cơ quan quản lý 17 nhà nước có thâm quyền có trách nhiệm tiếp nhận, theo dõi, giám sát việc thực hiện kê hoạch theo quy định của pháp luật.”."],["D9.K3","k","Sửa đối, bỗ sung Điều 44 như sau: “Điều 44. Xây dựng kế hoạch tác động vào thời tiết và giám sát thực hiện 1. Cơ quan, tổ chức có nhu cầu tác động vào thời tiết phải xây dựng kế hoạch tác động vào thời tiết bao gồm các nội dung sau đây: a) Tên cơ quan, tổ chức tham gia thực hiện tác động vào thời tiết; b) Mục đích tác động vào thời tiết quy định tại Điều 42 của Luật này; c) Khu vực dự kiến thực hiện tác động vào thời tiết; d) Thời gian dự kiến thực hiện tác động vào thời tiết; đ) Giải pháp thực hiện tác động vào thời tiết; e) Phương án bảo đảm an toàn, giảm thiểu tác động tiêu cực từ hoạt động tác động vào thời tiết. 2. Cơ quan, tổ chức có nhu cầu tác động vào thời tiết sau khi xây dựng kế hoạch tác động vào thời tiết quy định tại khoản 1 Điều này có trách nhiệm lấy ý kiến cộng đồng dân cư khu vực chịu ảnh hưởng trực tiếp; tiếp thu và hoàn thiện kế hoạch trước khi thực hiện. 3. Trước thời điểm thực hiện tác động vào thời tiết, cơ quan, tổ chức có nhu cầu tác động vào thời tiết có trách nhiệm thông báo kế hoạch tác động vào thời tiết đến cơ quan tiếp nhận quy định tại khoản 4 Điều này và công khai thông tin về kế hoạch cho cộng đồng dân cư khu vực chịu ảnh hưởng trực tiếp. 4. Cơ quan có thẩm quyền tiếp nhận thông báo về kế hoạch tác động vào thời tiết có trách nhiệm chủ trì theo dõi, giám sát việc chấp hành pháp luật về hoạt động tác động vào thời tiết theo thẩm quyền; xử lý hoặc kiến nghị cơ quan có thấm quyên xử lý vi phạm theo quy định của pháp luật, cụ thể như sau: a) Bộ Nông nghiệp và Môi trường tiếp nhận thông báo đối với trường hợp tác động vào thời tiết trên phạm vi từ hai tỉnh, thành phố trực thuộc trung ương trở lên; b) Ủy ban nhân dân cấp tỉnh tiếp nhận thông báo đối với trường hợp tác động vào thời tiết trong địa giới hành chính của tỉnh, thành phô trực thuộc trung ương. 5. Trường hợp có sự thay đổi về nội dung của kế hoạch tác động vào thời tiết thì cơ quan, tô chức quy định tại khoản 1 Điều này phải thực hiện thông báo và công khai thông tin theo quy định tại khoản 3 Điều này. 6. Cơ quan có thâm quyền quy định tại khoản 4 Điều này có trách nhiệm gửi thông báo về kế hoạch tác động vào thời tiết đã tiếp nhận đến các cơ quan phối hợp theo dõi, giám sát, cụ thể như sau: l8 a) Trường hợp tác động vào thời tiết trên phạm vi từ hai tỉnh, thành phố trực thuộc trung ương trở lên, Bộ Nông nghiệp và Môi trường có trách nhiệm gửi kế hoạch đã tiếp nhận đến Bộ Quốc phòng, Bộ Công an, Bộ Khoa học và Công nghệ, Ủy ban nhân dân các tỉnh, thành phố có khu vực chịu ảnh hưởng trực tiếp để phối hợp theo dõi, giám sát hoạt động tác động vào thời tiết theo quy định; b) Trường hợp tác động vào thời tiết trong địa giới hành chính một tỉnh, thành phố trực thuộc trung ương, Ủy ban nhân dân cấp tỉnh gửi kế hoạch đã tiếp nhận đến Bộ Nông nghiệp và Môi trường, Bộ Quốc phòng, Bộ Công an, Bộ Khoa học và Công nghệ để phối hợp theo dõi, giám sát hoạt động tác động vào thời tiết theo quy định. 7. Bộ trưởng Bộ Nông nghiệp và Môi trường quy định chỉ tiết các khoản 1, 2,3, 5 và 6 Điều này.”,"],["D9.K4","k","Sửa đôi, bỗ sung khoản 12 Điều 51 như sau: “12. Tổ chức theo dõi, giám sát việc thực hiện kế hoạch tác động vào thời tiết theo thẩm quyền.”"],["D9.K5","k","Sửa đối, bỗ sung điểm ¡1 khoản 1 Điều 53 như sau: “¡1) Tổ chức theo dõi, giám sát việc thực hiện kế hoạch tác động vào thời tiết theo thâm quyễn;”"]],"u":1070},{"n":"Điều 10","t":"Sửa ra đi, bỗ sung khoản 4 Điều 26 của Luật Đê điều","p":[],"u":1076},{"n":"Điều 11","t":"Hiệu lực thi hành","p":[],"u":1077},{"n":"Điều 12","t":"Điều khoản chuyển tiếp","p":[["D12.K1","k","Văn bản, giấy phép, giấy chứng nhận là kết quả giải quyết thủ tục hành chính đã được cơ quan, người có thâm quyền ban hành trước ngày Luật này có hiệu lực thi hành và chưa hết hiệu lực hoặc chưa hết thời hạn thì tiếp tục được á áp dụng, sử dụng theo thời hạn ghi trên văn bản, giấy phép, giấy chứng nhận đó, trừ trường hợp quy định tại các khoản 4, 5 và 6 Điều này. Trường hợp tổ chức, cá nhân có nhu cầu sửa đổi, bổ sung, cấp lại, gia hạn, điều chỉnh văn bản, giấy phép, giấy chứng nhận thì gửi văn bản để nghị đến cơ quan nhà nước, người có thầm quyền theo quy định của Luật này để giải quyết. 19"],["D12.K2","k","Tổ chức, cá nhân đã được cơ quan nhà nước, người có thâm quyền tiếp nhận hỗ sơ đề giải quyết thủ tục hành chính trước ngày Luật này có hiệu lực thi hành mà chưa có kết quả thì tiếp tục được giải quyết theo quy định của pháp luật tại thời điểm tiếp nhận."],["D12.K3","k","Văn bản, giấy phép, giấy chứng nhận đã được cấp bằng bản giấy trước ngày 18 tháng 5 năm 2026 và chưa hết hiệu lực hoặc chưa hết thời hạn mà bị mắt, rách nát, hư hỏng thì tô chức, cá nhân có thê đề nghị cơ quan, người có thẩm quyền cấp bản sao từ số gốc theo quy định của pháp luật."],["D12.K4","k","Giấy chứng nhận đăng ký thuốc bảo vệ thực vật đã được cấp trước ngày 18 tháng 5 năm 2026 và chưa hết hiệu lực hoặc chưa hết thời hạn thì được tiếp tục kéo dài thời hạn thêm 05 năm kể từ ngày hết hạn ghỉ trên Giấy chứng nhận."],["D12.K5","k","Quyết định công nhận phân bón lưu hành tại Việt Nam đã được cấp trước ngày 18 tháng 5 năm 2026 và chưa hết hiệu lực hoặc chưa hết thời hạn thì được tiếp tục kéo dài thời hạn thêm 05 năm kê từ ngày hết hạn ghi trên Quyết định công nhận."],["D12.K6","k","Giấy chứng nhận đủ điều kiện buôn bán thuốc bảo vệ thực vật đã được cấp trước ngày 18 tháng 5 năm 2026 và chưa hết hiệu lực hoặc chưa hết thời hạn thì được tiếp tục áp dụng, sử dụng không có thời hạn. Luật này được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XW⁄ Kỹ họp không thường lệ thứ Nhất, thông qua ngày 24 tháng 8 năm 2026. -_ Trần Thanh Mẫn"]],"u":1078}],"22/2026/QH16":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đổi, bồ sung một số điều theo Nghị quyết số 203/2025/QH15; Quốc hội ban hành Luật sửa đổi, bỗ sung một số điều của Luật Người lao động Việt Nam ẩi làm việc ở nước ngoài theo hợp đông số 69/2020/QH14 đã được sửa đổi, bổ Sung một số điều theo Luật số 16/2023/QH15 và Luật số 142/2025%QH15."]],"u":0},{"n":"Điều 1","t":"Sửa đối, bỗ sung một số điều của Luật Người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng","p":[["D1.K1","k","Sửa đổi, bổ sung một số khoản của Điều 3 như sau: “6. Cơ sở dữ liệu về người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng là tập hợp dữ liệu, thông tin về người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng, doanh nghiệp, đơn vị sự nghiệp, tổ chức, cá nhân Việt Nam đưa người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng.”; %1, Trực tiếp tuyển chọn là việc doanh nghiệp Việt Nam hoạt động dịch vụ đưa người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng đã được cấp Giấy phép hoạt động dịch vụ đưa người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng (sau đây gọi là Giấy phép) tự thực hiện hoặc phối hợp với bên nước ngoài tiếp nhận lao động để tổ chức sơ tuyến, đánh giá và lựa chọn người lao động đáp ứng yêu cầu, không thông qua bên thứ ba, không ủy quyền cho tổ chức, cá nhân khác đề thực hiện hoạt động này. §. Cho người khác sử dụng Giấy phép là việc doanh nghiệp Việt Nam hoạt động dịch vụ đưa người lao động Việt Nam ởi làm việc ở nước ngoài theo hợp đồng đã được cấp Giấy phép cho doanh nghiệp, tổ chức hoặc cá nhân khác sử dụng Giấy phép đó dưới bất kỳ hình thức nào để thực hiện một phần hoặc toàn bộ hoạt động dịch vụ đưa người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng nhân danh doanh nghiệp được cấp Giấy phép.”."],["D1.K1.Đa","d","Sửa đôi, bổ sung khoản 6 như sau:"],["D1.K1.Đb","d","Bồ sung khoản 7 và khoản 8 vào sau khoản 6 như sau:"],["D1.K2","k","Sửa đôi, bỗ sung khoản 1 Điều 4 như sau: “1, Ưu tiên đưa người lao động đã qua đào tạo và có trình độ chuyên môn kỹ thuật đi làm việc ở nước ngoài theo hợp đồng nhằm nâng cao thu nhập, tiếp cận công nghệ, quản trị hiện đại, rèn luyện kỹ năng, ngoại ngữ, kỷ luật lao động, tác phong công nghiệp. Tăng cường kết nối thông tin việc làm cho người lao động về nước với thị trường lao động trong nước nhằm phát huy, sử dụng hiệu quả nguồn nhân lực có kỹ năng nghề đã làm việc ở nước ngoài. Người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng trong một số ngành, nghề, công việc yêu cầu trình độ chuyên môn kỹ thuật hoặc lĩnh vực Nhà nước ưu tiên phát triển được hưởng cơ chế, chính sách đặc thù đề đi làm việc ở nước ngoài và thu hút, sử dụng hiệu quả nguồn nhân lực sau khi về nước phù hợp với điều kiện kinh tế - xã hội trong từng thời kỳ theo quy định của Chính phủ.”."],["D1.K3","k","Sửa đôi, bô sung điểm g khoản 1 Điều 6 như sau: “ø) Không phải đóng bảo hiểm xã hội hoặc nộp thuế thu nhập cá nhân hai lần ở \"Việt Nam và ở nước tiếp nhận lao động nếu Việt Nam và nước đó đã ký hiệp định về bảo hiểm xã hội trong đó có nội dung tránh đóng bảo hiểm xã hội hai lần hoặc hiệp định tránh đánh thuế hai lần;”"],["D1.K4","k","Sửa đôi, bỗổ sung một số khoản của Điều 7 như sau: “1. Lôi kéo, dụ dỗ, hứa hẹn, cung cấp thông tin sai sự thật, quảng cáo, tư vấn gian dối hoặc sử dụng thủ đoạn khác nhằm lừa dối người lao động; lừa đảo đề chiếm đoạt tài sản của người lao động: lợi dụng hoạt động đưa người lao động đi làm việc ở nước ngoài để tổ chức xuất cảnh trái phép, mua bán người, bóc lột, cưỡng bức lao động hoặc thực hiện hành vi trái pháp luật khác.”; “9, Thu tiền dịch vụ và các khoản thu từ người lao động không đúng quy định của pháp luật.”; “11. Đi làm việc ở nước ngoài hoặc tổ chức tuyển chọn, chuẩn bị nguồn lao động, đưa người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng mà xâm phạm an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của người lao động và cộng đồng hoặc không được nước tiếp nhận lao động cho phép.”; “12. Đi làm việc ở nước ngoài hoặc tổ chức tuyển chọn, chuẩn bị nguồn lao động, đưa người lao động Việt Nam đi làm việc ở nước ngoài đối với công việc sau đây: a) Công việc mát-xa;”; “13. Đi làm việc ở nước ngoài hoặc tổ chức tuyển chọn, chuẩn bị nguồn lao động, đưa người lao động Việt Nam đi làm việc ở nước ngoài ở khu vực sau đây: 8) Khu vực có chiến sự, khu vực đã được cơ quan có thẩm quyền của Việt Nam khuyên cáo không đên hoặc hạn chê đên;”."],["D1.K4.Đa","d","Sửa đôi, bỗ sung khoản 1 như sau:"],["D1.K4.Đb","d","Sửa đổi, bổ sung khoản 9 như sau:"],["D1.K4.Đc","d","Sửa đổi, bỗ sung khoản 11 như sau:"],["D1.K4.Đd","d","Sửa đổi, bổ sung đoạn mở đầu và điểm a khoản 12 như sau:"],["D1.K4.Đđ","d","Sửa đổi, bỗ sung đoạn mở đầu và điểm a khoản 13 như sau:"],["D1.K5","k","Sửa đổi, bổ sung các khoản 1, 2 và 3 Điều 9 như sau: “1, Tìm kiếm, phát triển thị trường lao động ở nước ngoài; ký kết và thực hiện ' hợp đồng, thỏa thuận liên quan đến việc đưa người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đông. 2. Cung cấp thông tin, quảng cáo, tư vấn về cơ hội việc làm ở nước ngoài. 3. Chuẩn bị nguồn lao động, tuyển chọn người lao động, hỗ trợ hoặc trực tiếp làm thủ tục đê người lao động đi làm việc ở nước ngoài.”."],["D1.K6","k","Sửa đổi, bổ sung một số điểm, khoản của Điều 10 như sau: “dđ) Có nhân viên nghiệp vụ đáp ứng điều kiện theo quy định của Chính phủ;”; “1a. Người đại diện theo pháp luật của doanh nghiệp đã bị thu hồi Giấy phép thuộc trường hợp quy định tại điềm a, d hoặc đ khoản 2 Điều 16 của Luật này thì trong thời hạn 05 năm kê từ ngày có quyết định thu hồi Giây phép không được là người đại diện theo pháp luật của doanh nghiệp được câp Giây phép; doanh nghiệp đã bị thu hồi Giây phép thuộc trường hợp quy định tại điêm a, d hoặc đ khoản 2 Điêu 16 của Luật này trong thời hạn 05 năm kê từ ngày có quyêt định thu hôi Giây phép không được câp Giây phép.”; “2. Chính phủ quy định chỉ tiết Điều này; quy định nội dung, mẫu, lệ phí cấp, hỗ sơ, trình tự, thủ tục câp, điêu chỉnh thông tin, câp lại, công bô và niêm yết Giây phép. \"."],["D1.K6.Đa","d","Sửa đôi, bỗ sung điểm d khoản 1 như sau:"],["D1.K6.Đb","d","Bồ sung khoản 1a vào sau khoản 1 như sau:"],["D1.K6.Đc","d","Sửa đôi, bỗ sung khoản 2 như sau:"],["D1.K7","k","Sửa đổi, bô sung một số điểm, khoản của Điều 17 như sau: “e) Có nhân viên nghiệp vụ đáp ứng điều kiện theo quy định của Chính phủ;”; “6. Chính phủ quy định chỉ tiết điểm d khoản 2 Điều này.”. §. Sửa đối, bỗ sung Điều 18 như sau: “Điều 18. Chuẩn bị nguồn lao động 1. Doanh nghiệp dịch vụ được chủ động chuẩn bị nguồn lao động trước khi đăng ký hợp đồng cung ứng lao động theo nhu câu của doanh nghiệp, thị trường 4 tiếp nhận và khả năng ký kết hợp đồng cung ứng lao động. 2. Doanh nghiệp dịch vụ thực hiện chuẩn bị nguồn lao động bằng một hoặc một số hoạt động sau đây: a) Trực tiếp hoặc phối hợp với các tổ chức, đơn vị có chức năng, tổ chức chính trị - xã hội đề thông tin, tuyên truyền cho người lao động phục vụ cho hoạt động chuẩn bị nguồn lao động; b) Tổ chức tư vấn và sơ tuyển người lao động; c) Trực tiếp hoặc hợp tác, liên kết với cơ sở giáo dục để đào tạo, bồi dưỡng kỹ năng nghề, ngoại ngữ cho người lao động trong trường hợp cần thiết theo quy định của pháp luật về giáo dục. 3. Doanh nghiệp dịch vụ ký kết bằng văn bản với người lao động về việc tham gia chuẩn bị nguồn lao động, trong đó phải có các nội dung sau đây: mức phí đào tạo, bồi dưỡng kỹ năng nghề, ngoại ngữ và các khoản thu khác (nếu có); dự kiến thị trường, ngành, nghề, tiêu chuẩn, thời gian tuyển chọn; cam kết việc ưu tiên tuyển chọn người lao động đã tham gia chuẩn bị nguồn lao động; trách nhiệm của các bên trong trường hợp người lao động không được bên nước ngoài tiếp nhận lao động tuyển chọn hoặc chấm dứt việc tham gia chuẩn bị nguồn lao động trước thời hạn. Doanh nghiệp dịch vụ chỉ được thu phí đảo tạo, bồi dưỡng kỹ năng nghề, ngoại ngữ sau khi người lao động đã được bên nước ngoài tiếp nhận lao động tuyển chọn và ký kết hợp đồng đưa người lao động Việt Nam đi làm việc ở nước ngoài. 4. Doanh nghiệp dịch vụ thông báo bằng văn bản đến Ủy ban nhân dân cấp xã nơi doanh nghiệp tổ chức hoạt động chuẩn bị nguồn lao động và cập nhật trên cơ sở dữ liệu về người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng chậm nhất 03 ngày trước ngày thực hiện chuẩn bị nguồn lao động. 5. Ủy ban nhân dân cấp xã có trách nhiệm công khai thông báo việc chuẩn bị nguồn lao động đã tiếp nhận, theo đối hoạt động chuẩn bị nguồn lao động trên địa bàn; xử lý theo thầm quyền hoặc chuyển đến cơ quan có thâm quyền theo quy định của pháp luật khi phát hiện tổ chức, cá nhân thực hiện hoạt động chuẩn bị nguồn lao động không đúng nội dung đã thông báo hoặc có hành vị vị phạm pháp luật khác. 6. Bộ trưởng Bộ Nội vụ quy định nội dung, mẫu văn bản thông báo chuẩn bị nguồn lao động.”."],["D1.K7.Đa","d","Sửa đôi, bố sung điêm c khoản 2 như sau:"],["D1.K7.Đb","d","Sửa đổi, bổ sung khoản 6 như sau:"],["D1.K9","k","Sửa đổi, bỗ sung Điều 21 như sau: “Điều 21. Hợp đồng đưa người lao động Việt Nam đi làm việc ở nước ngoài 1. Hợp đồng đưa người lao động Việt Nam đi làm việc ở nước ngoài là văn bản thỏa thuận giữa doanh nghiệp dịch vụ với người lao động về việc đưa người lao động 5 Việt Nam đi làm việc ở nước ngoài theo hợ
