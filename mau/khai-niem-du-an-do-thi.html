<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soi Luật · Khái niệm dự án và sơ đồ (bản thử, chưa duyệt)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Chỉ cho bản thử. App thật nhúng Be Vietnam Pro (woff2, OFL) trong static/fonts, không kết nối ra ngoài. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* KHÁI NIỆM (bản thử, chưa duyệt): Dự án, Sổ rủi ro, Sơ đồ quan hệ. Không thay mau/giao-dien-1.0.html (đã duyệt).
   Token lấy lại của P1; chỉ thêm --edge, --edge-heavy, --dim, --lane, --canvas. Một màu nhấn duy nhất: bút bi xanh. */
:root {
  --ground: #f4f4f1; --surface: #ffffff; --raised: #ecece8; --active: #e6e6e1;
  --border: #e2e2dd; --rule: #eeeeea; --control: #cfcfc9;
  --text: #121211; --muted: #585854; --faint: #66665f;
  --primary: #171716; --on-primary: #ffffff;
  --pen: #1d5fbf; --pen-tint: #e9f0fb;
  --pos-bg: #dcfae5; --pos-ink: #0b3d1c;
  --neg-bg: #ffedea; --neg-ink: #831c1e; --neg: #c4242a;
  --warn-bg: #fffbeb; --warn-ink: #8a3b0c; --warn-line: #f5d77a;
  --neu-bg: #ebebe7; --neu-ink: #3d3d3a;
  --page: #ffffff; --page-ink: #262624;
  --shadow: 0 10px 30px rgba(0,0,0,.12);
  --edge: #7a7a74; --edge-heavy: #2b2b29; --dim: .45; --lane: var(--rule); --canvas: var(--surface);
  --font: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fs-title: 22px; --fs-h2: 16px; --fs-body: 14px; --fs-read: 16px; --fs-small: 12px;
  --r-card: 8px; --r-ctl: 6px; --r-chip: 4px; --side-w: 248px; --bar-h: 36px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f0f0e; --surface: #181817; --raised: #222220; --active: #2a2a28;
    --border: #2c2c2a; --rule: #232321; --control: #4a4a46;
    --text: #f1f1ed; --muted: #b6b6b0; --faint: #a0a09a;
    --primary: #f1f1ed; --on-primary: #121211; --pen: #84adf0; --pen-tint: #1b2639;
    --pos-bg: #16291d; --pos-ink: #7fd6a0; --neg-bg: #2e1a1d; --neg-ink: #f19aa3; --neg: #ef7a86;
    --warn-bg: #2b2414; --warn-ink: #f0c56b; --warn-line: #5c4a1c; --neu-bg: #262624; --neu-ink: #d0d0ca;
    --page: #1e1e1c; --page-ink: #e4e4df; --shadow: 0 10px 30px rgba(0,0,0,.5);
    --edge: #9a9a94; --edge-heavy: #d0d0ca; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0f0f0e; --surface: #181817; --raised: #222220; --active: #2a2a28;
  --border: #2c2c2a; --rule: #232321; --control: #4a4a46;
  --text: #f1f1ed; --muted: #b6b6b0; --faint: #a0a09a;
  --primary: #f1f1ed; --on-primary: #121211; --pen: #84adf0; --pen-tint: #1b2639;
  --pos-bg: #16291d; --pos-ink: #7fd6a0; --neg-bg: #2e1a1d; --neg-ink: #f19aa3; --neg: #ef7a86;
  --warn-bg: #2b2414; --warn-ink: #f0c56b; --warn-line: #5c4a1c; --neu-bg: #262624; --neu-ink: #d0d0ca;
  --page: #1e1e1c; --page-ink: #e4e4df; --shadow: 0 10px 30px rgba(0,0,0,.5);
  --edge: #9a9a94; --edge-heavy: #d0d0ca; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font: 400 var(--fs-body)/1.5 var(--font); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
mark.m { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--pen); text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-skip-ink: none; }
svg { flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Dải khái niệm (công cụ rà soát, không thuộc sản phẩm) ---------- */
.concept { height: var(--bar-h); display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--primary); color: var(--on-primary); font-size: 12px; }
.concept b { font-weight: 600; white-space: nowrap; }
.concept .sp { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.concept label, .concept button { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; background: none; border: 0; color: inherit; padding: 0; }
.concept input { accent-color: var(--on-primary); }
.concept :focus-visible { outline-color: var(--on-primary); }
.phkey { display: inline-flex; gap: 6px; align-items: center; }
.ph-chip { display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 3px; font-size: 10px; font-weight: 600; line-height: 1; letter-spacing: .02em; }
.ph-chip.p { box-shadow: inset 0 0 0 1px currentColor; }
body:not(.ph) .phkey { display: none; }
[data-ph] { position: relative; }
body.ph [data-ph]::after { content: attr(data-ph); position: absolute; top: -8px; right: 6px; z-index: 5; height: 16px; padding: 0 5px; display: inline-flex; align-items: center; border-radius: 3px; font-size: 10px; font-weight: 600; line-height: 1; pointer-events: none; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }

/* ---------- Khung ---------- */
.app { height: calc(100% - var(--bar-h)); display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app.reading { grid-template-columns: var(--side-w) minmax(0, 1fr) clamp(520px, 39vw, 640px); }
.topbar { display: none; }

/* ---------- Nút ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--control); background: var(--surface); font-weight: 500; white-space: nowrap; flex: none; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--neg); border-color: var(--neg); }
.btn.text { border-color: transparent; background: none; padding: 0 8px; }
.btn.text:hover { background: var(--raised); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn:disabled { color: var(--faint); background: var(--raised); border-color: var(--border); cursor: default; }
.icon-btn { width: 32px; height: 32px; flex: none; border-radius: var(--r-ctl); border: 0; background: none; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--raised); color: var(--text); }
.link { border: 0; background: none; padding: 0; color: var(--text); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--control); text-align: left; }
.link:hover { text-decoration-color: var(--text); }
.quiet { border: 0; background: none; padding: 4px 0; color: var(--muted); text-align: left; }
.quiet:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.meta { color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 999px; font-size: var(--fs-small); font-weight: 500; white-space: nowrap; flex: none; }
.pill.pos { background: var(--pos-bg); color: var(--pos-ink); }
.pill.neg { background: var(--neg-bg); color: var(--neg-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 0 0 1px var(--warn-line); }
.pill.neu { background: var(--neu-bg); color: var(--neu-ink); }
.pill.plain { padding: 0 8px; background: var(--raised); color: var(--text); font-weight: 400; }
.pen-chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--raised); font-size: var(--fs-small); white-space: nowrap; flex: none; }
.band { margin-top: 10px; padding: 10px 14px; border-radius: var(--r-card); background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 0 0 1px var(--warn-line); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.band .btn { height: 28px; }
.basis { margin: 10px 0 0; color: var(--muted); font-size: 13px; }

/* ---------- Thanh bên ---------- */
.side { display: flex; flex-direction: column; min-height: 0; padding: 16px 16px 14px 0; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.sw { position: relative; }
.sw > button { width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) 16px; gap: 2px 10px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--control); border-radius: var(--r-ctl); background: var(--surface); }
.sw > button:hover { background: var(--raised); }
.sw > button .nm { font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sw > button .sub { grid-column: 2; color: var(--muted); font-size: var(--fs-small); margin-top: -2px; }
.sw > button svg:first-child { grid-row: 1 / 3; align-self: center; color: var(--muted); }
.sw > button svg:last-child { grid-row: 1 / 3; align-self: center; color: var(--muted); }
.swp { position: fixed; z-index: 66; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: grid; gap: 4px; max-height: min(70vh, 460px); overflow-y: auto; }
.swp input[type="search"] { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); padding: 0 10px; margin-bottom: 4px; }
.swp h3 { margin: 8px 8px 2px; font-size: var(--fs-small); font-weight: 500; color: var(--muted); }
.swr { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r-ctl); }
.swr:hover { background: var(--raised); }
.swr[aria-checked="true"] { background: var(--active); }
.swr .rd { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--control); }
.swr[aria-checked="true"] .rd { border: 4px solid var(--text); }
.swr .nm { min-width: 0; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.swh { display: flex; justify-content: space-between; gap: 12px; padding: 2px 8px 4px; font-size: var(--fs-small); color: var(--muted); }
.swr .ct { color: var(--muted); font-size: var(--fs-small); }
.newchat { justify-content: space-between; width: 100%; }
.kbd { color: var(--muted); font-size: var(--fs-small); font-weight: 400; }
.hsearch { position: relative; display: block; }
.hsearch svg { position: absolute; left: 10px; top: 9px; color: var(--muted); }
.hsearch input { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); padding: 0 10px 0 32px; }
.hsearch input::placeholder { color: var(--faint); }
.nav { display: grid; gap: 2px; }
.nav h2 { margin: 0 0 2px; padding: 0 8px; font-size: var(--fs-small); font-weight: 500; color: var(--muted); }
.nav button, .util button { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-ctl); border: 0; background: none; text-align: left; width: 100%; }
.nav button:hover, .util button:hover { background: var(--raised); }
.nav button[aria-current="page"] { background: var(--active); font-weight: 500; }
.nav svg, .util svg { color: var(--muted); }
.cnt { margin-left: auto; font-size: var(--fs-small); font-weight: 500; color: var(--text); }
.hist { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.hgrp + .hgrp { margin-top: 14px; }
.hgrp h2 { margin: 0 0 4px; padding: 0 8px; font-size: var(--fs-small); font-weight: 500; color: var(--muted); }
.hrow { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r-ctl); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrow:hover { background: var(--raised); }
.hrow[aria-current="true"] { background: var(--active); }
.hempty { padding: 8px; color: var(--muted); margin: 0; font-size: 13px; }
.util { border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 2px; }
.local { margin: 0; padding: 6px 8px 0; color: var(--muted); font-size: var(--fs-small); display: flex; gap: 8px; align-items: center; }
.local i { width: 6px; height: 6px; border-radius: 50%; background: var(--pos-ink); flex: none; }

/* ---------- Cột chính ---------- */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.col { width: min(100%, 1000px); margin: 0 auto; padding: 24px 32px 32px; container-type: inline-size; }
.title-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; }
.title-row > div:first-child { flex: 1 1 260px; min-width: 0; }
.title-row h1 { margin: 0; font-size: var(--fs-title); line-height: 1.3; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
.title-row .sub { margin: 4px 0 0; color: var(--muted); }
.title-row .acts { display: flex; gap: 8px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.find { margin: 10px 0 0; font-size: 15px; }
.find a, .find button { color: var(--text); font-weight: 600; }
.sec { margin-top: 22px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; margin: 0 0 8px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sec-h h2 span { color: var(--muted); font-weight: 400; }
.panel { border: 1px solid var(--border); border-radius: var(--r-card); }
.pgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px 28px; align-items: start; margin-top: 4px; }
@container (max-width: 800px) { .pgrid { grid-template-columns: minmax(0, 1fr); } }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li + li { border-top: 1px solid var(--rule); }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px; }
.prow:hover { background: var(--raised); }
.prow .t { grid-column: 1 / -1; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prow .s { grid-column: 1; grid-row: 2; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .pill, .prow .btn { grid-column: 2; grid-row: 2; }
.ctx { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--control); border-radius: var(--r-card); background: var(--raised); padding: 10px 12px; line-height: 1.55; }
.ctx-f { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; color: var(--muted); font-size: 13px; }
.stripline { display: flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: var(--r-card); }
.stripline button { flex: 1 1 140px; text-align: left; border: 0; background: none; padding: 10px 14px; border-radius: 0; }
.stripline button + button { border-left: 1px solid var(--rule); }
.stripline button:first-child { border-radius: var(--r-card) 0 0 var(--r-card); }
.stripline button:last-child { border-radius: 0 var(--r-card) var(--r-card) 0; }
.stripline button[aria-pressed="true"] { background: var(--active); }
.stripline button:hover { background: var(--raised); }
.stripline b { display: block; font-size: 20px; font-weight: 600; line-height: 1.2; }
.stripline span { color: var(--muted); font-size: 13px; }
.dash { color: var(--faint); }
.seg { display: inline-flex; border: 1px solid var(--control); border-radius: var(--r-ctl); overflow: hidden; background: var(--surface); }
.seg button { height: 32px; padding: 0 12px; border: 0; background: none; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--control); }
.seg button[aria-pressed="true"] { background: var(--active); color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fchip { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--control); background: var(--surface); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.fchip:hover { background: var(--raised); }
.fchip[aria-pressed="true"] { background: var(--active); border-color: var(--text); font-weight: 500; }
.fchip b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Thread / kết quả ---------- */
.thread { display: grid; gap: 28px; padding-top: 18px; }
.q { justify-self: end; max-width: 80%; background: var(--raised); border-radius: 14px 14px 4px 14px; padding: 10px 14px; }
.q p { margin: 0; font-size: 15px; }
.scopeline { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.grp { margin-top: 12px; border: 1px solid var(--border); border-radius: var(--r-card); }
.grp-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 14px 8px; border-bottom: 1px solid var(--rule); }
.grp-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.grp-h h3 span { color: var(--muted); font-weight: 400; }
.grp-h .mt { grid-column: 1; margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp-h .pill { grid-row: 1 / 3; grid-column: 2; align-self: center; }
.grp.faded .snip, .grp.faded .addr { color: var(--muted); }
.item { padding: 12px 14px; }
.item + .item { border-top: 1px solid var(--rule); }
.addr { font-weight: 600; color: var(--text); text-decoration: none; background: none; border: 0; padding: 0; text-align: left; }
.addr:hover { text-decoration: underline; text-underline-offset: 3px; }
.snip { margin: 4px 0 0; max-width: 68ch; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.item-f { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 6px; }
.go { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; font-weight: 500; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--control); }
.go:hover { text-decoration-color: var(--text); }
.src { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; margin-left: 4px; border-radius: var(--r-chip); border: 1px solid var(--control); background: var(--surface); font-size: 12px; font-weight: 500; vertical-align: 1px; }
.src:hover, .src:focus-visible { border-color: var(--pen); color: var(--pen); }
.none { margin-top: 12px; padding: 16px; border: 1px dashed var(--control); border-radius: var(--r-card); }
.none h2 { margin: 0; font-size: var(--fs-h2); font-weight: 600; }
.none p { margin: 6px 0 0; max-width: 64ch; }
.none .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.hello { padding-top: 10px; }
.ex { list-style: none; margin: 8px 0 0; padding: 0; border: 1px solid var(--border); border-radius: var(--r-card); }
.ex li + li { border-top: 1px solid var(--rule); }
.ex button { display: flex; width: 100%; justify-content: space-between; gap: 12px; text-align: left; border: 0; background: none; padding: 11px 14px; border-radius: var(--r-card); }
.ex button:hover { background: var(--raised); }
.ex button span { color: var(--muted); font-size: 13px; white-space: nowrap; }

/* AI (xem trước P3) */
.ai-say { margin: 10px 0 0; font-size: 16px; line-height: 1.6; max-width: 64ch; }
.mlabel { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--control); font-size: 12px; color: var(--muted); font-weight: 500; }
.verify { margin-top: 12px; padding: 10px 14px; border-radius: var(--r-card); background: var(--raised); font-size: 13px; }
.verify summary { cursor: pointer; font-weight: 500; }
.verify ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.used { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.quote { margin: 8px 0 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-card); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
.quote .n { font-weight: 600; color: var(--muted); }
.quote p { margin: 0; }
.quote .lab { font-size: 12px; color: var(--muted); }

/* ---------- Hàng rủi ro (một thành phần, ba nơi dùng) ---------- */
.rr { container-type: inline-size; border: 1px solid var(--border); border-radius: var(--r-card); margin-top: 8px; overflow: hidden; background: var(--surface); }
.rr-in { display: grid; grid-template-columns: minmax(0, 1fr); }
.rr .you { background: var(--raised); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.rr .you .acts { margin-top: auto; padding-top: 4px; }
.rr .rr-warn { display: grid; gap: 6px; padding: 8px 14px 12px; border-top: 1px solid var(--border); }
.rr .law { background: var(--surface); padding: 12px 14px; display: grid; gap: 6px; align-content: start; border-top: 1px solid var(--border); }
@container (min-width: 640px) {
  .rr-in { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
  .rr .law { border-top: 0; border-left: 1px solid var(--border); }
}
.lab { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); }
.lab b { color: var(--text); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.rr .note { margin: 0; font-size: 14px; }
.rr .acts { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 2px; }
.rr .law .qt { margin: 0; font-size: 14px; max-width: 64ch; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.rr .law .why { margin: 0; color: var(--muted); font-size: 13px; }
.rr .warnl { margin: 0; padding: 6px 10px; border-radius: var(--r-ctl); background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 0 0 1px var(--warn-line); font-size: 13px; }
.rr .empty { margin: 0; padding: 10px 12px; border: 1px dashed var(--control); border-radius: var(--r-ctl); color: var(--text); font-size: 13px; }
.rr select { height: 28px; border: 1px solid var(--control); border-radius: var(--r-ctl); background: var(--surface); padding: 0 6px; font-size: 13px; }
.stt { white-space: nowrap; min-width: 84px; justify-content: center; height: 28px; padding: 0 8px; border: 1px solid var(--control); border-radius: var(--r-ctl); background: var(--surface); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.stt[data-v="xu_ly"] { border-color: var(--text); }
.ro { margin-top: 8px; }
.unv { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; font-size: 12px; line-height: 20px; color: var(--warn-ink); background: var(--warn-bg); box-shadow: inset 0 0 0 1px var(--warn-line); }
.pnotes { list-style: none; margin: 10px 0 0; padding: 0; }
.pnotes li { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; padding: 4px 0; }
.pnotes .icon-btn { width: 28px; height: 28px; }
.pn-add { display: flex; gap: 8px; margin-top: 8px; }
.pn-add input { flex: 1; min-width: 0; height: 34px; border: 1px solid var(--control); border-radius: var(--r-ctl); background: var(--surface); padding: 0 10px; }
.intro { margin-top: 8px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r-card); max-width: 68ch; }
.intro p { margin: 0; }
.intro .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* ---------- Bảng ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 400; color: var(--muted); font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl tr.row:hover td { background: var(--raised); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .id { font-weight: 600; white-space: nowrap; }
.tbl .tt { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 46ch; }
.tbl button.rowb { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; text-decoration: none; }
.tbl button.rowb:hover { text-decoration: underline; text-underline-offset: 3px; }
.tbl .id button.rowb { font-weight: 600; }
.tbl td.nw { white-space: nowrap; }
.tbl .ex-row > td { padding: 0 10px 12px; background: var(--surface); }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--raised); font-size: 12px; margin: 0 4px 2px 0; white-space: nowrap; }
.tblwrap { border: 1px solid var(--border); border-radius: var(--r-card); overflow-x: auto; }
@container (max-width: 1000px) {
  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr.ex-row, .tbl tr.ex-row > td { display: block; }
  .tbl tr.row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  .tbl tr.row > td { display: block; padding: 0; border: 0; }
  .tbl tr.row:hover td { background: none; }
  .tbl td.first { flex: 1 1 55%; min-width: 0; order: 0; }
  .tbl td.end { flex: none; margin-left: auto; text-align: right; order: 1; }
  .tbl td.sec2 { flex: 1 1 100%; order: 2; }
  .tbl td.hide-s { flex: none; order: 3; font-size: 12px; color: var(--muted); text-align: left; }
  .tbl tr.ex-row { padding: 0 12px 12px; }
  .tbl tr.ex-row > td { padding: 0; }
}

/* ---------- Ô hỏi ---------- */
.composer { border-top: 1px solid var(--border); background: var(--surface); }
.composer .col { padding-top: 12px; padding-bottom: 14px; }
.main.w .composer .col { width: min(100%, 1180px); }   /* cùng bề rộng với nội dung của màn đang mở: một mép trái */
@container (max-width: 700px) { .under .hint { display: none; } }
.box { border: 1px solid var(--control); border-radius: 12px; padding: 8px 8px 8px 12px; background: var(--surface); position: relative; }
.box:focus-within { border-color: var(--text); }
.scopes { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.scopes .sc { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: var(--r-ctl); background: var(--raised); border: 0; font-size: 13px; white-space: nowrap; flex: none; }
.scopes .sc button { border: 0; background: none; padding: 0; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; color: var(--muted); }
.scopes .sc button:hover { color: var(--text); background: var(--active); }
.scopes .proj { border: 1px solid var(--control); background: var(--surface); font-weight: 500; }
.scopes .proj:hover { background: var(--raised); }
.entry { display: flex; gap: 10px; align-items: flex-end; }
.entry textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: none; line-height: 1.5; padding: 5px 0; max-height: 132px; font-size: 15px; }
.entry textarea::placeholder { color: var(--faint); }
.send { flex: none; width: 34px; height: 34px; border-radius: var(--r-ctl); border: 0; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.send:disabled { background: var(--raised); color: var(--faint); cursor: default; }
.under { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 8px; color: var(--muted); font-size: var(--fs-small); }
.under select { height: 28px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); padding: 0 6px; font-size: var(--fs-small); color: var(--text); max-width: 100%; }
.under .hint { margin-left: auto; }
.pick-list { position: absolute; left: 12px; right: 12px; bottom: calc(100% + 6px); z-index: 20; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; max-height: 260px; overflow-y: auto; }
.pick-list button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: var(--r-ctl); }
.pick-list button[aria-selected="true"], .pick-list button:hover { background: var(--active); }
.pick-list .t { font-weight: 500; }
.pick-list .s { grid-column: 1; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-list .pill { grid-row: 1 / 3; grid-column: 2; }

/* ---------- Trình đọc ---------- */
.reader { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); position: relative; }
.rd-top { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 20px; border-bottom: 1px solid var(--rule); }
.rd-top .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rd-top h2 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tabs { display: flex; gap: 20px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.tabs button { position: relative; border: 0; background: none; padding: 9px 0 10px; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: -1px; height: 2px; background: var(--text); }
.tabs .n { font-size: 12px; font-weight: 400; color: var(--muted); }
.rd-wrap { flex: 1; min-height: 0; display: flex; position: relative; }
.rd-body { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; }
.rd-meta { padding: 14px 20px 0; }
.rd-meta .mt { margin: 0; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.rd-meta .rs { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.rd-meta .tags { margin-top: 8px; }
.cite { margin: 10px 0 0; padding: 8px 12px; background: var(--raised); border-radius: var(--r-card); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.cite output { font-weight: 500; font-size: 13px; }
.ban { margin: 12px 20px 0; }
.rd-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 28px; padding: 16px 20px 40px 32px; }
.reader.wide .rd-grid { grid-template-columns: 200px minmax(0, 1fr); max-width: 1100px; margin: 0 auto; }
.toc { display: none; position: sticky; top: 16px; align-self: start; font-size: 13px; max-height: calc(100vh - 160px); overflow-y: auto; }
.reader.wide .toc { display: block; }
.reader.wide .toc-sel { display: none; }
.toc h3 { margin: 0 0 6px; font-size: var(--fs-small); font-weight: 500; color: var(--muted); }
.toc ul { list-style: none; margin: 0; padding: 0; }
.toc a { display: block; padding: 5px 8px; border-radius: var(--r-ctl); color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toc a:hover { background: var(--raised); }
.toc-sel { margin: 0 0 16px; }
.toc-sel select { width: 100%; height: 34px; border: 1px solid var(--control); border-radius: var(--r-ctl); background: var(--surface); padding: 0 8px; }
.text { font-size: var(--fs-read); line-height: 1.65; max-width: 70ch; min-width: 0; }
.dieu + .dieu { margin-top: 26px; }
.dieu h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; line-height: 1.45; scroll-margin-top: 16px; }
.u { position: relative; margin: 0 0 8px; padding: 2px 44px 2px 8px; border-radius: 4px; scroll-margin-top: 80px; }
.u.l2 { margin-left: 22px; }
.u .lb { color: var(--muted); margin-right: 6px; }
.u.sel { background: var(--pen-tint); }
.u.sel::before { content: ""; position: absolute; left: -6px; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--pen); }
.u .pa { position: absolute; right: 8px; top: 0; opacity: 0; width: 28px; height: 28px; background: var(--surface); border: 1px solid var(--control); }
.u:hover .pa, .u .pa:focus-visible { opacity: 1; }
@media (hover: none) { .u .pa { opacity: 1; } }
.u .mg { position: absolute; left: -28px; top: 5px; width: 18px; height: 18px; border: 0; background: none; padding: 0; color: var(--text); display: grid; place-items: center; }
.cut { color: var(--faint); font-size: 13px; margin: 8px 0 0; }
.rd-empty { padding: 24px 20px; color: var(--muted); }
.drawer { width: 320px; flex: none; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 14px 16px 24px; font-size: 13px; }
.reader:not(.wide) .drawer { position: absolute; right: 0; top: 0; bottom: 0; z-index: 8; box-shadow: var(--shadow); }
.drawer h3 { margin: 18px 0 6px; font-size: 13px; font-weight: 600; }
.drawer h3:first-of-type { margin-top: 0; }
.drawer .hh { display: flex; justify-content: space-between; align-items: center; }
.drawer .hh h2 { margin: 0; font-size: 14px; }
.nt { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-card); margin-top: 6px; display: grid; gap: 4px; background: var(--raised); }
.nt p { margin: 0; font-size: 13px; }
.nt .lab { font-size: 12px; }
.nt .acts { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.sheet { width: 100%; max-width: 560px; aspect-ratio: 1 / 1.414; background: var(--page); color: var(--page-ink); border: 1px solid var(--border); border-radius: 2px; padding: 9% 10%; font-size: 11px; line-height: 1.55; position: relative; overflow: hidden; }
.sheet p { margin: 0 0 5px; text-align: justify; }
.sheet .box2 { outline: 2px solid var(--pen); outline-offset: 2px; background: var(--pen-tint); border-radius: 2px; }
.orig { padding: 16px 20px 40px; display: grid; gap: 12px; justify-items: center; }
.selbar { position: fixed; z-index: 55; display: flex; gap: 2px; padding: 4px; background: var(--primary); color: var(--on-primary); border-radius: 8px; box-shadow: var(--shadow); }
.selbar button { border: 0; background: none; color: inherit; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.selbar button:hover { background: rgba(127,127,127,.3); }

/* ---------- Liên quan và sơ đồ ---------- */
.rel { padding: 16px 20px 40px; }
.rel .find { margin-top: 0; }
.rel-tools { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 12px; }
.rel h3.g { margin: 18px 0 4px; font-size: 13px; font-weight: 600; color: var(--text); }
.rel h3.g span { color: var(--muted); font-weight: 400; }
.rl { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--r-card); }
.rl li + li { border-top: 1px solid var(--rule); }
.rli { padding: 10px 14px; display: grid; gap: 4px; min-height: 56px; }
.rli.sel { background: var(--active); }
.rli.ghost .nm { color: var(--muted); }
.rli .top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.rli .nm { font-weight: 600; background: none; border: 0; padding: 0; text-align: left; }
.rli .nm:hover { text-decoration: underline; text-underline-offset: 3px; }
.rli .ttl { color: var(--muted); font-size: 13px; }
.rli blockquote { margin: 0; font-size: 13px; padding-left: 10px; border-left: 2px solid var(--control); color: var(--text); max-width: 70ch; }
.rli .foot { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.src-lab { font-size: 12px; color: var(--muted); }
.hist-l { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.hist-l li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; }
.hist-l time { color: var(--muted); font-variant-numeric: tabular-nums; }
.inbox { margin-top: 18px; border: 1px solid var(--border); border-radius: var(--r-card); }
.inbox summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 13px; }
.inbox .rli { border-top: 1px solid var(--rule); }
.simi { margin-top: 14px; font-size: 13px; color: var(--muted); }
.simi summary { cursor: pointer; }
.gwrap { margin-top: 12px; }
.gbar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin: 8px 0; }
.gbar .sp { flex: 1; }
.gbar .meta { font-size: 12px; }
.canvas { position: relative; display: flex; background: var(--canvas); border: 1px solid var(--border); border-radius: var(--r-card); overflow: auto; min-height: 360px; max-height: 720px; }
.canvas:focus-visible { outline-offset: -2px; }
.gsvg { display: block; user-select: none; }
.canvas > .gsvg { flex: none; margin: auto; }
.gsvg text { font-family: var(--font); }
.lane-line { stroke: var(--lane); stroke-width: 1; }
.lane-lab { fill: var(--muted); font-size: 12px; font-weight: 500; paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.gn { cursor: pointer; }
.gn rect.bx { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }
.gn text.lb { fill: var(--text); font-size: 12px; font-weight: 500; }
.gn.out rect.bx { fill: var(--canvas); stroke: var(--edge); } /* --control chỉ 1,56:1 trên nền khung vẽ, không đạt 3:1 (WCAG 1.4.11): dùng --edge */
.gn.out text.lb { fill: var(--muted); }
.gn.mine rect.bx { stroke: var(--pen); stroke-width: 1.5; }
.gn.mine text.lb { font-weight: 600; }
.gn.ghost rect.bx { fill: var(--canvas); stroke: var(--muted); stroke-dasharray: 5 3; }
.gn.ghost text.lb { fill: var(--muted); font-weight: 400; }
.gn.center rect.bx { fill: var(--pen-tint); stroke: var(--pen); stroke-width: 2; }
.gn.sel rect.bx { stroke: var(--pen); stroke-width: 2; }
.gn:focus { outline: none; }
.gn:focus-visible rect.ring, .gn.act rect.ring { stroke: var(--pen); stroke-width: 2; fill: none; }
.gn rect.ring { fill: none; stroke: none; }
.gn .ic { color: var(--text); }
.gn.out .ic, .gn.ghost .ic { color: var(--muted); }
.gn .date { fill: var(--muted); font-size: 12px; }
.gn .bdg-c { fill: var(--primary); }
.gn .bdg-t { fill: var(--on-primary); font-size: 12px; font-weight: 600; }
.gn.more rect.bx { fill: var(--surface); stroke: var(--muted); }
.gn.sim rect.bx { stroke-dasharray: 1 3; }
/* làm mờ chỉ nét và nền của nút/cạnh không liên quan; chữ giữ nguyên độ đậm để vẫn đọc được */
.gsvg.hov .gn:not(.nb) :is(rect.bx, .ic, .bdg-c), .gsvg.hov .ge:not(.nb) path { opacity: var(--dim); }
/* kiểu nét mã hoá LOẠI quan hệ (chú giải dựng từ cùng các lớp này); "văn bản chưa có" thể hiện ở viền nút, không ở nét */
.ge path.halo { fill: none; stroke: var(--canvas); stroke-width: 5; }
.ge path.v { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.ge.heavy path.v { stroke: var(--edge-heavy); stroke-width: 3; }
.ge.dot path.v { stroke-dasharray: 0.1 5; stroke-linecap: round; stroke-width: 2.5; }
.ge.simi path.v { stroke-dasharray: 7 5; stroke-width: 1.5; }
.ge.sel path.v, .ge.cen path.v { stroke: var(--pen); }
.ge path.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.ge .elab { fill: var(--text); font-size: 12px; }
.ge .elbg { fill: var(--canvas); }
.ge .q { fill: var(--text); font-size: 12px; font-weight: 700; }
.ge .qb { fill: var(--canvas); stroke: var(--edge); stroke-width: 1; }
.ge:not(.show):not(.tmp) .elab, .ge:not(.show):not(.tmp) .elbg { display: none; }
.gn .date { display: none; }
.gn.sel .date, .gn:hover .date, .gn:focus .date { display: block; }
.ge.tmp .elab, .ge.tmp .elbg { display: block; }
.mk-thin { fill: var(--edge); } .mk-heavy { fill: var(--edge-heavy); } .mk-pen { fill: var(--pen); } .mk-stop { stroke: var(--edge-heavy); stroke-width: 3; } .mk-stop-pen { stroke: var(--pen); stroke-width: 3; }
.legend { margin-top: 8px; border: 1px solid var(--border); border-radius: var(--r-card); font-size: 12px; background: var(--surface); }
.legend summary { cursor: pointer; padding: 8px 12px; font-weight: 500; font-size: 13px; }
.legend .lg { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 16px; padding: 4px 12px 12px; }
.legend .lg > div { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.legend .lg svg { flex: none; }
.legend .lg h4 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 12px; font-weight: 600; color: var(--text); }
.detail { margin-top: 10px; border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px; display: grid; gap: 8px; }
.detail h4 { margin: 0; font-size: 14px; font-weight: 600; }
.detail blockquote { margin: 0; padding-left: 10px; border-left: 2px solid var(--pen); font-size: 13px; max-width: 70ch; }
.detail .acts { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.gerr { padding: 28px 16px; text-align: center; color: var(--muted); }
.skelg { display: grid; gap: 14px; padding: 18px; }
.skelg i { display: block; height: 28px; border-radius: 6px; background: var(--raised); }
.ocr { margin: 0; font-size: 12px; color: var(--muted); }
.nov { color: var(--warn-ink); }
.rli .nm.g { color: var(--muted); }


/* ---------- Hộp thoại, thông báo, hộp xem trước ---------- */

","Căn cứ Nghị định sô 08/2015/NĐ-CP của Chính phủ quy định chỉ tiết và biện pháp thi hành Luật Hải quan về thủ tục hải quan, kiểm tra, giám sát, kiểm soát hải quan được sửa đổi, bổ sung bởi Nghị định sô 167/2025/NĐ-CP;"],["CC5","c","Căn cứ Nghị định số 14/2018/NĐ-CP của Chính phủ quy định chỉ tiết về hoạt động thương mại biên giới được sửa đổi, bổ sung bởi Nghị định số 122/2024/NĐ-CP;"],["CC6","c","Căn cứ Nghị định số 134/2016/NĐ-CP của Chính phủ quy định chỉ tiết một số điều và biện pháp thi hành Luật thuế xuất khẩu, thuế nhập khẩu được sửa đổi bổ sung bởi Nghị định số 18/2021/NĐ-CP và Nghị định số 182/2025/NĐ-CP;"],["CC7","c","Căn cứ Nghị định số 292/2026/NĐ-CP của Chính phủ quy định chỉ tiết một số điều của Luật Quản lý ngoại thương;"],["CC8","c","Căn cứ Nghị định số 1 12/2014/NĐ-CP của Chính phủ quy định về quản lý cửa khẩu biên giới đất liền được sửa đổi bổ sung bởi Nghị định số 34/2023/NĐ- CP và Nghị định số 299/2025/NĐ-CP;"],["CC9","c","Căn cứ Nghị định số 01/2015/NĐ-CP của Chính phủ quy định chỉ tiết phạm vi địa bàn hoạt động hải quan; trách nhiệm phối hợp trong phòng, chống buôn lậu, vận chuyển trái pháp hàng hóa qua biên giới được sửa đổi, bổ sung bởi Nghị định sô 12/201 8/NĐ- CP và Nghị định số 153/2026/NĐ-CP;"],["CC10","c","Căn cứ Nghị định số 376/2026/NĐ-CP của Chính phủ quy định chức năng, nhiệm vụ, quyên hạn và cơ cấu tổ chức của Bộ Tài chính; Theo đề nghị của Cục trưởng Cục Hải quan, 2 Bộ trưởng Bộ Tài chính ban hành Thông tư sửa đôi, bỗ sung một số điều của Thông tư số 80/2019/TT-BTC ngày 15 tháng 11 năm 2019 của Bộ | trưởng Bộ Tài chính hướng dẫn thủ tục hải quan, quản lý thuế, phí và lệ phí đối với hàng hóa xu"]],"u":0},{"n":"Điều 1","t":"Sửa đỗi, bỗ sung Điều 4 như sau:","p":[],"u":1},{"n":"Điều 2","t":"Sửa đỗi, bỗ sung Điều 5 như sau:","p":[],"u":2},{"n":"Điều 3","t":"Sửa đổi, bỗ sung Điều 6 như sau:","p":[],"u":3},{"n":"Điều 4","t":"Sửa đổi, bỗ sung Điều 7 như sau:","p":[],"u":4},{"n":"Điều 5","t":"Thay thế một số cụm từ tại Thông tư số 80/2019/TT-BTC như","p":[["D5.K1","k","Thay thế cụm từ “Tổng cục Hải quan” bằng cụm từ “Cục Hải quan” tại Điều 8, khoản 1, khoản 3 Điều 9, khoản 2 Điều 10, khoản 2 Điều 11, Phụ lục IV;"],["D5.K2","k","Thay thế cụm từ “Cục Hải quan tỉnh, TP...” bằng cụm từ “Hải quan khu vực” tại Phụ lục IV;"],["D5.K3","k","Thay thế cụm từ “Chỉ cục Hải quan cửa khẩu” bằng cụm từ “Hải quan cửa khẩu” tại khoản 2 Điều 9, Điều 10, Phụ lục IV;"],["D5.K4","k","Thay thế cụm từ “Tổng cục trưởng Tổng cục Hải quan” bằng cụm từ “Cục trưởng Cục Hải quan” tại khoản ] Điều 11;"],["D5.K5","k","Thay thế cụm từ “Chỉ cục trưởng” bằng cụm từ “Trưởng hải quan cửa khẩu” tại Phụ lục IV; 6"],["D5.K6","k","Thay thế cụm từ “Lãnh đạo Chỉ cục” bằng cụm từ “Lãnh đạo Hải quan cửa khẩu” tại Phụ lục IV;"],["D5.K7","k","Thay thế cụm từ “Bộ Nông nghiệp và Phát triển nông thôn” bằng cụm từ “Bộ Nông nghiệp và Môi trường” tại Điều 8;"],["D5.K8","k","Bãi bỏ cụm từ “mẫu số STDHCDBG 2019/HQVNT tại khoản 2 Điều 9;"],["D5.K9","k","Thay thế cụm từ “Điều 8l Nghị định số 08/2015/NĐ-CP ngày 21/01/2015 được sửa đổi, bố sung tại khoản 49 Điều 1 Nghị định số 59/2018/NĐ-CP ngày 20/4/2018 của Chính phủ” bằng cụm từ “Điều 81 Nghị định số 08/2015/NĐ-CP được sửa đổi, bỗ sung bởi khoản 48 Điều I Nghị định số 167/2025/NĐ-CP” tại khoản 1 Điều 10 ;"],["D5.K10","k","Thay thế cụm từ “Thông tư số 50/2018/TT-BTC ngày 23/5/2018 của Bộ trưởng Bộ Tải chính” bằng cụm từ “Thông tư số 127/2026/TT-BTC quy định về chỉ tiêu thông tin, mẫu chứng từ khai báo khi làm thủ tục xuất cảnh, nhập cảnh, quá cảnh đối với phương tiện vận tải qua cửa khẩu cảng hàng không, cảng biển, đường sắt, đường bộ và đường thủy nội địa” tại khoản 1 Điều 10;"],["D5.K11","k","Thay thế cụm từ “Nghị định số 08/2015/NĐ-CP ngày 21/01/2015 được sửa đổi, bổ sưng tại Nghị định số 59/2018/NĐ-CP ngày 20/4/2018 của Chính phủ và hướng dẫn tại Thông tư số 38/2015/TT-BTC ngày 25/3/2015 được sửa đổi, bổ sung tại Thông tư số 39/2018/TT-BTC ngày 20/4/2018 của Bộ trưởng Bộ Tài chính” bằng cụm từ “Nghị định 08/2015/NĐ-CP quy định chỉ tiết và biện pháp thi hành Luật Hải quan về thủ tục hải quan, kiểm tra, giám sát, kiểm soát hải quan được sửa đổi, bỗ sung bởi Nghị định số 167/2025/NĐ-CP và hướng dẫn tại Thông tư số 38/2015/TT-BTC quy định về thủ tục hải vm: kiểm tra, giám sát hải quan; thuế xuất khâu, thuế nhập khẩu và quản lý thuế đối với hàng hoá xuất khẩu, nhập khẩu được sửa đổi, bỗ sung bởi Thông tư số 39/2018/TT- BTC và Thông tư số 121/2025/TT-BTC” tại khoản 1 Điều 3;"],["D5.K12","k","Thay thế cụm từ “Số CMT/Giấy thông hành” bằng cụm từ “Số định danh cá nhân/Số Căn cước công dân” tại Phụ lục VI;"],["D5.K13","k","Thay thế Phụ lục I kèm theo Thông tư số 80/2019/TT-BTC bằng Phụ lục I kèm theo Thông tư này;"],["D5.K14","k","Thay thế Phụ lục II kèm theo Thông tư số 80/2019/TT-BTC bằng Phụ lục II kèm theo Thông tư này;"],["D5.K15","k","Thay thế Phụ lục III kèm theo Thông tư số 80/2019/TT-BTC bằng Phụ lục II kèm theo Thông tư này."]],"u":5},{"n":"Điều 6","t":"Hiệu lực thi hành","p":[["D6.K1","k","Thông tư này có hiệu lực thi hành từ ngày 01/01/2027."],["D6.K2","k","Trường hợp các văn bản liên quan viện dẫn tại Thông tư này được sửa đổi, bỗ sung hoặc thay thể thì thực hiện theo văn bản sửa đổi, bỗ sung hoặc thay thể đó. 7"],["D6.K3","k","Trong quá trình thực hiện Thông tư này, nếu có vướng mắc phát sinh, đề nghị các tổ chức, cá nhân có liên quan phản ánh về Bộ Tài chính (qua Cục Hải quan) đề tổng hợp và hướng dẫn xử lý./. Š."]],"u":21}],"155/2026/TT-BTC":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Nghị định số 299/2026/NĐ-CP ngày 28 tháng 7 năm 2026 của Chính phủ quy định tô chức đơn vị sự nghiệp công lập;"],["CC1","c","Căn cứ Nghị định số 376/2026/NĐ-CP ngày 01 tháng 10 năm 2026 của Chính phú quy định chức năng, nhiệm vụ, quyên hạn và cơ câu tổ chức của Bộ Tài chính; Theo đè nghị của Vụ trưởng Vụ Tổ chức cản bộ; Bộ trưởng Bộ Tài chính ban hành Thông tư quy định tiêu chí phân loại, điều kiện thành lập, tổ chức lại, giải thể đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính."]],"u":0},{"n":"Điều 1","t":"Phạm vi điều chỉnh","p":[],"u":25},{"n":"Điều 2","t":"Đối tượng áp dụng","p":[["D2.K2","k","Thông tư này không áp dụng đối với: Bộ Quốc phòng (nếu có); vị hành chính — kinh tế đặc biệt; và Sở Tài chỉnh tỉnh, thành phố hoạt động trong lĩnh vực thông tin và truyền thông, khoa học và công nghệ, giáo dục đào tạo và lĩnh vực khác ngoài lĩnh vực tài chính; trong lĩnh vực tài chính hoạt động theo cơ chế như đơn vị sự nghiệp công lập."],["D2.K2.Đa","d","Đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính thuộc Bộ Công an,"],["D2.K2.Đb","d","Đơn vị sự nghiệp công lập thuộc phạm vi quản lý của chính quyền đơn"],["D2.K2.Đc","d","Đơn vị sự nghiệp công lập thuộc thẩm quyển quản lý của Bộ Tài chính"],["D2.K2.Đđ","d","Đơn vị sự nghiệp công lập ở nước ngoài;"],["D2.K2.Đđ~2","d","Quỹ tài chính nhà nước ngoài ngân sách hoặc tổ chức khác hoạt động"],["D2.K3","k","Đối với đơn vị sự nghiệp công lập đa ngành, đa lĩnh vực có hoạt động sự nghiệp công thuộc lĩnh vực tài chính, cơ quan có thẩm quyền thành lập đơn vị quyết định việc áp dụng quy định tại Thông tư này đối với đơn vị."]],"u":26},{"n":"Điều 3","t":"Tiêu chí phân loại đơn vị sự nghiệp công lập hỗ trợ thực hiện nhiệm vụ quản lý nhà nước (heo đặc thù của lĩnh vực tài chính","p":[["D3.K1","k","Thực hiện nhiệm vụ của cơ quan, tô chức hỗ trợ doanh nghiệp nhỏ và vừa và được xác định là cơ quan, tổ chức hỗ trợ doanh nghiệp nhỏ và vừa theo quy định của pháp luật về doanh nghiệp nhỏ và vừa."],["D3.K2","k","Thực hiện nhiệm vụ mua sắm tài sản, phương tiện làm việc theo phương thức tập trung."],["D3.K3","k","Thực hiện hoạt động xúc tiến đầu tư."]],"u":34},{"n":"Điều 4","t":"Tiêu chí phân loại đơn vị sự nghiệp công lập theo ngành, lĩnh vực","p":[["D4.K1","k","Các đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính được phân loại theo các ngành, lĩnh vực sau: ©) Đơn vị sự nghiệp công lập thuộc lĩnh vực đấu thầu;"],["D4.K1.Đa","d","Đơn vị sự nghiệp công lập thuộc lĩnh vực hỗ trợ doanh nghiệp;"],["D4.K1.Đb","d","Đơn vị sự nghiệp công lập thuộc lĩnh vực xúc tiến đầu tư;"],["D4.K1.Đd","d","Đơn vị sự nghiệp công lập thuộc lĩnh vực kinh doanh bảo hiểm;"],["D4.K1.Đđ","d","Đơn vị sự nghiệp công lập thuộc lĩnh vực chứng khoán;"],["D4.K1.Đe","d","Đơn vị sự nghiệp công lập thuộc lĩnh vực giá;"],["D4.K8","k","Đơn vị sự nghiệp công lập thuộc các lĩnh vực tài chính khác."],["D4.K2","k","Các đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính có thể cung cấp dịch vụ sự nghiệp công của một hoặc nhiều ngành, lĩnh vực quy định tại khoản l Điều này."]],"u":38},{"n":"Điều 5","t":"Điều kiện thành lập đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính","p":[["D5.K1","k","Việc thành lập đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính phải đáp ứng các điều kiện theo quy định tại điểm a, c, d khoản 1 Điều 5 Nghị định số 299/2026/NĐ-CP ngày 28 tháng 7 năm 2026 của Chính phủ quy định tổ chức đơn vị sự nghiệp công lập."],["D5.K2","k","Ngoài các điều kiện chưng quy định tại khoản 1 Điều nảy, việc thành lập các đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính còn phải đáp ứng điều kiện khác theo quy định của pháp luật có liên quan (nếu có)."],["D5.K3","k","Mức độ tự chủ tài chính của đơn vị sự nghiệp công lập được thành lập mới phải đáp ứng yêu cầu theo quy định tại khoản 2 Điều 4 Nghị định số 299/2026/NĐ-CP."]],"u":47},{"n":"Điều 6","t":"Điều kiện tổ chức lại đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính","p":[["D6.K1","k","Việc tổ chức lại đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính được thực hiện khi thuộc một trong các trường hợp sau: 5 Nghị định số 299/2026/NĐ-CP; có thẩm quyển theo quy định của pháp luật hoặc nhằm nâng cao hiệu quá hoạt động cung cấp dịch vụ sự nghiệp công phục vụ xã hội, hỗ trợ thực hiện nhiệm vụ quản lý nhà nước của đơn vị sự nghiệp công lập."],["D6.K1.Đa","d","Thuộc một trong các trường hợp quy định tại điểm a, b, c khoản 2 Điều"],["D6.K1.Đb","d","Hai năm liên tiếp không hoàn thành nhiệm vụ theo đánh giá của cơ quan"],["D6.K2","k","Đơn vị sự nghiệp công lập hình thành sau khi tổ chức lại phải đáp ứng đủ điều kiện thành lập đơn vị sự nghiệp công lập quy định tại khoản 1, 2 Điều 5 Thông tư này và quy định pháp luật có liên quan."]],"u":51},{"n":"Điều 7","t":"Điều kiện giải thể đơn vị sự nghiệp công lập thuộc lnh vực tài chính","p":[["D7.K1","k","Việc giải thể đơn vị sự nghiệp công lập được thực hiện khi thuộc một trong các trường hợp sau: Điều 5 Nghị định số 299/2026/NĐ-CP; hoàn thành nhiệm vụ nhưng vẫn tiếp tục không hoàn thành nhiệm vụ theo đánh giá của cơ quan có thẩm quyền trong năm tiếp theo sau khi tổ chức lại."],["D7.K1.Đa","d","Thuộc một trong các trường hợp quy định tại điểm a, b, c, d khoản 3"],["D7.K1.Đb","d","Đơn vị sự nghiệp công lập đã tổ chức lại do hai năm liên tiếp không"],["D7.K2","k","Đơn vị sự nghiệp công lập chỉ thực hiện giải thể sau khi hoàn thành nghĩa vụ về tài chính, tài sản, đất đai, các khoản vay, nợ phải trả và các nghĩa vụ khác có liên quan và được cơ quan, tô chức có thẩm quyền xác nhận bằng văn bản. Điều §. Quy định chuyển tiếp Cơ quan, tổ chức đã gửi đề án, Tờ trình đến cơ quan hoặc người có thẩm quyền quyết định thành lập, tổ chức lại, giải thể đơn vị sự nghiệp công lập trước ngày Thông tư này có hiệu lực, nhưng chưa được cơ quan hoặc người có thẩm quyền ra quyết định thành lập, tổ chức lại, giải thể đơn vị sự nghiệp công lập thì tiếp tục thực hiện theo quy định của pháp luật về thành lập, tổ chức lại, giải thể đơn vị sự nghiệp công lập tại thời điểm gửi đề án, Tờ trình."]],"u":56},{"n":"Điều 9","t":"Hiệu lực thi hành","p":[["D9.K1","k","Thông tư này có hiệu lực thi hành kế từ ngày 01 tháng 12 năm 2026."],["D9.K2","k","Các Thông tư sau hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành: trưởng Bộ Tài chính quy định tiêu chí phân loại, điều kiện thành lập, sáp nhập, hợp nhất, giải thể đơn vị sự nghiệp công lập thuộc lĩnh vực tài chính; trưởng Bộ Kế hoạch và Đầu tư quy định tiêu chí phân loại, điều kiện thành lập, sáp nhập, hợp nhất, giải thể các đơn vị sự nghiệp công lập thuộc ngành, lĩnh vực kế hoạch, đầu tư và thống kê."],["D9.K2.Đa","d","Thông tư số 72/2023/TT-BTC ngày 01 tháng 12 năm 2023 của Bộ"],["D9.K2.Đb","d","Thông tư số 11/2024/TT-BKHĐT ngày 24 tháng 6 năm 2024 của Bộ"]],"u":61},{"n":"Điều 10","t":"Trách nhiệm thỉ hành","p":[["D10.K1","k","Các Bộ, cơ quan ngang Bộ, Ủy ban nhân dân các tỉnh, thành phố có trách nhiệm chỉ đạo tổ chức triển khai thực hiện Thông tư này."],["D10.K2","k","Thủ trưởng các đơn vị thuộc Bộ Tài chính, Giám đốc Sở Tài chính các tỉnh, thành phố, người đứng đầu đơn vị sự nghiệp công lập và các cơ quan, tổ chức có liên quan chịu trách nhiệm thi hành Thông tư này."],["D10.K3","k","Trường hợp các văn bản quy phạm pháp luật trích dẫn tại Thông tư này được sửa đổi, bỗ sung hoặc thay thế bằng văn bản quy phạm pháp luật khác thì áp dụng quy định tại văn bản sửa đổi, bổ sung hoặc thay thế."],["D10.K4","k","Trong quá trình thực hiện, nếu có khó khăn, vướng mắc, đề nghị các cơ quan, đơn vị phản ánh bằng văn bản về Bộ Tài chính để hướng dẫn, giải quyết theo quy la tt Nơi nhận: KT. BỘ TRƯỞNG - Ban Bí thư Trung ương Đảng; THỨ TRƯỞNG ~ Thủ tướng, các Phó Thủ tướng Chính phủ; ~ Văn phòng Trung ương và các Ban của Đảng; ~ Văn phòng Tổng Bí thư, Văn phòng Chủ tịch nước; ~ Văn phòng Quốc hội; ~ Văn phòng Chính phủ; ~ Viện Kiểm sát nhân dân tối cao; ~ Tòa án nhân dân tối cao; ~ Kiểm toán Nhà nước; ~ Các Bộ, cơ quan ngang Bộ; - Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam; ~ HĐND, UBND các tỉnh, thành phố; ~ Sở Tài chính các tỉnh, thành phô; ~ Cục Kiểm tra văn bản và Tô chức thi hành pháp luật (Bộ Tư pháp); ~ Công báo, Cổng TTĐT của Chính phủ; - Cơ sở dữ liệu quốc gia về văn bản pháp luật; - Cổng TTĐT của Bộ Tài chính; ~ Các đơn vị thuộc Bộ Tài chính; - Lưu: VT, TCCB ( {00 bản)/"]],"u":66}],"156/2026/TT-BTC":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Luật Phí và lệ phí số 97/2015/QH13;"],["CC1","c","Căn cứ Luật Dữ liệu số 60/2024/QH15;"],["CC2","c","Căn cứ Luật Giao dịch điện tử số 20/2023/QH15,"],["CC3","c","Căn cứ Luật Ngân sách nhà nước số 89/2025/QH15,"],["CC4","c","Căn cứ Luật Quản lý thuế số 108/2025/QH15,"],["CC5","c","Căn cứ Nghị định số 362/2025/NĐ-CP của Chính phủ quy định chỉ tiết một số điều và biện pháp để tô chức, hướng dẫn thị hành Luật Phí và lệ phí;"],["CC6","c","Căn cứ Nghị định số 165/2025/NĐ-CP của Chính phủ quy định chỉ tiết một số điều và biện pháp thi bành Luật Dữ liệu;"],["CC7","c","Căn cứ Nghị định số 194/2025/NĐ-CP của Chính phủ quy định chỉ tiết một số điều của Luật Giao dịch điện tử về cơ sở dữ liệu quốc gia, kết nỗi và chia sẻ đữ liệu, dữ liệu mở phục vụ giao dịch điện tử của cơ quan nhà nước;"],["CC8","c","Căn cứ Nghị định số 278/2025/NĐ-CP của Chính phú quy định về kết nói, chia sẻ đữ liệu bắt buộc giữa các cơ quan thuộc hệ thông chính trị;"],["CC9","c","Căn cứ Nghị định số 252/2026/NĐ-CP của Chính phủ quy định chỉ tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Quản lý thuế;"],["CC10","c","Căn cứ Nghị định số 254/2026/NĐ-CP của Chính phú quy định chỉ tiết một số điều và biện pháp để tô chức, hướng dẫn thì hành Luật Quản lý thuế số 108/2025/QH15 về hóa đơn điện tử, chứng từ điện tử;"],["CC11","c","Căn cứ Nghị định số 347/2025/NĐ-CP của Chính phủ quy định về thủ tục hành chính thuộc lĩnh vực Kho bạc Nhà nước;"],["CC12","c","Căn cứ Nghị định số 376/2026/NĐ-CP của Chính phủ quy định chức năng, nhiệm vụ, quyên bạn và cơ cầu tổ chức của .Bộ Tài chỉnh; 2 Theo đè nghị của Vụ trưởng Vụ Chính sách thuế, phí và lệ phí; Bộ trưởng Bộ Tài chính ban hành Thông tư quy định mức thu, giảm, chế độ thu, nộp phí khai thác và sử dụng thông tin trong Cơ sở dữ liệu tổng hợp quốc gia."]],"u":0},{"n":"Điều 1","t":"Phạm vi điều chính và đối tượng áp dụng","p":[["D1.K1","k","Thông tư này quy định về mức thu, giảm, chế độ thu, nộp phí khai thác và sử dụng thông tin trong Cơ sở dữ liệu tổng hợp quốc gia."],["D1.K2","k","Thông tư này áp dụng đối với người nộp phí, tổ chức thu phí khai thác và sử dụng thông tin trong Cơ sở dữ liệu tổng hợp quốc gia và các tổ chức, cá nhân khác có liên quan đến thu, nộp phí khai thác và sử dụng thông tin trong Cơ sở dữ liệu tông hợp quốc gia."]],"u":71},{"n":"Điều 2","t":"Người nộp phí và tỗ chức thu phí","p":[["D2.K1","k","Tổ chức, cá nhân khi yêu cầu khai thác và sử dụng thông tin trong Cơ sở đữ liệu tổng hợp quốc gia theo quy định của pháp luật là người nộp phí khai thác và sử dụng thông tin trong Cơ sở dữ liệu tông hợp quốc gia theo quy định tại Thông tư này, trừ các trường hợp không phái nộp phí theo quy định của pháp luật về dữ liệu và pháp luật về giao dịch điện tử."],["D2.K2","k","Trung tâm Dữ liệu quốc gia là tổ chức thu phí theo quy định tại Thông tư này. Điều 3, Mức thu phí 1, Kế từ ngày Thông tư này có hiệu lực thi hành đến hết ngày 31 tháng 12 năm 2028, mức thu phí khai thác và sử dụng thông tin trong Cơ sở đữ liệu tổng hợp quốc gia là 300 đồng/trường dữ liệu."],["D2.K2~2","k","Kể từ ngày 01 tháng 01 năm 2029 trở đi, mức thu phí khai thác và sử dụng thông tin trong Cơ sở đữ liệu tổng hợp quốc gia là 600 đồng/trường dữ liệu."]],"u":74},{"n":"Điều 4","t":"Các trường hợp được giảm phí","p":[["D4.K1","k","Cá nhân khai thác và sử dụng thông tin trong Cơ sở dữ liệu tổng hợp quốc gia được giảm 50% mức thu phí quy định tại Điều 3 Thông tư này khi thuộc một trong các trường hợp sau:. 3 người có công với cách mạng; biệt khó khăn theo quy định của pháp luật. 2, Cá nhân thuộc từ hai trường hợp quy định tại khoản 1 Điều này trở lên thì chỉ được giảm 50% mức thu phí khai thác và sử dụng thông tin trong Cơ sở dữ liệu tổng hợp quốc gia."],["D4.K1.Đa","d","Trẻ em theo quy định của pháp luật về trẻ em;"],["D4.K1.Đb","d","Cá nhân thuộc hộ nghèo theo quy định của pháp luật về chuẩn nghẻo;"],["D4.K1.Đc","d","Người cao tuổi theo quy định của pháp luật về người cao tuổi;"],["D4.K1.Đđ","d","Người khuyết tật theo quy định của pháp luật về người khuyết tật;"],["D4.K1.Đđ~2","d","Người có công với cách mạng theo quy định của pháp luật về ưu đãi"],["D4.K1.Đe","d","Đồng bảo dân tộc thiểu số ở các xã có điều kiện kinh tế - xã hội đặc"]],"u":78},{"n":"Điều 5","t":"Khai, thu, nộp, quyết toán và hoàn trã phí","p":[["D5.K1","k","Người nộp phí nộp tiền phí vào ngân sách nhà nước theo hình thức quy định tại khoản 1 Điều 3 Nghị định số 362/2025/NĐ-CP quy định chỉ tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Phí và lệ phí."],["D5.K2","k","Tổ chức thu phí nộp 100% số tiền phí thu được vào ngân sách nhà nước theo chương, tiểu mục của Mục lục ngân sách nhà nước hiện hành, bao gồm tiền lãi phát sinh (nếu có) trên số dư tài khoản liên quan trong quá trình thu phí. Nguồn chi phí trang trải cho hoạt động cung cấp dịch vụ, thu phí được ngân sách nhà nước bố trí trong dự toán của tổ chức thu phí theo chế độ, định mức chỉ ngân sách nhà nước theo quy định của pháp luật. Tổ chức thu phí khai, nộp và quyết toán phí theo quy định tại khoản 3 Điều 3 Nghị định số 362/2025/NĐ-CP,"],["D5.K3","k","Trường hợp người nộp phí đã nộp phí nhưng không được cung cấp hoặc chỉ được cung cấp một phân thông tin theo yêu cầu đã thanh toán hoặc phát sinh giao dịch thu trùng, thu vượt mức quy định, tổ chức thu phí có trách nhiệm kiểm tra, đối soát, xác định số tiền phí được hoản trả và hoàn trả cho người nộp phí theo quy định của pháp luật về quản lý thuế."]],"u":86},{"n":"Điều 6","t":"Hiệu lực thi hành","p":[["D6.K1","k","Thông tư này có hiện lực thi hành từ ngày 01 tháng 11 năm 2026."],["D6.K2","k","Các nội dung khác liên quan đến việc khai, thu, nộp, công khai chế độ thu phí không quy định tại Thông tư này được thực hiện theo quy định tại các văn bản: Luật Phí và lệ phí số 97/2015/QH13; Luật Quản lý thuế số 108/2025/QH15; Nghị định số 252/2026/NĐ-CP quy định chỉ tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Quản lý thuế; Nghị định số 254/2026/NĐ-CP quy định chỉ tiết một số điều và biện pháp để tổ chức, hưởng dẫn thi hành Luật Quản lý thuế số 108/2025/QH15 về hóa đơn điện tử, chứng từ điện tử; Nghị định số 362/2025/NĐ-CP; Nghị định số 347/2025/NĐ-CP quy định về thủ tục hành chính thuộc lĩnh vực Kho bạc Nhà nước. 4"],["D6.K3","k","Trường hợp các văn bản viện dẫn tại Thông tư này được sửa đổi, bổ sung hoặc thay thế thì thực hiện theo văn bản sửa đổi, bổ sung hoặc thay thế đó."],["D6.K4","k","Trong quá trình thực hiện, trường hợp có vướng mắc, đề nghị các tổ chức, cá nhân phản ánh kịp thời về Bộ Tài chính để nghiên cứu, hướng dẫn bổ sung./. Nơi nhận: KT. BỘ TRƯỞNG - Ban Bí thư Trung ương Đảng; HỨ TRƯỞNG ~ Thủ tướng, các Phó Thủ tướng Chính phủ; ~ Văn phòng Trung ương Đảng và các Ban của Đảng; ~ Văn phòng Tổng Bí thư; ~ Văn phòng Quốc hội; - Hội đồng Dân tộc; ~ Ủy ban Kinh tế và Tài chính; ~ Văn phòng Chủ tịch nước; ~ Viện kiểm sát nhân dân tối cao; ~ Toà án nhân dân tối cao; ~ Kiểm toán nhà nước; ~ Cơ quan trung ương của các đoàn thể; ~ Các bộ, cơ quan ngang bộ; - HĐND, UBND các tỉnh, thành phố trực thuộc trung ương; ~ Sở Tài chính các tỉnh, thành phô trực thuộc trung ương; ~ Thuế các tỉnh, thành phố trực thuộc trung ương; ~ Kho bạc Nhà nước các khu vực; - Cục Kiểm tra văn bản và Tổ chức thi hành pháp luật, Bộ Tư pháp; ~ Công báo; ~ Cổng Thông tin điện tử Chính phủ; - Cơ sở dữ liệu quốc gia về pháp luật; - Bộ trưởng (để báo cáo); ~ Cổng Thông tin điện tử Bộ Tài chính; - Các đơn vị thuộc Bộ Tài chính; - Lưu: VT, CST (170b)/j„⁄"]],"u":90}],"17/2026/QH16":[{"n":"Căn cứ","t":"Phần mở đầu","p":[["CC0","c","Căn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đổi, bồ sung một số điều theo Nghị quyết số 203/2025%/QH15; Quốc hội ban hành Luật sửa đổi, bổ sung một số điều của Luật Xuất bản số 19/2012/QH13 đã được sửa đối, bổ sung một số điều theo Luật số 33⁄2018/QH14 và Luật số 112/2025/QH15."]],"u":0},{"n":"Đoạn","t":"","p":[["p1.para1","o","Kến Đan giữ 3g công bao QUÓC HỘI CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM Độc lập - Tự do - Hạnh phúc Luật số: 17/2026/QH16 LUẬT SỬA ĐÓI, BÓ SUNG MỘT SÓ ĐIỀU CỦA LUẬT XUÁT BẢN Căn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam đã được sửa đổi, bồ sung một số điều theo Nghị quyết số 203/2025%/QH15; Quốc hội ban hành Luật sửa đổi, bổ sung một số điều của Luật Xuất bản số 19/2012/QH13 đã được sửa đối, bổ sung một số điều theo Luật số 33⁄2018/QH14 và Luật số 112/2025/QH15."]],"u":95},{"n":"Điều 1","t":"Sửa đỗi, bỗ sung một số điều của Luật Xuất bản","p":[["D1.K1","k","Sửa đổi, bỗ sung Điều 1 như sau: “Điều 1. Phạm vi điều chính ˆ Luật này quy định về tổ chức và hoạt động xuất bản; quyền và nghĩa vụ của cơ quan, tô chức, cá nhân tham gia và có liên quan đến hoạt động xuất bản; quản lý nhà nước về hoạt động xuất bản. Hoạt động xuất bản bao gồm các lĩnh vực xuất bản, in và phát hành xuất bản phẩm.”."],["D1.K2","k","Sửa đổi, bố sung Điều 3 như sau: “Điều 3. Vị trí, mục đích và nguyên tắc của hoạt động xuất bản 1. Hoạt động xuất bản thuộc lĩnh vực văn hóa, tư tưởng của Đảng, Nhà nước và Nhân dân; đồng thời là ngành kinh tế - - công nghệ, bộ phận quan trọng của công nghiệp văn hóa và hạ tầng tri thức quốc gia. 2. Hoạt động xuất bản nhằm tuyên truyền, bảo vệ nền tảng tư tưởng và chủ trương, đường lối của Đảng, chính sách, pháp luật của Nhà nước; phổ biến, giới thiệu tri thức, nâng cao dân trí; giữ gìn tiếng nói, chữ viết; bảo tồn và phát huy bản sắc, giá trị văn hóa, giá trị con người Việt Nam; tiếp thu tỉnh hoa văn hóa nhân loại, nâng cao vị thế văn hóa dân tộc; góp phần bảo đảm an ninh chính trị, trật tự, an toàn xã hội, bảo vệ Tổ quốc và chủ quyền quốc gia. 3. Đảng và Nhà nước giữ vai trò chủ đạo trong định hướng và kiến tạo phát triển hoạt động xuất bản, xây dựng nền xuất bản . chuyên nghiệp, nhân văn, hiện đại; Nhà nước ban hành và tổ chức thực hiện cơ chế, chính sách tạo môi trường cạnh tranh lành mạnh, bình đẳng, thúc đây hợp tác công tư, đổi mới sáng tạo, ứng dụng khoa học, công nghệ, chuyên đổi số và hội nhập quốc tế, khuyến khích, thu hút, tạo điều kiện _——— - ẮX „ .. __ Ũ + ` ` 2 để các thành phần kinh tế tham gia phát triển hoạt động xuất bản, phát triển văn hóa đọc. 4. Cơ quan, tổ chức, cá nhân tham gia hoạt động xuất bản có trách nhiệm tuân thủ pháp luật; bảo vệ lợi ích quốc gia, dân tộc; thực hiện chính sách của Nhà nước, chuẩn mực đạo đức xã hội, đạo đức nghề nghiệp; tôn trọng quyền và lợi ích hợp pháp của tổ chức, cá nhân.”."],["D1.K3","k","Sửa đổi, bổ sung Điều 4 như sau: “Điều 4. Giải thích từ ngữ Trong Luật này, các từ ngữ dưới đây được hiểu như sau: 1. Xuất bản là quá trình do nhà xuất bản hoặc cơ quan, tổ chức được phép xuât bản thực hiện nhắm tạo thành bản mẫu đê ¡n xuât bản phẩm hoặc tạo lập xuât bản phâm điện tử, bao gôm các công đoạn sau đây: a) Khai thác và tổ chức bản thảo là việc tìm kiếm, tạo lập, tiếp nhận, lựa chọn, đặt hàng, nhận chuyển giao, quyền sử dụng hoặc quản lý và hoàn thiện bản thảo nhằm chuẩn bị cho quá trình xuất bản; _b)} Biên tập là việc thẩm định, chỉnh sửa, hoàn thiện nội dung, hình thức bản thảo, bảo đảm chât lượng, tính chính xác và tuân thủ quy định của pháp luật; c) Thiết kế và chế bản là việc trình bày, thiết kế mỹ thuật, kỹ thuật để tạo thành bản mâu để in xuât bản phâm hoặc tệp xuât bản phâm điện tử; d) Quyết định xuất bản là văn bản của người có thâm quyền của nhà xuất bản hoặc cơ quan, tô chức được phép xuât bản phê duyệt bản mẫu đề làm căn cứ in xuât bản phẩm hoặc tạo lập xuât bản phâm điện tử. 2. Nhà xuất bản là tỗổ chức được thành lập theo quy định của Luật này, có chức năng thực hiện việc xuât bản xuât bản phẩm và chịu trách nhiệm trước pháp luật về nội dung, chất lượng và tính hợp pháp của xuất bản phẩm do mình xuất bản. 3. Bản thảo là bản viết tay, đánh máy hoặc dữ liệu số của một tác phẩm, tài liệu đê xuât bản. 4. Bản mẫu là bản hoàn chỉnh của tác phẩm, tài liệu sau khi được biên tập, được phê duyệt băng quyết định xuât bản và làm căn cứ đê in xuât bản phẩm hoặc tạo lập xuât bản phẩm điện tử. 5. Xuất bản phẩm là tác phẩm, tài liệu về chính trị, kinh tế, văn hóa, xã hội, quốc phòng, an ninh, giáo dục và đào tạo, khoa học, công nghệ, văn học, nghệ thuật được xuất bản thông qua nhà xuất bản, cơ quan, tổ chức được phép ' xuất bản tại Việt Nam hoặc được nhập khẩu vào Việt Nam theo quy định của Luật này; được thể hiện bằng ngôn ngữ, hình ảnh, âm thanh hoặc kết hợp các hình thức này, bao gồm: a) Xuất bản phẩm in được thể hiện dưới dạng vật chất, gồm sách in, sách chữ nỗi, tranh, ảnh, bản đồ, áp-phích, tờ rời, tờ gấp, các loại lịch; 3 b) Xuất bản phẩm điện tử được tạo lập trực tiếp dưới dạng dữ liệu số hoặc được số hóa từ xuất bản phẩm in, sử dụng thông qua phương tiện điện tử, gồm sách điện tử (sách chữ, sách nói, sách kết hợp văn bản, âm thanh, hình ảnh, video và các yêu tổ đa phương tiện) và các hình thức điện tử khác theo quy định của pháp luật. 6. Lưu chiếu là việc tiếp nhận và lưu giữ xuất bản phẩm in hoặc tệp điện tử của xuất bản phẩm điện tử để Bộ Văn hóa, Thể thao và Du lịch, Ủy ban nhân dân cấp tỉnh thực hiện quản lý nhà nước. 7. In xuất bản phẩm là việc sử dụng thiết bị trong các công đoạn chế bản, in và gia công sau in để tạo ra xuất bản phẩm từ bản mẫu. §. Cơ sở in xuất bản phẩm (sau đây gợi là cơ sở in) là tổ chức, đơn vị thực hiện toàn bộ hoặc từng công đoạn chê bản, in, gia công sau in xuất bản phẩm. 9. Phát hành xuất bản phẩm là việc đưa xuất bản phẩm. đến người sử dụng theo một hoặc nhiều hình thức bán, cho thuê, xuất khâu, nhập khâu, tham gia hội chợ, phân phối qua đại lý, ký gửi hoặc hình thức khác nhằm mục đích kinh doanh (sau đây gọi là kinh doanh phát hành xuất bản phẩm); phân phát, tặng cho, cho mượn, triển lãm, lưu hành nội bộ, viện trợ, tặng kèm không thu tiền và các hình thức khác không nhằm mục đích kinh doanh (sau đây gọi là phát hành xuất bản phẩm không nhằm mục đích kinh doanh). 10. Cơ sở kinh doanh phát hành xuất bản phẩm (sau đây gọi là cơ sở phát hành) là tổ chức, đơn vị thực hiện một hoặc nhiều hình thức kinh doanh xuất bản phẩm quy định tại khoản 9 Điều này. 11. Cơ sở cung cấp dịch vụ trung gian phát hành xuất bản phẩm là tỗ chức, đơn vị cung cấp nền tảng số theo quy định của pháp luật về thương mại điện tử để kết nối hoặc hỗ trợ giao dịch giữa cơ sở phát hành, cá nhân kinh doanh xuất bản phẩm với người sử dụng dịch vụ. 12. Cơ sở kinh doanh nhập khẩu xuất bản + phẩm (sau đây gọi là cơ sở nhập khẩu) là tổ chức, đơn vị trực tiếp thực hiện nhập khâu xuất bản phẩm để kinh doanh. 13. Người đứng đầu cơ sở in, cơ sở phát hành là người đại diện theo pháp luật và trực tiếp quản lý, điều hành hoạt động của cơ sở. 14. Biên tập viên là người làm công tác biên tập tại nhà xuất bản. 15. Sản phẩm thông tin có tính chất xuất bản phẩm trên không gian mạng là tác phẩm, tài liệu của tổ chức, cá nhân tạo lập có hình thức thể hiện tương tự xuất bản phẩm điện tử quy định tại điểm b khoản 5 Điều này để phố biến đến công chúng mà không thực hiện xuất bản, phát hành, nhập khẩu theo quy định của Luật này. sản phẩm thông tỉn có tính chất xuất bản phẩm trên không gian mạng không bao gồm sản phẩm báo chí, tác phẩm điện ảnh, sản phẩm quảng cáo, chương trình phát thanh, truyền hình và các loại thông tin khác theo quy định của pháp luật. 16. In nối bản trái phép xuất bản phẩm là hành vì sử dụng thiết bị chế bản, 4 in, gia công sau in để in thêm xuất bản phẩm vượt quá số lượng được phép theo văn bản xác nhận đăng ký kế hoạch xuất bản, quyết định xuất bản, giấy phép xuất bản tài liệu không kinh doanh, giấy phép in xuất khẩu theo quy định của Luật này. 17. In lậu xuất bản phẩm là hành vì sử dụng thiết bị chế bản, in, gia công sau in đề i in xuất bản phẩm đã được xuất bản hợp pháp khi không có một trong các giấy tờ quy định tại khoản 16 Điều này hoặc không được phép của chủ sở hữu quyền tác giả theo quy định của pháp luật về sở hữu trí tuệ. 18. In giả xuất bản phẩm là hành vì sử dụng bản thảo tác phẩm hoặc tài liệu để thực hiện một hoặc các công đoạn chế bản, in, gia công sau in, tạo ra sản phẩm có hình thức và nội dung gây nhằm lẫn là xuất bản phẩm theo quy định của Luật này.”"],["D1.K4","k","Sửa đổi, bổ sung Điều 6 như sau: “Điều 6. Quản lý nhà nước về hoạt động xuất bản 1. Nội dung quản lý nhà nước về hoạt động xuất bản bao gồm: a) Thực hiện các nhiệm vụ chung về quản lý nhà nước liên quan đến hoạt động xuất bản theo quy định của pháp luật; b) Quản lý việc đăng ký kế hoạch xuất bản; , Cấp, cấp lại, thu hồi chứng chỉ hành nghề biên tập, giây phép thành lập nhà xuất bản, giấy phép hoạt động in xuất bản phẩm; cấp, điều chỉnh văn bản xác nhận đăng ký; c) Quản lý xuất bản phẩm lưu chiều; “quyết định việc buộc sửa chữa mới được phát hành, đình chỉ phát hành, thu hồi, tịch thu, cm lưu hành, tiêu hủy xuất bản phẩm vi phạm theo quy định của pháp luật; d) Xây dựng, quản lý, vận hành và kết nối, chia sẻ đữ liệu trong hoạt động xuất bản theo quy định của pháp luật; bảo đảm việc thực hiện quyên, nghĩa vụ và thủ tục trong hoạt động xuất bản bằng phương tiện điện tử theo quy định của pháp luật về giao dịch điện tử, trừ trường hợp pháp luật có quy định khác; đ), Tổ chức phối hợp liên ngành trong phòng, chống in nối bản trái phép, in lậu, in giả xuất bản phẩm, xâm phạm quyền sở hữu trí tuệ; quản lý xuất bản phẩm liên quan đến quốc phòng, an ninh, bí mật nhà nước theo quy định của pháp luật về bảo vệ bí mật nhà nước, an ninh mạng và quy định khác của pháp luật có liên quan; e) Tổ chức thực hiện các hoạt động phát triển thị trường xuất bản, phát triển văn hóa đọc, quảng bá xuất bản phẩm theo quy định của pháp luật; ø) Quản lý, hướng dẫn hoạt động của các hội, hiệp hội trong lĩnh vực xuất bản, ¡n và phát hành theo quy định của pháp luật; bảo vệ quyền và lợi ích hợp pháp của người làm công tác xuất bản theo quy định của pháp luật; h) Thanh tra, kiểm tra và xử lý vi phạm về hoạt động xuất bản, phổ biến sản phẩm thông tin có tính chất xuất bản phẩm trên không gian mạng theo quy định của pháp luật. 2. Chính phủ thống nhất quản lý nhà nước về hoạt động xuất bản trong phạm vi cả nước. Bộ Văn hóa, Thê thao và Du lịch chịu trách nhiệm trước 5 Chính phủ thực hiện quản lý nhà nước về hoạt động xuất bản. Độ, cơ quan ngang bộ và Ủy ban nhân dân các cấp thực hiện quản lý nhà-nước về hoạt động xuất bản theo thẩm quyền.”"],["D1.K5","k","Sửa đổi, bổ sung Điều 7 như sau: “Điều 7. Chính sách của Nhà nước về phát triển hoạt động xuất bản 1. Miễn, giảm thuế, tiền thuê đất, thuê bất động sản là tài sản công đối với nhà xuất bản theo quy định của pháp luật. 2. Xây dựng và phát triển Các cơ quan xuất bản, truyền thông chủ lực quốc gia và hình thành các tập đoàn xuất bản, truyền thông đa nền tảng, đa sản phẩm. 3. Đầu tư xây dựng, phát triển hệ thống thông tin, cơ sở dữ liệu chuyên ngành phục vụ quản lý nhà nước, chuyển đôi sô và phát triển thị trường xuất bản; đâu tư phát triển xuất bản và phát hành xuất bản phẩm điện tử, ứng dụng trí tuệ nhân tạo vào hoạt động xuất bản theo quy định của pháp luật về đầu tư và quy định khác của pháp luật có liên quan; ưu tiên, bố trí quỹ đất cho hoạt động xuất bản. 4. Đặt hàng, giao nhiệm vụ, đấu thầu để xuất bản, in, phát hành xuất bản phẩm và mua, hỗ trợ chỉ phí vận chuyển xuất bản phẩm phục vụ nhiệm vụ chính trị, quốc phòng, an nỉnh, thông tin đối ngoại, ứng phó tình trạng khẩn cấp, phòng, chống thiên tai, dịch bệnh và các nhiệm vụ trọng yêu khác của đất nước; xuất bản phẩm phục vụ đồng bào dân tộc thiểu số (tiếng Việt và tiếng dân tộc), miền núi, biên giới, hải đảo, vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn; xuất bản phẩm dành cho trẻ em, người khuyết tật nhìn và các đối tượng yếu thế khác theo quy định của pháp luật. 5. Ưu đãi thuế, tín dụng đối với cơ sở ịn đầu tư đổi mới công nghệ, hiện đại hóa thiết bị, ứng dụng công nghệ xanh, kinh tế tuần hoàn; đối với cơ sở phát hành và doanh nghiệp đầu tư phát triển hạ tầng số, mạng lưới phân phối xuất bản phẩm phục vụ các đối tượng, địa bàn quy định tại khoản 4 Điều này. : 6. Hỗ trợ nhà xuất bản mua bản quyển, dịch thuật, biên Soạn, xuất bản, phát hành xuất bản phẩm có giá trị phục vụ nhiệm vụ chính trị, phát triển văn hóa, giáo dục, khoa học, công nghệ, hội nhập quốc : tế; hỗ trợ xuất bản, phát hành xuất bản phẩm điện tử phục vụ đồng bào dân tộc thiểu số và nâng cao khả năng tiếp cận, khai thác và sử dụng xuất bản phẩm điện tử; hỗ trợ xúc tiến thương mại, truyền thông, quảng bá xuất bản phẩm trong nước và ra nước ngoài. 7. Đào tạo, bồi dưỡng, cập nhật kiến thức, kỹ năng chuyên môn, nghiệp vụ cho đội ngũ làm công tác xuất bản, in và phát hành xuất bản phẩm; thu hút, trọng dụng và phát triển nguồn nhân lực chất lượng cao đáp ứng yêu cầu chuyên đổi số, hội nhập quốc tế và phát triển hoạt động xuất bản; khuyến khích liên kết giữa cơ sở đào tạo với nhà xuât bản, cơ sở in, cơ sở phát hành trong đào tạo, bồi dưỡng và phát triển nguồn nhân lực. §. Khuyến khích phát triển không gian đọc, thư viện, tủ sách và các mô hình đọc trong cộng đồng, trong cơ quan, tổ chức, đơn vị, nhà trường; ứng dụng công nghệ số 6 phục vụ ¡tiếp cận xuất bản phẩm, huy động các nguồn lực để đầu tư, tài trợ phát triển ._ văn hóa đọc theo quy định của pháp luật; tôn vinh, khen thưởng tô chức, đơn vị, cá nhân có đóng góp trong hoạt động xuất bản và phát triển văn hóa đọc; trao giải thưởng đối với xuất bản phẩm có giá trị. -9. Thu hút các nguồn lực xã hội tham gia hoạt động xuất bản; tăng cường hợp tác đâu tư theo phương thức đôi tác công tư giữa nhà xuât bản với cơ sở in, cơ sở phát hành và các tô chức, cá nhân theo quy định của pháp luật. 10. Phát huy vai trò của hội, hiệp hội trong lĩnh vực xuất bản, in, phát hành, thực hiện tuyên truyền, phê biến pháp luật; góp ý, phản biện chính sách trong xây dựng pháp luật; phát triển văn hóa đọc, phát triển thị trường xuất bản và các nhiệm vụ khác theo quy định của pháp luật.”."],["D1.K6","k","Sửa đối, bổ sung khoản 2 Điều 10 như sau: “2. Nghiêm cắm thực hiện các hành vi sau đây: a) Xuất bản, in, phát hành xuất bản phẩm, cung cấp dịch vụ trung gian phát hành xuât bản phẩm hoặc đăng, phát sản phẩm thông tin có tính chât xuât bản phẩm trên không gian mạng có nội dung quy định tại các điêm a, b, c và d khoản l Điêu này; b) Xuất bản, in, phát hành xuất bản phẩm, cung cấp dịch vụ trung gian phát hành hoặc phát tán trên không gian mạng xuât bản phâm đã bị đình chỉ phát hành, thu hôi, tịch thu, câm lưu hành, tiêu hủy, nhập khẩu trái phép; c) In nối bản trái phép xuất bản phẩm; in lậu xuất bản phẩm; in giả xuất bản phẩm; d) Tàng trữ để phát hành hoặc phát hành xuất bản phẩm do in nối bản trái phép, 1n lậu, In giả; 4) Phát hành bản in sản phẩm thông tin có tính chất xuất bản phẩm trên không gian mạng, trừ trường hợp in để phục vụ nghiên cứu hoặc mục đích khác theo quy định của pháp luật; e) Lợi dụng trí tuệ nhân tạo để thực hiện hành vi vi phạm pháp luật trong hoạt động xuât bản; ø) Đăng, phát sản phẩm thông tin có tính chất xuất bản phẩm trên không gian mạng dưới dạng sách; h) Ðe dọa tính mạng, sức khỏe, uy hiếp tỉnh thần, xúc phạm uy tín, danh dự, nhân phâm hoặc cản trở trái pháp luật hoạt động nghệ nghiệp của biên tập viên, người làm công tác xuât bản.”."],["D1.K7","k","Sửa đổi, bố sung Điều 12 như sau: “Điều 12. Đối tượng thành lập và loại hình tổ chức nhà xuất bản 1. Cơ quan, tổ chức sau đây được thành lập nhà xuất bản (sau đây gọi là cơ quan chủ quản nhà xuât bản): 7 a) Bộ, cơ quan ngang bộ, Ủy ban nhân dân cấp tỉnh, tổ chức chính trị ở trung ương và cấp tỉnh, tổ chức chính trị - xã hội ở trung ương và cấp tỉnh. Trường hợp Ủy ban nhân dân cấp tỉnh không thành lập nhà xuất bản thì cơ quan chuyên môn về văn hóa thuộc Ủy ban nhân dân cấp tỉnh được thành lập nhà xuất bản; b) Đơn vị sự nghiệp công lập ở trung ương; hội quần chúng do Đảng, Nhà nước giao nhiệm vụ ở trung ương trực tiếp sáng tạo tác phẩm, tài liệu khoa học, học thuật; c) Cơ sở giáo dục đại học công lập trực thuộc bộ, cơ quan ngang bộ. 2. Nhà xuất bản tổ chức và hoạt động theo loại hình đơn vị sự nghiệp công lập hoặc doanh nghiệp do Nhà nước nắm giữ 100% vốn điều lệ.” §. Sửa đổi, bổ sung Điều 14 như sau: __ “Điều 14. Cấp, cấp lại, thu hồi giấy phép thành lập, đình chỉ hoạt động xuất bản của nhà xuất bản"],["D1.K1~2","k","Trước khi thành lập nhà xuất bản, cơ quan, tổ chức quy định tại các điểm a, b và c khoản Ì Điều 12 của Luật này lập hồ sơ đề nghị Bộ Văn hóa, Thể thao và Du lịch cấp giấy phép thành lập nhà xu
