<title>Soi Luật 1.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Chỉ cho bản xem Artifact. App thật nhúng Be Vietnam Pro (woff2, OFL) trong static/fonts, không kết nối ra ngoài. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Mẫu giao diện Soi Luật 1.0 (P1), dựng lại theo taste-skill, kiểu "achromatic ledger" cho màn hình làm việc.
   Bố cục: sidebar lịch sử trên nền giấy | luồng hỏi đáp ở giữa | trình đọc văn bản mở bên phải.
   Màu duy nhất trên dữ liệu là "bút bi xanh": gạch dưới từ khớp, tô và vạch lề đoạn được dẫn. Khung chỉ có mực. */
:root {
  --ground: #f4f4f1;   /* giấy Công báo */
  --surface: #ffffff;
  --raised: #ecece8;
  --active: #e6e6e1;
  --border: #e2e2dd;
  --rule: #eeeeea;
  --control: #cfcfc9;
  --text: #121211;
  --muted: #585854;
  --faint: #66665f;
  --primary: #171716;
  --on-primary: #ffffff;
  --pen: #1d5fbf;       /* bút bi xanh: dữ liệu khớp */
  --pen-tint: #e9f0fb;
  --pos-bg: #dcfae5; --pos-ink: #0b3d1c;
  --neg-bg: #ffedea; --neg-ink: #831c1e; --neg: #c4242a;
  --warn-bg: #fffbeb; --warn-ink: #8a3b0c; --warn-line: #f5d77a;
  --neu-bg: #ebebe7; --neu-ink: #3d3d3a;
  --page: #ffffff; --page-ink: #262624;
  --shadow: 0 10px 30px rgba(0,0,0,.12);
  --font: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fs-title: 22px; --fs-h2: 16px; --fs-body: 14px; --fs-read: 16px; --fs-small: 12px;
  --r-card: 8px; --r-ctl: 6px; --r-chip: 4px;
  --side-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f0f0e; --surface: #181817; --raised: #222220; --active: #2a2a28;
    --border: #2c2c2a; --rule: #232321; --control: #4a4a46;
    --text: #f1f1ed; --muted: #b6b6b0; --faint: #a0a09a;
    --primary: #f1f1ed; --on-primary: #121211;
    --pen: #84adf0; --pen-tint: #1b2639;
    --pos-bg: #16291d; --pos-ink: #7fd6a0; --neg-bg: #2e1a1d; --neg-ink: #f19aa3; --neg: #ef7a86;
    --warn-bg: #2b2414; --warn-ink: #f0c56b; --warn-line: #5c4a1c;
    --neu-bg: #262624; --neu-ink: #d0d0ca;
    --page: #1e1e1c; --page-ink: #e4e4df;
    --shadow: 0 10px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0f0f0e; --surface: #181817; --raised: #222220; --active: #2a2a28;
  --border: #2c2c2a; --rule: #232321; --control: #4a4a46;
  --text: #f1f1ed; --muted: #b6b6b0; --faint: #a0a09a;
  --primary: #f1f1ed; --on-primary: #121211;
  --pen: #84adf0; --pen-tint: #1b2639;
  --pos-bg: #16291d; --pos-ink: #7fd6a0; --neg-bg: #2e1a1d; --neg-ink: #f19aa3; --neg: #ef7a86;
  --warn-bg: #2b2414; --warn-ink: #f0c56b; --warn-line: #5c4a1c;
  --neu-bg: #262624; --neu-ink: #d0d0ca;
  --page: #1e1e1c; --page-ink: #e4e4df;
  --shadow: 0 10px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--text); font: 400 var(--fs-body)/1.5 var(--font); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
mark.m { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--pen); text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-skip-ink: none; }

/* ---------- Khung ---------- */
.app { height: 100%; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app.reading { grid-template-columns: var(--side-w) minmax(0, 1fr) clamp(520px, 46vw, 720px); }
.topbar { display: none; }

/* ---------- Nút ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--control); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--neg); border-color: var(--neg); background: var(--surface); }
.btn.text { border-color: transparent; background: none; padding: 0 8px; }
.btn.text:hover { background: var(--raised); }
.btn:disabled, .btn.primary:disabled { color: var(--faint); background: var(--raised); border-color: var(--border); cursor: default; opacity: 1; }
.icon-btn { width: 32px; height: 32px; flex: none; border-radius: var(--r-ctl); border: 0; background: none; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--raised); color: var(--text); }
.link { border: 0; background: none; padding: 0; color: var(--text); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--control); }
.link:hover { text-decoration-color: var(--text); }

/* ---------- Sidebar ---------- */
.side { display: flex; flex-direction: column; min-height: 0; padding: 20px 16px 16px 0; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.scope { padding: 0 8px; color: var(--muted); font-size: var(--fs-small); margin: -10px 0 0; }
.newchat { justify-content: space-between; width: 100%; }
.kbd { color: var(--muted); font-size: var(--fs-small); font-weight: 400; }
.hsearch { position: relative; display: block; }
.hsearch svg { position: absolute; left: 10px; top: 9px; color: var(--muted); }
.hsearch input { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); padding: 0 10px 0 32px; }
.hsearch input::placeholder { color: var(--faint); }
.hist { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.hgrp + .hgrp { margin-top: 18px; }
.hgrp h2 { margin: 0 0 4px; padding: 0 8px; font-size: var(--fs-small); font-weight: 500; color: var(--muted); }
.hrow { position: relative; display: flex; align-items: center; border-radius: var(--r-ctl); }
.hrow a { flex: 1; min-width: 0; display: block; padding: 7px 8px; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: var(--r-ctl); }
.hrow:hover { background: var(--raised); }
.hrow.on { background: var(--active); }
.hrow .more { width: 28px; height: 28px; margin-right: 2px; opacity: 0; }
.hrow:hover .more, .hrow.on .more, .hrow .more:focus-visible, .hrow .more[aria-expanded="true"] { opacity: 1; }
.hrow input { flex: 1; min-width: 0; height: 32px; margin: 1px 0; border: 1px solid var(--pen); border-radius: var(--r-ctl); padding: 0 8px; background: var(--surface); }
.menu { position: absolute; right: 0; top: 34px; z-index: 30; min-width: 150px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow); }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: var(--r-chip); }
.menu button:hover { background: var(--raised); }
.menu .del { color: var(--neg); }
.hempty { padding: 8px; color: var(--muted); margin: 0; }
.util { border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 2px; }
.util a, .util button.u-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-ctl); color: var(--text); text-decoration: none; border: 0; background: none; text-align: left; width: 100%; }
.util a:hover, .util button.u-item:hover { background: var(--raised); }
.util svg { color: var(--muted); flex: none; }
.util .cnt { margin-left: auto; color: var(--text); font-size: var(--fs-small); font-weight: 500; }
.upgrade { margin: 0 8px 4px 34px; color: var(--muted); font-size: var(--fs-small); display: grid; gap: 4px; }
.upgrade .track { height: 4px; border-radius: 999px; background: var(--raised); overflow: hidden; }
.upgrade .track i { display: block; height: 100%; background: var(--text); }
.local { margin: 0; padding: 6px 8px 0; color: var(--muted); font-size: var(--fs-small); display: flex; gap: 8px; align-items: center; }
.local i { width: 6px; height: 6px; border-radius: 50%; background: var(--pos-ink); flex: none; }

/* ---------- Cột chính ---------- */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.col { width: min(100%, 840px); margin: 0 auto; padding: 28px 32px 32px; }
.title-row { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.title-row h1 { margin: 0; font-size: var(--fs-title); line-height: 1.3; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
.title-row .sub { margin: 4px 0 0; color: var(--muted); }
.title-row .acts { display: flex; gap: 4px; flex: none; }
.app.reading .title-row .acts { display: none; }
.app.reading .title-row h1 { font-size: 18px; }
.thread { display: grid; gap: 36px; padding-top: 24px; }

.q { justify-self: end; max-width: 80%; background: var(--raised); border-radius: 14px 14px 4px 14px; padding: 10px 14px; }
.q p { margin: 0; font-size: 15px; }
.q time { display: block; margin-top: 2px; color: var(--muted); font-size: var(--fs-small); text-align: right; }

.res-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.res-h h2 { margin: 0; font-size: var(--fs-h2); font-weight: 600; }
.finding { margin: 6px 0 0; }
.finding b { font-weight: 600; }
.risk { margin: 4px 0 0; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.risk .link { font-size: 13px; font-weight: 400; color: var(--muted); }
.legend { margin: 8px 0 0; padding: 10px 14px; background: var(--raised); border-radius: var(--r-card); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.legend dt { font-weight: 500; }
.legend dd { margin: 0; color: var(--muted); }
.filters { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: var(--fs-small); font-weight: 500; white-space: nowrap; flex: none; }
.pill.pos { background: var(--pos-bg); color: var(--pos-ink); }
.pill.neg { background: var(--neg-bg); color: var(--neg-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 0 0 1px var(--warn-line); }
.pill.neu { background: var(--neu-bg); color: var(--neu-ink); }
.band { margin-top: 10px; padding: 10px 14px; border-radius: var(--r-card); background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 0 0 1px var(--warn-line); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.band .btn { height: 28px; }

.grp { margin-top: 16px; border: 1px solid var(--border); border-radius: var(--r-card); }
.grp-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 16px 10px; border-bottom: 1px solid var(--rule); }
.grp-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.grp-h h3 span { color: var(--muted); font-weight: 400; }
.grp-h .mt { grid-column: 1 / 2; margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp-h .pill { grid-row: 1 / 3; grid-column: 2; align-self: center; }
.grp.faded .snip, .grp.faded .addr { color: var(--muted); }
.items { list-style: none; margin: 0; padding: 0; }
.item { padding: 14px 16px; }
.item + .item { border-top: 1px solid var(--rule); }
.item-h { display: flex; flex-wrap: wrap; gap: 0 10px; align-items: baseline; }
.addr { font-weight: 600; color: var(--text); text-decoration: none; }
.addr:hover { text-decoration: underline; text-underline-offset: 3px; }
.dieu-t { color: var(--muted); font-size: 13px; min-width: 0; }
.snip { margin: 6px 0 0; max-width: 68ch; }
.warn-line { margin: 6px 0 0; color: var(--warn-ink); font-size: 13px; }
.grp-h .warn-line { grid-column: 1 / -1; margin: 2px 0 0; }
.also-in { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.also-in .link { font-size: 13px; }
@media (hover: none) { .hrow .more { opacity: 1; } }
.item-f { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 8px; min-height: 30px; }
.go { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; font-weight: 500; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--control); }
.go:hover { text-decoration-color: var(--text); }
.quiet { border: 0; background: none; padding: 4px 0; color: var(--muted); }
.quiet:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.meta { color: var(--muted); font-size: 13px; }
.pick { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-left: auto; cursor: pointer; }
.pick input { width: 16px; height: 16px; accent-color: var(--primary); }
.also { margin-top: 6px; font-size: 13px; color: var(--muted); }
.also summary { cursor: pointer; width: fit-content; }
.also ul { list-style: none; margin: 6px 0 0; padding: 0 0 0 16px; display: grid; gap: 4px; }
.also li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.also .link { font-size: 13px; }
.res-f { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 14px; }
.res-f .meta { margin-right: auto; }
.cap { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
.unsaved { margin: 10px 0 0; color: var(--muted); font-size: 13px; }

.full-list { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--r-card); }
.full { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 16px; }
.full + .full { border-top: 1px solid var(--rule); }
.full h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.full p { margin: 0; color: var(--muted); font-size: 13px; }
.full .btn { grid-row: 1 / 3; grid-column: 2; }

.none { margin-top: 12px; padding: 16px; border: 1px dashed var(--control); border-radius: var(--r-card); }
.none h2 { margin: 0; font-size: var(--fs-h2); font-weight: 600; }
.none p { margin: 6px 0 0; max-width: 64ch; }
.none ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
.none .btn { margin-top: 10px; }

.skel { display: grid; gap: 8px; }
.bar { border-radius: 4px; background: var(--raised); }
.skel .note { color: var(--muted); font-size: 13px; }
.skel .grp { padding: 0; }
.skel .grp > div { padding: 14px 16px; display: grid; gap: 8px; }
.skel .grp > div + div { border-top: 1px solid var(--rule); }

/* Câu trả lời AI (xem trước P3) */
.ai .say { font-size: 16px; line-height: 1.6; margin: 10px 0 0; max-width: 64ch; }
.ai ol.pts { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 6px; max-width: 66ch; }
.src { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; margin-left: 4px; border-radius: var(--r-chip); border: 1px solid var(--control); background: var(--surface); font-size: 12px; font-weight: 500; vertical-align: 1px; }
.src:hover { border-color: var(--pen); color: var(--pen); }
.basis { margin-top: 18px; }
.basis h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.basis ul { margin: 0; padding-left: 20px; }
.quote { margin: 0; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--r-card); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
.quote + .quote { margin-top: 8px; }
.quote .n { font-weight: 600; color: var(--muted); }
.quote .law { margin: 0; }
.quote footer { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--muted); }

/* Màn hình trống */
.hello { padding-top: 24px; }
.hello p { margin: 0 0 14px; color: var(--muted); max-width: 60ch; }
.ex { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--r-card); }
.ex li + li { border-top: 1px solid var(--rule); }
.ex button { display: flex; width: 100%; justify-content: space-between; gap: 12px; text-align: left; border: 0; background: none; padding: 12px 16px; border-radius: var(--r-card); }
.ex button:hover { background: var(--raised); }
.ex button span { color: var(--muted); font-size: 13px; white-space: nowrap; }

/* Ô hỏi */
.composer { border-top: 1px solid var(--border); background: var(--surface); }
.composer .col { padding-top: 12px; padding-bottom: 14px; }
.box { display: flex; gap: 10px; align-items: flex-end; border: 1px solid var(--control); border-radius: 12px; padding: 8px 8px 8px 14px; background: var(--surface); }
.box:focus-within { border-color: var(--text); }
.box textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: none; line-height: 1.5; padding: 5px 0; max-height: 132px; font-size: 15px; }
.box textarea::placeholder { color: var(--faint); }
.send { flex: none; width: 34px; height: 34px; border-radius: var(--r-ctl); border: 0; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.send:disabled { background: var(--raised); color: var(--faint); cursor: default; }
.under { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 8px; color: var(--muted); font-size: var(--fs-small); }
.under select { height: 28px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); padding: 0 6px; font-size: var(--fs-small); color: var(--text); max-width: 100%; }
.under .hint { margin-left: auto; }

/* ---------- Trình đọc ---------- */
.reader { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); }
.rd-top { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 20px; border-bottom: 1px solid var(--rule); }
.rd-top .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.rd-top h2 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd-top .btn { height: 32px; gap: 0; }
.tabs { display: flex; gap: 20px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.tabs button { position: relative; border: 0; background: none; padding: 9px 0 10px; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: -1px; height: 2px; background: var(--text); }
.rd-body { flex: 1; min-height: 0; overflow-y: auto; }
.rd-meta { padding: 16px 20px 0; }
.rd-meta .mt { margin: 0; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.rd-meta .mt a { color: var(--text); }
.cite { margin: 12px 0 0; padding: 10px 14px; background: var(--raised); border-radius: var(--r-card); }
.cite output { display: block; font-weight: 500; user-select: all; }
.cite small { display: block; color: var(--muted); font-size: var(--fs-small); margin-top: 2px; }
.rd-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 28px; padding: 16px 20px 40px 32px; }
.reader.wide .rd-grid { grid-template-columns: 200px minmax(0, 1fr); max-width: 1100px; margin: 0 auto; }
.toc { display: none; position: sticky; top: 16px; align-self: start; font-size: 13px; }
.reader.wide .toc { display: block; }
.reader.wide .toc-sel { display: none; }
.toc h3 { margin: 0 0 6px; font-size: var(--fs-small); font-weight: 500; color: var(--muted); }
.toc ul { list-style: none; margin: 0; padding: 0; }

const LAW = {"D100":[{"n":1,"title":"Điều 1. Phạm vi điều chỉnh","units":[{"id":"1.1","t":"1. Nghị định này quy định về hành vi vi phạm hành chính; hình thức, mức xử phạt, biện pháp khắc phục hậu quả đối với từng hành vi vi phạm hành chính; thẩm quyền lập biên bản, thẩm quyền xử phạt, mức phạt tiền cụ thể theo từng chức danh đối với hành vi vi phạm hành chính trong lĩnh vực giao thông đường bộ và đường sắt."},{"id":"1.2","t":"2. Các hành vi vi phạm hành chính trong các lĩnh vực quản lý nhà nước khác liên quan đến lĩnh vực giao thông đường bộ và đường sắt mà không quy định tại Nghị định này thì áp dụng quy định tại các Nghị định quy định về xử phạt vi phạm hành chính trong các lĩnh vực đó để xử phạt."}]},{"n":2,"title":"Điều 2. Đối tượng áp dụng","units":[{"id":"2.1","t":"1. Cá nhân, tổ chức có hành vi vi phạm hành chính trong lĩnh vực giao thông đường bộ, đường sắt trên lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam."},{"gap":1}]},{"n":3,"title":"Điều 3. Giải thích từ ngữ","units":[{"id":"3","t":"Trong Nghị định này, các từ ngữ dưới đây được hiểu như sau:"},{"id":"3.1","t":"1. Lĩnh vực giao thông đường bộ:"},{"gap":1},{"id":"3.1.c","t":"c) Các loại xe tương tự xe mô tô là phương tiện giao thông đường bộ chạy bằng động cơ, có hai bánh hoặc ba bánh, có dung tích làm việc của động cơ từ 50 cm3 trở lên, có vận tốc thiết kế lớn nhất lớn hơn 50 km/h, có khối lượng bản thân không lớn hơn 400 kg;"},{"id":"3.1.d","t":"d) Xe máy điện là xe gắn máy được dẫn động bằng động cơ điện có công suất lớn nhất không lớn hơn 4 kW, có vận tốc thiết kế lớn nhất không lớn hơn 50 km/h;"},{"gap":1}]},{"n":5,"title":"Điều 5. Xử phạt người điều khiển xe ô tô và các loại xe tương tự xe ô tô vi phạm quy tắc giao thông đường bộ","units":[{"gap":1},{"id":"5.3","t":"3. Phạt tiền từ 800.000 đồng đến 1.000.000 đồng đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây:"},{"id":"5.3.a","t":"a) Điều khiển xe chạy quá tốc độ quy định từ 05 km/h đến dưới 10 km/h;"},{"gap":1},{"id":"5.5","t":"5. Phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây:"},{"gap":1},{"id":"5.5.i","t":"i) Điều khiển xe chạy quá tốc độ quy định từ 10 km/h đến 20 km/h."},{"id":"5.6","t":"6. Phạt tiền từ 6.000.000 đồng đến 8.000.000 đồng đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây:"},{"id":"5.6.a","t":"a) Điều khiển xe chạy quá tốc độ quy định trên 20 km/h đến 35 km/h;"},{"gap":1}]},{"n":6,"title":"Điều 6. Xử phạt người điều khiển xe mô tô, xe gắn máy (kể cả xe máy điện), các loại xe tương tự xe mô tô và các loại xe tương tự xe gắn máy vi phạm quy tắc giao thông đường bộ","units":[{"gap":1},{"id":"6.2","t":"2. Phạt tiền từ 200.000 đồng đến 300.000 đồng đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây:"},{"gap":1},{"id":"6.2.c","t":"c) Điều khiển xe chạy quá tốc độ quy định từ 05 km/h đến dưới 10 km/h;"},{"gap":1},{"id":"6.4","t":"4. Phạt tiền từ 600.000 đồng đến 1.000.000 đồng đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây:"},{"id":"6.4.a","t":"a) Điều khiển xe chạy quá tốc độ quy định từ 10 km/h đến 20 km/h;"},{"gap":1},{"id":"6.4.e","t":"e) Không chấp hành hiệu lệnh của đèn tín hiệu giao thông;"},{"gap":1},{"id":"6.7","t":"7. Phạt tiền từ 4.000.000 đồng đến 5.000.000 đồng đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây:"},{"id":"6.7.a","t":"a) Điều khiển xe chạy quá tốc độ quy định trên 20 km/h;"},{"id":"6.7.b","t":"b) Không chú ý quan sát, điều khiển xe chạy quá tốc độ quy định gây tai nạn giao thông; đi vào đường cao tốc, dừng xe, đỗ xe, quay đầu xe, lùi xe, tránh xe, vượt xe, chuyển hướng, chuyển làn đường không đúng quy định gây tai nạn giao thông; không đi đúng phần đường, làn đường, không giữ khoảng cách an toàn giữa hai xe theo quy định gây tai nạn giao thông hoặc đi vào đường có biển báo hiệu có nội dung cấm đi vào đối với loại phương tiện đang điều khiển, đi ngược chiều của đường một chiều, đi ngược chiều trên đường có biển “Cấm đi ngược chiều” gây tai nạn giao thông, trừ hành vi vi phạm quy định tại điểm d khoản 8 Điều này;"},{"gap":1}]},{"n":21,"title":"Điều 21. Xử phạt các hành vi vi phạm quy định về điều kiện của người điều khiển xe cơ giới","units":[{"id":"21.1","t":"1. Phạt cảnh cáo người từ đủ 14 tuổi đến dưới 16 tuổi điều khiển xe mô tô, xe gắn máy (kể cả xe máy điện) và các loại xe tương tự xe mô tô hoặc điều khiển xe ô tô, máy kéo và các loại xe tương tự xe ô tô."},{"id":"21.2","t":"2. Phạt tiền từ 100.000 đồng đến 200.000 đồng đối với một trong các hành vi vi phạm sau đây:"},{"id":"21.2.a","t":"a) Người điều khiển xe mô tô, xe gắn máy, các loại xe tương tự xe mô tô và các loại xe tương tự xe gắn máy không có hoặc không mang theo Giấy chứng nhận bảo hiểm trách nhiệm dân sự của chủ xe cơ giới còn hiệu lực;"},{"id":"21.2.b","t":"b) Người điều khiển xe mô tô, xe gắn máy, các loại xe tương tự xe mô tô và các loại xe tương tự xe gắn máy không mang theo Giấy đăng ký xe;"},{"id":"21.2.c","t":"c) Người điều khiển xe mô tô và các loại xe tương tự xe mô tô không mang theo Giấy phép lái xe, trừ hành vi vi phạm quy định tại điểm b khoản 5, điểm c khoản 7 Điều này."},{"id":"21.3","t":"3. Phạt tiền từ 200.000 đồng đến 400.000 đồng đối với một trong các hành vi vi phạm sau đây:"},{"id":"21.3.a","t":"a) Người điều khiển xe ô tô, máy kéo và các loại xe tương tự xe ô tô không mang theo Giấy phép lái xe, trừ hành vi vi phạm quy định tại điểm c khoản 8 Điều này;"},{"id":"21.3.b","t":"b) Người điều khiển xe ô tô, máy kéo và các loại xe tương tự xe ô tô không mang theo Giấy đăng ký xe (kể cả rơ moóc và sơ mi rơ moóc);"},{"id":"21.3.c","t":"c) Người điều khiển xe ô tô, máy kéo và các loại xe tương tự xe ô tô không mang theo Giấy chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường (đối với loại xe có quy định phải kiểm định, kể cả rơ moóc và sơ mi rơ moóc)."},{"id":"21.4","t":"4. Phạt tiền từ 400.000 đồng đến 600.000 đồng đối với một trong các hành vi vi phạm sau đây:"},{"id":"21.4.a","t":"a) Người từ đủ 16 tuổi đến dưới 18 tuổi điều khiển xe mô tô có dung tích xi lanh từ 50 cm3 trở lên;"},{"id":"21.4.b","t":"b) Người điều khiển xe ô tô, máy kéo và các loại xe tương tự xe ô tô không có hoặc không mang theo Giấy chứng nhận bảo hiểm trách nhiệm dân sự của chủ xe cơ giới còn hiệu lực;"},{"id":"21.4.c","t":"c) Người điều khiển xe ô tô, máy kéo và các loại xe tương tự xe ô tô có Giấy phép lái xe nhưng đã hết hạn sử dụng dưới 06 tháng."},{"id":"21.5","t":"5. Phạt tiền từ 800.000 đồng đến 1.200.000 đồng đối với người điều khiển xe mô tô hai bánh có dung tích xi lanh dưới 175 cm3 và các loại xe tương tự xe mô tô thực hiện một trong các hành vi vi phạm sau đây:"},{"id":"21.5.a","t":"a) Không có Giấy phép lái xe hoặc sử dụng Giấy phép lái xe không do cơ quan có thẩm quyền cấp, Giấy phép lái xe bị tẩy xóa;"},{"id":"21.5.b","t":"b) Có Giấy phép lái xe quốc tế do các nước tham gia Công ước về Giao thông đường bộ năm 1968 cấp (trừ Giấy phép lái xe quốc tế do Việt Nam cấp) nhưng không mang theo Giấy phép lái xe quốc gia;"},{"id":"21.5.c","t":"c) Sử dụng Giấy phép lái xe không hợp lệ (Giấy phép lái xe có số phôi ghi ở mặt sau không trùng với số phôi được cấp mới nhất trong hệ thống thông tin quản lý Giấy phép lái xe)."},{"id":"21.6","t":"6. Phạt tiền từ 1.200.000 đồng đến 3.000.000 đồng đối với người từ đủ 16 tuổi đến dưới 18 tuổi điều khiển xe ô tô, máy kéo, các loại xe tương tự xe ô tô."},{"id":"21.7","t":"7. Phạt tiền từ 3.000.000 đồng đến 4.000.000 đồng đối với người điều khiển xe mô tô hai bánh có dung tích xi lanh từ 175 cm3 trở lên, xe mô tô ba bánh thực hiện một trong các hành vi vi phạm sau đây:"},{"id":"21.7.a","t":"a) Có Giấy phép lái xe nhưng không phù hợp với loại xe đang điều khiển;"},{"id":"21.7.b","t":"b) Không có Giấy phép lái xe hoặc sử dụng Giấy phép lái xe không do cơ quan có thẩm quyền cấp, Giấy phép lái xe bị tẩy xóa;"},{"id":"21.7.c","t":"c) Có Giấy phép lái xe quốc tế do các nước tham gia Công ước về Giao thông đường bộ năm 1968 cấp (trừ Giấy phép lái xe quốc tế do Việt Nam cấp) nhưng không mang theo Giấy phép lái xe quốc gia;"},{"id":"21.7.d","t":"d) Sử dụng Giấy phép lái xe không hợp lệ (Giấy phép lái xe có số phôi ghi ở mặt sau không trùng với số phôi được cấp mới nhất trong hệ thống thông tin quản lý Giấy phép lái xe)."},{"id":"21.8","t":"8. Phạt tiền từ 4.000.000 đồng đến 6.000.000 đồng đối với người điều khiển xe ô tô, máy kéo và các loại xe tương tự xe ô tô vi phạm một trong các hành vi sau đây:"},{"id":"21.8.a","t":"a) Có Giấy phép lái xe nhưng không phù hợp với loại xe đang điều khiển hoặc đã hết hạn sử dụng từ 06 tháng trở lên;"},{"id":"21.8.b","t":"b) Không có Giấy phép lái xe hoặc sử dụng Giấy phép lái xe không do cơ quan có thẩm quyền cấp, Giấy phép lái xe bị tẩy xóa;"},{"id":"21.8.c","t":"c) Có Giấy phép lái xe quốc tế do các nước tham gia Công ước về Giao thông đường bộ năm 1968 cấp (trừ Giấy phép lái xe quốc tế do Việt Nam cấp) nhưng không mang theo Giấy phép lái xe quốc gia;"},{"id":"21.8.d","t":"d) Sử dụng Giấy phép lái xe không hợp lệ (Giấy phép lái xe có số phôi ghi ở mặt sau không trùng với số phôi được cấp mới nhất trong hệ thống thông tin quản lý Giấy phép lái xe)."},{"id":"21.9","t":"9. Ngoài việc bị phạt tiền, người điều khiển phương tiện thực hiện hành vi vi phạm còn bị áp dụng các hình thức xử phạt bổ sung sau đây:"},{"id":"21.9.a","t":"a) Thực hiện hành vi quy định tại điểm a, điểm c khoản 5; điểm b, điểm d khoản 7; điểm b, điểm d khoản 8 Điều này còn bị áp dụng hình thức xử phạt bổ sung tịch thu Giấy phép lái xe không do cơ quan có thẩm quyền cấp, Giấy phép lái xe bị tẩy xóa, Giấy phép lái xe không hợp lệ;"},{"id":"21.9.b","t":"b) Thực hiện hành vi quy định tại điểm c khoản 5, điểm d khoản 7, điểm d khoản 8 bị tước quyền sử dụng Giấy phép lái xe được cấp mới nhất trong hệ thống thông tin quản lý Giấy phép lái xe từ 01 tháng đến 03 tháng."}]},{"n":84,"title":"Điều 84. Hiệu lực thi hành","units":[{"id":"84.1","t":"1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2020."},{"id":"84.2","t":"2. Nghị định này thay thế Nghị định số 46/2016/NĐ-CP ngày 26 tháng 5 năm 2016 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực giao thông đường bộ và đường sắt."}]},{"n":85,"title":"Điều 85. Điều khoản chuyển tiếp","units":[{"id":"85","t":"Đối với các hành vi vi phạm hành chính trong lĩnh vực giao thông đường bộ, đường sắt xảy ra trước ngày Nghị định này có hiệu lực thi hành mà sau đó mới bị phát hiện hoặc đang xem xét giải quyết thì áp dụng các quy định có lợi cho tổ chức, cá nhân vi phạm."}]}],"D103":[{"n":21,"title":"Điều 21. Trách nhiệm của Bộ Tài chính","units":[{"id":"21.1","t":"1. Chủ trì, phối hợp với Bộ Công an, các Bộ, ngành liên quan và Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương hướng dẫn, tuyên truyền thực hiện bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới;"},{"id":"21.2","t":"2. Ban hành quy tắc, điều khoản và biểu phí bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới;"},{"id":"21.3","t":"3. Quy định việc phát hành, quản lý và sử dụng mẫu Giấy chứng nhận bảo hiểm."},{"id":"21.4","t":"4. Hướng dẫn hồ sơ yêu cầu bồi thường."},{"id":"21.5","t":"5. Quy định mức đóng góp hàng năm và ban hành cơ chế quản lý, sử dụng, thanh toán, quyết toán Quỹ bảo hiểm xe cơ giới."},{"id":"21.6","t":"6. Trực tiếp hoặc chủ trì, phối hợp với cơ quan liên quan kiểm tra, giám sát các doanh nghiệp bảo hiểm trong việc thực hiện bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới;"},{"id":"21.7","t":"7. Chỉ đạo các lực lượng chức năng xử phạt vi phạm hành chính các doanh nghiệp bảo hiểm vi phạm các quy định về bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới theo quy định tại Nghị định này và các quy định khác của pháp luật liên quan."},{"id":"21.8","t":"8. Chủ trì, phối hợp với các cơ quan liên quan hướng dẫn Hiệp hội bảo hiểm Việt Nam, các doanh nghiệp bảo hiểm triển khai xây dựng cơ sở dữ liệu về bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới;"}]},{"n":29,"title":"Điều 29. Xử phạt các hành vi vi phạm quy định về tham gia bảo hiểm của người điều khiển xe cơ giới","units":[{"id":"29.1","t":"1. Phạt tiền 100.000 đồng đối với người điều khiển xe mô tô, xe gắn máy, xe mô tô ba bánh và các loại xe cơ giới tương tự không có hoặc không mang theo Giấy chứng nhận bảo hiểm còn hiệu lực."},{"id":"29.2","t":"2. Phạt tiền 500.000 đồng đối với người điều khiển xe ô tô, máy kéo và các loại xe cơ giới tương tự không có hoặc không mang theo Giấy chứng nhận bảo hiểm còn hiệu lực."}]},{"n":44,"title":"Điều 44. Hiệu lực thi hành","units":[{"id":"44","t":"Nghị định này có hiệu lực thi hành sau 15 ngày, kể từ ngày đăng Công báo và thay thế Nghị định số 115/1997/NĐ-CP ngày 17 tháng 12 năm 1997 của Chính phủ về chế độ bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới."}]}],"D214":[{"n":1,"title":"Điều 1. Sửa đổi, bổ sung một số điều của Nghị định số 103/2008/NĐ-CP ngày 16 tháng 9 năm 2008 của Chính phủ về bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới như sau:","units":[{"id":"1.1","t":"1. Sửa đổi\nKhoản 2 Điều 4 như sau:\n“2. Doanh nghiệp bảo hiểm có trách nhiệm trích 1% doanh thu phí bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới hàng năm để đóng vào Quỹ bảo hiểm xe cơ giới”."},{"id":"1.2","t":"2. Sửa đổi\nKhoản 9 Điều 20 như sau:\n“9. Trích 1% doanh thu phí bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới hàng năm đóng góp vào Quỹ bảo hiểm xe cơ giới.”"},{"id":"1.3","t":"3. Sửa đổi\nKhoản 5 Điều 21 như sau:\n“Ban hành cơ chế quản lý, sử dụng, thanh toán và quyết toán Quỹ bảo hiểm xe cơ giới.”"}]},{"n":2,"title":"Điều 2. Hiệu lực thi hành","units":[{"id":"2","t":"Nghị định này có hiệu lực thi hành kể từ ngày 10 tháng 02 năm 2014."}]}],"D38":[{"n":34,"title":"Điều 34. Vi phạm quy định về hành vi cấm trong hoạt động quảng cáo","units":[{"id":"34.1","t":"1. Phạt tiền từ 1.000.000 đồng đến 2.000.000 đồng đối với hành vi treo, đặt, dán, vẽ các sản phẩm quảng cáo trên cột điện, trụ điện, cột tín hiệu giao thông và cây xanh nơi công cộng, trừ trường hợp quy định tại điểm d khoản 3, điểm b khoản 5 và điểm b khoản 8 Điều 12 Nghị định số 100/2019/NĐ-CP\nngày 30 tháng 12 năm 2019 của Chính phủ quy định xử phạt vi phạm hành chính trong lĩnh vực giao thông đường bộ và đường sắt."},{"gap":1}]}],"D142":[{"n":17,"title":"Điều 17. Vi phạm quy định đối với người điều khiển ô tô và các loại phương tiện tương tự ô tô trong vùng đất cảng","units":[{"id":"17.1","t":"1. Phạt tiền từ 600.000 đồng đến 800.000 đồng đối với người điều khiển ô tô và các loại phương tiện tương tự ô tô chạy quá tốc độ quy định từ 05 km/giờ đến dưới 10 km/giờ."},{"id":"17.2","t":"2. Phạt tiền từ 2.000.000 đồng đến 3.000.000 đồng đối với người điều khiển ô tô và các loại phương tiện tương tự ô tô thực hiện một trong các hành vi vi phạm sau đây:"},{"gap":1},{"id":"17.2.b","t":"b) Điều khiển ô tô và các loại phương tiện tương tự ô tô chạy quá tốc độ quy định từ 10 km/giờ đến 20 km/giờ."},{"gap":1}]}],"D22":[{"n":1,"title":"Điều 1. Phạm vi Điều chỉnh","units":[{"id":"1","t":"Thông tư này quy định Quy tắc, Điều Khoản, biểu phí và mức trách nhiệm bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới."}]},{"n":18,"title":"Điều 18. Quyền của doanh nghiệp bảo hiểm","units":[{"gap":1},{"id":"18.3","t":"3. Đề nghị lực lượng Cảnh sát giao thông, Cảnh sát Điều tra cung cấp bản sao các tài liệu liên quan đến vụ tai nạn theo quy định tại Khoản 3 Điều 22 Nghị định số 103/2008/NĐ-CP."},{"gap":1}]}]};

  const orig = D.gone
    ? `<div class="orig"><div class="none" role="alert"><h2>Không mở được ảnh trang</h2><p>Tệp ${esc(D.file)} không còn ở thư mục đã nạp. Chữ trong kho vẫn đọc được ở tab Văn bản.</p><button type="button" class="btn" data-retry>Thử lại</button></div></div>`
    : `<div class="orig"><div class="orig-bar"><span>Trang ${pg} trên ${D.pages}</span>
      <button type="button" class="btn" data-page="-1"${pg <= 1 ? ' disabled' : ''}>Trang trước</button><button type="button" class="btn" data-page="1"${pg >= D.pages ? ' disabled' : ''}>Trang sau</button></div>
      <div class="sheet" role="img" aria-label="Trang ${pg} của ${esc(docName(D))}">${onPage.length ? onPage.map(x => `<h4>${esc(x.title)}</h4>${x.units.filter(u => !u.gap).map(u => `<p>${esc(u.t)}</p>`).join('')}`).join('') : '<p>Trang này không có Điều nào trong dữ liệu mẫu.</p>'}<p class="pno">${pg}</p></div>
      <p class="cap">Mẫu dựng lại trang từ chữ. App thật hiện ảnh chụp trang gốc của tệp ${esc(D.file)}, không có khung tô.</p></div>`;
  const tabs = isPdf(D) ? [['text', 'Văn bản'], ['orig', 'Bản gốc']] : [['text', 'Văn bản']];
  R.innerHTML = `<div class="rd-top"><div class="who"><h2 id="rd-title" tabindex="-1">${esc(docName(D))}</h2>${hlPill(r.d)}</div>
      <button type="button" class="btn" data-copy="${esc(cite)}" aria-label="Sao chép trích dẫn: ${esc(cite)}">Sao chép<span>&nbsp;trích dẫn</span></button>
      <button type="button" class="icon-btn" id="rd-wide" aria-pressed="${wide}" aria-label="${wide ? 'Thu nhỏ trình đọc' : 'Mở rộng trình đọc'}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">${wide ? '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>' : '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>'}</svg></button>
      <button type="button" class="icon-btn" id="rd-close" aria-label="Đóng trình đọc (Esc)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="tabs" role="tablist" aria-label="Cách xem văn bản">${tabs.map(([k, l]) => `<button type="button" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${S.tab === k}" aria-controls="rd-body" tabindex="${S.tab === k ? 0 : -1}">${l}</button>`).join('')}</div>
    <div class="rd-body" id="rd-body" role="tabpanel" aria-labelledby="tab-${S.tab}" tabindex="-1">${S.tab === 'text' ? meta + text : orig}</div>`;
  R.hidden = false;
  $('#app').classList.add('reading');
  $$('details[data-k]', R).forEach(d => { d.open = S.open.has(d.dataset.k); });
  setModal();
  if (scroll) {
    $('#rd-title').focus({ preventScroll: true });
    const t = whole ? $('#d-' + whole) : tu && $('#u-' + tu.replace(/\./g, '-'));
    requestAnimationFrame(() => { if (t) t.scrollIntoView({ block: whole ? 'start' : 'center' }); });
  }
}

/* ---------- Hỏi ---------- */
const SOHIEU = /\d+\/\d{4}\/[A-ZĐa-zđ0-9-]+/;
function route(q, f) {
  const fq = fold(q);
  const dm = q.match(/điều\s*(\d+)/i), so = q.match(SOHIEU);
  if (so) {
    const d = DOCS.find(x => fold(x.so) === fold(so[0]));
    if (d && dm) {
      const n = +dm[1], di = dieuOf(d.id, n);
      if (di) { const key = `dieu-${d.id}-${n}`; RES[key] = { items: [{ d: d.id, u: [di.units.find(u => u.id).id], k: 'r2', whole: n }] }; return { k: 'res', a: key, f }; }
      return { k: 'full', docs: [d.id], dieuMiss: `Mẫu chưa có nguyên văn Điều ${n} của văn bản này; mở toàn văn để xem các Điều có trong mẫu.` };
    }
    if (d) return { k: 'full', docs: [d.id] };
  }
  const part = q.match(/\d+\/\d{4}|\d{4}\/[A-ZĐa-zđ-]+/);
  if (part) {
    const hits = DOCS.filter(x => x.so && fold(x.so).includes(fold(part[0])));
    if (hits.length) return { k: 'full', docs: hits.slice(0, 5).map(x => x.id), more: Math.max(0, hits.length - 5) };
  }
  if (fq.includes('bao hiem')) return { k: 'res', a: fq.includes('o to') ? 'oto' : 'bh', f };
  if (fq.includes('toc do')) return { k: 'res', a: 'td', f };
  if (fq.includes('quang cao')) return { k: 'res', a: 'qc', f };
  if (fq.includes('giay phep lai xe')) return { k: 'res', a: 'gplx', f };
  return { k: 'none', q: q.replace(/[?？.]+$/, '') };
}
function now() { const t = 10 * 60 + 30 + S.seq; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function filters() { const f = { loai: $('#f-loai').value, cq: $('#f-cq').value, hl: $('#f-hl').value }; return f.loai || f.cq || f.hl ? f : null; }
function ask(q) {
  q = q.trim(); if (!q) return;
  if (S.emptyKho) { toast('Kho chưa có văn bản. Hãy nạp văn bản trước.'); return; }
  let c = cur();
  S.seq++;
  if (!c) {
    c = { id: 'n' + S.seq, age: 0, at: now(), title: q.length > 60 ? q.slice(0, 60).trimEnd() + '…' : q, msgs: [] };
    CONVS.unshift(c); S.conv = c.id; setHash(c.id);
  }
  const f = filters();
  c.msgs.push({ r: 'u', t: q, at: now() });
  const wait = { r: 'b', k: 'wait' };
  c.msgs.push(wait);
  render(); scrollEnd();
  setTimeout(() => {
    Object.assign(wait, route(q, f));
    if (S.conv !== c.id) { renderSide(); return; }
    render(); scrollTurnTop();
  }, 650);
}
function scrollEnd() { const s = $('#scroll'); s.scrollTop = s.scrollHeight; }
function scrollTurnTop() { const t = $$('.turn'), s = $('#scroll'); if (t.length) s.scrollTop = Math.max(0, t[t.length - 1].offsetTop - 140); }
function setHash(id) { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); }
function openConv(id) { S.conv = id; S.menu = null; closeSide(); render(); $('#scroll').scrollTop = 0; setHash(id); }
function newChat() { S.conv = null; S.menu = null; closeSide(); render(); setHash(''); $('#ask').focus(); }

/* ---------- Hộp thoại ---------- */
function dialog(html) {
  S.dlgOpener = document.activeElement;
  $('#dialog').innerHTML = html; $('#scrim').hidden = false; $('#app').inert = true;
  const b = $('#dialog [data-first]') || $('#dialog button'); if (b) b.focus();
}
function closeDialog(focusEl) {
  $('#scrim').hidden = true; $('#app').inert = false;
  const t = focusEl || (S.dlgOpener && document.contains(S.dlgOpener) ? S.dlgOpener : $('.newchat'));
  if (t) t.focus();
}

/* ---------- Sự kiện ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('a, button, input');
  if (!t) { if (S.menu) { S.menu = null; renderSide(); } return; }
  const ds = t.dataset;
  if (ds.conv) { e.preventDefault(); openConv(ds.conv); return; }
  if (t.hasAttribute('data-new')) { newChat(); return; }
  if (ds.menu) { S.menu = S.menu === ds.menu ? null : ds.menu; renderSide(); const m = $('.menu button'); if (m && S.menu) m.focus(); return; }
  if (ds.rename) {
    S.menu = null; S.renaming = ds.rename;
    const c = CONVS.find(x => x.id === ds.rename);
    if (S.q && !fold(c.title).includes(fold(S.q.trim()))) { S.q = ''; $('#hq').value = ''; }
    if (narrowSide()) openSide(true);
    renderSide(); return;
  }
  if (ds.del) {
    const id = ds.del; S.menu = null; renderSide();
    const c = CONVS.find(x => x.id === id);
    dialog(`<h2 id="dlg-t">Xoá “${esc(c.title)}”?</h2><p>Cuộc trò chuyện và các kết quả đã lưu sẽ mất. Câu hỏi vẫn còn trong nhật ký truy vấn (dùng cho trang Truy vấn bỏ sót).</p>
      <div class="row"><button type="button" class="btn" data-cancel data-first>Huỷ</button><button type="button" class="btn danger" data-confirm-del="${c.id}">Xoá cuộc trò chuyện</button></div>`);
    return;
  }
  if (ds.confirmDel) {
    const i = CONVS.findIndex(x => x.id === ds.confirmDel), name = CONVS[i].title;
    CONVS.splice(i, 1);
    if (S.conv === ds.confirmDel) { S.conv = CONVS[0] ? CONVS[0].id : null; setHash(S.conv); }
    render(); closeDialog($('.hrow.on a') || $('.newchat')); toast('Đã xoá “' + name + '”.'); return;
  }
  if (t.hasAttribute('data-cancel')) { closeDialog(); return; }
  if (t.hasAttribute('data-import')) {
    dialog(`<h2 id="dlg-t">Nạp văn bản</h2><p>Chọn tệp PDF, Word, ảnh chụp, hoặc cả một thư mục. App đọc chữ ngay trên máy này; văn bản quét sẽ được OCR.</p>
      <div class="row"><button type="button" class="btn" data-cancel>Đóng</button><button type="button" class="btn" data-pickfile>Chọn thư mục</button><button type="button" class="btn primary" data-pickfile data-first>Chọn tệp</button></div>`);
    return;
  }
  if (t.hasAttribute('data-pickfile')) { closeDialog($('#btn-import')); toast('Mẫu: app thật mở hộp chọn tệp của Windows.'); return; }
  if (ds.open !== undefined) { e.preventDefault(); openReader(ds.open, ds.w, t); return; }
  if (ds.copy) { copy(ds.copy); return; }
  if (ds.more) {
    const before = S.shown[ds.more] || SHOW;
    S.shown[ds.more] = Math.min(before + MORE, CAP);
    render(`#it-${ds.more.replace(':', '-')}-${before} .go`); return;
  }
  if (ds.pick) { if (t.checked) S.picked.add(ds.pick); else S.picked.delete(ds.pick); render(`[data-pick="${ds.pick}"]`); return; }
  if (ds.export) { const k = [...S.picked].filter(p => p.startsWith(ds.export + '|')).length; toast(`Mẫu: app thật tải tệp Word gồm ${k} đoạn đã chọn, kèm trích dẫn và hiệu lực.`); return; }
  if (ds.legend) { if (S.legend.has(ds.legend)) S.legend.delete(ds.legend); else S.legend.add(ds.legend); render(`[data-legend="${ds.legend}"]`); return; }
  if (ds.unfilter) { const [cid, i] = ds.unfilter.split(':'); const m = CONVS.find(c => c.id === cid).msgs[+i]; delete m.f; ['#f-loai', '#f-cq', '#f-hl'].forEach(s => { $(s).value = ''; }); render(); return; }
  if (ds.reask) { ask(ds.reask); return; }
  if (ds.ex) { ask(ds.ex); $('#ask').focus(); return; }
  if (ds.src) {
    e.preventDefault();
    const q = $('#src-' + ds.src); if (q) { q.scrollIntoView({ block: 'center' }); const a = $('[data-open]', q); if (a) a.focus({ preventScroll: true }); }
    return;
  }
  if (ds.goto) { e.preventDefault(); const h = $('#d-' + ds.goto); if (h) h.scrollIntoView({ block: 'start' }); $$('.toc a').forEach(a => { a.classList.toggle('on', a === t); a.toggleAttribute('aria-current', a === t); }); return; }
  if (ds.page) { S.page = Math.max(1, Math.min(doc(S.rd.d).pages, (S.page || 1) + +ds.page)); renderReader(false); const b = $(`[data-page="${ds.page}"]`); (b && !b.disabled ? b : $(`[data-page="${-ds.page}"]`)).focus(); return; }
  if (t.hasAttribute('data-retry')) { toast('Vẫn không thấy tệp. Nếu đã chuyển chỗ, hãy nạp lại tệp từ chỗ mới.'); return; }
  if (ds.old) { e.preventDefault(); toast(`“${ds.old}” giữ như bản 0.8 trong P1.`); return; }
  if (ds.tab) { S.tab = ds.tab; renderReader(false); $('#tab-' + ds.tab).focus(); return; }
  if (t.id === 'rd-close') { closeReader(); return; }
  if (t.id === 'rd-wide') { $('#reader').classList.toggle('wide'); renderReader(false); $('#rd-wide').focus(); return; }
  if (t.id === 'open-side') { openSide(); return; }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-k]')) { if (d.open) S.open.add(d.dataset.k); else S.open.delete(d.dataset.k); } }, true);
$('#rd-scrim').addEventListener('click', closeReader);
$('#side-scrim').addEventListener('click', () => closeSide(true));
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeDialog(); });
document.addEventListener('change', e => { if (e.target.id === 'goto') { const h = $('#d-' + e.target.value); if (h) h.scrollIntoView({ block: 'start' }); } });
document.addEventListener('keydown', e => {
  if (e.altKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); if ($('#scrim').hidden) newChat(); return; }
  if (e.target.matches && e.target.matches('[role="tab"]') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const tabs = $$('[role="tab"]'), i = tabs.indexOf(e.target);
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    e.preventDefault(); S.tab = tabs[j].dataset.tab; renderReader(false); $('#tab-' + S.tab).focus(); return;
  }
  if (e.key === 'Escape') {
    if (!$('#scrim').hidden) { closeDialog(); return; }
    if (S.menu) { const id = S.menu; S.menu = null; renderSide(); const b = $(`[data-menu="${id}"]`); if (b) b.focus(); return; }
    if (S.renaming) { S.renaming = null; renderSide(); return; }
    if (S.rd) { closeReader(); return; }
    if ($('#side').classList.contains('open')) { closeSide(true); return; }
  }
  if (e.target.id && e.target.id.startsWith('rn-') && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); saveRename(e.target); }
});
function saveRename(inp) {
  const v = inp.value.trim(), id = S.renaming, c = CONVS.find(x => x.id === id);
  S.renaming = null;
  if (!c) return;
  if (!v) { renderSide(); toast('Tên không được để trống. Giữ tên cũ.'); return; }
  const changed = v.slice(0, 80) !== c.title;
  c.title = v.slice(0, 80); render();
  const a = $(`[data-conv="${id}"]`); if (a) a.focus();
  if (changed) toast('Đã đổi tên.');
}
document.addEventListener('focusout', e => {
  if (e.target.id && e.target.id.startsWith('rn-') && S.renaming) { const inp = e.target; setTimeout(() => { if (S.renaming && document.activeElement !== inp) saveRename(inp); }, 0); }
});
$('#hq').addEventListener('input', e => { S.q = e.target.value; renderSide(); });
const ta = $('#ask');
function grow() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 132) + 'px'; $('#send').disabled = !ta.value.trim(); }
ta.addEventListener('input', grow);
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#composer').requestSubmit(); } });
$('#composer').addEventListener('submit', e => { e.preventDefault(); const q = ta.value; ta.value = ''; grow(); ask(q); });
const narrowSide = () => matchMedia('(max-width: 900px)').matches;
function openSide(keepFocus) {
  $('#side').classList.add('open'); $('#side-scrim').classList.add('open'); $('#open-side').setAttribute('aria-expanded', 'true');
  setModal();
  if (!keepFocus) { const a = $('#side .hrow.on a') || $('#side [data-new]'); if (a) a.focus(); }
}
function closeSide(returnFocus) {
  const was = $('#side').classList.contains('open');
  $('#side').classList.remove('open'); $('#side-scrim').classList.remove('open'); $('#open-side').setAttribute('aria-expanded', 'false');
  setModal();
  if (was && returnFocus) $('#open-side').focus();
}
matchMedia('(max-width: 900px)').addEventListener('change', () => closeSide(false));
matchMedia('(max-width: 1240px)').addEventListener('change', setModal);
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (h === 'import') { $('#btn-import').click(); return; }
  if (CONVS.some(c => c.id === h) && h !== S.conv) openConv(h);
});

/* ---------- Khởi động ---------- */
const h0 = location.hash.slice(1);
if (h0 === 'kho-trong') { S.emptyKho = true; S.conv = null; CONVS.length = 0; }
else if (CONVS.some(c => c.id === h0)) S.conv = h0;
render();
closeSide(false);
if (h0 === 'import') $('#btn-import').click();
})();
</script>
